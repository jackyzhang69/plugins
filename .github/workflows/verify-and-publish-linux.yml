name: Verify Linux package integrity

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**/bin/linux-x64/**'
      - '.github/workflows/verify-and-publish-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-checksums:
    runs-on: [self-hosted, macOS, ARM64, plugins-release-69]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify committed Linux checksum sidecars
        run: |
          set -euo pipefail
          # Hash only: the macOS runner cannot execute Linux binaries.
          # FormBro ships its CLI in git without a checksum sidecar.
          for checksum in plugins/*/bin/linux-x64/*.sha256; do
            binary="${checksum%.sha256}"
            expected="$(awk 'NR == 1 {print $1}' "$checksum")"
            actual="$(shasum -a 256 "$binary" | awk '{print $1}')"
            if [[ "$expected" != "$actual" ]]; then
              echo "SHA-256 mismatch: $binary" >&2
              exit 1
            fi
            echo "SHA-256 OK: $binary"
          done
