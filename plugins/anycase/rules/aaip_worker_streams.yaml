rules:
- id: aaip_status_and_work_permit
  category: status
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream in ['alberta_opportunity', 'tourism_hospitality', 'rural_renewal']
    fields:
    - candidate.work_permit_basis
    - candidate.in_refugee_appeal_or_removal
  pass_if: (candidate.stream in ['aee_general', 'accelerated_tech', 'law_enforcement', 'health_ee']) || ((candidate.stream in ['alberta_opportunity', 'tourism_hospitality', 'rural_renewal']) && (candidate.in_refugee_appeal_or_removal == false && ((candidate.stream == 'alberta_opportunity' && candidate.residing_in_alberta == true && candidate.work_permit_basis in ['lmia', 'lmia_exempt_trade', 'intra_company', 'iec', 'mobilite_francophone', 'religious_r205d', 'vulnerable_worker_open', 'vulnerable_worker_family', 'pgwp_alberta_public', 'ircc_public_policy_open']) || (candidate.stream == 'tourism_hospitality' && candidate.residing_in_alberta == true && candidate.work_permit_basis in ['lmia', 'wildfire_special_measure']) || (candidate.stream == 'rural_renewal' && ((candidate.residing_in_canada == false && (candidate.work_permit_basis == 'none' || (candidate.work_permit_basis != null && !(candidate.work_permit_basis in ['other', 'maintained_status', 'none'])))) || (candidate.residing_in_canada == true && candidate.work_permit_basis != null && !(candidate.work_permit_basis in ['none', 'other', 'maintained_status'])))))))
  fail_if: candidate.stream in ['alberta_opportunity', 'tourism_hospitality', 'rural_renewal'] && (candidate.in_refugee_appeal_or_removal == true || (candidate.stream != null && !(candidate.stream in ['alberta_opportunity', 'tourism_hospitality', 'rural_renewal'])) || (candidate.stream == 'alberta_opportunity' && candidate.residing_in_alberta == false) || (candidate.stream == 'alberta_opportunity' && candidate.work_permit_basis != null && !(candidate.work_permit_basis in ['lmia', 'lmia_exempt_trade', 'intra_company', 'iec', 'mobilite_francophone', 'religious_r205d', 'vulnerable_worker_open', 'vulnerable_worker_family', 'pgwp_alberta_public', 'ircc_public_policy_open'])) || (candidate.stream == 'tourism_hospitality' && candidate.residing_in_alberta == false) || (candidate.stream == 'tourism_hospitality' && candidate.work_permit_basis != null && !(candidate.work_permit_basis in ['lmia', 'wildfire_special_measure'])) || (candidate.stream == 'rural_renewal' && candidate.work_permit_basis in ['other', 'maintained_status']) || (candidate.stream == 'rural_renewal' && candidate.residing_in_canada == true && candidate.work_permit_basis in ['none', 'other', 'maintained_status']))
  missing_or_unverified: 'NEEDS_REVIEW: Stream, work-permit basis, Alberta residence,
    or Canadian residence cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-AAIP-WORKER-STATUS-001
    source_file: src01.html
    section: Status and eligible work permit
    verbatim_excerpt: refugee claimants or individuals involved in a Government of
      Canada appeal or removal process
- id: aaip_occupation_eligible
  category: occupation
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
