  pass_if: (candidate.stream in ['aee_general', 'accelerated_tech', 'law_enforcement', 'health_ee']) || ((candidate.stream in ['alberta_opportunity', 'tourism_hospitality', 'rural_renewal']) && (job_offer.weekly_hours >= 30 && ((candidate.stream == 'alberta_opportunity' && candidate.experience_was_full_time == true && job_offer.same_as_current_occupation == true && ((candidate.work_permit_basis in ['pgwp_alberta_public', 'ircc_public_policy_open'] && candidate.alberta_experience_months_last_18 >= 6 && candidate.occupation_related_to_alberta_study == true) || (candidate.work_permit_basis in ['lmia', 'lmia_exempt_trade', 'intra_company', 'iec', 'mobilite_francophone', 'religious_r205d', 'vulnerable_worker_open', 'vulnerable_worker_family'] && (candidate.alberta_experience_months_last_18 >= 12 || candidate.occupation_experience_months_last_30 >= 24)))) || (candidate.stream == 'tourism_hospitality' && candidate.experience_was_full_time == true && job_offer.same_employer_as_qualifying_work == true && (candidate.ths_consecutive_months_with_employer >= 6 || candidate.ths_hours_with_same_employer >= 780)) || (candidate.stream == 'rural_renewal' && (candidate.rrs_pgwp_two_year_dli_in_community == true || (candidate.rrs_experience_months_last_18 >= 12 && candidate.experience_was_full_time == true))))))
  fail_if: candidate.stream in ['alberta_opportunity', 'tourism_hospitality', 'rural_renewal'] && (job_offer.weekly_hours < 30 || (candidate.stream == 'alberta_opportunity' && candidate.experience_was_full_time == false) || (candidate.stream == 'alberta_opportunity' && job_offer.same_as_current_occupation == false) || (candidate.stream == 'alberta_opportunity' && candidate.work_permit_basis in ['pgwp_alberta_public', 'ircc_public_policy_open'] && candidate.alberta_experience_months_last_18 < 6) || (candidate.stream == 'alberta_opportunity' && candidate.work_permit_basis in ['pgwp_alberta_public', 'ircc_public_policy_open'] && candidate.occupation_related_to_alberta_study == false) || (candidate.stream == 'alberta_opportunity' && candidate.work_permit_basis in ['lmia', 'lmia_exempt_trade', 'intra_company', 'iec', 'mobilite_francophone', 'religious_r205d', 'vulnerable_worker_open', 'vulnerable_worker_family'] && candidate.alberta_experience_months_last_18 < 12 && candidate.occupation_experience_months_last_30 < 24) || (candidate.stream == 'tourism_hospitality' && candidate.experience_was_full_time == false) || (candidate.stream == 'tourism_hospitality' && job_offer.same_employer_as_qualifying_work == false) || (candidate.stream == 'tourism_hospitality' && candidate.ths_consecutive_months_with_employer < 6 && candidate.ths_hours_with_same_employer < 780) || (candidate.stream == 'rural_renewal' && candidate.rrs_pgwp_two_year_dli_in_community == false && candidate.rrs_experience_months_last_18 < 12) || (candidate.stream == 'rural_renewal' && candidate.rrs_pgwp_two_year_dli_in_community == false && candidate.experience_was_full_time == false))
