  missing_or_unverified: 'NEEDS_REVIEW: NOC 2021 code, TEER, Alberta residence, work-permit
    basis, or NOC 42202 early-childhood certification cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-AAIP-WORKER-OCCUPATION-002
    source_file: src01.html
    section: Eligible and ineligible occupations
    verbatim_excerpt: Ineligible occupations
