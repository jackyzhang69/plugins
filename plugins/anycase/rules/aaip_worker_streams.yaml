rules:
- id: aaip_status_and_work_permit_alberta_opportunity
  category: status
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'alberta_opportunity'
    fields:
    - candidate.work_permit_basis
    - candidate.in_refugee_appeal_or_removal
  pass_if: candidate.stream != 'alberta_opportunity' || (((candidate.in_refugee_appeal_or_removal == false) && ((candidate.residing_in_alberta == true) && (candidate.work_permit_basis in ['lmia', 'lmia_exempt_trade', 'intra_company', 'iec', 'mobilite_francophone', 'religious_r205d', 'vulnerable_worker_open', 'vulnerable_worker_family', 'pgwp_alberta_public', 'ircc_public_policy_open']))))
  fail_if: candidate.stream == 'alberta_opportunity' && (((candidate.in_refugee_appeal_or_removal == true) || (candidate.residing_in_alberta == false) || ((candidate.work_permit_basis != null) && !((candidate.work_permit_basis in ['lmia', 'lmia_exempt_trade', 'intra_company', 'iec', 'mobilite_francophone', 'religious_r205d', 'vulnerable_worker_open', 'vulnerable_worker_family', 'pgwp_alberta_public', 'ircc_public_policy_open'])))))
  missing_or_unverified: 'NEEDS_REVIEW: Stream, work-permit basis, Alberta residence, or Canadian residence cannot be verified.'
  evidence_anchor:
    evidence_unit_id: aaip_aos_eligibility.full_document_body
    source_id: aaip_aos_eligibility
    source_file: 7ae2bc33c77941ec80b27e2e4f7998f5508345d93ec9fa641ac0c340ce1bf1d8
    section: Status and eligible work permit — alberta_opportunity
