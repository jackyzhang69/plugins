rules:
- id: aaip_status_and_work_permit
  category: status
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  - candidate.work_permit_basis
  - candidate.in_refugee_appeal_or_removal
  conditional_required_fields:
    when: candidate.stream == 'alberta_opportunity' || candidate.stream == 'tourism_hospitality'
    fields:
    - candidate.residing_in_alberta
  pass_if: candidate.in_refugee_appeal_or_removal == false && ((candidate.stream ==
    'alberta_opportunity' && candidate.residing_in_alberta == true && candidate.work_permit_basis
    in ['lmia', 'lmia_exempt_trade', 'intra_company', 'iec', 'mobilite_francophone',
    'religious_r205d', 'vulnerable_worker_open', 'vulnerable_worker_family', 'pgwp_alberta_public',
    'ircc_public_policy_open']) || (candidate.stream == 'tourism_hospitality' && candidate.residing_in_alberta
    == true && candidate.work_permit_basis in ['lmia', 'wildfire_special_measure'])
    || (candidate.stream == 'rural_renewal' && ((candidate.residing_in_canada == false
    && (candidate.work_permit_basis == 'none' || (candidate.work_permit_basis != null
    && !(candidate.work_permit_basis in ['other', 'maintained_status', 'none']))))
    || (candidate.residing_in_canada == true && candidate.work_permit_basis != null
    && !(candidate.work_permit_basis in ['none', 'other', 'maintained_status'])))))
  fail_if: candidate.in_refugee_appeal_or_removal == true || (candidate.stream !=
    null && !(candidate.stream in ['alberta_opportunity', 'tourism_hospitality', 'rural_renewal']))
    || (candidate.stream == 'alberta_opportunity' && candidate.residing_in_alberta
    == false) || (candidate.stream == 'alberta_opportunity' && candidate.work_permit_basis
    != null && !(candidate.work_permit_basis in ['lmia', 'lmia_exempt_trade', 'intra_company',
    'iec', 'mobilite_francophone', 'religious_r205d', 'vulnerable_worker_open', 'vulnerable_worker_family',
    'pgwp_alberta_public', 'ircc_public_policy_open'])) || (candidate.stream == 'tourism_hospitality'
    && candidate.residing_in_alberta == false) || (candidate.stream == 'tourism_hospitality'
    && candidate.work_permit_basis != null && !(candidate.work_permit_basis in ['lmia',
    'wildfire_special_measure'])) || (candidate.stream == 'rural_renewal' && candidate.work_permit_basis
    in ['other', 'maintained_status']) || (candidate.stream == 'rural_renewal' &&
    candidate.residing_in_canada == true && candidate.work_permit_basis in ['none',
    'other', 'maintained_status'])
  missing_or_unverified: 'NEEDS_REVIEW: Stream, work-permit basis, Alberta residence,
    or Canadian residence cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-AAIP-WORKER-STATUS-001
    source_file: src01.html
    section: Status and eligible work permit
    verbatim_excerpt: refugee claimants or individuals involved in a Government of
      Canada appeal or removal process
- id: aaip_occupation_eligible
  category: occupation
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  - job_offer.noc_2021_code
  conditional_required_fields:
    when: candidate.stream == 'alberta_opportunity' && job_offer.noc_2021_code ==
      '42202'
    fields:
    - candidate.ece_certification
  pass_if: (candidate.stream == 'alberta_opportunity' && job_offer.noc_2021_code !=
    null && !(job_offer.noc_2021_code in ['00010', '40021', '40030', '40041', '60040',
    '41100', '41220', '41221', '51111', '51122', '42200', '43100', '43109', '53121',
    '53122', '53124', '53200', '63101', '33100', '44100', '44101', '64321', '55109',
    '65109', '65211', '65229', '65329', '75200', '85101', '85102', '85104', '85110',
    '85121']) && (!(job_offer.noc_2021_code == '42202') || candidate.ece_certification
    == 'level_2_or_3')) || (candidate.stream == 'tourism_hospitality' && job_offer.noc_2021_code
    in ['54100', '60030', '60031', '62020', '62200', '63200', '64300', '64301', '64314',
    '64320', '64322', '65200', '65201', '65210', '65310', '65311', '65312', '65320'])
    || (candidate.stream == 'rural_renewal' && job_offer.noc_2021_code != null &&
    !(job_offer.noc_2021_code in ['00010', '60040', '41100', '51111', '51122', '42200',
    '53121', '53122', '53124', '53200', '33100', '44100', '44101', '64321', '55109',
    '65229', '85101']) && (job_offer.noc_teer in [0, 1, 2, 3] || (job_offer.noc_teer
    in [4, 5] && candidate.residing_in_alberta == true && candidate.work_permit_basis
    != null && !(candidate.work_permit_basis in ['none', 'other', 'maintained_status']))))
  fail_if: (candidate.stream == 'alberta_opportunity' && job_offer.noc_2021_code in
    ['00010', '40021', '40030', '40041', '60040', '41100', '41220', '41221', '51111',
    '51122', '42200', '43100', '43109', '53121', '53122', '53124', '53200', '63101',
    '33100', '44100', '44101', '64321', '55109', '65109', '65211', '65229', '65329',
    '75200', '85101', '85102', '85104', '85110', '85121']) || (candidate.stream ==
    'alberta_opportunity' && job_offer.noc_2021_code == '42202' && candidate.ece_certification
    != null && !(candidate.ece_certification == 'level_2_or_3')) || (candidate.stream
    == 'tourism_hospitality' && job_offer.noc_2021_code != null && !(job_offer.noc_2021_code
    in ['54100', '60030', '60031', '62020', '62200', '63200', '64300', '64301', '64314',
    '64320', '64322', '65200', '65201', '65210', '65310', '65311', '65312', '65320']))
    || (candidate.stream == 'rural_renewal' && job_offer.noc_2021_code in ['00010',
    '60040', '41100', '51111', '51122', '42200', '53121', '53122', '53124', '53200',
    '33100', '44100', '44101', '64321', '55109', '65229', '85101']) || (candidate.stream
    == 'rural_renewal' && job_offer.noc_teer != null && !(job_offer.noc_teer in [0,
    1, 2, 3, 4, 5])) || (candidate.stream == 'rural_renewal' && job_offer.noc_teer
    in [4, 5] && (candidate.residing_in_alberta == false || candidate.residing_in_canada
    == false || candidate.work_permit_basis in ['none', 'other', 'maintained_status']))
  missing_or_unverified: 'NEEDS_REVIEW: NOC 2021 code, TEER, Alberta residence, work-permit
    basis, or NOC 42202 early-childhood certification cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-AAIP-WORKER-OCCUPATION-002
    source_file: src01.html
    section: Eligible and ineligible occupations
    verbatim_excerpt: Ineligible occupations
- id: aaip_qualifying_employment
  category: experience
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  - job_offer.weekly_hours
  conditional_required_fields:
    when: candidate.stream == 'alberta_opportunity' && (candidate.work_permit_basis
      == 'pgwp_alberta_public' || candidate.work_permit_basis == 'ircc_public_policy_open')
    fields:
    - candidate.alberta_experience_months_last_18
    - candidate.occupation_related_to_alberta_study
  pass_if: job_offer.weekly_hours >= 30 && ((candidate.stream == 'alberta_opportunity'
    && candidate.experience_was_full_time == true && job_offer.same_as_current_occupation
    == true && ((candidate.work_permit_basis in ['pgwp_alberta_public', 'ircc_public_policy_open']
    && candidate.alberta_experience_months_last_18 >= 6 && candidate.occupation_related_to_alberta_study
    == true) || (candidate.work_permit_basis in ['lmia', 'lmia_exempt_trade', 'intra_company',
    'iec', 'mobilite_francophone', 'religious_r205d', 'vulnerable_worker_open', 'vulnerable_worker_family']
    && (candidate.alberta_experience_months_last_18 >= 12 || candidate.occupation_experience_months_last_30
    >= 24)))) || (candidate.stream == 'tourism_hospitality' && candidate.experience_was_full_time
    == true && job_offer.same_employer_as_qualifying_work == true && (candidate.ths_consecutive_months_with_employer
    >= 6 || candidate.ths_hours_with_same_employer >= 780)) || (candidate.stream ==
    'rural_renewal' && (candidate.rrs_pgwp_two_year_dli_in_community == true || (candidate.rrs_experience_months_last_18
    >= 12 && candidate.experience_was_full_time == true))))
  fail_if: job_offer.weekly_hours < 30 || (candidate.stream == 'alberta_opportunity'
    && candidate.experience_was_full_time == false) || (candidate.stream == 'alberta_opportunity'
    && job_offer.same_as_current_occupation == false) || (candidate.stream == 'alberta_opportunity'
    && candidate.work_permit_basis in ['pgwp_alberta_public', 'ircc_public_policy_open']
    && candidate.alberta_experience_months_last_18 < 6) || (candidate.stream == 'alberta_opportunity'
    && candidate.work_permit_basis in ['pgwp_alberta_public', 'ircc_public_policy_open']
    && candidate.occupation_related_to_alberta_study == false) || (candidate.stream
    == 'alberta_opportunity' && candidate.work_permit_basis in ['lmia', 'lmia_exempt_trade',
    'intra_company', 'iec', 'mobilite_francophone', 'religious_r205d', 'vulnerable_worker_open',
    'vulnerable_worker_family'] && candidate.alberta_experience_months_last_18 < 12
    && candidate.occupation_experience_months_last_30 < 24) || (candidate.stream ==
    'tourism_hospitality' && candidate.experience_was_full_time == false) || (candidate.stream
    == 'tourism_hospitality' && job_offer.same_employer_as_qualifying_work == false)
    || (candidate.stream == 'tourism_hospitality' && candidate.ths_consecutive_months_with_employer
    < 6 && candidate.ths_hours_with_same_employer < 780) || (candidate.stream == 'rural_renewal'
    && candidate.rrs_pgwp_two_year_dli_in_community == false && candidate.rrs_experience_months_last_18
    < 12) || (candidate.stream == 'rural_renewal' && candidate.rrs_pgwp_two_year_dli_in_community
    == false && candidate.experience_was_full_time == false)
  missing_or_unverified: 'NEEDS_REVIEW: Full-time qualifying experience, current-occupation
    match, employer continuity, or the Rural Renewal 12-month test cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-AAIP-WORKER-EXPERIENCE-003
    source_file: src01.html
    section: Qualifying work experience
    verbatim_excerpt: minimum of 12 months full-time work experience
- id: aaip_job_offer_genuine
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - job_offer.is_part_time_casual_or_seasonal
  - candidate.is_contractor_owner_or_agency
  - job_offer.home_based_or_not_commercial
  - job_offer.work_on_alberta_premises
  - job_offer.weekly_hours
  pass_if: job_offer.is_part_time_casual_or_seasonal == false && candidate.is_contractor_owner_or_agency
    == false && job_offer.home_based_or_not_commercial == false && job_offer.work_on_alberta_premises
    == true && job_offer.weekly_hours >= 30
  fail_if: job_offer.is_part_time_casual_or_seasonal == true || candidate.is_contractor_owner_or_agency
    == true || job_offer.home_based_or_not_commercial == true || job_offer.work_on_alberta_premises
    == false || job_offer.weekly_hours < 30
  missing_or_unverified: 'NEEDS_REVIEW: Offer hours, employment relationship, business
    premises, or Alberta work location cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-AAIP-WORKER-JOB-OFFER-004
    source_file: src03.html
    section: Genuine full-time job offer redlines
    verbatim_excerpt: part-time, casual or seasonal employees
- id: aaip_wage_floor
  category: wage
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.work_permit_basis
  - job_offer.hourly_wage
  - job_offer.alberta_lowest_starting_wage
  conditional_required_fields:
    when: candidate.work_permit_basis == 'lmia'
    fields:
