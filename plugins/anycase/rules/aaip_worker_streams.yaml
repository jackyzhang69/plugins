schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  - job_offer
  - employer
  types:
    assessment_date: ISO-8601 date; assessment date. Not a rule by itself.
    candidate:
      stream: alberta_opportunity | tourism_hospitality | rural_renewal
      work_permit_basis: lmia | lmia_exempt_trade | intra_company | iec | mobilite_francophone
        | religious_r205d | vulnerable_worker_open | vulnerable_worker_family | pgwp_alberta_public
        | ircc_public_policy_open | wildfire_special_measure | other | none | maintained_status
      in_refugee_appeal_or_removal: boolean; refugee claimant, or a person in a federal
        appeal or removal
      residing_in_alberta: boolean; living in Alberta
      residing_in_canada: boolean; living in Canada
      currently_working: boolean; currently working. Used only for the Rural Renewal
        settlement-funds trigger.
      ece_certification: level_2_or_3 or another resolved certification value. Material
        only for NOC 42202.
      experience_was_full_time: boolean; qualifying experience was full-time (30 hours
        a week)
      alberta_experience_months_last_18: number; months of Alberta experience in the
        last 18 months
      occupation_experience_months_last_30: number; months in the occupation in the
        last 30 months
      occupation_related_to_alberta_study: boolean; occupation is related to the Alberta
        program of study
      ths_consecutive_months_with_employer: number; consecutive months with the Tourism
        and Hospitality employer
      ths_hours_with_same_employer: number; hours with that same employer
      rrs_experience_months_last_18: number; qualifying months in the last 18 months
      rrs_pgwp_two_year_dli_in_community: boolean; PGWP holder who completed a two-year
        program at a DLI in the designated community
      endorsement_letter_valid: boolean; community EDO endorsement letter is valid.
        One-year validity is already resolved.
      intends_to_reside_in_designated_community: boolean
      is_contractor_owner_or_agency: boolean; independent contractor, owner, shareholder,
        director, or agency worker
      language_result_within_2_years: boolean; one official test, result under two
        years old
      language_clb_minimum: integer; lowest of the four skills
      meets_canadian_high_school: boolean; ECA equal to Canadian high school, a Canadian
        credential, or an Alberta AIT trade certificate. Already resolved.
      holds_alberta_trade_certificate: boolean; Alberta AIT certificate when the offer
        is a compulsory trade
      holds_required_licence: boolean; required professional licence
      settlement_funds_cad: number; unencumbered settlement funds
      settlement_funds_required_cad: number; officer-supplied LICO requirement for
        family size and community population
    job_offer:
      noc_2021_code: five-digit NOC 2021 string
      noc_teer: integer 0-5
      weekly_hours: number; paid hours per week
      same_as_current_occupation: boolean; Alberta Opportunity current occupation
        matches the offer
      same_employer_as_qualifying_work: boolean; Tourism and Hospitality offer employer
        is the qualifying employer
      in_designated_community: boolean; Rural Renewal work location is in the designated
        community
      is_part_time_casual_or_seasonal: boolean
      home_based_or_not_commercial: boolean; home-based or not commercially or industrially
        zoned
      work_on_alberta_premises: boolean; work is on premises in Alberta
      hourly_wage: number; basic hourly wage
      alberta_lowest_starting_wage: number; Job Bank lowest starting wage for the
        occupation and location
      lmia_stated_hourly_wage: number; hourly wage stated on the LMIA. Required when
        the basis is lmia.
      compulsory_trade: boolean
      requires_professional_licence: boolean
    employer:
      wcb_industry_eligible: boolean; Tourism and Hospitality WCB industry is eligible
      sector_association_member: boolean; recognized sector-association member
      travel_alberta_exemption: boolean; Travel Alberta exemption from association
        membership
minimums:
  note: Documentation only. The engine evaluates the rules, not this block.
  full_time_weekly_hours: 30
  language_result_max_age_years: 2
  streams:
    alberta_opportunity:
      eligible_work_permit_basis:
      - lmia
      - lmia_exempt_trade
      - intra_company
      - iec
      - mobilite_francophone
      - religious_r205d
      - vulnerable_worker_open
      - vulnerable_worker_family
      - pgwp_alberta_public
      - ircc_public_policy_open
      experience_alberta_months_last_18: 12
      experience_occupation_months_last_30: 24
      pgwp_or_public_policy_alberta_months_last_18: 6
      language_clb_teer_0_3: 5
      language_clb_noc_33102: 7
      language_clb_teer_4_5: 4
    tourism_hospitality:
      eligible_work_permit_basis:
