  Tourism and Hospitality, Rural Renewal, Alberta Express Entry priority sectors,
  Accelerated Tech, Law Enforcement, and Dedicated Health Care Express Entry.
  Criterion PASS does not guarantee selection or establish an historical release binding.
  AnyScore owns Worker Expression of Interest points.'
