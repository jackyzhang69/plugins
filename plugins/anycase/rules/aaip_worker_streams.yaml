  pass_if: (candidate.stream in ['aee_general', 'accelerated_tech', 'law_enforcement', 'health_ee']) || ((candidate.stream in ['alberta_opportunity', 'tourism_hospitality', 'rural_renewal']) && ((candidate.stream == 'alberta_opportunity' && job_offer.noc_2021_code != null && !(job_offer.noc_2021_code in ['00010', '40021', '40030', '40041', '60040', '41100', '41220', '41221', '51111', '51122', '42200', '43100', '43109', '53121', '53122', '53124', '53200', '63101', '33100', '44100', '44101', '64321', '55109', '65109', '65211', '65229', '65329', '75200', '85101', '85102', '85104', '85110', '85121']) && (!(job_offer.noc_2021_code == '42202') || candidate.ece_certification == 'level_2_or_3')) || (candidate.stream == 'tourism_hospitality' && job_offer.noc_2021_code in ['54100', '60030', '60031', '62020', '62200', '63200', '64300', '64301', '64314', '64320', '64322', '65200', '65201', '65210', '65310', '65311', '65312', '65320']) || (candidate.stream == 'rural_renewal' && job_offer.noc_2021_code != null && !(job_offer.noc_2021_code in ['00010', '60040', '41100', '51111', '51122', '42200', '53121', '53122', '53124', '53200', '33100', '44100', '44101', '64321', '55109', '65229', '85101']) && (job_offer.noc_teer in [0, 1, 2, 3] || (job_offer.noc_teer in [4, 5] && candidate.residing_in_alberta == true && candidate.work_permit_basis != null && !(candidate.work_permit_basis in ['none', 'other', 'maintained_status']))))))
