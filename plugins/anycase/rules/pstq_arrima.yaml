rules:
- id: pstq_french
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  - candidate.feer
  conditional_required_fields:
    when: candidate.stream == 'volet_1' || candidate.stream == 'volet_2' || candidate.stream == 'volet_3'
    fields:
    - candidate.french_oral_level
  pass_if: candidate.stream == 'volet_4' || (candidate.stream == 'volet_1' && candidate.french_oral_level
    >= 7 && candidate.french_written_level >= 5) || (candidate.stream == 'volet_3' && candidate.feer in
    [0, 1, 2] && candidate.french_oral_level >= 7 && candidate.french_written_level >= 5) || (candidate.stream
    == 'volet_2' && candidate.french_oral_level >= 5) || (candidate.stream == 'volet_3' && candidate.feer
    in [3, 4, 5] && candidate.french_oral_level >= 5)
  fail_if: (candidate.stream == 'volet_1' && (candidate.french_oral_level < 7 || candidate.french_written_level
    < 5)) || (candidate.stream == 'volet_3' && candidate.feer in [0, 1, 2] && (candidate.french_oral_level
    < 7 || candidate.french_written_level < 5)) || (candidate.stream == 'volet_2' && candidate.french_oral_level
    < 5) || (candidate.stream == 'volet_3' && candidate.feer in [3, 4, 5] && candidate.french_oral_level
    < 5)
  missing_or_unverified: 'NEEDS_REVIEW: French oral or written level, stream, or FEER cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "d6.b05.html.quebec-pstq-requirements.9e5f322dab39"
    source_id: "pstq"
    source_file: "84e2fcf8ddfb3dc41fb89db6aae02577193f949236956c9368266f9a17f3473a"
    section: PSTQ French Requirements
    verbatim_excerpt: "oral knowledge of French of level 7 or higher and a written knowledge of level 5 or higher"
  provenance:
    source_file: quebec-pstq-arrima.html
    section: PSTQ French Requirements
    page: 16
    verbatim: oral 7 and written 5 for Volet 1
- id: pstq_experience
  category: experience
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream in ['volet_1', 'volet_2', 'volet_4']
    fields:
    - candidate.experience_months_past_5_years
  pass_if: candidate.stream == 'volet_3' || (candidate.stream == 'volet_1' && candidate.experience_months_past_5_years >= 12) || (candidate.stream == 'volet_2' && candidate.experience_months_past_5_years >= 24 && candidate.quebec_experience_months >= 12) || (candidate.stream == 'volet_4' && candidate.experience_months_past_5_years >= 36)
  fail_if: (candidate.stream == 'volet_1' && candidate.experience_months_past_5_years < 12) || (candidate.stream == 'volet_2' && (candidate.experience_months_past_5_years < 24 || candidate.quebec_experience_months < 12)) || (candidate.stream == 'volet_4' && candidate.experience_months_past_5_years < 36)
  missing_or_unverified: 'NEEDS_REVIEW: Qualifying experience months cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "d6.b05.html.quebec-pstq-requirements.9e5f322dab39"
    source_id: "pstq"
    source_file: "84e2fcf8ddfb3dc41fb89db6aae02577193f949236956c9368266f9a17f3473a"
    section: PSTQ Experience Requirements
    verbatim_excerpt: "at least two years' paid work experience in your main occupation, i<strong>ncluding at least one year in Québec</strong>"
  provenance:
    source_file: quebec-pstq-arrima.html
    section: PSTQ Experience Requirements
    page: 14
    verbatim: 1 year for Volet 1; 2 years including 1 in Quebec for Volet 2; 3 years for Volet 4
- id: pstq_diploma
  category: education
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.eligible_quebec_diploma
  pass_if: candidate.eligible_quebec_diploma == true
  fail_if: candidate.eligible_quebec_diploma == false
  missing_or_unverified: 'NEEDS_REVIEW: Quebec-equivalent diploma cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "d6.b05.html.quebec-pstq-requirements.9e5f322dab39"
    source_id: "pstq"
    source_file: "84e2fcf8ddfb3dc41fb89db6aae02577193f949236956c9368266f9a17f3473a"
    section: PSTQ Diploma Requirements
    verbatim_excerpt: "At least 900 hours, if it is at secondary or college level"
  provenance:
    source_file: quebec-pstq-arrima.html
    section: PSTQ Diploma Requirements
    page: 14
    verbatim: DEP of at least 900 hours, ASP, or AEC
- id: pstq_funds_contract
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.self_sufficiency_contract_signed
  pass_if: candidate.self_sufficiency_contract_signed == true
  fail_if: candidate.self_sufficiency_contract_signed == false
  missing_or_unverified: 'NEEDS_REVIEW: The three-month financial self-sufficiency contract cannot be
    verified.'
  evidence_anchor:
    evidence_unit_id: "d6.b05.html.quebec-pstq-requirements.9e5f322dab39"
    source_id: "pstq"
    source_file: "84e2fcf8ddfb3dc41fb89db6aae02577193f949236956c9368266f9a17f3473a"
    section: "Financial Self-Sufficiency Contract"
    verbatim_excerpt: "</li><li>Demonstrate, by signing a Financial Self-Sufficiency Contract, your capacity to provide for yourself and, if applicable, that of your accompanying family members for the three months after becoming a permanent resident."
  provenance:
    source_file: quebec-pstq-arrima.html
    section: Financial Self-Sufficiency Contract
    page: 1
    verbatim: financial self-sufficiency contract
- id: pstq_spouse_french
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.accompanying_spouse
  conditional_required_fields:
    when: candidate.accompanying_spouse == true
    fields:
    - candidate.spouse_french_oral_level
  pass_if: candidate.accompanying_spouse == false || candidate.spouse_french_oral_level >= 4
  fail_if: candidate.accompanying_spouse == true && candidate.spouse_french_oral_level < 4
  missing_or_unverified: 'NEEDS_REVIEW: Spouse French oral level cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "d6.b05.html.quebec-pstq-requirements.9e5f322dab39"
    source_id: "pstq"
    source_file: "84e2fcf8ddfb3dc41fb89db6aae02577193f949236956c9368266f9a17f3473a"
    section: Accompanying Spouse French
    verbatim_excerpt: "Your accompanying spouse must have a spoken knowledge of French at level 4 or higher"
  provenance:
    source_file: quebec-pstq-arrima.html
    section: Accompanying Spouse French
    page: 16
    verbatim: French oral level 4
- id: pstq_declaration_of_interest_validity_window
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stage
  - candidate.declaration_of_interest_date
  - candidate.invitation_received
  - candidate.linked_spouse_accepted
  - candidate.refused_without_maintaining_interest
  pass_if: >-
    (candidate.stage == 'selection-application' && candidate.invitation_received == true && candidate.invitation_response == 'accepted' &&
    candidate.invitation_date >= candidate.declaration_of_interest_date &&
    candidate.invitation_response_date >= candidate.invitation_date &&
    candidate.invitation_response_date < calendar_months_after(candidate.declaration_of_interest_date, 12) &&
    calendar_days_between(candidate.invitation_date, candidate.invitation_response_date) <= 30 &&
    (candidate.linked_spouse_accepted == false || candidate.linked_spouse_acceptance_date > candidate.invitation_response_date) &&
    (candidate.refused_without_maintaining_interest == false || candidate.refusal_date > candidate.invitation_response_date)) ||
    (candidate.stage == 'doi-ranking' && assessment_date >= candidate.declaration_of_interest_date &&
    assessment_date < calendar_months_after(candidate.declaration_of_interest_date, 12) &&
    candidate.linked_spouse_accepted == false && candidate.refused_without_maintaining_interest == false &&
    (candidate.invitation_received == false ||
    (candidate.invitation_response == 'pending' && calendar_days_between(candidate.invitation_date, assessment_date) < 30) ||
    (candidate.invitation_response == 'refused' && candidate.maintains_interest == true &&
    calendar_days_between(candidate.invitation_date, candidate.invitation_response_date) >= 0 &&
    calendar_days_between(candidate.invitation_date, candidate.invitation_response_date) < 30)))
  fail_if: >-
    candidate.stage == 'doi-ranking' &&
    (assessment_date >= calendar_months_after(candidate.declaration_of_interest_date, 12) ||
    (candidate.linked_spouse_accepted == true && candidate.linked_spouse_acceptance_date <= assessment_date) ||
    (candidate.refused_without_maintaining_interest == true && candidate.refusal_date <= assessment_date) ||
    (candidate.invitation_response == 'accepted' && candidate.invitation_response_date <= assessment_date) ||
    (candidate.invitation_received == true && candidate.invitation_response == 'pending' &&
    calendar_days_between(candidate.invitation_date, assessment_date) >= 30))
  missing_or_unverified: 'NEEDS_REVIEW: Verify the first RIQ art.27 invalidation event; an accepted invitation is assessed at acceptance, not by expiring its former DOI at the current date.'
  evidence_anchor:
    source_file: b53422848bab6a871ec3af6d45380447b0ad21c2a6a7a6caef6f1afbc2f88826
    section: RIQ art.27
    verbatim_excerpt: devient invalide à compter de la première des dates suivantes
- id: pstq_invitation_response_window
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.invitation_received
  pass_if: candidate.invitation_received == false || (calendar_days_between(candidate.invitation_date, candidate.invitation_response_date) >= 0 && calendar_days_between(candidate.invitation_date, candidate.invitation_response_date) <= 30)
  fail_if: candidate.invitation_received == true && calendar_days_between(candidate.invitation_date, candidate.invitation_response_date) > 30
  missing_or_unverified: 'NEEDS_REVIEW: Invitation and response dates are required; refusal preserving interest does not itself satisfy invited application conditions.'
  evidence_anchor:
    source_file: b53422848bab6a871ec3af6d45380447b0ad21c2a6a7a6caef6f1afbc2f88826
    section: RIQ art.27
    verbatim_excerpt: celle qui suit de 30 jours la date de l’invitation
- id: pstq_experience_window_5y
  category: experience
  severity: ADVISORY
  eval_type: deterministic
  required_fields:
