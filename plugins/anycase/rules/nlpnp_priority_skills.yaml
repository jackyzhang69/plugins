schema_version: 1.0.0
catalog_id: nlpnp_priority_skills
jurisdiction: CA-NL
category: Newfoundland and Labrador Provincial Nominee Program
display_name: NLPNP Skilled Worker and Express Entry Skilled Worker
status: ACTIVE
program_id: NLPNP_PRIORITY_SKILLS
stream_id: SKILLED_WORKER
effective_date: '2026-04-22'
source_edition: >-
  NLPNP section 4 eligibility criteria: Skilled Worker Category (no date printed) and Express Entry - Skilled Worker
  Category (Updated April 22, 2026); Employer Criteria (Updated October 30, 2026); retrieved 2026-11-16.
source_url: https://www.gov.nl.ca/immigration/
decision_scope: >-
  Deterministic eligibility prescreen for the NLPNP Skilled Worker and Express Entry Skilled Worker categories. The
  Priority Skills questionnaire, its 114-point grid and its 60-point threshold are not evaluated: they exist only in
  an undated 2020 guide that the current EOI model (launched February 2025, criteria page updated 2026-03-23)
  does not publish, so the grid is historical and unsupported for current judgement. Offer duration is reviewed
  conservatively where the applicant criteria (12 months) and Employer Criteria (2 years) differ. The Express Entry
  points total is the caller-supplied total on the NLPNP Point Assessment Grid; this file does not add the grid factors.
