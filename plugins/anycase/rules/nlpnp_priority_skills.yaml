    section: Employer Criteria - Basic Employer Requirements
    verbatim_excerpt: for at least two (2) consecutive years. In exceptional circumstances, one (1) year may be accepted.
- id: nlpnp_sw_language
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
