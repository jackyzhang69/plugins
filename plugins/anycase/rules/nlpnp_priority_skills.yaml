    source_sha256: cd6417868dc7d920ce7feee8b5493b6b4e4947be5946f71e4ce768041c86f51a
    source_edition: no date printed; fetched 2026-11-16
    section: 4. Skilled Worker Category Eligibility Criteria
    verbatim_excerpt: Be 21 to 59 years old;
    supporting_excerpts:
    - evidence_unit_id: "atlantic_documents:nl_ee_category_eligibility_criteria_sec4:ee_eligibility_criteria"
      source_file: 628755b6d38c42726505ec7afead4b6094c47f1dcf8c5291ad26baf1495a3e76
      verbatim_excerpt: Be 21 to 59 years old;
- id: nlpnp_sw_occupation
  category: occupation
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  - job_offer.noc_teer
  pass_if: >-
    (candidate.stream in ['skilled_worker', 'express_entry']) && ((candidate.stream == 'skilled_worker' && job_offer.noc_teer in [0, 1, 2, 3, 4, 5]) || (candidate.stream == 'express_entry' && job_offer.noc_teer in [0, 1, 2, 3]))
  fail_if: >-
    (candidate.stream in ['skilled_worker', 'express_entry']) && (candidate.stream == 'express_entry' && job_offer.noc_teer in [4, 5])
  missing_or_unverified: 'NEEDS_REVIEW: Stream or the TEER of the job offer cannot be verified.'
  provenance:
    source_file: https://www.gov.nl.ca/immigration/4-express-entry-skilled-worker-category-eligibility-criteria/
    section: 4. Express Entry - Skilled Worker Category Eligibility Criteria
    verbatim: In a TEER 0, 1, 2, or 3 occupation;
  evidence_anchor:
    evidence_unit_id: "atlantic_documents:nl_ee_category_eligibility_criteria_sec4:ee_eligibility_criteria"
    source_id: nl_ee_category_eligibility_criteria_sec4
    source_file: 628755b6d38c42726505ec7afead4b6094c47f1dcf8c5291ad26baf1495a3e76
    source_url: https://www.gov.nl.ca/immigration/4-express-entry-skilled-worker-category-eligibility-criteria/
    source_sha256: 8fcad40883d50513692148fea01a04bffbe55f96cf09f013582d723e5dd55223
    source_edition: Updated April 22, 2026
    section: 4. Express Entry - Skilled Worker Category Eligibility Criteria
    verbatim_excerpt: In a TEER 0, 1, 2, or 3 occupation;
    supporting_excerpts:
    - evidence_unit_id: "atlantic_documents:nl_sw_category_eligibility_criteria_sec4:sw_eligibility_criteria"
      source_file: 0875f3d545ce233a9f5299e4b3d6cc279af48303d407c573f70515496151ae95
      verbatim_excerpt: In a TEER 0, 1, 2, 3, 4 or 5 occupation;
- id: nlpnp_sw_offer
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  - job_offer.weekly_hours
  - job_offer.paid_salary_or_hourly_not_commission
  - job_offer.hourly_wage
  - job_offer.prevailing_hourly_wage
  - job_offer.duration_months
  - job_offer.extension_reasonably_expected
  pass_if: >-
    (candidate.stream in ['skilled_worker', 'express_entry']) && (job_offer.weekly_hours >= 30 && job_offer.paid_salary_or_hourly_not_commission == true && job_offer.hourly_wage >= job_offer.prevailing_hourly_wage && job_offer.duration_months >= 24 && job_offer.extension_reasonably_expected == true)
  fail_if: >-
    (candidate.stream in ['skilled_worker', 'express_entry']) && ((job_offer.weekly_hours != null && job_offer.weekly_hours < 30) || job_offer.paid_salary_or_hourly_not_commission == false || (job_offer.hourly_wage != null && job_offer.prevailing_hourly_wage != null && job_offer.hourly_wage < job_offer.prevailing_hourly_wage) || (job_offer.duration_months != null && job_offer.duration_months < 12) || job_offer.extension_reasonably_expected == false)
  missing_or_unverified: 'NEEDS_REVIEW: Offer hours, pay, duration or extension cannot be verified, or duration is between 12 and 24 months where applicant and employer criteria differ.'
  provenance:
    source_file: https://www.gov.nl.ca/immigration/4-skilled-worker-category-eligibility-criteria/
    section: 4. Skilled Worker Category Eligibility Criteria
    verbatim: That guarantees a minimum of thirty (30) hours per week for the applicant;
  evidence_anchor:
    evidence_unit_id: "atlantic_documents:nl_sw_category_eligibility_criteria_sec4:sw_eligibility_criteria"
    source_id: nl_sw_category_eligibility_criteria_sec4
    source_file: 0875f3d545ce233a9f5299e4b3d6cc279af48303d407c573f70515496151ae95
    source_url: https://www.gov.nl.ca/immigration/4-skilled-worker-category-eligibility-criteria/
    source_sha256: cd6417868dc7d920ce7feee8b5493b6b4e4947be5946f71e4ce768041c86f51a
    source_edition: no date printed; fetched 2026-11-16
    section: 4. Skilled Worker Category Eligibility Criteria
    verbatim_excerpt: That guarantees a minimum of thirty (30) hours per week for the applicant;
    supporting_excerpts:
    - evidence_unit_id: "atlantic_documents:nl_sw_category_eligibility_criteria_sec4:sw_eligibility_criteria"
      source_file: 0875f3d545ce233a9f5299e4b3d6cc279af48303d407c573f70515496151ae95
      verbatim_excerpt: That compensates the applicant in the form of a salary or hourly wage (not commission);
    - evidence_unit_id: "atlantic_documents:nl_sw_category_eligibility_criteria_sec4:sw_eligibility_criteria"
      source_file: 0875f3d545ce233a9f5299e4b3d6cc279af48303d407c573f70515496151ae95
      verbatim_excerpt: That is at least one (1) year (twelve (12) months) in duration with a reasonable expectation of extension at the time of NLPNP application, as verified by the employer;
    - evidence_unit_id: "atlantic_documents:nl_employer_criteria_2026_10_30:employer_criteria"
      source_file: a3e110a0eb8bd270c18b2a9f1a58314cac19d8410d456d7bf4c8e941a125db0c
      verbatim_excerpt: Full-time, at least 2 years, located in NL
- id: nlpnp_work_authorization
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  pass_if: >-
    (candidate.stream in ['skilled_worker', 'express_entry']) && ((candidate.stream == 'skilled_worker' && (employer.jva_approved == true || candidate.holds_valid_work_permit_for_position == true)) || (candidate.stream == 'express_entry' && (employer.jva_approved == true || employer.lmia_positive == true || candidate.holds_work_authorization_for_position == true)))
  fail_if: >-
    (candidate.stream in ['skilled_worker', 'express_entry']) && ((candidate.stream == 'skilled_worker' && employer.jva_approved == false && candidate.holds_valid_work_permit_for_position == false && candidate.holds_work_authorization_for_position == false) || (candidate.stream == 'express_entry' && employer.jva_approved == false && employer.lmia_positive == false && candidate.holds_work_authorization_for_position == false))
  missing_or_unverified: 'NEEDS_REVIEW: JVA, valid work permit, LMIA or alternate authorization requires verification; alternate authorization without a JVA for Skilled Worker is unresolved.'
  provenance:
    source_file: https://www.gov.nl.ca/immigration/4-express-entry-skilled-worker-category-eligibility-criteria/
    section: 4. Express Entry - Skilled Worker Category Eligibility Criteria
    verbatim: With an employer that has a valid JVA, LMIA, OR where the applicant holds a valid work permit or alternate federal authorization to work full-time at the time of application to work in the identified position.
  evidence_anchor:
    evidence_unit_id: "atlantic_documents:nl_ee_category_eligibility_criteria_sec4:ee_eligibility_criteria"
    source_id: nl_ee_category_eligibility_criteria_sec4
    source_file: 628755b6d38c42726505ec7afead4b6094c47f1dcf8c5291ad26baf1495a3e76
    source_url: https://www.gov.nl.ca/immigration/4-express-entry-skilled-worker-category-eligibility-criteria/
    source_sha256: 8fcad40883d50513692148fea01a04bffbe55f96cf09f013582d723e5dd55223
    source_edition: Updated April 22, 2026
    section: 4. Express Entry - Skilled Worker Category Eligibility Criteria
    verbatim_excerpt: With an employer that has a valid JVA, LMIA, OR where the applicant holds a valid work permit or alternate federal authorization to work full-time at the time of application to work in the identified position.
    supporting_excerpts:
    - evidence_unit_id: "atlantic_documents:nl_sw_category_eligibility_criteria_sec4:sw_eligibility_criteria"
      source_file: 0875f3d545ce233a9f5299e4b3d6cc279af48303d407c573f70515496151ae95
      verbatim_excerpt: With an employer that has a valid JVA, if the applicant does not have a valid work permit to work in the identified position;
- id: nlpnp_employer_operating
  category: employer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - employer.months_operating
  pass_if: >-
    (candidate.stream in ['skilled_worker', 'express_entry']) && (employer.months_operating >= 24)
  fail_if: >-
    (candidate.stream in ['skilled_worker', 'express_entry']) && (employer.months_operating != null && employer.months_operating < 12)
  missing_or_unverified: 'NEEDS_REVIEW: Employer operating history is missing, or is between 12 and 24 months where one year may be accepted only in exceptional circumstances (new business after closure or sale, innovation or export business, rural region).'
  provenance:
    source_file: https://www.gov.nl.ca/immigration/immigrating-to-newfoundland-and-labrador/provincial-nominee-program/employers/employer-criteria/
    section: Employer Criteria - Be Established in NL
    verbatim: for at least two (2) consecutive years. In exceptional circumstances, one (1) year may be accepted.
  evidence_anchor:
    evidence_unit_id: "atlantic_documents:nl_employer_criteria_2026_10_30:employer_criteria"
    source_id: nl_employer_criteria_2026_10_30
    source_file: a3e110a0eb8bd270c18b2a9f1a58314cac19d8410d456d7bf4c8e941a125db0c
    source_url: https://www.gov.nl.ca/immigration/immigrating-to-newfoundland-and-labrador/provincial-nominee-program/employers/employer-criteria/
