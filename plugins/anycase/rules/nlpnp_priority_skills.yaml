schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  - job_offer
  - employer
  types:
    assessment_date: ISO-8601 date; assessment date. Not a rule by itself.
    candidate:
      stream: skilled_worker | express_entry
      age_years: integer; 21 to 59
      meets_noc_employment_requirements: boolean; the applicant meets the NOC employment requirements (qualifications, training, skills, accreditation) for the job
      holds_work_authorization_for_position: boolean; valid work permit or alternate federal authorization to work in the identified position
      holds_valid_work_permit_for_position: boolean; valid work permit for the identified position, distinct from alternate authorization
      holds_pgwp: boolean; post-graduation work permit holder (excluded from the Skilled Worker category)
      resides_in_canada: boolean
      permit_months_remaining_at_application: number; required when resides_in_canada is true; at least 4
      ownership_max_combined_ratio: decimal in [0,1]; applicant's ownership share of the employing business; cannot exceed 0.10
      has_criminal_record: boolean; the applicant or a dependent over 22
      has_unresolved_custody_or_child_support_dispute: boolean
      misrepresented_in_application: boolean; the applicant or the employer
      is_in_canada_refugee_claimant: boolean
      intends_to_reside_in_nl: boolean
      language_test_valid_for_processing: boolean; test valid for the entire NLPNP processing and the permanent residence submission
      language_test_type: IELTS-General | CELPIP-General | PTE-Core | TEF-Canada | TCF-Canada
      language_clb_minimum: integer; lowest of the four skills (Skilled Worker TEER 4 or 5 needs CLB 4)
      language_meets_ee_stream_minimum: boolean; the minimum for the federal Express Entry stream on the profile is met
      express_entry_profile_valid: boolean; accepted into the IRCC Express Entry pool
      nlpnp_grid_points: number; caller-supplied total on the NLPNP Point Assessment Grid (Express Entry needs 67)
      has_canadian_postsecondary_or_valid_eca: boolean; Express Entry category
      settlement_funds_sufficient: boolean; sufficient settlement resources for the applicant and dependents
      ability_to_settle_in_nl: boolean; ability to settle permanently in Newfoundland and Labrador
      legal_status_in_canada: boolean; valid status when residing in Canada
      ee_declared_experience_documented: boolean; all work experience declared in the Express Entry pool is documented
      representative_authorized_or_not_used: boolean; no paid representative is used, or the representative is authorized
    job_offer:
      noc_teer: integer 0-5
      weekly_hours: number; at least 30
      paid_salary_or_hourly_not_commission: boolean
      hourly_wage: number; offered hourly wage
      prevailing_hourly_wage: number; regional prevailing wage, or provincial or national when regional data is unavailable, as assessed by OIM
      duration_months: number; the offered duration in months
      extension_reasonably_expected: boolean; employer-verified reasonable expectation of extension
      other_job_requirements_met: boolean; job is in NL, any remote job is based in NL, non-seasonal, complies with employment standards and union agreements, and does not involve a labour dispute
    employer:
      jva_approved: boolean
      lmia_positive: boolean
      months_operating: number; active business under current ownership and management in Newfoundland and Labrador
      other_employer_requirements_met: boolean; permanent NL establishment, required local full-time employees, financial stability, legal compliance, good standing, recruitment priority and LMIA/JVA conditions are verified
evaluation:
  rule_statuses:
  - PASS
  - FAIL
  - NEEDS_REVIEW
  aggregate:
  - If any CRITICAL_REDLINE rule is FAIL, verdict = FAIL.
  - Otherwise, if any rule is NEEDS_REVIEW, verdict = NEEDS_REVIEW.
  - Otherwise, verdict = PASS.
rules:
- id: nlpnp_age
  category: age
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.age_years
  pass_if: >-
    (candidate.stream in ['skilled_worker', 'express_entry']) && (candidate.age_years >= 21 && candidate.age_years <= 59)
  fail_if: >-
    (candidate.stream in ['skilled_worker', 'express_entry']) && ((candidate.age_years != null && candidate.age_years < 21) || (candidate.age_years != null && candidate.age_years > 59))
  missing_or_unverified: 'NEEDS_REVIEW: Age cannot be verified.'
  provenance:
    source_file: https://www.gov.nl.ca/immigration/4-skilled-worker-category-eligibility-criteria/
    section: 4. Skilled Worker Category Eligibility Criteria
    verbatim: Be 21 to 59 years old;
  evidence_anchor:
    evidence_unit_id: "atlantic_documents:nl_sw_category_eligibility_criteria_sec4:sw_eligibility_criteria"
    source_id: nl_sw_category_eligibility_criteria_sec4
