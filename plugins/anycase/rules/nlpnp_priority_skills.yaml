    fields:
    - candidate.language_test_valid_for_processing
    - candidate.language_test_type
  pass_if: >-
    (candidate.stream in ['skilled_worker', 'express_entry']) && ((candidate.stream == 'skilled_worker' && job_offer.noc_teer in [0, 1, 2, 3]) || (candidate.stream == 'skilled_worker' && job_offer.noc_teer in [4, 5] && candidate.language_test_valid_for_processing == true && candidate.language_test_type in ['IELTS-General', 'CELPIP-General', 'PTE-Core', 'TEF-Canada', 'TCF-Canada'] && candidate.language_clb_minimum != null && candidate.language_clb_minimum >= 4) || (candidate.stream == 'express_entry' && candidate.language_test_valid_for_processing == true && candidate.language_test_type in ['IELTS-General', 'CELPIP-General', 'PTE-Core', 'TEF-Canada', 'TCF-Canada'] && candidate.language_meets_ee_stream_minimum == true))
  fail_if: >-
    (candidate.stream in ['skilled_worker', 'express_entry']) && ((candidate.language_test_type in ['IELTS-General', 'CELPIP-General', 'PTE-Core', 'TEF-Canada', 'TCF-Canada']) && ((candidate.stream == 'skilled_worker' && job_offer.noc_teer in [4, 5] && candidate.language_test_valid_for_processing == true && candidate.language_clb_minimum != null && candidate.language_clb_minimum < 4) || (candidate.stream == 'express_entry' && candidate.language_test_valid_for_processing == true && candidate.language_meets_ee_stream_minimum == false)))
  missing_or_unverified: 'NEEDS_REVIEW: An accepted language test valid for the entire processing is required for Skilled Worker TEER 4 or 5 and Express Entry; other test types require review.'
  provenance:
    source_file: https://www.gov.nl.ca/immigration/4-skilled-worker-category-eligibility-criteria/
    section: 4. Skilled Worker Category Eligibility Criteria
    verbatim: Applicants with TEER 4 or 5 job offers must submit a valid language proficiency test in NLPNP application.
