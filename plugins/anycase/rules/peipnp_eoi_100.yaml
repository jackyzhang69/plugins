- id: pei_job_offer
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  - job_offer.from_pei_employer
  - job_offer.full_time
  - job_offer.is_seasonal
  conditional_required_fields:
    when: job_offer.is_permanent == false
    fields:
    - job_offer.duration_months
  pass_if: >-
    candidate.stream in ['skilled_worker', 'critical_worker', 'international_graduate', 'intermediate_experience', 'occupations_in_demand', 'express_entry'] &&
    job_offer.from_pei_employer == true && job_offer.full_time == true && job_offer.is_seasonal == false &&
    (job_offer.is_permanent == true ||
    (candidate.stream != 'occupations_in_demand' && job_offer.duration_months != null && job_offer.duration_months >= 24))
  fail_if: >-
    (candidate.stream != null && !(candidate.stream in ['skilled_worker', 'critical_worker', 'international_graduate', 'intermediate_experience', 'occupations_in_demand', 'express_entry'])) ||
    job_offer.from_pei_employer == false || job_offer.full_time == false || job_offer.is_seasonal == true ||
    (job_offer.is_permanent == false && candidate.stream != 'occupations_in_demand' && job_offer.duration_months != null && job_offer.duration_months < 24)
  missing_or_unverified: 'NEEDS_REVIEW: Prince Edward Island employer, full-time terms, seasonal status or offer duration cannot be verified, or an Occupations in Demand offer is fixed-term (the guide prints permanent in the stream list and permanent or 24 months in the employer list).'
  provenance:
