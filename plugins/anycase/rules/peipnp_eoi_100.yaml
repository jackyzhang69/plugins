- id: pei_language
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream != 'express_entry'
    fields:
    - candidate.language_clb_minimum
    - candidate.language_result_within_2_years
    - candidate.occupational_language_met
    - job_offer.noc_teer
  pass_if: >-
    candidate.stream == 'express_entry' ||
    (candidate.stream in ['critical_worker', 'intermediate_experience', 'occupations_in_demand'] &&
    candidate.language_result_within_2_years == true && candidate.language_clb_minimum != null && candidate.language_clb_minimum >= 4) ||
    (candidate.stream == 'skilled_worker' &&
    ((candidate.language_result_within_2_years == true && candidate.language_clb_minimum != null && candidate.language_clb_minimum >= 4) ||
    candidate.occupational_language_met == true)) ||
    (candidate.stream == 'international_graduate' &&
    ((job_offer.noc_teer in [0, 1, 2, 3] && candidate.occupational_language_met == true) ||
    (job_offer.noc_teer in [4, 5] && candidate.language_result_within_2_years == true &&
    candidate.language_clb_minimum != null && candidate.language_clb_minimum >= 4)))
  fail_if: >-
    (candidate.stream != null && !(candidate.stream in ['skilled_worker', 'critical_worker', 'international_graduate', 'intermediate_experience', 'occupations_in_demand', 'express_entry'])) ||
    (candidate.stream in ['critical_worker', 'intermediate_experience', 'occupations_in_demand'] &&
    (candidate.language_result_within_2_years == false || (candidate.language_clb_minimum != null && candidate.language_clb_minimum < 4))) ||
    (candidate.stream == 'skilled_worker' && candidate.occupational_language_met == false &&
    (candidate.language_result_within_2_years == false || (candidate.language_clb_minimum != null && candidate.language_clb_minimum < 4))) ||
    (candidate.stream == 'international_graduate' &&
    ((job_offer.noc_teer in [0, 1, 2, 3] && candidate.occupational_language_met == false) ||
    (job_offer.noc_teer in [4, 5] && (candidate.language_result_within_2_years == false ||
    (candidate.language_clb_minimum != null && candidate.language_clb_minimum < 4)))))
  missing_or_unverified: 'NEEDS_REVIEW: Test age, lowest CLB, PEIW-02 confirmation or TEER cannot be verified. Express Entry has no language condition in the guide.'
  provenance:
    source_file: PEI Workforce Application Guide (January 2026)
    section: Step 1 - Skilled Worker, Critical Worker, International Graduate, Intermediate Experience, Occupations in Demand
    page: 3
    verbatim: Providing a valid language test result from an IRCC-approved testing institution, with a minimum score of CLB/NCLC 4. Language tests are valid for 2 years after the date of the test result; or
  evidence_anchor:
    evidence_unit_id: "atlantic_documents:pei_workforce_application_guide_jan_2026:p003"
    unit_status: candidate_k_validated_not_published
