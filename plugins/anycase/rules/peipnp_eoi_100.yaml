    (candidate.stream == 'skilled_worker' && candidate.completed_postsecondary_two_year == true) ||
    (candidate.stream in ['critical_worker', 'intermediate_experience', 'occupations_in_demand'] &&
    (candidate.meets_canadian_high_school == true || candidate.completed_postsecondary_two_year == true))
  fail_if: >-
    (candidate.stream != null && !(candidate.stream in ['skilled_worker', 'critical_worker', 'international_graduate', 'intermediate_experience', 'occupations_in_demand', 'express_entry'])) ||
    (candidate.stream == 'skilled_worker' && candidate.completed_postsecondary_two_year == false) ||
    (candidate.stream in ['critical_worker', 'intermediate_experience', 'occupations_in_demand'] &&
    candidate.meets_canadian_high_school == false && candidate.completed_postsecondary_two_year == false)
  missing_or_unverified: 'NEEDS_REVIEW: Post-secondary (Skilled Worker) or secondary school diploma (Critical Worker, Intermediate Experience, Occupations in Demand) cannot be verified. International Graduate and Express Entry have no education bullet in the guide.'
