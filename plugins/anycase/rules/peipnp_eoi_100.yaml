schema_version: 1.0.0
catalog_id: peipnp_eoi_100
jurisdiction: CA-PE
category: Prince Edward Island Provincial Nominee Program
display_name: PEI PNP Workforce and Express Entry
status: ACTIVE
program_id: PEIPNP_WORKFORCE
stream_id: WORKFORCE
effective_date: '2026-01-01'
source_edition: >-
  PEI Workforce Application Guide, January 2026 edition (footer 'January 2026 - page N', PDF pp.2-22); the live bytes
  of the guide are identical to the pinned artifact (raw sha256 94eb5b53...b5537), retrieved 2026-11-16. The PEI
  web pages are behind a bot challenge and were not used.
source_url: https://www.princeedwardisland.ca/sites/default/files/publications/pei_workforce_application_guide.pdf
decision_scope: >-
  Deterministic prescreen of the age, job-offer, language, education, intent and Express Entry profile conditions that the
  January 2026 guide prints for the five workforce streams and PEI Express Entry. Not evaluated here: work-experience
  years, legal status, financial resources, the Occupations in Demand NOC list, the Critical Worker trucking rule,
  employer requirements beyond the offer terms, the general ineligibility list, and the Express Entry 9-month and
  4-month permit conditions. Express Entry has no age, education, language or intent condition in the guide, so none
  is evaluated for it. The 100-point grids belong to AnyScore; this file has no points floor and states no pass mark. The
  Occupations in Demand offer term is 'permanent' in the stream list but 'permanent or minimum 24 months' in the
  all-streams employer list and the Appendix D definition and the guide does not reconcile them, so a fixed-term
  Occupations in Demand offer is NEEDS_REVIEW.
sources:
- id: pei_workforce_application_guide
  title: PEI Workforce Application Guide (January 2026)
  url: https://www.princeedwardisland.ca/sites/default/files/publications/pei_workforce_application_guide.pdf
  sha256: 94eb5b53aae77f001c02fbd36b8b26171b0f8f98da69fd80b2090f8d70fb5537
  citation: Step 1 Assess Your Eligibility (PDF pp.2-6) and Appendix D definitions (PDF pp.17-20).
  legal_authority: Prince Edward Island Provincial Nominee Program workforce and Express Entry eligibility
schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  - job_offer
  types:
    assessment_date: ISO-8601 date; assessment date. Not a rule by itself.
    candidate:
      stream: skilled_worker | critical_worker | international_graduate | intermediate_experience | occupations_in_demand
        | express_entry. The business stream is not a value in this file.
      age_years: integer; workforce applicants must be 18 to 59 inclusive. Express Entry has no stated age.
      language_clb_minimum: integer; lowest of the four skills on one test. Test minimum is CLB/NCLC 4.
      language_result_within_2_years: boolean; the test result is at most two years old.
      occupational_language_met: boolean; the employer confirms on PEIW-02 that the applicant's English or French is sufficient. Alternative to a test for Skilled Worker, and the only route for International Graduate in TEER 0 to 3.
      meets_canadian_high_school: boolean; the applicant holds a secondary school diploma (high school).
      completed_postsecondary_two_year: boolean; post-secondary degree or diploma, minimum two-year program. Required for Skilled Worker.
      express_entry_profile_valid: boolean; the applicant holds a valid federal Express Entry profile number.
      intends_to_reside_in_pei: boolean
    job_offer:
      from_pei_employer: boolean; the offer is from a Prince Edward Island employer.
      full_time: boolean; the offer is full-time (at least 30 hours per week for which wages are paid).
      is_seasonal: boolean; true means the offer is seasonal and fails.
      is_permanent: boolean; the offer is permanent. A non-permanent offer passes when duration_months is at least 24, except Occupations in Demand.
      duration_months: number; offer duration in months when the offer is not permanent.
      noc_teer: integer; TEER 0 to 5. Decides the International Graduate language route.
minimums:
  note: Documentation only. The engine evaluates the rules, not this block.
  streams:
  - skilled_worker
  - critical_worker
  - international_graduate
  - intermediate_experience
  - occupations_in_demand
  - express_entry
  workforce_age_years_min: 18
  workforce_age_years_max: 59
  offer_duration_months_if_not_permanent: 24
  language_result_max_age_years: 2
  language_clb_test_minimum: 4
  points_pass_mark: none
reference_points_grid:
  note: Documentation only. The eligibility engine ignores this key. AnyScore owns the arithmetic. There is no numeric pass mark in this ruleset and no points-floor rule.
  pass_mark: none
rules:
- id: pei_age
  category: age
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream != 'express_entry'
    fields:
    - candidate.age_years
  pass_if: >-
    candidate.stream == 'express_entry' ||
    (candidate.stream in ['skilled_worker', 'critical_worker', 'international_graduate', 'intermediate_experience', 'occupations_in_demand'] &&
    candidate.age_years != null && candidate.age_years >= 18 && candidate.age_years <= 59)
  fail_if: >-
    (candidate.stream != null && !(candidate.stream in ['skilled_worker', 'critical_worker', 'international_graduate', 'intermediate_experience', 'occupations_in_demand', 'express_entry'])) ||
    (candidate.stream in ['skilled_worker', 'critical_worker', 'international_graduate', 'intermediate_experience', 'occupations_in_demand'] &&
    candidate.age_years != null && (candidate.age_years < 18 || candidate.age_years > 59))
  missing_or_unverified: 'NEEDS_REVIEW: Age cannot be verified.'
  provenance:
    source_file: PEI Workforce Application Guide (January 2026)
    section: Step 1 - Occupations in Demand (the other four workforce streams print the same range)
    page: 4
    verbatim: be 18 to 59 years old;
