    verbatim_excerpt: "\f3. Applicants are required to reside in Saskatchewan with their accompanying dependent\n      family members within 50 kilometres of the applicant\u2019s business.\n4. Applicants must own at least one third (33 1/3%) of the equity of the business and\n   provide active and on-going participation in the day to day management and direction of\n   the business. If an Applicant will own less than 33 1/3 % they must invest $1 million CAD\n   and provide active and on-going participation in the day to day management and\n   direction of the business."
