  evidence_anchor:
    source_id: sinp_entrepreneur_guide_current_captured
    source_file: sinp-entrepreneur-guide-current.txt
    source_sha256: 562fc295d7b6e00347d99dd2e271e6e26096c23d08903188b5ce295d1a265133
    section: lines 686-720
    verbatim_excerpt: "\fJoint Ventures between SINP Program Applicants\n\n    \u2022    For applicants proposing a joint venture with another SINP applicant in the operation\n         of a new business, the purchase of an existing business or a partnership with a\n         Permanent Resident or Canadian Citizen:\n         o The Saskatchewan based business must have been in continuous operation by the\n            same owner for the previous three years.\n         o Applicants must complete an exploratory visit to meet the previous owners or\n            business partners.\n         o Applicants must provide evidence that reasonable efforts were taken to\n            establish a fair market value for the business or investment amount.\n         o Any succession buy-out must result in a complete change in ownership where\n            the applicants will assume full control of the business.\n         o When committing to maintain employment for existing Canadian citizens or\n            permanent residents, applicants will not be required to create additional jobs.\n         o When applying, all applicants must clearly indicate in their application form that\n            they are proposing a joint venture with a program applicant or a permanent\n            resident or Canadian citizen, and identify their proposed business partners;\n         o Each prospective applicant must submit their individual EOI simultaneously;\n         o Each prospective applicant will be evaluated individually, with selection from the\n            EOI pool dependent on their ability to meet eligibility criteria and earn points as an\n            individual, not part of a group or partnership;\n         o If any partner is not selected from the EOI pool for processing, all remaining\n            partners will be required to update their business proposal, making any required\n            changes to ensure they continue to be eligible for the EOI points previously\n            earned;\n       \
      \  o If all partners are selected from the EOI pool and approved, each partner will be\n            required to sign a separate Business Performance Agreement, and each partner\n            must meet the agreement terms in order to be approved for nomination;\n         o In the event that the SINP determines that one or more partners failed to meet the\n            terms of their individual Business Performance Agreement for reasons beyond\n            humanitarian and compassionate circumstances, all remaining partners will be\n            required to update their performance agreement to ensure they continue to meet\n            program criteria, including, but not limited to, changes to the required investment\n            amount."
