    section: lines 422-438
    verbatim_excerpt: "2 (e). Arriving in Saskatchewan and Business Establishment\n\n    \u2022   All approved applicants that don't attend an arrival meeting in Saskatchewan\n        within 18 months of the date on the SINP Entrepreneur Approval letter will be\n        deemed to have failed to fulfill BPA terms, and their applications will be\n        closed.\n    \u2022   Upon arrival in Saskatchewan, you are required to:\n          o     Attend an Arrival Meeting with SINP within 90 days of arriving in Canada.\n                SINP staff will provide valuable information, answer questions regarding\n                fulfilling the BPA terms, and offer referrals to relevant service providers for\n                business establishment guidance.\n          o     Notify SINP Entrepreneur Category of your arrival. Appendix E includes a\n                list of documents you are required to provide.\n          o     No later than 12 months after the Landing Date, submit to the SINP\n                Entrepreneur category the Business Establishment Progress Report\n                outlining your business establishment activities to date.\n          o     Appendix G includes the Business Establishment Progress Report form."
