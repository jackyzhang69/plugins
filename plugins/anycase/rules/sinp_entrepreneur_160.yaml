  evidence_anchor:
    source_id: sinp_entrepreneur_guide_current_captured
    source_file: sinp-entrepreneur-guide-current.txt
    source_sha256: 562fc295d7b6e00347d99dd2e271e6e26096c23d08903188b5ce295d1a265133
    section: lines 191-211
    verbatim_excerpt: "\fExploratory Visit\n\n    EOI Candidates are required to have participated in an exploratory visit to Saskatchewan of\n    no less than five (5) days over the previous 12-month period prior to submitting an\n    Expression of Interest. During this visit the person must have conducted meetings with\n    local stakeholders and service providers relevant to the candidate\u2019s Business\n    Establishment Plan including, but not limited to, suppliers, commercial realtors, lawyers,\n    accountants, business brokers/consultants, financial institutions, and economic\n    development agencies. Activities such as meetings, information sessions and workshops\n    are only eligible for consideration if the candidate can demonstrate how they directly\n    relate to the candidate\u2019s Business Establishment Plan. Travel days to or from Saskatchewan\n    do not count as one of the five days required.\n\n    If invited to apply, candidates are required to complete and submit an Exploratory Visit\n    Report that details the activities undertaken during their visit. The report must cover the\n    entire length of your stay in Canada, including time spent in other provinces, if any. The\n    report must list the dates, times, contact information and description of the activity and/or\n    meeting and how it relates to the candidate\u2019s business establishment or settlement. The\n    report should include copies of airline tickets, boarding passes, hotel receipts, and\n    business cards. Please do not include photographs, brochures, flyers, maps, or other\n    promotional information collected during the Exploratory Visit."
