schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  types:
    assessment_date: ISO-8601 date
reference_points_grid:
  note: Documentation only. Maximum 160 under the corrected pre-March 2024 grid. This eligibility ruleset does not calculate ranking points.
rules:
- id: sinp_ent_net_worth
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.source_edition
  conditional_required_fields:
    when: candidate.source_edition == "before_2024_03_14"
    fields:
    - candidate.net_worth_cad
    - candidate.net_worth_verified_by_approved_professional
  pass_if: (candidate.source_edition == "current_2024_guide") || ((candidate.source_edition == "before_2024_03_14") && (candidate.net_worth_cad >= 500000 && candidate.net_worth_verified_by_approved_professional == true))
  fail_if: (candidate.source_edition == "before_2024_03_14") && (candidate.net_worth_cad < 500000 || candidate.net_worth_verified_by_approved_professional == false)
  missing_or_unverified: 'NEEDS_REVIEW: Net worth or Ministry-approved professional verification cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "sinp.prairies_documents.guide.p013"
    source_id: sinp_entrepreneur_application_guide_before_2024_03_14
    source_file: "4b6c40497a6331f9b1a59d06fae08744e994eae0a1022db10595aed1a184d25f"
    page: "13"
    section: "Eligibility Requirements \u2014 minimum net worth"
    verbatim_excerpt: "a. Applicants must have a minimum $500,000 CAD in Net Business and Personal\nAssets, verified by a Ministry approved professional third party."
- id: sinp_ent_accumulation_verification
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.source_edition
  conditional_required_fields:
    when: candidate.source_edition == "before_2024_03_14"
    fields:
    - candidate.net_worth_accumulation_verified_percent
    - candidate.net_worth_accumulation_verified_by_approved_professional
  pass_if: (candidate.source_edition == "current_2024_guide") || ((candidate.source_edition == "before_2024_03_14") && (candidate.net_worth_accumulation_verified_percent >= 80 && candidate.net_worth_accumulation_verified_by_approved_professional == true))
  fail_if: (candidate.source_edition == "before_2024_03_14") && (candidate.net_worth_accumulation_verified_percent < 80 || candidate.net_worth_accumulation_verified_by_approved_professional == false)
  missing_or_unverified: 'NEEDS_REVIEW: Legal accumulation of claimed net worth or its Ministry-approved professional verification cannot be verified to at least 80 percent.'
  evidence_anchor:
    evidence_unit_id: "sinp.prairies_documents.guide.p013"
    source_id: sinp_entrepreneur_application_guide_before_2024_03_14
    source_file: "4b6c40497a6331f9b1a59d06fae08744e994eae0a1022db10595aed1a184d25f"
    page: "13"
    section: "Eligibility Requirements \u2014 accumulation of claimed net worth"
    verbatim_excerpt: "b. Applicants must be able to demonstrate accumulation of claimed net worth\nthrough legal means, verified to at least 80 percent by a Ministry approved\nprofessional third party."
- id: sinp_ent_experience
  category: experience
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.source_edition
  conditional_required_fields:
    when: candidate.source_edition == "before_2024_03_14"
    fields:
    - candidate.entrepreneurial_years_past_10
  pass_if: (candidate.source_edition == "current_2024_guide") || ((candidate.source_edition == "before_2024_03_14") && (candidate.entrepreneurial_years_past_10 >= 3))
  fail_if: (candidate.source_edition == "before_2024_03_14") && (candidate.entrepreneurial_years_past_10 < 3)
  missing_or_unverified: 'NEEDS_REVIEW: Three years of entrepreneurial experience within the ten years before EOI submission cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "sinp.prairies_documents.guide.p013"
    source_id: sinp_entrepreneur_application_guide_before_2024_03_14
    source_file: "4b6c40497a6331f9b1a59d06fae08744e994eae0a1022db10595aed1a184d25f"
    page: "13"
    section: "Eligibility Requirements \u2014 entrepreneurial experience"
    verbatim_excerpt: "c. Applicants must have a minimum of three years of\nentrepreneurialexperience within the ten years prior to\nsubmitting their EOI."
- id: sinp_ent_investment
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.source_edition
  conditional_required_fields:
    when: candidate.source_edition == "before_2024_03_14"
    fields:
    - candidate.in_regina_or_saskatoon
    - candidate.investment_cad
  pass_if: (candidate.source_edition == "current_2024_guide") || ((candidate.source_edition == "before_2024_03_14") && ((candidate.in_regina_or_saskatoon == true && candidate.investment_cad >= 300000) || (candidate.in_regina_or_saskatoon == false && candidate.investment_cad >= 200000)))
  fail_if: (candidate.source_edition == "before_2024_03_14") && ((candidate.in_regina_or_saskatoon == true && candidate.investment_cad < 300000) || (candidate.in_regina_or_saskatoon == false && candidate.investment_cad < 200000))
  missing_or_unverified: 'NEEDS_REVIEW: Equity investment amount or whether the community is Regina or Saskatoon cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "sinp.prairies_documents.guide.p013"
    source_id: sinp_entrepreneur_application_guide_before_2024_03_14
    source_file: "4b6c40497a6331f9b1a59d06fae08744e994eae0a1022db10595aed1a184d25f"
    page: "13"
    section: "Eligibility Requirements \u2014 equity investment"
    verbatim_excerpt: "d. Applicants will be required to make a minimum equity investment of\n$300,000 CAD in Regina or Saskatoon, or a minimum equity investment of\n$200,000 CAD in any other Saskatchewan community."
- id: sinp_ent_equity
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.source_edition
  conditional_required_fields:
    when: candidate.source_edition == "before_2024_03_14"
    fields:
    - candidate.equity_ratio
    - candidate.investment_cad
  pass_if: (candidate.source_edition == "current_2024_guide") || ((candidate.source_edition == "before_2024_03_14") && (candidate.equity_ratio >= 1 / 3 || candidate.investment_cad >= 1000000))
  fail_if: (candidate.source_edition == "before_2024_03_14") && (candidate.equity_ratio < 1 / 3 && candidate.investment_cad < 1000000)
  missing_or_unverified: 'NEEDS_REVIEW: Equity share or investment amount cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "sinp.prairies_documents.guide.p014"
    source_id: sinp_entrepreneur_application_guide_before_2024_03_14
    source_file: "4b6c40497a6331f9b1a59d06fae08744e994eae0a1022db10595aed1a184d25f"
    page: "14"
    section: "Eligibility Requirements \u2014 business equity"
    verbatim_excerpt: "4. Applicants must own at least one third (33 1/3%) of the equity of the business and\nprovide active and on-going participation in the day to day management and direction\nof the business. If an Applicant will own less than 33 1/3 % they must invest $1 million\nCAD and provide active and on-going participation in the day to day management and\ndirection of the business."
- id: sinp_ent_management
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.source_edition
  conditional_required_fields:
    when: candidate.source_edition == "before_2024_03_14"
    fields:
    - candidate.committed_to_active_ongoing_day_to_day_management_and_direction_in_saskatchewan
    - candidate.business_establishment_stage
  pass_if: (candidate.source_edition == "current_2024_guide") || ((candidate.source_edition == "before_2024_03_14") && ((candidate.business_establishment_stage == "application" && candidate.committed_to_active_ongoing_day_to_day_management_and_direction_in_saskatchewan == true) || (candidate.business_establishment_stage == "established" && candidate.actual_active_ongoing_day_to_day_management_and_direction_in_saskatchewan == true)))
  fail_if: (candidate.source_edition == "before_2024_03_14") && ((candidate.business_establishment_stage == "application" && candidate.committed_to_active_ongoing_day_to_day_management_and_direction_in_saskatchewan == false) || (candidate.business_establishment_stage == "established" && candidate.actual_active_ongoing_day_to_day_management_and_direction_in_saskatchewan == false))
  missing_or_unverified: 'NEEDS_REVIEW: The application-stage commitment or, when established, actual active and ongoing day-to-day management and direction in Saskatchewan cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "sinp.prairies_documents.guide.p014"
    source_id: sinp_entrepreneur_application_guide_before_2024_03_14
    source_file: "4b6c40497a6331f9b1a59d06fae08744e994eae0a1022db10595aed1a184d25f"
    page: "14"
    section: "Eligibility Requirements \u2014 business management"
    verbatim_excerpt: "Applicants must own at least one third (33 1/3%) of the equity of the business and\nprovide active and on-going participation in the day to day management and direction\nof the business."
- id: sinp_ent_jobs
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.source_edition
  conditional_required_fields:
    when: candidate.source_edition == "before_2024_03_14"
    fields:
    - candidate.in_regina_or_saskatoon
    - candidate.new_business
    - candidate.business_establishment_stage
  pass_if: (candidate.source_edition == "current_2024_guide") || ((candidate.source_edition == "before_2024_03_14") && ((candidate.business_establishment_stage == "application" || candidate.business_establishment_stage == "established") && (candidate.in_regina_or_saskatoon == false || candidate.new_business == false || candidate.qualifying_jobs_committed_or_created_for_canadians_or_pr_nonrelatives >= 2)))
  fail_if: (candidate.source_edition == "before_2024_03_14") && ((candidate.business_establishment_stage == "application" || candidate.business_establishment_stage == "established") && candidate.in_regina_or_saskatoon == true && candidate.new_business == true && candidate.qualifying_jobs_committed_or_created_for_canadians_or_pr_nonrelatives < 2)
  missing_or_unverified: 'NEEDS_REVIEW: At application, planned qualifying jobs for Canadians or permanent residents who are not relatives; after establishment, created or maintained qualifying jobs cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "sinp.prairies_documents.guide.p014"
    source_id: sinp_entrepreneur_application_guide_before_2024_03_14
    source_file: "4b6c40497a6331f9b1a59d06fae08744e994eae0a1022db10595aed1a184d25f"
    page: "14"
    section: "Eligibility Requirements \u2014 new business employment"
    verbatim_excerpt: "5. Applicants establishing a new business in Saskatoon or Regina must create or maintain at\nleast two (2) jobs for two Canadians or Permanent Residents in Saskatchewan (nonrelative workers)."
- id: sinp_ent_existing_business_staffing
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.source_edition
  conditional_required_fields:
    when: candidate.source_edition == "before_2024_03_14"
    fields:
    - candidate.purchased_existing_business_in_regina_or_saskatoon
    - candidate.business_establishment_stage
  pass_if: (candidate.source_edition == "current_2024_guide") || ((candidate.source_edition == "before_2024_03_14") && (candidate.purchased_existing_business_in_regina_or_saskatoon == false || (candidate.business_establishment_stage == "established" && candidate.post_purchase_qualifying_canadian_or_pr_staff_count >= candidate.pre_purchase_qualifying_canadian_or_pr_staff_count) || (candidate.business_establishment_stage == "application" && candidate.commitment_to_maintain_existing_staffing_complement == true)))
  fail_if: (candidate.source_edition == "before_2024_03_14") && (candidate.purchased_existing_business_in_regina_or_saskatoon == true && ((candidate.business_establishment_stage == "established" && candidate.post_purchase_qualifying_canadian_or_pr_staff_count < candidate.pre_purchase_qualifying_canadian_or_pr_staff_count) || (candidate.business_establishment_stage == "application" && candidate.commitment_to_maintain_existing_staffing_complement == false)))
  missing_or_unverified: 'NEEDS_REVIEW: Commitment to maintain the existing Regina or Saskatoon business staffing complement, or actual counts when established, cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "sinp.prairies_documents.guide.p014"
    source_id: sinp_entrepreneur_application_guide_before_2024_03_14
    source_file: "4b6c40497a6331f9b1a59d06fae08744e994eae0a1022db10595aed1a184d25f"
    page: "14"
    section: "Eligibility Requirements \u2014 purchase of existing business"
    verbatim_excerpt: "If applicants purchase an existing business in Saskatoon or Regina they\nmust maintain the business\u2019 staffing complement (the number of Canadian or permanent\nresident workers) in place at the time of purchase."
- id: sinp_ent_residence
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.source_edition
  conditional_required_fields:
    when: candidate.source_edition == "before_2024_03_14"
    fields:
    - candidate.committed_to_reside_in_saskatchewan_with_dependents
    - candidate.business_establishment_stage
  pass_if: (candidate.source_edition == "current_2024_guide") || ((candidate.source_edition == "before_2024_03_14") && ((candidate.business_establishment_stage == "application" && candidate.committed_to_reside_in_saskatchewan_with_dependents == true) || (candidate.business_establishment_stage == "established" && candidate.actual_residence_with_dependents_in_saskatchewan == true)))
  fail_if: (candidate.source_edition == "before_2024_03_14") && ((candidate.business_establishment_stage == "application" && candidate.committed_to_reside_in_saskatchewan_with_dependents == false) || (candidate.business_establishment_stage == "established" && candidate.actual_residence_with_dependents_in_saskatchewan == false))
  missing_or_unverified: 'NEEDS_REVIEW: The application-stage residence commitment, or actual Saskatchewan residence when established, cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "sinp.prairies_documents.guide.p014"
    source_id: sinp_entrepreneur_application_guide_before_2024_03_14
    source_file: "4b6c40497a6331f9b1a59d06fae08744e994eae0a1022db10595aed1a184d25f"
    page: "14"
    section: "Eligibility Requirements \u2014 residence"
    verbatim_excerpt: "3. Applicants are required to reside in Saskatchewan with their dependent family\nmembers."
- id: sinp_ent_bep_knowledge
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.source_edition
  conditional_required_fields:
    when: candidate.source_edition == "before_2024_03_14"
    fields:
    - candidate.bep_knowledge_human_review_outcome
  pass_if: (candidate.source_edition == "current_2024_guide") || ((candidate.source_edition == "before_2024_03_14") && (candidate.bep_knowledge_human_review_outcome == "demonstrated"))
  fail_if: (candidate.source_edition == "before_2024_03_14") && (candidate.bep_knowledge_human_review_outcome == "not_demonstrated")
  missing_or_unverified: 'NEEDS_REVIEW: An authorized human assessment of in-depth Business Establishment Plan knowledge is missing or inconclusive.'
  evidence_anchor:
    evidence_unit_id: "sinp.prairies_documents.guide.p013"
    source_id: sinp_entrepreneur_application_guide_before_2024_03_14
    source_file: "4b6c40497a6331f9b1a59d06fae08744e994eae0a1022db10595aed1a184d25f"
    page: "13"
    section: "Eligibility Requirements \u2014 Business Establishment Plan knowledge"
    verbatim_excerpt: "2. Applicants must have and be able to demonstrate an in-depth knowledge of their BEP."
- id: sinp_current_arrival_approval
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.source_edition
  conditional_required_fields:
    when: (candidate.source_edition == "current_2024_guide") && (candidate.stream in ["ent_new", "ent_existing", "ent_succession"] && candidate.business_establishment_stage == "established")
    fields:
    - candidate.approval_letter_date
    - candidate.arrival_meeting_date
  pass_if: (candidate.source_edition == "before_2024_03_14" || ((candidate.source_edition == "current_2024_guide") && (candidate.stream in ["ent_new", "ent_existing", "ent_succession"]) && (candidate.business_establishment_stage in ["eoi", "application"]))) || (((candidate.source_edition == "current_2024_guide") && (candidate.stream in ["ent_new", "ent_existing", "ent_succession"] && candidate.business_establishment_stage == "established")) && (calendar_days_between(candidate.approval_letter_date, candidate.arrival_meeting_date) >= 0 && candidate.arrival_meeting_date <= calendar_months_after(candidate.approval_letter_date, 18)))
  fail_if: (calendar_days_between(candidate.approval_letter_date, candidate.approval_letter_date) == 0 && calendar_days_between(candidate.arrival_meeting_date, candidate.arrival_meeting_date) == 0) && (((candidate.source_edition == "current_2024_guide") && (candidate.stream in ["ent_new", "ent_existing", "ent_succession"] && candidate.business_establishment_stage == "established")) && (calendar_days_between(candidate.approval_letter_date, candidate.arrival_meeting_date) < 0 || candidate.arrival_meeting_date > calendar_months_after(candidate.approval_letter_date, 18)))
  missing_or_unverified: 'NEEDS_REVIEW: Source-edition, branch/stage selector or source-required evidence is missing or inconclusive.'
  evidence_anchor:
    source_id: sinp_entrepreneur_guide_current_captured
    source_file: sinp-entrepreneur-guide-current.txt
    source_sha256: 562fc295d7b6e00347d99dd2e271e6e26096c23d08903188b5ce295d1a265133
    section: lines 422-438
    verbatim_excerpt: "2 (e). Arriving in Saskatchewan and Business Establishment\n\n    \u2022   All approved applicants that don't attend an arrival meeting in Saskatchewan\n        within 18 months of the date on the SINP Entrepreneur Approval letter will be\n        deemed to have failed to fulfill BPA terms, and their applications will be\n        closed.\n    \u2022   Upon arrival in Saskatchewan, you are required to:\n          o     Attend an Arrival Meeting with SINP within 90 days of arriving in Canada.\n                SINP staff will provide valuable information, answer questions regarding\n                fulfilling the BPA terms, and offer referrals to relevant service providers for\n                business establishment guidance.\n          o     Notify SINP Entrepreneur Category of your arrival. Appendix E includes a\n                list of documents you are required to provide.\n          o     No later than 12 months after the Landing Date, submit to the SINP\n                Entrepreneur category the Business Establishment Progress Report\n                outlining your business establishment activities to date.\n          o     Appendix G includes the Business Establishment Progress Report form."
