  eval_type: deterministic
  required_fields:
  - candidate.source_edition
  conditional_required_fields:
    when: (candidate.source_edition == "current_2024_guide") && (candidate.stream in ["ent_new", "ent_existing", "ent_succession"] && candidate.business_establishment_stage == "established")
    fields:
    - candidate.canada_arrival_date
    - candidate.arrival_meeting_date
  pass_if: (candidate.source_edition == "before_2024_03_14" || ((candidate.source_edition == "current_2024_guide") && (candidate.stream in ["ent_new", "ent_existing", "ent_succession"]) && (candidate.business_establishment_stage in ["eoi", "application"]))) || (((candidate.source_edition == "current_2024_guide") && (candidate.stream in ["ent_new", "ent_existing", "ent_succession"] && candidate.business_establishment_stage == "established")) && (calendar_days_between(candidate.canada_arrival_date, candidate.arrival_meeting_date) >= 0 && calendar_days_between(candidate.canada_arrival_date, candidate.arrival_meeting_date) <= 90))
  fail_if: (calendar_days_between(candidate.canada_arrival_date, candidate.canada_arrival_date) == 0 && calendar_days_between(candidate.arrival_meeting_date, candidate.arrival_meeting_date) == 0) && (((candidate.source_edition == "current_2024_guide") && (candidate.stream in ["ent_new", "ent_existing", "ent_succession"] && candidate.business_establishment_stage == "established")) && (calendar_days_between(candidate.canada_arrival_date, candidate.arrival_meeting_date) < 0 || calendar_days_between(candidate.canada_arrival_date, candidate.arrival_meeting_date) > 90))
  missing_or_unverified: 'NEEDS_REVIEW: Source-edition, branch/stage selector or source-required evidence is missing or inconclusive.'
  evidence_anchor:
