      \  o If all partners are selected from the EOI pool and approved, each partner will be\n            required to sign a separate Business Performance Agreement, and each partner\n            must meet the agreement terms in order to be approved for nomination;\n         o In the event that the SINP determines that one or more partners failed to meet the\n            terms of their individual Business Performance Agreement for reasons beyond\n            humanitarian and compassionate circumstances, all remaining partners will be\n            required to update their performance agreement to ensure they continue to meet\n            program criteria, including, but not limited to, changes to the required investment\n            amount."
