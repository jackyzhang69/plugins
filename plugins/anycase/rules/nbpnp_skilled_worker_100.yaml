- id: nbpnp_job_offer
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  pass_if: >-
    (candidate.stream == 'express_entry' && candidate.ee_pathway == 'nb_interest') ||
    ((candidate.stream == 'skilled_worker' || (candidate.stream == 'express_entry' && candidate.ee_pathway == 'employment_nb')) &&
    job_offer.weekly_hours >= 30 && job_offer.is_seasonal == false && job_offer.accepted_or_current == true &&
    (candidate.stream != 'express_entry' || job_offer.noc_teer in [0, 1, 2, 3]) &&
    employer.months_operating >= 24 && employer.on_foreign_worker_registry == true)
  fail_if: >-
    (candidate.stream == 'skilled_worker' || (candidate.stream == 'express_entry' && candidate.ee_pathway == 'employment_nb')) &&
    ((job_offer.weekly_hours != null && job_offer.weekly_hours < 30) || job_offer.is_seasonal == true ||
    job_offer.accepted_or_current == false || (candidate.stream == 'express_entry' && job_offer.noc_teer != null && !(job_offer.noc_teer in [0, 1, 2, 3])) ||
    (employer.months_operating != null && employer.months_operating < 24) || employer.on_foreign_worker_registry == false)
  missing_or_unverified: 'NEEDS_REVIEW: Pathway, job hours, seasonal status or employer eligibility cannot be verified.'
