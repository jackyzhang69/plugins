schema_version: 1.0.0
catalog_id: nbpnp_skilled_worker_100
jurisdiction: CA-NB
category: New Brunswick Provincial Nominee Program
display_name: NBPNP Skilled Worker and Express Entry
status: ACTIVE
program_id: NBPNP_SKILLED_WORKER
stream_id: SKILLED_WORKER
effective_date: '2026-06-01'
source_edition: Current official Skilled Worker and Express Entry stream pages, captured 2026-11-17; the Employment in New Brunswick guide is October 2026.
source_url: https://www.gnb.ca/en/topic/family-home-community/immigration/provincial-nominee-program/skilled-worker-stream.html
decision_scope: Eligibility prescreen for the New Brunswick Skilled Worker and Express Entry pathways. Express Entry compares a caller-assessed total with the official 67-point threshold. No Skilled Worker points cutoff is inferred.
sources:
- id: nbpnp_sw
  title: New Brunswick Skilled Worker Stream
  url: https://www.gnb.ca/en/topic/family-home-community/immigration/provincial-nominee-program/skilled-worker-stream.html
  sha256: d45db861aa4b608eb784ff9c1237eabdd1d4f0a24165087132ee79a246151d03
- id: nbpnp_ee
  title: New Brunswick Express Entry Stream
  url: https://www.gnb.ca/en/topic/family-home-community/immigration/provincial-nominee-program/express-entry-stream.html
  sha256: 74c870bf0a7efcab324e0d3092ad549046fe6d416bc6786d44b56e36b169c7fc
schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  - job_offer
  - employer
  types:
    assessment_date: ISO-8601 date; assessment date. Not a rule by itself.
    candidate:
      stream: skilled_worker | express_entry. The business stream is not a value in this file.
      age_years: integer; Skilled Worker requires at least 19, Express Entry requires 19 through 55.
      skilled_worker_pathway: experience | graduates | priority_occupations
      ee_pathway: employment_nb | nb_interest
      language_clb_minimum: integer; lowest of the four language skills.
      language_result_within_2_years: boolean; applicable approved test is less than two years old at the ImmigrationNB application.
      language_result_valid_at_ircc: boolean; for Express Entry, the applicable test will be less than two years old at the permanent residence application to IRCC.
      language_test_type_accepted: boolean; the applicable language test is accepted by the program.
      nb_graduate_language_test_exemption_verified: boolean; the Graduate test exemption is verified against the current guide.
      nb_graduate_studied_in_english_or_french: boolean; NB graduate program was conducted in English or French.
      meets_canadian_high_school: boolean; Canadian high school diploma or foreign equivalent.
      eligible_nb_graduate_program: boolean; completed a PGWP-eligible program at a designated NB institution.
      nb_mahe_unb_dual_degree_completed: boolean; completed the MAHE-UNB Dual Degree in Nursing.
      months_full_time_with_supporting_employer: number; Experience pathway work with the same supporting employer.
      related_paid_work_months: number; Priority Occupations pathway related paid work months within the past five years.
      related_paid_work_hours_past_5_years: number; related paid work hours within the past five years.
      continuous_skilled_months_past_10_years: number; EE continuous skilled work experience in the past 10 years.
      experience_noc_teer: integer; TEER of the skilled work experience, not necessarily the offered position.
      express_entry_profile_valid: boolean; valid Express Entry profile.
      currently_employed_in_nb_12_months: boolean; currently employed and worked full time in NB for the past 12 months.
      currently_working_for_supporting_employer: boolean; the Experience pathway applicant currently works for the supporting employer.
      nb_residence_months: number; months residing in New Brunswick.
      nb_work_authorized: boolean; work relied on was authorized in Canada.
      letter_of_interest: boolean; NB letter of interest received in the Express Entry profile.
      federal_proof_of_funds_met: boolean; federal funds requirement is met or an applicable federal exemption has been verified.
      nb_priority_recruitment_and_noc_verified: boolean; the NB government recruitment mission and listed priority occupation are verified.
      nb_other_requirements_verified: boolean; remaining applicable current guide and common-page conditions are individually verified, including status, intent, ECA, licences, work authorization, wage, employer eligibility, recruitment and disqualifications.
      assessed_grid_points: number; caller-assessed Express Entry selection-factor total.
    job_offer:
      weekly_hours: number; regular weekly hours. Floor is 30.
      accepted_or_current: boolean; the applicant accepted the job offer or is currently working in the position.
      is_seasonal: boolean; true means the offer is seasonal and fails.
      noc_teer: integer; TEER of the offered position.
      noc_2021_code: five-digit NOC code of the offered position.
    employer:
      months_operating: number; months the employer has been operating. Floor is 24.
      on_foreign_worker_registry: boolean; employer is on the foreign worker registry.
minimums:
  note: Documentation only. The engine evaluates the rules, not this block.
  streams:
  - skilled_worker
  - express_entry
  skilled_worker_age_min: 19
  weekly_hours: 30
  employer_months_operating: 24
  language_result_max_age_years: 2
  language_clb_skilled_worker: 4
  language_clb_express_entry: 7
  skilled_worker_experience_same_employer_months: 6
  skilled_worker_priority_related_paid_months: 12
  express_entry_continuous_skilled_months: 12
  express_entry_teer:
  - 0
  - 1
  - 2
  - 3
  skilled_worker_points_threshold: unverified
  express_entry_points_threshold: 67
  points_grid_maximum: 100
rules:
- id: nbpnp_age
  category: age
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  - candidate.age_years
  pass_if: (candidate.stream == 'skilled_worker' && candidate.age_years >= 19) || (candidate.stream == 'express_entry' && candidate.age_years >= 19 && candidate.age_years <= 55)
  fail_if: (candidate.stream in ['skilled_worker', 'express_entry'] && candidate.age_years != null && candidate.age_years < 19) || (candidate.stream == 'express_entry' && candidate.age_years != null && candidate.age_years > 55)
  missing_or_unverified: 'NEEDS_REVIEW: Stream or age cannot be verified.'
  evidence_anchor:
    evidence_unit_id: nbpnp:nb_skilled_worker_current_20261117:full_document_body
    source_id: nb_skilled_worker_current_20261117
    source_file: 4f3b2f1c94d0af2503170dddefd9045f299d978db94ff09f3df279dcee2f0b39
    section: Eligibility
    verbatim_excerpt: be at least 19 years old
    supporting_excerpts:
    - evidence_unit_id: nbpnp:nb_express_entry_current_20261117:full_document_body
      source_file: ca32a316be03bc348b22d6f351b1e4b87dc8351a89c4fe98859281adeb513eb2
