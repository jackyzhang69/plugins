schema_version: "1.0.0"
catalog_id: "lmia_global_talent"
jurisdiction: "FED"
category: "Temporary Foreign Worker Program"
display_name: "TFWP LMIA: Global Talent Stream"
status: "ACTIVE"
program_id: "TFWP_LMIA"
stream_id: "GLOBAL_TALENT"
effective_date: "2026-07-17"
source_edition: "ESDC Temporary Foreign Worker Program Requirements for the Global Talent Stream, July 2026 update"
source_url: "https://www.canada.ca/en/employment-social-development/services/foreign-workers/global-talent/requirements.html"
decision_scope: "Pre-screen of the five regulatory rules defined below; PASS confirms eligibility for expedited 2-week processing under GTS."

schema:
  input_type: object
  required_top_level: [assessment_date, employer, job_offer, noul]
  types:
    assessment_date: "ISO-8601 date; LMIA submission date"
    employer:
      business_name: string
      cra_business_number: string
      is_sex_industry: boolean
      on_ircc_ineligibility_list: boolean
      in_default_of_amp: boolean
      lmia_revocation_past_2_years: boolean
      gts_category: "string in ['A', 'B']"
      designated_partner_referral: boolean
      has_lmbp_agreement: boolean
    job_offer:
      province: "two-letter code in [AB, BC, MB, NB, NL, NT, NS, NU, ON, PE, QC, SK, YT]"
      noc_2021_code: "five-digit string"
      noc_teer: "integer 0-5"
      title: string
      regular_hourly_wage_cad: "non-negative decimal"
      prevailing_wage_cad: "non-negative decimal"
    noul:
      proposition_id: "is_genuine_labour_shortage"
      probability_true: "decimal in [0,1] or null"
      evidence_complete: boolean
      evidence_refs: "non-empty array of stable evidence identifiers when evidence_complete is true"
      model_version: "non-empty string"

  validation:
    missing_or_null_required_value: "NEEDS_REVIEW with MISSING_MATERIAL and the missing field path"
    invalid_type_or_out_of_range: "NEEDS_REVIEW with INVALID_INPUT and the field path"
    inconsistent_verified_inputs: "NEEDS_REVIEW with CONFLICTING_EVIDENCE"
    unknown_evidence_status: "NEEDS_REVIEW with UNVERIFIED_EVIDENCE"
    no_short_circuit: true

evaluation:
  rule_statuses: [PASS, FAIL, NEEDS_REVIEW]
  aggregate:
    - "If any CRITICAL_REDLINE rule is FAIL, verdict = FAIL."
    - "Otherwise, if any rule is NEEDS_REVIEW, verdict = NEEDS_REVIEW."
    - "Otherwise, verdict = PASS."
  gts_category_b_in_demand_nocs:
    - "20012" # Computer and information systems managers
    - "21211" # Data scientists
    - "21220" # Cybersecurity specialists
    - "21221" # Business systems specialists
    - "21222" # Information systems specialists
    - "21223" # Database analysts and data administrators
    - "21230" # Computer systems developers and programmers
    - "21231" # Software engineers and designers
    - "21232" # Software developers and programmers
    - "21233" # Web designers
    - "21234" # Web developers and programmers
    - "21300" # Civil engineers
    - "21301" # Mechanical engineers
    - "21310" # Electrical and electronics engineers
    - "21311" # Computer engineers
    - "22220" # Computer network technicians
    - "22221" # User support technicians
    - "52120" # Graphic designers and illustrators

rules:
  - id: lmia_employer_ineligibility
    category: employer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - employer.is_sex_industry
      - employer.on_ircc_ineligibility_list
      - employer.in_default_of_amp
      - employer.lmia_revocation_past_2_years
    pass_if: "employer.is_sex_industry == false && employer.on_ircc_ineligibility_list == false && employer.in_default_of_amp == false && employer.lmia_revocation_past_2_years == false"
    fail_if: "employer.is_sex_industry == true || employer.on_ircc_ineligibility_list == true || employer.in_default_of_amp == true || employer.lmia_revocation_past_2_years == true"
    missing_or_unverified: "NEEDS_REVIEW: Employer compliance standing cannot be established."
    interpretation: "Service Canada has no legal authority to process LMIA applications from ineligible employers."
    evidence_anchor:
      evidence_unit_id: "lmia_global_talent.refusal.full_page_projection"
      source_file: "43b29dc7de2289539bd22bd339072b3b8796f6d7c27520596ad6e43c5933a875"
      section: "Regulatory authority and ineligibility"
      verbatim_excerpt: "We do not have the authority to process applications from ineligible employers"
  - id: lmia_gts_stream_eligibility
    category: gts_qualifying_pathway
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - employer.gts_category
      - job_offer.noc_2021_code
    pass_if: "(employer.gts_category == 'A' && employer.designated_partner_referral == true) || (employer.gts_category == 'B' && job_offer.noc_2021_code in gts_category_b_in_demand_nocs)"
    fail_if: "(employer.gts_category == 'A' && employer.designated_partner_referral == false) || (employer.gts_category == 'B' && !(job_offer.noc_2021_code in gts_category_b_in_demand_nocs)) || !(employer.gts_category in ['A', 'B'])"
    missing_or_unverified: "NEEDS_REVIEW: GTS Category, referral partner endorsement, or NOC classification evidence is missing."
    interpretation: "An employer must qualify under either Category A (innovative firms referred by a designated referral partner) or Category B (hiring highly skilled foreign workers in in-demand STEM occupations on the Global Talent Occupations List)."
    evidence_anchor:
      evidence_unit_id: "lmia_global_talent.gts_requirements.full_page_projection"
      source_file: "9a77f4dd42f34da5c12efd6ebf8baddc13cf8f00572edc29efed071c720abc0a"
      section: "Category A and Category B"
      verbatim_excerpt: "You may be eligible for <a href=\"#h2.20\">Category A</a> of the Global Talent Stream (GTS) if you’ve been referred to the GTS by one of <a href=\"#h2.19\">the stream's designated referral partners</a> and if you’re hiring an individual with unique and specialized talent to help your business scale up and grow.</p>\r\n\r\n<p>If the requested occupation is included on the <a href=\"#h2.21\">global talent occupations list</a>, it’ll be processed as a Category B application and must meet Category B requirements.</p>\r\n\r\n<p><strong>Or</strong></p>\r\n\r\n<p>You may be eligible for <a href=\"#h2.21\">Category B</a> of the GTS if you’re seeking to hire highly skilled temporary foreign workers to fill positions in in-demand occupations found on the <a href=\"#h2.21\">global talent occupations list</a>. A referral isn’t required to be eligible for Category B."

  - id: lmia_prevailing_wage
    category: compensation
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - job_offer.regular_hourly_wage_cad
      - job_offer.prevailing_wage_cad
    pass_if: "job_offer.regular_hourly_wage_cad >= job_offer.prevailing_wage_cad"
    fail_if: "job_offer.regular_hourly_wage_cad < job_offer.prevailing_wage_cad"
    missing_or_unverified: "NEEDS_REVIEW: Prevailing wage for occupation and sub-region or offered base wage is missing."
    interpretation: "Wages offered to temporary foreign workers under GTS must equal or exceed the prevailing wage for the occupation in the sub-region."
    evidence_anchor:
      evidence_unit_id: "lmia_global_talent.gts_requirements.full_page_projection"
      source_file: "9a77f4dd42f34da5c12efd6ebf8baddc13cf8f00572edc29efed071c720abc0a"
      section: "Wages and working conditions"
      verbatim_excerpt: "For the purpose of the GTS, you must pay the prevailing wage, which is defined as the highest of either:</p>\r\n\r\n<ul>\r\n\t<li>the regional median hourly wage posted on <a href=\"https://www.jobbank.gc.ca/trend-analysis/search-wages\">Job Bank</a></li>\r\n\t<li>the wage that is within the wage range that you’re paying your current employees hired for the same job and work location, and with the same skills and years of experience"

  - id: lmia_gts_labour_market_benefits_plan
    category: employer_commitments
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - employer.has_lmbp_agreement
    pass_if: "employer.has_lmbp_agreement == true"
    fail_if: "employer.has_lmbp_agreement == false"
    missing_or_unverified: "NEEDS_REVIEW: Labour Market Benefits Plan (LMBP) agreement is missing or incomplete."
    interpretation: "Under GTS, employers are legally required to develop a Labour Market Benefits Plan committing to either job creation for Canadians (mandatory under Cat A) or skills/training investment for Canadians (mandatory under Cat B)."
    evidence_anchor:
      evidence_unit_id: "lmia_global_talent.gts_requirements.full_page_projection"
      source_file: "9a77f4dd42f34da5c12efd6ebf8baddc13cf8f00572edc29efed071c720abc0a"
      section: "Labour Market Benefits Plan"
      verbatim_excerpt: "You’re required to work with ESDC to develop an LMBP that demonstrates your commitment to activities that will have lasting, positive impacts on the Canadian labour market.</p>\r\n\r\n<p>An LMBP will help you and the Government of Canada identify and track your overall job creation, skills and training investments and other activities that will benefit the Canadian economy through your employment of highly skilled global talent.</p>\r\n\r\n<p>The commitments in your LMBP will be divided into mandatory and complementary benefits.</p>\r\n\r\n<p>If you’ve been referred by one of the <a href=\"#h2.19\">GTS’s designated referral partners</a> and are seeking to hire <a href=\"#h2.20\">unique and specialized talent</a> (Category A), you must commit to creating jobs for Canadians and permanent residents as your mandatory benefit.</p>\r\n\r\n<p>If you’re an employer in Canada seeking to hire highly skilled temporary foreign workers to fill positions in occupations on the <a href=\"#h2.21\">global talent occupations list</a> (Category B), you must commit to increasing skills and training investments for Canadians and permanent residents as your mandatory benefit."

  - id: lmia_genuine_labour_shortage
    category: qualitative
    severity: QUALITATIVE_STANDARD
    eval_type: typesafe_jev
    required_fields:
      - noul.proposition_id
      - noul.probability_true
      - noul.evidence_complete
    precondition: "noul.evidence_complete == true && noul.proposition_id == 'is_genuine_labour_shortage'"
    pass_if: "noul.probability_true >= 0.70"
    fail_if: "noul.probability_true < 0.30"
    missing_or_unverified: "NEEDS_REVIEW: Genuine business need and labour shortage probability is borderline (0.30 <= P < 0.70) or qualitative evidence is incomplete."
    interpretation: "Service Canada officers assess whether the job vacancy is genuine and represents an authentic talent shortage."
    evidence_anchor:
      evidence_unit_id: "EU-LMIA-005"
      source_file: "global_talent_requirements.html"
      section: "Assessment criteria"
      verbatim_excerpt: "Service Canada will assess whether the job offer is genuine"
