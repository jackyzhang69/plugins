schema_version: "1.0.0"
catalog_id: "lmia_global_talent"
jurisdiction: "FED"
category: "Temporary Foreign Worker Program"
display_name: "TFWP LMIA: Global Talent Stream"
status: "ACTIVE"
program_id: "TFWP_LMIA"
stream_id: "GLOBAL_TALENT"
effective_date: "2026-11-10"
source_edition: "ESDC Program requirements for the Global Talent Stream (page date 2026-11-10; global talent occupations list updated December 2022; Category A designated referral partners updated 2026-09-15) and ESDC Refusal to process an LMIA application (page date 2026-10-27)"
source_url: "https://www.canada.ca/en/employment-social-development/services/foreign-workers/global-talent/requirements.html"
decision_scope: "Pre-screen of the modelled GTS requirements, not an official ESDC decision. Category A applications beyond two positions remain subject to discretionary review. Prevailing wages must reflect all applicable sources in force on the submission date."

schema:
  input_type: object
  required_top_level: [assessment_date, employer, job_offer, noul]
  types:
    assessment_date: "ISO-8601 date; LMIA submission date"
    employer:
      business_name: string
      cra_business_number: string
      is_sex_industry: boolean
      on_ircc_ineligibility_list: boolean
      in_default_of_amp: boolean
      lmia_revocation_past_2_years: "boolean; true when an LMIA was revoked in the past 2 years"
      gts_category: "string in ['A', 'B']"
      designated_partner_referral: boolean
      lmbp_requirements_verified: "boolean; applicable mandatory and at least two complementary commitments are verified with ESDC, including relevant previous-plan assessment"
      gts_category_a_requirements_verified: "boolean; referral partner verified Canadian operation, innovation, growth potential, qualified worker and unique specialized position requirements"
      other_material_gts_requirements_verified: "boolean; applicable recruitment-fee prohibition, abuse/affiliate review, insurance, employment agreement, union and refusal-to-process requirements have been verified"
      gts_category_a_approved_positions_this_calendar_year: "non-negative integer; number of Category A unique and specialized positions already approved for this employer in the calendar year of the LMIA submission (0 for the first position)"
    job_offer:
      province: "two-letter code in [AB, BC, MB, NB, NL, NT, NS, NU, ON, PE, QC, SK, YT]"
      noc_2021_code: "five-digit string"
      noc_teer: "integer 0-5"
      title: string
      regular_hourly_wage_cad: "non-negative decimal; guaranteed hourly wage offered"
      guaranteed_annual_base_salary_cad: "non-negative decimal; guaranteed annual base salary for Category A"
      prevailing_wage_cad: "non-negative decimal; verified highest applicable regional, comparable-employee, category and Quebec wage guidance"
      quebec_wage_guidance_verified: "boolean; applicable MIFI wage guidance has been checked for a Quebec position"
      gts_subset_conditions_met: "boolean; true only when noc_2021_code is one of the sub-set occupations (21210, 51120, 52120) and the position meets the experience/exclusion conditions stated for that sub-set in the occupations list; false for every other occupation"
    noul:
      proposition_id: "is_genuine_and_legitimate_job_offer"
      probability_true: "decimal in [0,1] or null"
      evidence_complete: boolean
      evidence_refs: "non-empty array of stable evidence identifiers when evidence_complete is true"
      model_version: "non-empty string"

  validation:
    missing_or_null_required_value: "NEEDS_REVIEW with MISSING_MATERIAL and the missing field path"
    invalid_type_or_out_of_range: "NEEDS_REVIEW with INVALID_INPUT and the field path"
    inconsistent_verified_inputs: "NEEDS_REVIEW with CONFLICTING_EVIDENCE"
    unknown_evidence_status: "NEEDS_REVIEW with UNVERIFIED_EVIDENCE"
    no_short_circuit: true

evaluation:
  rule_statuses: [PASS, FAIL, NEEDS_REVIEW]
  aggregate:
    - "If any CRITICAL_REDLINE rule is FAIL, verdict = FAIL."
    - "Otherwise, if any rule is NEEDS_REVIEW, verdict = NEEDS_REVIEW."
    - "Otherwise, verdict = PASS."
  # Global talent occupations list (ESDC, updated December 2022), full-occupation rows.
  gts_category_b_full_nocs:
    - "20012" # Computer and information systems managers
    - "21300" # Civil engineers
    - "21310" # Electrical and electronics engineers
    - "21330" # Mining engineers
    - "21390" # Aerospace engineers
    - "21311" # Computer engineers (except software engineers and designers)
    - "21211" # Data scientists
    - "21220" # Cybersecurity specialists
    - "21221" # Business system specialists
    - "21222" # Information systems specialists
    - "21223" # Database analysts and data administrators
    - "21230" # Computer systems developers and programmers
    - "21231" # Software engineers and designers
    - "21232" # Software developers and programmers
    - "21233" # Web designers
    - "21234" # Web developers and programmers
    - "22310" # Electrical and electronics engineering technologists and technicians
    - "22220" # Computer network and web technicians
    - "22222" # Information systems testing technicians
  # Sub-set rows: only qualify when the stated sub-set conditions are met.
  gts_category_b_subset_nocs:
    - "21210" # Mathematicians and statisticians (actuaries and related occupations excluded)
    - "51120" # Producer/technical/creative/artistic director and project manager - visual effects and video game (3-year role and skills conditions)
    - "52120" # Digital media designers (3 years in listed digital media design skills)
  # Category B wage floors: hourly rate or higher prevailing wage (Quebec: ESDC directs to the MIFI website, no floor modelled).
  gts_category_b_hourly_wage_floors_cad:
    "22310": 41.35
    "22220": 40.87
    "22222": 41.03
    "51120": 40.87
    "52120": 38.46

rules:
  - id: lmia_employer_ineligibility
    category: employer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - employer.is_sex_industry
      - employer.on_ircc_ineligibility_list
      - employer.in_default_of_amp
    pass_if: "employer.is_sex_industry == false && employer.on_ircc_ineligibility_list == false && employer.in_default_of_amp == false"
    fail_if: "employer.is_sex_industry == true || employer.on_ircc_ineligibility_list == true || employer.in_default_of_amp == true"
    missing_or_unverified: "NEEDS_REVIEW: Employer compliance standing cannot be established."
    interpretation: "Regulatory authority: Service Canada cannot process LMIA applications from employers who regularly offer sex-industry services, who are on the IRCC ineligibility list (non-compliance finding, inspection ban), or who are in default of an administrative monetary penalty."
    evidence_anchor:
      evidence_unit_id: "lmia:lmia_refusal_current_20261117:full_document_body"
      source_file: "e2f81d4ae873adbf95cbbb4e37bf63221dc262bb3a572f45c1df4542e63c789a"
      section: "Regulatory authority and ineligibility"
      source_id: "lmia_refusal_current_20261117"
      verbatim_excerpt: "We do not have the authority to process applications from ineligible employers for the Temporary Foreign Worker Program who:</p>\r\n<ul>\r\n  <li>regularly offer services in the sex industry (striptease, erotic dance, escort services or erotic massage)</li>\r\n  <li>are on the <a href=\"/en/immigration-refugees-citizenship/services/work-canada/employers-non-compliant.html\">Immigration, Refugees and Citizenship Canada ineligibility list</a> which includes employers who:\r\n    <ul>\r\n      <li>have been found non-compliant as result of an employer compliance review</li>\r\n      <li>have been banned from the Temporary Foreign Worker Program because non-compliance was discovered during an inspection</li>\r\n      <li>are in default of payment of an administrative monetary penalty"

  - id: lmia_recent_revocation_refusal
    category: employer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - employer.lmia_revocation_past_2_years
    pass_if: "employer.lmia_revocation_past_2_years == false"
    missing_or_unverified: "NEEDS_REVIEW: An LMIA was revoked in the past 2 years (or revocation history is unknown). Service Canada may refuse to process the application; this is discretionary and cannot be decided automatically."
    interpretation: "Ministerial instruction: Service Canada may refuse to process an application for any position if the employer had an application revoked in the past 2 years for providing false, misleading or inaccurate information. The source says 'may', so a revocation is routed to review, never to an automatic FAIL."
    evidence_anchor:
      evidence_unit_id: "lmia:lmia_refusal_current_20261117:full_document_body"
      source_file: "e2f81d4ae873adbf95cbbb4e37bf63221dc262bb3a572f45c1df4542e63c789a"
      section: "Previous revocation"
      source_id: "lmia_refusal_current_20261117"
      verbatim_excerpt: "We may refuse to process your LMIA application for any position if you have had an application revoked in the past 2 years for having provided false, misleading or inaccurate information"

  - id: lmia_gts_stream_eligibility
    category: gts_qualifying_pathway
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - employer.gts_category
      - job_offer.noc_2021_code
    pass_if: "(employer.gts_category == 'A' && employer.designated_partner_referral == true && employer.gts_category_a_requirements_verified == true && !(job_offer.noc_2021_code in gts_category_b_full_nocs) && (!(job_offer.noc_2021_code in gts_category_b_subset_nocs) || job_offer.gts_subset_conditions_met == false)) || employer.gts_category == 'B'"
    fail_if: "valid_noc_2021_code(job_offer.noc_2021_code) && employer.gts_category == 'A' && employer.designated_partner_referral == false && !(job_offer.noc_2021_code in gts_category_b_full_nocs) && (!(job_offer.noc_2021_code in gts_category_b_subset_nocs) || job_offer.gts_subset_conditions_met == false)"
    missing_or_unverified: "NEEDS_REVIEW: GTS category, referral, Category A requirements or occupation classification is unresolved; occupations on the list are processed as Category B."
    interpretation: "Category A requires a referral by one of the stream's designated referral partners for unique and specialized talent. Category B needs no referral but the occupation must be on the global talent occupations list and meet its wage floor (checked in lmia_gts_category_b_occupation_and_wage_floor). An occupation on the list is processed as Category B."
    evidence_anchor:
      evidence_unit_id: "lmia:lmia_gts_current_20261117:full_document_body"
      source_file: "9a9feff7a872f3ab74c5e47ce1a6432274ec74694b603b1b5601b8d4f0e5bbb9"
      section: "Eligibility: Category A and Category B"
      source_id: "lmia_gts_current_20261117"
      verbatim_excerpt: "You may be eligible for <a href=\"#h2.20\">Category A</a> of the Global Talent Stream (GTS) if you’ve been referred to the GTS by one of <a href=\"#h2.19\">the stream's designated referral partners</a> and if you’re hiring an individual with unique and specialized talent to help your business scale up and grow.</p>\r\n\r\n<p>If the requested occupation is included on the <a href=\"#h2.21\">global talent occupations list</a>, it’ll be processed as a Category B application and must meet Category B requirements.</p>\r\n\r\n<p><strong>Or</strong></p>\r\n\r\n<p>You may be eligible for <a href=\"#h2.21\">Category B</a> of the GTS if you’re seeking to hire highly skilled temporary foreign workers to fill positions in in-demand occupations found on the <a href=\"#h2.21\">global talent occupations list</a>. A referral isn’t required to be eligible for Category B."

  - id: lmia_gts_category_a_wage_floor
    category: compensation
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - employer.gts_category
      - job_offer.regular_hourly_wage_cad
      - job_offer.noc_2021_code
    conditional_required_fields:
      when: "employer.gts_category == 'A'"
      fields:
        - employer.gts_category_a_approved_positions_this_calendar_year
    pass_if: "employer.gts_category == 'B' || (employer.gts_category == 'A' && !(job_offer.noc_2021_code in gts_category_b_full_nocs) && (!(job_offer.noc_2021_code in gts_category_b_subset_nocs) || job_offer.gts_subset_conditions_met == false) && employer.gts_category_a_approved_positions_this_calendar_year < 2 && job_offer.regular_hourly_wage_cad >= 38.46 && job_offer.guaranteed_annual_base_salary_cad >= 80000)"
    fail_if: "valid_noc_2021_code(job_offer.noc_2021_code) && employer.gts_category == 'A' && !(job_offer.noc_2021_code in gts_category_b_full_nocs) && (!(job_offer.noc_2021_code in gts_category_b_subset_nocs) || job_offer.gts_subset_conditions_met == false) && ((employer.gts_category_a_approved_positions_this_calendar_year < 2 && (job_offer.regular_hourly_wage_cad < 38.46 || job_offer.guaranteed_annual_base_salary_cad < 80000)) || (employer.gts_category_a_approved_positions_this_calendar_year >= 2 && (job_offer.regular_hourly_wage_cad < 72.11 || job_offer.guaranteed_annual_base_salary_cad < 150000)))"
    missing_or_unverified: "NEEDS_REVIEW: Category A wage, annual salary, occupation or approved-position count is unverified; more than two positions require discretionary ESDC review."
    interpretation: "Category A requires both hourly and annual base salary minimums. More than two positions per calendar year may be considered only exceptionally, after prior LMBP commitments and referral reconfirmation; the wage alone does not establish acceptance."
    evidence_anchor:
      evidence_unit_id: "lmia:lmia_gts_current_20261117:full_document_body"
      source_file: "9a9feff7a872f3ab74c5e47ce1a6432274ec74694b603b1b5601b8d4f0e5bbb9"
      section: "Wages: Category A wage floor"
      source_id: "lmia_gts_current_20261117"
      verbatim_excerpt: "under Category A, for the first 2 unique and specialized positions requested by an employer and approved by the TFW Program per calendar year, at least $38.46 per hour that amounts to no less than a base salary of $80,000 annually. For any additional unique and specialized positions requested by the employer (in other words, more than 2) and approved by the TFW Program per calendar under Category A, at least $72.11 per hour that amounts to no less than a base salary of $150,000 annually"

  - id: lmia_gts_category_b_occupation_and_wage_floor
    category: gts_qualifying_pathway
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - employer.gts_category
      - job_offer.noc_2021_code
      - job_offer.province
      - job_offer.regular_hourly_wage_cad
    pass_if: "(employer.gts_category == 'A' && !(job_offer.noc_2021_code in gts_category_b_full_nocs) && (!(job_offer.noc_2021_code in gts_category_b_subset_nocs) || job_offer.gts_subset_conditions_met == false)) || (employer.gts_category == 'B' && (job_offer.noc_2021_code in gts_category_b_full_nocs || (job_offer.noc_2021_code in gts_category_b_subset_nocs && job_offer.gts_subset_conditions_met == true)) && job_offer.regular_hourly_wage_cad >= gts_category_b_hourly_wage_floors_cad.get(job_offer.noc_2021_code, 0.0) && (job_offer.province != 'QC' || gts_category_b_hourly_wage_floors_cad.get(job_offer.noc_2021_code, 0.0) == 0.0))"
    fail_if: "valid_noc_2021_code(job_offer.noc_2021_code) && employer.gts_category == 'B' && ((!(job_offer.noc_2021_code in gts_category_b_full_nocs) && !(job_offer.noc_2021_code in gts_category_b_subset_nocs)) || (job_offer.noc_2021_code in gts_category_b_subset_nocs && job_offer.gts_subset_conditions_met == false) || (job_offer.province != 'QC' && job_offer.regular_hourly_wage_cad < gts_category_b_hourly_wage_floors_cad.get(job_offer.noc_2021_code, 0.0)))"
    missing_or_unverified: "NEEDS_REVIEW: NOC 2021 code, sub-set conditions, province or offered wage is missing; for Quebec the wage floors of the listed technician/creative occupations are published by MIFI and are not modelled."
    interpretation: "Category B: the occupation must be on ESDC's global talent occupations list. Occupations 21210, 51120 and 52120 are sub-sets that qualify only when their stated conditions are met. Where the list shows a wage floor, the hourly floor applies at minimum (22310 $41.35, 22220 $40.87, 22222 $41.03, 51120 $40.87, 52120 $38.46), or the prevailing wage if higher; for a Quebec work location ESDC refers to the MIFI website for wage floors, so those cases are routed to review."
    evidence_anchor:
      evidence_unit_id: "lmia:lmia_gts_current_20261117:full_document_body"
      source_file: "9a9feff7a872f3ab74c5e47ce1a6432274ec74694b603b1b5601b8d4f0e5bbb9"
      section: "Global talent occupations list for Category B"
      source_id: "lmia_gts_current_20261117"
      verbatim_excerpt: "Global talent occupations list</summary>\r\n    <table class=\"table table-bordered table-responsive\">\r\n      <thead>\r\n        <tr>\r\n          <th scope=\"col\">NOC code 2021</th>\r\n          <th scope=\"col\">Occupation</th>\r\n          <th scope=\"col\">For illustrative purposes only<br><br>\r\n            Minimum wage requirement (annual salary)</th>\r\n          <th scope=\"col\">Minimum wage requirement (hourly rate)</th>\r\n        </tr>\r\n      </thead>\r\n      <tbody>\r\n        <tr>\r\n          <td>20012</td>\r\n          <td>Computer and information systems managers</td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21300</td>\r\n          <td>Civil engineers</td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21310</td>\r\n          <td>Electrical and electronics engineers</td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21330</td>\r\n          <td>Mining engineers</td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21390</td>\r\n          <td>Aerospace engineers</td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21311</td>\r\n          <td>Computer engineers (except software engineers and designers)</td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>Sub-set of 21210*</td>\r\n          <td>Mathematicians and statisticians *Positions for actuaries or related occupations are excluded from this subset.</td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21211 </td>\r\n          <td>Data scientists </td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21220</td>\r\n          <td>Cybersecurity specialists</td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21221</td>\r\n          <td>Business system specialists</td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21222</td>\r\n          <td>Information systems specialists</td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21223</td>\r\n          <td>Database analysts and data administrators</td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21230</td>\r\n          <td>Computer systems developers and programmers </td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21231</td>\r\n          <td>Software engineers and designers</td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21232</td>\r\n          <td>Software developers and programmers</td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21233</td>\r\n          <td>Web designers </td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>21234</td>\r\n          <td>Web developers and programmers</td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n          <td><a href=\"#h2.11\">Prevailing wage</a></td>\r\n        </tr>\r\n        <tr>\r\n          <td>22310</td>\r\n          <td>Electrical and electronics engineering technologists and technicians</td>\r\n          <td>$86,000 <a href=\"#h2.11\">or higher prevailing wage</a><br><br>\r\n            If you’re submitting an application from the province of Quebec, consult the <a href=\"https://www.quebec.ca/emploi/embauche-et-gestion-de-personnel/recruter/embaucher-immigrant/embaucher-travailleur-etranger-temporaire\">MIFI website</a> (French only) for wage floors</td>\r\n          <td>$41.35 <a href=\"#h2.11\">or higher prevailing wage</a><br><br>\r\n            If you’re submitting an application from the province of Quebec, consult the <a href=\"https://www.quebec.ca/emploi/embauche-et-gestion-de-personnel/recruter/embaucher-immigrant/embaucher-travailleur-etranger-temporaire\">MIFI website</a> (French only) for wage floors</td>\r\n        </tr>\r\n        <tr>\r\n          <td>22220</td>\r\n          <td>Computer network and web technicians</td>\r\n          <td>$85,000 <a href=\"#h2.11\">or higher prevailing wage</a><br><br>\r\n            If you’re submitting an application from the province of Quebec, consult the <a href=\"https://www.quebec.ca/emploi/embauche-et-gestion-de-personnel/recruter/embaucher-immigrant/embaucher-travailleur-etranger-temporaire\">MIFI website</a> (French only) for wage floors</td>\r\n          <td>$40.87 <a href=\"#h2.11\">or higher prevailing wage</a><br><br>\r\n            If you’re submitting an application from the province of Quebec, consult the <a href=\"https://www.quebec.ca/emploi/embauche-et-gestion-de-personnel/recruter/embaucher-immigrant/embaucher-travailleur-etranger-temporaire\">MIFI website</a> (French only) for wage floors</td>\r\n        </tr>\r\n        <tr>\r\n          <td>22222</td>\r\n          <td>Information systems testing technicians</td>\r\n          <td>$85,000 <a href=\"#h2.11\">or higher prevailing wage</a><br><br>\r\n            If you’re submitting an application from the province of Quebec, consult the <a href=\"https://www.quebec.ca/emploi/embauche-et-gestion-de-personnel/recruter/embaucher-immigrant/embaucher-travailleur-etranger-temporaire\">MIFI website</a> (French only) for wage floors</td>\r\n          <td>$41.03 <a href=\"#h2.11\">or higher prevailing wage</a><br><br>\r\n            If you’re submitting an application from the province of Quebec, consult the <a href=\"https://www.quebec.ca/emploi/embauche-et-gestion-de-personnel/recruter/embaucher-immigrant/embaucher-travailleur-etranger-temporaire\">MIFI website</a> (French only) for wage floors</td>\r\n        </tr>\r\n        <tr>\r\n          <td>Sub-set of 51120**</td>\r\n          <td>Producer, technical, creative and artistic director and project manager – Visual effects and video game **The position must require a minimum of 3 years of experience in the visual effects, video game or animation industries in 1 or a combination of the following roles: producer, technical director, creative director, artistic director or project manager, senior coordinator, department manager, with 3 years of job experience in at least 1 or more of the following skills relevant to the visual effects, video game or animation industries: surfacing and look development; character or simulation rigging; matte painting; managing budgets or teams; or technical pipeline development and application for visual effects, video games, or animation production.</td>\r\n          <td>$85,000 <a href=\"#h2.11\">or higher prevailing wage</a><br><br>\r\n            If you’re submitting an application from the province of Quebec, consult the <a href=\"https://www.quebec.ca/emploi/embauche-et-gestion-de-personnel/recruter/embaucher-immigrant/embaucher-travailleur-etranger-temporaire\">MIFI website</a> (French only) for wage floors</td>\r\n          <td>$40.87 <a href=\"#h2.11\">or higher prevailing wage</a><br><br>\r\n            If you’re submitting an application from the province of Quebec, consult the <a href=\"https://www.quebec.ca/emploi/embauche-et-gestion-de-personnel/recruter/embaucher-immigrant/embaucher-travailleur-etranger-temporaire\">MIFI website</a> (French only) for wage floors</td>\r\n        </tr>\r\n        <tr>\r\n          <td>Sub-set of 52120***</td>\r\n          <td>Digital media designers ***The position must require a minimum of 3 years of job experience in at least 1 of the following digital media design skills: 3D modeling, compositing, paint and roto, layout and match move, digital environment and Matte painting, texture, lighting shading, character effects, effects and simulations, design and scenario, rigging, user interface or user experience, responsive design (for gaming), virtual reality, augmented reality, digital media animation, levels editing for digital media design, software editing for digital media design, pipeline software development or applications relevant for digital media design</td>\r\n          <td>$80,000 <a href=\"#h2.11\">or higher prevailing wage</a><br><br>\r\n            If you’re submitting an application from the province of Quebec, consult the <a href=\"https://www.quebec.ca/emploi/embauche-et-gestion-de-personnel/recruter/embaucher-immigrant/embaucher-travailleur-etranger-temporaire\">MIFI website</a> (French only) for wage floors</td>\r\n          <td>$38.46 <a href=\"#h2.11\">or higher"

  - id: lmia_prevailing_wage
    category: compensation
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - job_offer.regular_hourly_wage_cad
      - job_offer.prevailing_wage_cad
    pass_if: "job_offer.regular_hourly_wage_cad >= job_offer.prevailing_wage_cad && (job_offer.province != 'QC' || job_offer.quebec_wage_guidance_verified == true)"
    fail_if: "job_offer.regular_hourly_wage_cad < job_offer.prevailing_wage_cad"
    missing_or_unverified: "NEEDS_REVIEW: Prevailing wage for occupation and sub-region or offered base wage is missing."
    interpretation: "Under the GTS the employer must pay the prevailing wage: the highest of the regional median hourly wage on Job Bank and the wage paid to current employees in the same job, work location, skills and experience. Only guaranteed wages count."
    evidence_anchor:
      evidence_unit_id: "lmia:lmia_gts_current_20261117:full_document_body"
      source_file: "9a9feff7a872f3ab74c5e47ce1a6432274ec74694b603b1b5601b8d4f0e5bbb9"
      section: "Wages"
      source_id: "lmia_gts_current_20261117"
      verbatim_excerpt: "you must pay the prevailing wage, which is defined as the highest of either:</p>\r\n\r\n<ul>\r\n\t<li>the regional median hourly wage posted on <a href=\"https://www.jobbank.gc.ca/trend-analysis/search-wages\">Job Bank</a></li>\r\n\t<li>the wage that is within the wage range that you’re paying your current employees hired for the same job and work location, and with the same skills and years of experience"

  - id: lmia_gts_labour_market_benefits_plan
    category: employer_commitments
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - employer.lmbp_requirements_verified
    pass_if: "employer.lmbp_requirements_verified == true"
    missing_or_unverified: "NEEDS_REVIEW: Required category-specific and complementary LMBP commitments or prior assessment have not been verified with ESDC."
    interpretation: "An employer works with ESDC to develop the plan; absence of a completed agreement alone does not establish ineligibility."
    evidence_anchor:
      evidence_unit_id: "lmia:lmia_gts_current_20261117:full_document_body"
      source_file: "9a9feff7a872f3ab74c5e47ce1a6432274ec74694b603b1b5601b8d4f0e5bbb9"
      section: "Labour Market Benefits Plan"
      source_id: "lmia_gts_current_20261117"
      verbatim_excerpt: "You’re required to work with ESDC to develop an LMBP that demonstrates your commitment to activities that will have lasting, positive impacts on the Canadian labour market.</p>\r\n\r\n<p>An LMBP will help you and the Government of Canada identify and track your overall job creation, skills and training investments and other activities that will benefit the Canadian economy through your employment of highly skilled global talent.</p>\r\n\r\n<p>The commitments in your LMBP will be divided into mandatory and complementary benefits.</p>\r\n\r\n<p>If you’ve been referred by one of the <a href=\"#h2.19\">GTS’s designated referral partners</a> and are seeking to hire <a href=\"#h2.20\">unique and specialized talent</a> (Category A), you must commit to creating jobs for Canadians and permanent residents as your mandatory benefit.</p>\r\n\r\n<p>If you’re an employer in Canada seeking to hire highly skilled temporary foreign workers to fill positions in occupations on the <a href=\"#h2.21\">global talent occupations list</a> (Category B), you must commit to increasing skills and training investments for Canadians and permanent residents as your mandatory benefit."

  - id: lmia_other_gts_requirements
    category: employer_commitments
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - employer.other_material_gts_requirements_verified
    pass_if: "employer.other_material_gts_requirements_verified == true"
    missing_or_unverified: "NEEDS_REVIEW: Other applicable employer, job-offer and refusal-to-process requirements require verification."
    evidence_anchor:
      evidence_unit_id: "lmia:lmia_gts_current_20261117:full_document_body"
      source_file: "9a9feff7a872f3ab74c5e47ce1a6432274ec74694b603b1b5601b8d4f0e5bbb9"
      section: "Recruitment fees"
      source_id: "lmia_gts_current_20261117"
      verbatim_excerpt: "As an employer, you must confirm and ensure that you or anybody recruiting on your behalf doesn’t charge or recover any recruitment fees, directly or indirectly, from the temporary foreign workers."

  - id: lmia_genuine_and_legitimate_job_offer
    category: qualitative
    severity: QUALITATIVE_STANDARD
    eval_type: typesafe_jev
    required_fields:
      - noul.proposition_id
      - noul.probability_true
      - noul.evidence_complete
      - noul.evidence_refs
      - noul.model_version
    precondition: "noul.evidence_complete == true && noul.proposition_id == 'is_genuine_and_legitimate_job_offer'"
    pass_if: "noul.probability_true >= 0.70"
    fail_if: "noul.probability_true < 0.30"
    missing_or_unverified: "NEEDS_REVIEW: Business and job-offer legitimacy probability is borderline (0.30 <= P < 0.70) or qualitative evidence is incomplete."
    interpretation: "Every employer must supply documents with the LMIA (and GTS) application to demonstrate that both the business and the job offer are legitimate; Service Canada assesses this qualitatively. The 0.70 / 0.30 probability thresholds are this project's review contract, not an ESDC figure."
    evidence_anchor:
      evidence_unit_id: "lmia:lmia_gts_current_20261117:full_document_body"
      source_file: "9a9feff7a872f3ab74c5e47ce1a6432274ec74694b603b1b5601b8d4f0e5bbb9"
      section: "Business legitimacy"
      source_id: "lmia_gts_current_20261117"
      verbatim_excerpt: "All employers applying to the TFW Program must supply documents along with their LMIA application, including a GTS application, to demonstrate that their <a href=\"/en/employment-social-development/services/foreign-workers/business-legitimacy.html\">business and job offer are legitimate"

  - id: lmia_gts_input_scope
    category: gts_qualifying_pathway
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - employer.gts_category
      - job_offer.province
      - job_offer.noc_2021_code
    pass_if: "employer.gts_category in ['A', 'B'] && job_offer.province in ['AB', 'BC', 'MB', 'NB', 'NL', 'NT', 'NS', 'NU', 'ON', 'PE', 'QC', 'SK', 'YT'] && valid_noc_2021_code(job_offer.noc_2021_code)"
    fail_if: "false"
    missing_or_unverified: "NEEDS_REVIEW: Submission date, GTS category, Canadian province or recognized 2021 NOC code is missing or invalid."
    evidence_anchor:
      evidence_unit_id: "lmia:lmia_gts_current_20261117:full_document_body"
      source_file: "9a9feff7a872f3ab74c5e47ce1a6432274ec74694b603b1b5601b8d4f0e5bbb9"
      section: "Eligibility: Category A and Category B"
      source_id: "lmia_gts_current_20261117"
      verbatim_excerpt: "If the requested occupation is included on the <a href=\"#h2.21\">global talent occupations list</a>, it’ll be processed as a Category B application and must meet Category B requirements."
