  fail_if: (candidate.stream != 'foreign_worker' || candidate.applies_with_job_offer == true) && (employer.has_business_premises_in_ontario
    == false || employer.no_outstanding_esa_orders == false || employer.no_outstanding_ohsa_orders == false)
