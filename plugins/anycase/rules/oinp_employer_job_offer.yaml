schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  - job_offer
  - employer
  types:
    assessment_date: ISO-8601 date; application assessment date
    candidate:
      stream: foreign_worker | international_student | in_demand_skills
      qualifying_experience_months: non-negative number; cumulative paid FTE experience
      experience_in_last_5_years: boolean; must be within 5 years prior to application for FW
      experience_in_same_noc: boolean; experience must match the NOC code of the job offer
      experience_work_pattern: full_time | concurrent_part_time | single_part_time; paid work counted under s. 16
      experience_weekly_paid_hours: number; combined concurrent hours, or hours in the single position
      experience_paid_months: number; actual paid duration in the same NOC within the five-year window, not an eligibility Boolean
      months_since_graduation: number; calendar months since degree/diploma was granted (max 24 for IS)
      holds_mandatory_licence: boolean; required if occupation is regulated in Ontario
      equity_percentage: decimal in [0, 1]; combined direct/indirect equity of applicant and family in employer
      applies_with_job_offer: boolean; false exempts offer/employer requirements only for the historical foreign_worker
        self-employed-physician route
      applying_from_inside_canada: boolean; filing location at applicant application
      temporary_resident_status: visitor_record | study_permit | work_permit | maintained_status | none | expired_no_maintained_status
      interview_requested_by_director: boolean; source interview request
      interview_attended: boolean; only material if interview requested
      has_approved_employment_position: boolean; Director approval of the offered position
      currently_working_for_employer: boolean; determines the current-wage comparison
      experience_gained_in_canada: boolean; location of the experience relied upon
      experience_lawful_residence_in_canada: boolean; lawful residence throughout relied-on Canadian work
      experience_authorized_work_in_canada: boolean; authorization throughout relied-on Canadian work
      equity_obtained_as_employee_remuneration: boolean; provenance of current combined direct/indirect applicant/family
        holding
      historical_equity_percentage: decimal ratio; combined direct/indirect applicant/family holding for historical
        interests; zero only if no historical interest
      historical_equity_obtained_as_employee_remuneration: boolean; provenance of all historical holdings relied
        upon under the exception
      language_test_name: IELTS-General-Training | CELPIP-General | PTE-Core | TEF-Canada | TCF-Canada
      language_clb_listening: number; independently verified CLB listening
      language_clb_reading: number; independently verified CLB reading
      language_clb_writing: number; independently verified CLB writing
      language_clb_speaking: number; independently verified CLB speaking
      education:
        credential_type: undergraduate_degree_or_diploma | graduate_degree_or_diploma | ontario_college_graduate_certificate
          | ontario_university_graduate_certificate
        credential_completed: boolean; obtained credential or institution letter confirming all requirements completed
        institution_name: exact name on the captured historical Ministry institution list; no DLI/eligibility Boolean substitute
        full_time_program_years: number; program duration on a full-time basis
        total_requirement_units: positive number; common unit for all credential requirements
        units_completed_while_lawfully_residing_and_studying_in_canada: number; requirement units supported by both
          lawful Canadian residence and study
      physician:
        cpso_class: independent_practice | academic_practice | provisional; no postgraduate-education class
        cpso_good_standing: boolean; current CPSO membership in good standing
        ohip_payment_eligible: boolean; eligible for publicly funded payment under the Health Insurance Act
      living_outside_canada: boolean; at the relevant recruitment trigger
      working_outside_ontario: boolean; at the relevant recruitment trigger
      holds_valid_ontario_work_permit: boolean; recruitment alternative only
    job_offer:
      noc_2021_code: five-digit string
      noc_teer: integer 0-5; verified against NOC 2021
      is_indeterminate: boolean; permanent position with no pre-determined end date
      weekly_hours: number; paid hours per week (minimum 30 for full-time)
      hourly_wage: non-negative decimal; basic hourly wage excluding bonuses, overtime, or tips
      prevailing_median_wage: non-negative decimal; prevailing median wage from Job Bank for NOC & region
      prevailing_low_wage: non-negative decimal; prevailing low/entry wage from Job Bank for NOC & region
      is_regulated_occupation: boolean; whether the occupation requires professional licensing in Ontario
      annual_paid_hours: number; paid hours in a 12-month period, at least 1560
      activities_primarily_in_ontario: boolean; independent position activity test with only 73300/73301 exception
      current_wage_paid_by_employer: number; basic hourly wage currently paid in the position
    employer:
      years_operating_in_ontario: non-negative number; active business operation in Ontario
      in_gta: boolean; true if located in City of Toronto, Durham, Halton, York, or Peel regions
      annual_revenue_cad: non-negative decimal; gross annual revenue for most recently completed fiscal year
      full_time_pr_citizen_employees: integer; number of permanent full-time Canadian citizens or PRs on payroll
      has_business_premises_in_ontario: boolean; physical business premises located in Ontario
      no_outstanding_esa_orders: boolean; no outstanding Employment Standards Act order
      no_outstanding_ohsa_orders: boolean; no outstanding Occupational Health and Safety Act order
      collective_agreement_determines_wages: boolean; true requires agreement-specific human review
      has_valid_cvor_certificate: boolean; only required for offered NOC 73300/73301
      cvor_safety_rating: Excellent | Satisfactory | Satisfactory Unaudited; historical EJO rating set only
      director_determined_recruitment_necessary: boolean; statutory trigger before recruitment evidence is demanded
      has_positive_lmia_for_position: boolean; named recruitment alternative
      domestic_recruitment_efforts_made: boolean; reasonable unsuccessful efforts before offering the position
"minimums":
  "employer":
    "operating_years": 3
    "revenue_gta": 1000000
    "revenue_outside_gta": 500000
    "ft_employees_gta": 5
    "ft_employees_outside_gta": 3
  "job_offer":
    "weekly_hours_minimum": 30
    "duration": "indeterminate"
  "streams":
    "foreign_worker":
      "eligible_teer":
      - 0
      - 1
      - 2
      - 3
      "work_experience_months": 24
      "experience_lookback_years": 5
      "wage_standard": "median"
    "international_student":
      "eligible_teer":
      - 0
      - 1
      - 2
      - 3
      "application_window_months": 24
      "wage_standard": "low"
    "in_demand_skills":
      "eligible_teer":
      - 4
      - 5
      "ontario_work_experience_months": 9
      "language_minimum_clb": 4
      "wage_standard": "median"
