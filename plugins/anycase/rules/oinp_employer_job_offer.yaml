"schema":
  "input_type": "object"
  "required_top_level":
  - "assessment_date"
  - "candidate"
  - "job_offer"
  - "employer"
  "types":
    "assessment_date": "ISO-8601 date; application assessment date"
    "candidate":
      "stream": "foreign_worker | international_student | in_demand_skills"
      "qualifying_experience_months": "non-negative number; cumulative paid FTE experience"
      "experience_in_last_5_years": "boolean; must be within 5 years prior to application for FW"
      "experience_in_same_noc": "boolean; experience must match the NOC code of the job offer"
      "completed_eligible_canadian_credential": "boolean; eligible >= 2-yr degree/diploma or 1-yr post-grad\
        \ certificate"
      "months_since_graduation": "number; calendar months since degree/diploma was granted (max 24 for\
        \ IS)"
      "language_clb_minimum": >-
        integer; minimum CLB in all four abilities (listening, reading, writing, speaking)
      "holds_mandatory_licence": "boolean; required if occupation is regulated in Ontario"
      "intention_to_reside_in_ontario": "boolean; demonstrated intention to settle permanently in Ontario"
      "equity_percentage": >-
        decimal in [0, 1]; combined direct/indirect equity of applicant and family in employer
      "legal_status_in_canada": "boolean; valid work/study permit or visitor record if residing in Canada"
    "job_offer":
      "noc_2021_code": "five-digit string"
      "noc_teer": "integer 0-5; verified against NOC 2021"
      "is_indeterminate": "boolean; permanent position with no pre-determined end date"
      "weekly_hours": "number; paid hours per week (minimum 30 for full-time)"
      "hourly_wage": "non-negative decimal; basic hourly wage excluding bonuses, overtime, or tips"
      "prevailing_median_wage": "non-negative decimal; prevailing median wage from Job Bank for NOC &\
        \ region"
      "prevailing_low_wage": "non-negative decimal; prevailing low/entry wage from Job Bank for NOC &\
        \ region"
      "is_regulated_occupation": "boolean; whether the occupation requires professional licensing in Ontario"
      "is_eligible_in_demand_noc": "boolean; whether NOC is on the published OINP In-Demand Skills list"
      "work_location_in_ontario": "boolean; work must occur primarily within Ontario"
    "employer":
      "years_operating_in_ontario": "non-negative number; active business operation in Ontario"
      "in_gta": >-
        boolean; true if located in City of Toronto, Durham, Halton, York, or Peel regions
      "annual_revenue_cad": >-
        non-negative decimal; gross annual revenue for most recently completed fiscal year
      "full_time_pr_citizen_employees": "integer; number of permanent full-time Canadian citizens or PRs\
        \ on payroll"
      "has_business_premises_in_ontario": "boolean; physical business premises located in Ontario"
      "no_employment_standards_orders": "boolean; no outstanding orders under ESA 2000 or OHSA"
"minimums":
  "employer":
    "operating_years": 3
    "revenue_gta": 1000000
    "revenue_outside_gta": 500000
    "ft_employees_gta": 5
    "ft_employees_outside_gta": 3
  "job_offer":
    "weekly_hours_minimum": 30
    "duration": "indeterminate"
  "streams":
    "foreign_worker":
