"display_name": >-
  OINP Employer Job Offer Streams (Foreign Worker, International Student, In-Demand Skills)
"status": "LEGACY_CLOSED"
"closure_basis": "\"As part of the redesign of the OINP, the following streams have been closed: Employer Job Offer: Foreign Worker …\"; each EJO checklist banner: \"this stream was closed as of May 30, 2026\" (d6.b05.html.ontario-checklists.d9b928770333 / ontario-2026-updates.8b36171d46df)."
