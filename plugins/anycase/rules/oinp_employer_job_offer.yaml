  Job Offer Program Guides (2024/2026)
"source_url": "https://www.ontario.ca/page/oinp-employer-job-offer-streams"
"decision_scope": >-
  Deterministic prescreen of statutory employer eligibility, job offer terms and wage thresholds, and
  applicant statutory qualifications for the three OINP Employer Job Offer streams (Foreign Worker, International
  Student, and In-Demand Skills). Points are handled by AnyScore's EOI scoring model.
