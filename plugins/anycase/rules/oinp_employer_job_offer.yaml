      "teer_4_or_5": 0
    "job_offer_broad_occupational_category":
      "category_0_2_3": 10
      "category_7": 7
      "category_1_9": 5
      "category_4_8": 4
      "category_5_6": 3
    "job_offer_hourly_wage":
      "wage_40_and_above": 10
