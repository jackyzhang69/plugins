    verbatim_excerpt: a total gross annual revenue of at least $1,000,000, or
- id: oinp_ejo_employer_workforce
  category: employer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields: []
  pass_if: (candidate.stream == 'foreign_worker' && candidate.applies_with_job_offer == false) || ((employer.in_gta
    == true && employer.full_time_pr_citizen_employees >= 5) || (employer.in_gta == false && employer.full_time_pr_citizen_employees
    >= 3))
  fail_if: (candidate.stream != 'foreign_worker' || candidate.applies_with_job_offer == true) && ((employer.in_gta
    == true && employer.full_time_pr_citizen_employees < 5) || (employer.in_gta == false && employer.full_time_pr_citizen_employees
    < 3))
  missing_or_unverified: 'NEEDS_REVIEW: Number of full-time Canadian citizen or PR employees cannot be established.'
  evidence_anchor:
    page: ''
    source_id: o_reg_422_17_v26
    evidence_unit_id: o_reg_422_17_v26.full_document_body
