"rules":
- "id": "oinp_ejo_employer_operating_history"
  "category": "employer"
  "severity": "CRITICAL_REDLINE"
  "eval_type": "deterministic"
  "required_fields":
  - "employer.years_operating_in_ontario"
  "pass_if": "employer.years_operating_in_ontario >= 3"
  "fail_if": "employer.years_operating_in_ontario < 3"
  "missing_or_unverified": "NEEDS_REVIEW: Employer Ontario operational history cannot be verified."
  "evidence_anchor":
    "source_id": "o_reg_422_17"
    "citation": "O. Reg. 422/17 s. 4(1)(a)"
    "evidence_unit_id": "oinp.wps.current.employer-guide"
    "source_file": "e80367ba912163b29e689f7dd84ca3c3871353d0c205f8ad6ac775f6bfb401b1"
    "section": "Employer requirements"
    "verbatim_excerpt": "have been in active business for at least three years prior to applying"
- "id": "oinp_ejo_employer_revenue"
  "category": "employer"
  "severity": "CRITICAL_REDLINE"
  "eval_type": "deterministic"
  "required_fields":
  - "employer.in_gta"
  - "employer.annual_revenue_cad"
  "pass_if": >-
    (employer.in_gta == true && employer.annual_revenue_cad >= 1000000) || (employer.in_gta == false &&
    employer.annual_revenue_cad >= 500000)
  "fail_if": >-
    (employer.in_gta == true && employer.annual_revenue_cad < 1000000) || (employer.in_gta == false &&
    employer.annual_revenue_cad < 500000)
  "missing_or_unverified": >-
    NEEDS_REVIEW: Employer gross annual revenue for the latest fiscal year is unverified.
  "evidence_anchor":
    "source_id": "o_reg_422_17"
    "citation": "O. Reg. 422/17 s. 4(1)(b)"
    "evidence_unit_id": "oinp.wps.current.employer-guide"
    "source_file": "e80367ba912163b29e689f7dd84ca3c3871353d0c205f8ad6ac775f6bfb401b1"
    "section": "Employer requirements"
    "verbatim_excerpt": "A minimum of $1,000,000 in total gross annual revenue if the employee will work or report to work at a location in the Greater Toronto Area"
- "id": "oinp_ejo_employer_workforce"
  "category": "employer"
  "severity": "CRITICAL_REDLINE"
  "eval_type": "deterministic"
  "required_fields":
  - "employer.in_gta"
  - "employer.full_time_pr_citizen_employees"
  "pass_if": >-
    (employer.in_gta == true && employer.full_time_pr_citizen_employees >= 5) || (employer.in_gta == false
    && employer.full_time_pr_citizen_employees >= 3)
  "fail_if": >-
    (employer.in_gta == true && employer.full_time_pr_citizen_employees < 5) || (employer.in_gta == false
    && employer.full_time_pr_citizen_employees < 3)
  "missing_or_unverified": >-
    NEEDS_REVIEW: Number of full-time Canadian citizen or PR employees cannot be established.
  "evidence_anchor":
    "source_id": "o_reg_422_17"
    "citation": "O. Reg. 422/17 s. 4(1)(c)"
    "evidence_unit_id": "oinp.wps.current.employer-guide"
    "source_file": "e80367ba912163b29e689f7dd84ca3c3871353d0c205f8ad6ac775f6bfb401b1"
    "section": "Employer requirements"
    "verbatim_excerpt": "your business must have at least <strong>5</strong> full-time employees who are Canadian citizens or permanent residents who work or report to work at that location.</p><h4>Work location outside the Greater Toronto Area</h4><p>If the employee will work at a location outside the <abbr title=\"Greater Toronto Area\">GTA</abbr> or will work at more than one location but report to work at a location outside the&nbsp;<abbr title=\"Greater Toronto Area\">GTA</abbr>, your business must have at least&nbsp;<strong>3</strong>&nbsp;full-time employees who are Canadian citizens or permanent residents who work or report to work at that location."
- "id": "oinp_ejo_employer_premises_and_compliance"
  "category": "employer"
  "severity": "CRITICAL_REDLINE"
  "eval_type": "deterministic"
  "required_fields":
  - "employer.has_business_premises_in_ontario"
  - "employer.no_employment_standards_orders"
  "pass_if": >-
    employer.has_business_premises_in_ontario == true && employer.no_employment_standards_orders == true
  "fail_if": >-
    employer.has_business_premises_in_ontario == false || employer.no_employment_standards_orders == false
  "missing_or_unverified": >-
    NEEDS_REVIEW: Physical premises verification or ESA compliance records are missing.
  "evidence_anchor":
    "source_id": "o_reg_422_17"
    "citation": "O. Reg. 422/17 s. 4(1)(d)-(e)"
    "evidence_unit_id": "oinp.wps.current.employer-guide"
    "source_file": "e80367ba912163b29e689f7dd84ca3c3871353d0c205f8ad6ac775f6bfb401b1"
    "section": "Employer requirements"
    "verbatim_excerpt": "have business premises in Ontario where the employee will work</li><li data-list-item-id=\"e9c3a4ec08b642cd50218166fa3f47799\">have no outstanding orders made against your business under the Ontario&nbsp;<a href=\"/laws/statute/00e41\"><cite>Employment Standards Act, 2000</cite></a>&nbsp;or the&nbsp;<a href=\"/laws/statute/90o01\"><cite>Occupational Health and Safety Act</cite></a>"
- "id": "oinp_ejo_job_permanent_full_time"
  "category": "job_offer"
  "severity": "CRITICAL_REDLINE"
  "eval_type": "deterministic"
  "required_fields":
  - "job_offer.is_indeterminate"
  - "job_offer.weekly_hours"
  - "job_offer.work_location_in_ontario"
  "pass_if": >-
    job_offer.is_indeterminate == true && job_offer.weekly_hours >= 30 && job_offer.work_location_in_ontario
    == true
  "fail_if": >-
    job_offer.is_indeterminate == false || job_offer.weekly_hours < 30 || job_offer.work_location_in_ontario
    == false
  "missing_or_unverified": >-
    NEEDS_REVIEW: Indeterminate terms, full-time hours (>=30/wk), or Ontario job location unverified.
  "evidence_anchor":
    "source_id": "o_reg_422_17"
    "citation": "O. Reg. 422/17 s. 4(2)"
    "evidence_unit_id": "oinp.wps.current.employer-guide"
    "source_file": "e80367ba912163b29e689f7dd84ca3c3871353d0c205f8ad6ac775f6bfb401b1"
    "section": "Job offer requirements"
    "verbatim_excerpt": "The job offer must be for a full-time and permanent position.</p><ul><li data-list-item-id=\"e8dd67bd440aa2fb53135babbb659a245\">full-time means the job must be a minimum of 1,560&nbsp;hours a year and a minimum of 30&nbsp;hours of paid work per week.</li>"
- "id": "oinp_ejo_eligible_noc"
  "category": "job_offer"
  "severity": "CRITICAL_REDLINE"
  "eval_type": "deterministic"
  "required_fields":
  - "candidate.stream"
  - "job_offer.noc_teer"
  "pass_if": >-
    ((candidate.stream == 'foreign_worker' || candidate.stream == 'international_student') && job_offer.noc_teer
    in [0, 1, 2, 3]) || (candidate.stream == 'in_demand_skills' && job_offer.noc_teer in [4, 5] && job_offer.is_eligible_in_demand_noc
    == true)
  "fail_if": >-
    ((candidate.stream == 'foreign_worker' || candidate.stream == 'international_student') && !(job_offer.noc_teer
    in [0, 1, 2, 3])) || (candidate.stream == 'in_demand_skills' && (!(job_offer.noc_teer in [4, 5]) ||
    job_offer.is_eligible_in_demand_noc == false))
  "missing_or_unverified": >-
    NEEDS_REVIEW: NOC TEER classification or In-Demand Skills occupation eligibility unverified.
  "evidence_anchor":
    "source_id": "o_reg_422_17"
    "citation": "O. Reg. 422/17 s. 4(3)"
    "evidence_unit_id": "EU-OINP-EJO-NOC-TEER-006"
    "source_file": "src02.html"
    "section": "Job offer requirements"
    "verbatim_excerpt": "TEER category 0, 1, 2 or 3 of the National Occupational Classification"
- "id": "oinp_ejo_wage_threshold"
  "category": "job_offer"
  "severity": "CRITICAL_REDLINE"
  "eval_type": "deterministic"
  "required_fields":
  - "candidate.stream"
  - "job_offer.hourly_wage"
  "pass_if": >-
    (candidate.stream == 'foreign_worker' && job_offer.hourly_wage >= job_offer.prevailing_median_wage)
    || (candidate.stream == 'international_student' && job_offer.hourly_wage >= job_offer.prevailing_low_wage)
    || (candidate.stream == 'in_demand_skills' && job_offer.hourly_wage >= job_offer.prevailing_median_wage)
  "fail_if": >-
    (candidate.stream == 'foreign_worker' && job_offer.hourly_wage < job_offer.prevailing_median_wage)
    || (candidate.stream == 'international_student' && job_offer.hourly_wage < job_offer.prevailing_low_wage)
    || (candidate.stream == 'in_demand_skills' && job_offer.hourly_wage < job_offer.prevailing_median_wage)
  "missing_or_unverified": >-
    NEEDS_REVIEW: Basic hourly wage or prevailing wage comparison cannot be established.
  "evidence_anchor":
    "source_id": "o_reg_422_17"
    "citation": "O. Reg. 422/17 s. 4(4)"
    "evidence_unit_id": "oinp.wps.current.employer-guide"
    "source_file": "e80367ba912163b29e689f7dd84ca3c3871353d0c205f8ad6ac775f6bfb401b1"
    "section": "Job offer requirements"
    "verbatim_excerpt": "The wage offered for the position under the Ontario Workforce Priority stream must meet or exceed the wage level assigned to the specific region of Ontario where the employee will be working and be at or above either:</p><ul><li data-list-item-id=\"e356561d56f29ded505fb76f50181250f\">the median wage level</li><li data-list-item-id=\"e27cc2a27b4a1283a526a0e92a949b870\">the low wage level, if the employee is a recent Ontario graduate and the job offer is in a TEER 0-3 category occupation</li>"
- "id": "oinp_ejo_candidate_qualifications"
  "category": "candidate"
  "severity": "CRITICAL_REDLINE"
  "eval_type": "deterministic"
  "required_fields":
  - "candidate.stream"
  "pass_if": >-
    (candidate.stream == 'foreign_worker' && candidate.qualifying_experience_months >= 24 && candidate.experience_in_last_5_years
    == true && candidate.experience_in_same_noc == true) || (candidate.stream == 'international_student'
    && candidate.completed_eligible_canadian_credential == true && candidate.months_since_graduation <=
    24) || (candidate.stream == 'in_demand_skills' && candidate.qualifying_experience_months >= 9 && candidate.language_clb_minimum
    >= 4)
  "fail_if": >-
    (candidate.stream == 'foreign_worker' && (candidate.qualifying_experience_months < 24 || candidate.experience_in_last_5_years
    == false || candidate.experience_in_same_noc == false)) || (candidate.stream == 'international_student'
    && (candidate.completed_eligible_canadian_credential == false || candidate.months_since_graduation
    > 24)) || (candidate.stream == 'in_demand_skills' && (candidate.qualifying_experience_months < 9 ||
    candidate.language_clb_minimum < 4))
  "missing_or_unverified": >-
    NEEDS_REVIEW: Candidate work experience, graduation date/credential, or CLB language scores unverified.
  "evidence_anchor":
    "source_id": "o_reg_422_17"
    "citation": "O. Reg. 422/17 s. 5(1), 5(2), 5(3)"
    "evidence_unit_id": "EU-OINP-EJO-CANDIDATE-FW-009"
    "source_file": "src02.html"
    "section": "Applicant requirements"
    "verbatim_excerpt": >-
      at least two years of cumulative paid full-time work experience (or the equivalent in paid part-time
      work) in the same occupation
- "id": "oinp_ejo_mandatory_licensing"
  "category": "candidate"
  "severity": "CRITICAL_REDLINE"
  "eval_type": "deterministic"
  "required_fields":
  - "job_offer.is_regulated_occupation"
  "pass_if": >-
    job_offer.is_regulated_occupation == false || (job_offer.is_regulated_occupation == true && candidate.holds_mandatory_licence
    == true)
  "fail_if": >-
    job_offer.is_regulated_occupation == true && candidate.holds_mandatory_licence == false
  "missing_or_unverified": "NEEDS_REVIEW: Professional regulatory licensing status in Ontario is unverified."
  "evidence_anchor":
    "source_id": "o_reg_422_17"
    "citation": "O. Reg. 422/17 s. 5(4)"
    "evidence_unit_id": "EU-OINP-EJO-LICENSING-011"
    "source_file": "src02.html"
    "section": "Applicant requirements"
    "verbatim_excerpt": >-
      Regulated occupation: the official licensing or registration requirement is not present in the pinned
      knowledge revisions.
- "id": "oinp_ejo_candidate_equity_and_intention"
  "category": "candidate"
  "severity": "CRITICAL_REDLINE"
  "eval_type": "deterministic"
  "required_fields":
  - "candidate.equity_percentage"
  - "candidate.intention_to_reside_in_ontario"
  "pass_if": >-
    candidate.equity_percentage < 0.10 && candidate.intention_to_reside_in_ontario == true
  "fail_if": >-
    candidate.equity_percentage >= 0.10 || candidate.intention_to_reside_in_ontario == false
  "missing_or_unverified": >-
    NEEDS_REVIEW: Business equity share (<10%) or Ontario residency intention unverified.
  "evidence_anchor":
    "source_id": "o_reg_422_17"
    "citation": "O. Reg. 422/17 s. 4(5), s. 5(5)"
    "evidence_unit_id": "EU-OINP-EJO-EQUITY-INTENT-012"
    "source_file": "src02.html"
    "section": "Applicant / Intention"
    "verbatim_excerpt": "must be less than 10%"
