  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields: []
  pass_if: >-
    (candidate.stream == 'foreign_worker' && candidate.applies_with_job_offer == false) ||
    (candidate.stream == 'foreign_worker' &&
