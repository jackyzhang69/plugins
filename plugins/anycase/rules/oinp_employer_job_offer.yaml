      or
- id: oinp_ejo_employer_premises_and_compliance
  category: employer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields: []
  pass_if: (candidate.stream == 'foreign_worker' && candidate.applies_with_job_offer == false) || (employer.has_business_premises_in_ontario
