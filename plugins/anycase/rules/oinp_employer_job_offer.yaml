rules:
- id: oinp_ejo_employer_operating_history
  category: employer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields: []
  pass_if: (candidate.stream == 'foreign_worker' && candidate.applies_with_job_offer == false) || (employer.years_operating_in_ontario
    >= 3)
  fail_if: (candidate.stream != 'foreign_worker' || candidate.applies_with_job_offer == true) && (employer.years_operating_in_ontario
    < 3)
  missing_or_unverified: 'NEEDS_REVIEW: Employer Ontario operational history cannot be verified.'
  evidence_anchor:
    page: ''
    source_id: o_reg_422_17_v26
    evidence_unit_id: o_reg_422_17_v26.full_document_body
    source_file: 11dd020ae4e80a513f05d84488b51badb3d5f68488ff8c7e89e8ad2e4ffae108
    section: Approval of an employment position, paragraph 1
    citation: O. Reg. 422/17, s. 4 (1) 1
    verbatim_excerpt: The employer’s business must have existed and been active for at least three years before the
      date of making the application.
- id: oinp_ejo_employer_revenue
  category: employer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields: []
  pass_if: (candidate.stream == 'foreign_worker' && candidate.applies_with_job_offer == false) || ((employer.in_gta
    == true && employer.annual_revenue_cad >= 1000000) || (employer.in_gta == false && employer.annual_revenue_cad
    >= 500000))
  fail_if: (candidate.stream != 'foreign_worker' || candidate.applies_with_job_offer == true) && ((employer.in_gta
    == true && employer.annual_revenue_cad < 1000000) || (employer.in_gta == false && employer.annual_revenue_cad
    < 500000))
  missing_or_unverified: 'NEEDS_REVIEW: Employer gross annual revenue for the latest fiscal year is unverified.'
  evidence_anchor:
    page: ''
    source_id: o_reg_422_17_v26
    evidence_unit_id: o_reg_422_17_v26.full_document_body
    source_file: 11dd020ae4e80a513f05d84488b51badb3d5f68488ff8c7e89e8ad2e4ffae108
    section: Approval of an employment position, paragraph 3 i
