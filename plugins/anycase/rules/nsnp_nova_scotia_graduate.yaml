schema_version: 1.0.0
catalog_id: nsnp_nova_scotia_graduate
category: Nova Scotia Nominee Program
display_name: 'Nova Scotia Nominee Program: Nova Scotia Graduate'
status: ACTIVE
program_id: NSNP_NOVA_SCOTIA_GRADUATE
stream_id: NOVA_SCOTIA_GRADUATE
jurisdiction: CA-NS
effective_date: '2026-09-01'
source_edition: 'Nova Scotia Graduate stream page (liveinnovascotia.com/nova-scotia-graduate, no page date, retrieved 2026-11-16) and Nova Scotia Graduate Stream Submission Guide, Nova Scotia Nominee Program (September 2026)'
source_url: https://liveinnovascotia.com/nova-scotia-graduate
decision_scope: >-
  Pre-screen of the Nova Scotia Graduate stream EOI criteria published on the stream page and in the September 2026
  guide. The stream is open only for NOC 32102, 32124, 33102 and 42202. No equity/ownership cap, TEER-banded language
  floor or PGWP-only status rule exists in the sources and none is evaluated. A pass is not nomination.
sources:
- id: ns_graduate_stream_page
  title: Nova Scotia Graduate (stream page)
  url: https://liveinnovascotia.com/nova-scotia-graduate
  sha256: e345bc58388c5dce4661b4638596e4f35eb0da39ea7e53fd060ba899de1dba33
  retrieved_at: '2026-11-16'
- id: ns_graduate_guide
  title: Nova Scotia Graduate Stream Submission Guide (September 2026)
  url: https://liveinnovascotia.com/sites/default/files/2026-02/Guide-NSNP-Nova-Scotia-Graduate-English.pdf
  sha256: c97d3043cc8131b97abe84a33d7cc6df27025d98937fde7f5b6f379ba860abe3
  retrieved_at: '2026-11-16'
schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  - job_offer
  - employer
  types:
    assessment_date: ISO-8601 date; application assessment date
    candidate:
      age_years: integer; age at assessment
      has_high_school_diploma: boolean
      institution_is_ns_dli: boolean; completed at an eligible Nova Scotia designated learning institution
      graduated_within_past_36_months: boolean; requirements for completing the program met within three years of the application
      completed_program_weeks: number; program length in weeks
      share_of_program_completed_in_ns: decimal in [0,1]
      credential_type: diploma | certificate | degree | other
      holds_required_ns_regulatory_certifications: boolean; certifications issued by Nova Scotia regulatory bodies required for the job
      resides_in_canada: boolean
      valid_nonexpired_status_document: boolean; required when resides_in_canada is true
      on_maintained_status: boolean; required when resides_in_canada is true
      legal_status_in_country_of_residence: boolean; used when resides_in_canada is false
      intention_to_reside_in_ns: boolean
      first_language_is_english_or_french: boolean
      language_alternative_evidence: boolean; transcripts show English/French as main language of instruction OR employment history and references show it as main language of communication
      language_test:
        valid_at_application: boolean; tested within 2 years of applying
        listening_clb: integer
        reading_clb: integer
        writing_clb: integer
        speaking_clb: integer
    job_offer:
      noc_2021_code: five-digit string
      indeterminate: boolean; permanent, no end date
      weekly_regular_hours: number; full-time is at least 30 hours a week
      is_in_nova_scotia: boolean
      is_telework_outside_ns: boolean
      directly_related_to_field_of_study: boolean
      regular_base_hourly_cad: number
      statutory_minimum_wage_cad: number
      within_provincial_wage_range_for_occupation: boolean
    employer:
      ns_operating_months: integer
      meets_ns_registration_requirement: boolean; commercial business registered with the Nova Scotia Registry of Joint Stock Companies with a permanent establishment in Nova Scotia, or not-for-profit registered under the Societies Act
      hiring_contravenes_labour_agreements_or_in_dispute: boolean
evaluation:
  rule_statuses:
  - PASS
  - FAIL
  - NEEDS_REVIEW
  aggregate:
  - If any CRITICAL_REDLINE rule is FAIL, verdict = FAIL.
  - Otherwise, if any rule is NEEDS_REVIEW, verdict = NEEDS_REVIEW.
  - Otherwise, verdict = PASS.
rules:
- id: nsnp_grad_age
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.age_years
  pass_if: candidate.age_years >= 19 && candidate.age_years <= 55
  fail_if: (candidate.age_years != null && candidate.age_years < 19) || (candidate.age_years != null && candidate.age_years > 55)
  missing_or_unverified: 'NEEDS_REVIEW: Candidate age cannot be verified.'
  provenance:
    source_file: https://liveinnovascotia.com/nova-scotia-graduate
    section: Nova Scotia Graduate - Eligibility
    verbatim: be 19 to 55 years old;
  evidence_anchor:
    evidence_unit_id: "atlantic_documents:ns_graduate_stream_page:graduate_stream_open_noc_and_eligibility"
    unit_status: candidate_k_validated_not_published
