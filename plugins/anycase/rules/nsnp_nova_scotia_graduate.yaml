  conditional_required_fields:
    when: candidate.first_language_is_english_or_french == false
    fields:
    - candidate.language_alternative_evidence
  pass_if: >-
    candidate.first_language_is_english_or_french == true || candidate.language_alternative_evidence == true ||
    (candidate.language_test.valid_at_application == true && candidate.language_test.listening_clb >= 5 &&
    candidate.language_test.reading_clb >= 5 && candidate.language_test.writing_clb >= 5 && candidate.language_test.speaking_clb >= 5)
  fail_if: >-
    candidate.first_language_is_english_or_french == false && candidate.language_alternative_evidence == false &&
    candidate.language_test.valid_at_application == true &&
    ((candidate.language_test.listening_clb != null && candidate.language_test.listening_clb < 5) ||
    (candidate.language_test.reading_clb != null && candidate.language_test.reading_clb < 5) ||
    (candidate.language_test.writing_clb != null && candidate.language_test.writing_clb < 5) ||
    (candidate.language_test.speaking_clb != null && candidate.language_test.speaking_clb < 5))
