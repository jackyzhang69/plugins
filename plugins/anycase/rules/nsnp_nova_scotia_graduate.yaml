- id: nsnp_grad_dli_credential
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.institution_is_ns_dli
  - candidate.graduated_within_past_36_months
  - candidate.completed_program_weeks
  - candidate.share_of_program_completed_in_ns
  - candidate.credential_type
  - job_offer.noc_2021_code
  pass_if: >-
    candidate.institution_is_ns_dli == true && candidate.graduated_within_past_36_months == true &&
    candidate.share_of_program_completed_in_ns >= 0.5 &&
    ((job_offer.noc_2021_code == '33102' && candidate.completed_program_weeks >= 24) ||
    (job_offer.noc_2021_code != '33102' && candidate.completed_program_weeks >= 30)) &&
    (((job_offer.noc_2021_code == '32102' || job_offer.noc_2021_code == '32124') && candidate.credential_type == 'diploma') ||
    (job_offer.noc_2021_code == '33102' && candidate.credential_type in ['certificate', 'diploma', 'degree']) ||
    (job_offer.noc_2021_code == '42202' && candidate.credential_type in ['diploma', 'degree']))
  fail_if: >-
    candidate.institution_is_ns_dli == false || candidate.graduated_within_past_36_months == false ||
    (candidate.share_of_program_completed_in_ns != null && candidate.share_of_program_completed_in_ns < 0.5) ||
    (job_offer.noc_2021_code == '33102' && candidate.completed_program_weeks != null && candidate.completed_program_weeks < 24) ||
    (job_offer.noc_2021_code in ['32102', '32124', '42202'] && candidate.completed_program_weeks != null && candidate.completed_program_weeks < 30) ||
    ((job_offer.noc_2021_code == '32102' || job_offer.noc_2021_code == '32124') && candidate.credential_type != null && candidate.credential_type != 'diploma') ||
    (job_offer.noc_2021_code == '33102' && candidate.credential_type != null && !(candidate.credential_type in ['certificate', 'diploma', 'degree'])) ||
    (job_offer.noc_2021_code == '42202' && candidate.credential_type != null && !(candidate.credential_type in ['diploma', 'degree']))
  missing_or_unverified: 'NEEDS_REVIEW: Designated learning institution completion letter, program length, share completed in Nova Scotia, credential type or completion date is missing.'
  provenance:
    source_file: https://liveinnovascotia.com/nova-scotia-graduate
    section: Nova Scotia Graduate - Eligibility (program of study)
    verbatim: The program must have been at least 30 weeks in length or 24 weeks for NOC 33102 (Nurse Aids and Continuing Care Assistants). You must have completed at least 50% of the program in Nova Scotia.
  evidence_anchor:
