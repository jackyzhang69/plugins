- id: nsnp_grad_job_offer_permanence
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - job_offer.noc_2021_code
  - job_offer.indeterminate
  - job_offer.weekly_regular_hours
  - job_offer.is_in_nova_scotia
  - job_offer.is_telework_outside_ns
  pass_if: >-
    job_offer.noc_2021_code in ['32102', '32124', '33102', '42202'] && job_offer.indeterminate == true &&
    job_offer.weekly_regular_hours >= 30 && job_offer.is_in_nova_scotia == true && job_offer.is_telework_outside_ns == false
  fail_if: >-
    (job_offer.noc_2021_code != null && !(job_offer.noc_2021_code in ['32102', '32124', '33102', '42202'])) ||
    job_offer.indeterminate == false || (job_offer.weekly_regular_hours != null && job_offer.weekly_regular_hours < 30) ||
    job_offer.is_in_nova_scotia == false || job_offer.is_telework_outside_ns == true
  missing_or_unverified: 'NEEDS_REVIEW: Job offer NOC category, permanence, hours or Nova Scotia location is unverified.'
