      source_id: "lmia_eligibility_low_wage_requirements_20261004"
      verbatim_excerpt: "All employers applying to the Temporary Foreign Worker Program must provide documents along with their LMIA application to demonstrate that their <a href=\"/en/employment-social-development/services/foreign-workers/business-legitimacy.html\">business and job offer are legitimate"
