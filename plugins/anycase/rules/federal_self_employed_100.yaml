schema_version: 1.0.0
catalog_id: federal_self_employed_100
jurisdiction: CA
category: Federal self-employed
display_name: Federal Self-Employed Persons
status: ACTIVE
program_id: FEDERAL_SELF_EMPLOYED
stream_id: SELF_EMPLOYED
effective_date: '2024-04-30'
source_edition: IRPR self-employed persons class
source_url: https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/self-employed.html
decision_scope: Deterministic prescreen of relevant experience, intent, contribution, settlement funds, and a caller-supplied
  100-point total against the 35-point minimum. Factor arithmetic stays in AnyScore.
sources:
- id: irpr_se
  title: Federal Self-Employed Persons Program
  url: https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/self-employed.html
  citation: IRPR self-employed persons class
  legal_authority: Official program baseline used for the redline. Points arithmetic stays in AnyScore.
schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  types:
    assessment_date: ISO-8601 date
reference_points_grid:
  note: Documentation only. Maximum 100. Selection minimum 35. AnyScore owns the factor arithmetic.
rules:
- id: se_experience
  category: experience
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.relevant_experience_months_past_5_years
  pass_if: candidate.relevant_experience_months_past_5_years >= 24
  fail_if: candidate.relevant_experience_months_past_5_years < 24
  missing_or_unverified: 'NEEDS_REVIEW: Relevant cultural or athletic experience cannot be verified.'
  evidence_anchor:
    evidence_unit_id: se.guide.before
    source_file: fd296489e0e92413819344ce6a36088be42504756e715ada7b9528c6c9abb61c
    section: Relevant experience
    source_id: irpr_se
    verbatim_excerpt: "For at least two years in the period beginning five years before the date of application"
- id: se_intent
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.intent_and_ability
  pass_if: candidate.intent_and_ability == true
  fail_if: candidate.intent_and_ability == false
  missing_or_unverified: 'NEEDS_REVIEW: Intention and ability to be self-employed in Canada cannot be verified.'
  evidence_anchor:
    evidence_unit_id: se.guide.before
    source_file: fd296489e0e92413819344ce6a36088be42504756e715ada7b9528c6c9abb61c
    section: Who can apply
    source_id: irpr_se
    verbatim_excerpt: "must have the experience, intention and ability to"
- id: se_contribution
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.significant_contribution
  pass_if: candidate.significant_contribution == true
  fail_if: candidate.significant_contribution == false
  missing_or_unverified: 'NEEDS_REVIEW: Significant contribution to cultural or athletic life cannot be verified.'
  evidence_anchor:
    evidence_unit_id: se.guide.before
    source_file: fd296489e0e92413819344ce6a36088be42504756e715ada7b9528c6c9abb61c
    section: Program purpose
    source_id: irpr_se
    verbatim_excerpt: "make a significant contribution to cultural activities or athletics in Canada"
- id: se_funds
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.settlement_funds_cad
  - candidate.settlement_funds_required_cad
  pass_if: candidate.settlement_funds_cad >= candidate.settlement_funds_required_cad
  fail_if: candidate.settlement_funds_cad < candidate.settlement_funds_required_cad
  missing_or_unverified: 'NEEDS_REVIEW: Settlement funds cannot be verified.'
  evidence_anchor:
    evidence_unit_id: se.guide.before
    source_file: fd296489e0e92413819344ce6a36088be42504756e715ada7b9528c6c9abb61c
    section: Other requirements
    source_id: irpr_se
    verbatim_excerpt: "must establish that they have enough money to support themselves and their family members for at least one year after they arrive in Canada"
- id: se_points
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.assessed_grid_points
  pass_if: candidate.assessed_grid_points >= 35
  fail_if: candidate.assessed_grid_points < 35
  missing_or_unverified: 'NEEDS_REVIEW: The assessed 100-point total is missing.'
  evidence_anchor:
    evidence_unit_id: se.guide.before
    source_file: fd296489e0e92413819344ce6a36088be42504756e715ada7b9528c6c9abb61c
    section: Selection criteria
    source_id: irpr_se
    verbatim_excerpt: "<p>Use the table below to calculate your total score. The pass mark is <strong>35</strong>. The <strong>maximum</strong> possible <strong>score</strong> for each class is <strong>100</strong>."
