      \ the group your job is classified in under the&nbsp;<a href=\"/en/immigration-refugees-citizenship/services/immigrate-canada/find-national-occupation-code.html\"\
      >National Occupational Classification system (NOC)</a>.</p>\r\n            <h4>Minimum\
      \ level for all 4 abilities</h4>\r\n            <div class=\"table-responsive\"\
