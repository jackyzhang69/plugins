    page: ''
- id: cec_quebec
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.intends_to_reside_outside_quebec
  pass_if: candidate.intends_to_reside_outside_quebec == true
  fail_if: candidate.intends_to_reside_outside_quebec == false
  missing_or_unverified: 'NEEDS_REVIEW: Intention to reside outside Quebec cannot
    be verified.'
  evidence_anchor:
    evidence_unit_id: federal_ee:express_entry_cec_program:full_document_body
