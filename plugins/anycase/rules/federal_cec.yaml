schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  types:
    assessment_date: ISO-8601 date
    candidate:
      cec_counted_work_noc_teer: 'TEER of the work whose months are counted toward this CEC claim: integer
        0-5 only when one unambiguous tier is verified; mixed, unverified, null or absent otherwise. Never
        derive from offer TEER or a primary NOC selected for another purpose.'
      canadian_skilled_months_past_3_years: 'Verified full-time-equivalent qualifying months in the three
        years before application: 12 means 1,560 hours, with at most 30 hours counted per week. From 2026-11-17,
        Canadian work experience in NOC 41200 paid by a Canadian entity through a stipend, grant, bursary,
        or scholarship counts as paid work. If potentially qualifying physician time is excluded, self-employment
        requires review.'
      work_authorized: Whether the counted qualifying work was legally authorized; not unrelated employment.
      gained_as_full_time_student: Whether the counted qualifying work was gained while studying full-time;
        not unrelated periods.
      self_employed_work: Whether potentially counted work includes self-employment; physician-policy
        applicability remains manual.
      language_clb_minimum: 'Minimum benchmark level across all four abilities of the selected first-official-language
        test: CLB for English or NCLC for French, not raw test scores and not the lower score of an unselected
        language. Approved-test and validity evidence remain manual.'
      intends_to_reside_outside_quebec: Verified intent to live outside Quebec; experience in Quebec itself
        is not excluded.
reference_points_grid:
  note: The Canadian Experience Class has no selection points grid.
rules:
- id: cec_experience
  category: experience
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.canadian_skilled_months_past_3_years
  - candidate.work_authorized
  - candidate.gained_as_full_time_student
  - candidate.self_employed_work
  - candidate.cec_counted_work_noc_teer
  pass_if: candidate.canadian_skilled_months_past_3_years >= 12 && candidate.work_authorized == true &&
    candidate.gained_as_full_time_student == false && candidate.self_employed_work == false && candidate.cec_counted_work_noc_teer
    in [0, 1, 2, 3]
  fail_if: candidate.work_authorized == false || candidate.gained_as_full_time_student == true || candidate.cec_counted_work_noc_teer
    in [4, 5] || (candidate.canadian_skilled_months_past_3_years < 12 && candidate.self_employed_work
    == false)
  missing_or_unverified: 'NEEDS_REVIEW: qualifying work TEER or counted experience is unverified, mixed-TEER
    work is unresolved, or physician self-employment may qualify. Offer TEER is never a proxy.'
  evidence_anchor:
    evidence_unit_id: federal_ee:express_entry_cec_program:full_document_body
    source_id: express_entry_cec_program
    source_file: 5ed84020dee8fb3dc73637b851363082a17f910169cfead49a3e041b2ccada74
    section: Skilled work experience
    verbatim_excerpt: total at least <strong>1 year of work</strong> or 1,560 hours total
- id: cec_language
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.cec_counted_work_noc_teer
  - candidate.language_clb_minimum
  pass_if: (candidate.cec_counted_work_noc_teer in [0, 1] && candidate.language_clb_minimum >= 7) || (candidate.cec_counted_work_noc_teer
    in [2, 3] && candidate.language_clb_minimum >= 5)
  fail_if: (candidate.cec_counted_work_noc_teer in [0, 1] && candidate.language_clb_minimum < 7) || (candidate.cec_counted_work_noc_teer
    in [2, 3] && candidate.language_clb_minimum < 5)
  missing_or_unverified: 'NEEDS_REVIEW: verified counted-work TEER and selected first-official-language
    four-ability CLB/NCLC levels are needed. Mixed TEER or unverified language evidence requires manual
    review; offer TEER is irrelevant.'
  evidence_anchor:
    evidence_unit_id: federal_ee:express_entry_language_results:full_document_body
    source_id: express_entry_language_results
    source_file: ce53add9d0620e94a1cc7c2e4c08b707db65e39cd26adf3f5bc6d26e052e257b
    section: Canadian Experience Class — minimum level for all four abilities; TEER 0/1 versus TEER 2/3
    verbatim_excerpt: "Canadian Experience Class</h3>\r\n            </summary>\r\n            <p"
- id: cec_quebec
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.intends_to_reside_outside_quebec
  pass_if: candidate.intends_to_reside_outside_quebec == true
  fail_if: candidate.intends_to_reside_outside_quebec == false
  missing_or_unverified: 'NEEDS_REVIEW: Intention to reside outside Quebec cannot be verified.'
  evidence_anchor:
    evidence_unit_id: federal_ee:express_entry_cec_program:full_document_body
    source_id: express_entry_cec_program
    source_file: 5ed84020dee8fb3dc73637b851363082a17f910169cfead49a3e041b2ccada74
    section: Where you can live in Canada
    verbatim_excerpt: You must plan to live <strong>outside the province of Quebec</strong>
- id: cec_additional_source_requirements_manual
  category: manual_source_coverage
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields: []
  missing_or_unverified: 'NEEDS_REVIEW: paid work (including NOC 41200 stipend/grant/bursary/scholarship
    verification from 2026-11-17), status/physical presence, NOC duties, test validity/language, admissibility,
    application-date window and physician-policy/mixed-TEER conditions require manual verification; see
    partial criteria.'
  evidence_anchor:
