- id: aaip_rural_personal_capital
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  pass_if: (candidate.stream in ['farm', 'graduate', 'foreign_graduate']) || ((candidate.stream == 'rural') && (candidate.net_worth_cad >= 300000 && candidate.net_worth_personal_or_spousal == true && candidate.personal_spousal_equity_investment_cad >= 100000 && ((candidate.business_kind == 'new' && candidate.equity_ratio >= 0.51 && candidate.partners_canadian_or_pr == true) || (candidate.business_kind == 'succession' && candidate.equity_ratio >= 1 && candidate.complete_ownership_transfer == true))))
  fail_if: (candidate.stream == 'rural') && (candidate.net_worth_cad < 300000 || candidate.net_worth_personal_or_spousal == false || candidate.personal_spousal_equity_investment_cad < 100000 || (candidate.business_kind == 'new' && (candidate.equity_ratio < 0.51 || candidate.partners_canadian_or_pr == false)) || (candidate.business_kind == 'succession' && (candidate.equity_ratio < 1 || candidate.complete_ownership_transfer == false)))
  missing_or_unverified: 'NEEDS_REVIEW: Source-specific facts or assessed evidence are missing; do not infer a determination.'
  evidence_anchor:
    evidence_unit_id: aaip:aaip_rural_eligibility:full_document_body
    source_id: aaip_rural_eligibility
    source_file: 3518e457dbd0de6beb5c1c1a450a4f98455ee241dc73ec0781ccf65107757867
    section: Personal/spousal capital, investment and ownership
