  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'foreign_graduate'
    fields:
    - candidate.language_clb_minimum
    - candidate.language_result_within_2_years
    - candidate.language_test_accepted
  pass_if: candidate.stream != 'foreign_graduate' || (candidate.language_clb_minimum >= 5 && candidate.language_result_within_2_years == true && candidate.language_test_accepted == true)
  fail_if: candidate.stream == 'foreign_graduate' && (candidate.language_clb_minimum < 5 || candidate.language_result_within_2_years == false || candidate.language_test_accepted == false)
  missing_or_unverified: 'NEEDS_REVIEW: the minimum of all four verified abilities, an accepted official test, or the under-two-year validity at EOI submission is unverified.'
  evidence_anchor:
    evidence_unit_id: aaip:aaip_foreign_graduate_eligibility:full_document_body
