schema_version: 1.0.0
catalog_id: aaip_entrepreneur_streams
jurisdiction: CA-AB
category: AAIP entrepreneur
display_name: AAIP Entrepreneur Streams
status: ACTIVE
program_id: AAIP_ENTREPRENEUR
stream_id: ENTREPRENEUR
effective_date: '2024-01-01'
source_edition: AAIP Rural, Graduate, Foreign Graduate, and Farm streams
source_url: https://www.alberta.ca/aaip-entrepreneur-streams
decision_scope: Deterministic prescreen for endorsement, net worth, investment, equity,
  and language. Entrepreneur points stay in AnyScore.
sources:
- id: aaip_ent
  title: AAIP entrepreneur streams
  url: https://www.alberta.ca/aaip-entrepreneur-streams
  citation: AAIP Rural, Graduate, Foreign Graduate, and Farm streams
  legal_authority: Official program baseline used for the redline. Points arithmetic
    stays in AnyScore.
schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  types:
    assessment_date: ISO-8601 date
reference_points_grid:
  note: Documentation only. AnyScore owns the entrepreneur points.
rules:
- id: aaip_ent_endorsement
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'rural' || candidate.stream == 'farm' || candidate.stream
      == 'foreign_graduate'
    fields:
    - candidate.endorsement_valid
  pass_if: candidate.stream == 'graduate' || candidate.endorsement_valid == true
  fail_if: candidate.stream != 'graduate' && candidate.endorsement_valid == false
  missing_or_unverified: 'NEEDS_REVIEW: Community, agency, or agriculture endorsement
    cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-AAIP-ENT-ENDORSEMENT-001
    source_file: 57394f3a0fb6b073725c440e23df0f2906b5c187792a71070d244f09752f6506
    section: Endorsement requirements
    source_id: aaip_ent
    verbatim_excerpt: "Your EOI will include the following documents or forms:</p><ul><li>Foreign Graduate Entrepreneur Stream Business Plan</li><li>Pitch Deck</li><li>Letter of Recommendation from a Designated Agency"
- id: aaip_ent_net_worth
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'rural' || candidate.stream == 'farm'
    fields:
    - candidate.net_worth_cad
  pass_if: candidate.stream == 'graduate' || (candidate.stream == 'rural' && candidate.net_worth_cad
    >= 300000) || (candidate.stream == 'farm' && candidate.net_worth_cad >= 500000)
    || (candidate.stream == 'foreign_graduate' && candidate.settlement_funds_cad >=
    candidate.settlement_funds_required_cad)
  fail_if: (candidate.stream == 'rural' && candidate.net_worth_cad < 300000) || (candidate.stream
    == 'farm' && candidate.net_worth_cad < 500000) || (candidate.stream == 'foreign_graduate'
    && candidate.settlement_funds_cad < candidate.settlement_funds_required_cad)
  missing_or_unverified: 'NEEDS_REVIEW: Net worth or settlement funds cannot be verified.'
  evidence_anchor:
    evidence_unit_id: bc.aaip_farm_document_checklist.p002
    source_file: 92984646c7a65355da07186c0ce9fc5c9d2808eee8faf84e04bce09f3af81640
    page: "2"
    section: Net worth and settlement funds
    source_id: aaip_ent
    verbatim_excerpt: "minimum net worth of\n\uf020$500,000 in unencumbered Canadian funds"
- id: aaip_ent_investment
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'rural' || candidate.stream == 'farm' || candidate.stream
      == 'foreign_graduate'
    fields:
    - candidate.investment_cad
  pass_if: candidate.stream == 'graduate' || (candidate.stream == 'rural' && candidate.investment_cad
    >= 100000) || (candidate.stream == 'farm' && candidate.investment_cad >= 500000)
    || (candidate.stream == 'foreign_graduate' && candidate.fges_urban == false &&
    candidate.investment_cad >= 50000) || (candidate.stream == 'foreign_graduate'
    && candidate.fges_urban == true && candidate.investment_cad >= 100000)
  fail_if: (candidate.stream == 'rural' && candidate.investment_cad < 100000) || (candidate.stream
    == 'farm' && candidate.investment_cad < 500000) || (candidate.stream == 'foreign_graduate'
    && candidate.fges_urban == false && candidate.investment_cad < 50000) || (candidate.stream
    == 'foreign_graduate' && candidate.fges_urban == true && candidate.investment_cad
    < 100000)
  missing_or_unverified: 'NEEDS_REVIEW: Investment amount or foreign-graduate location
    cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-AAIP-ENT-INVESTMENT-003
    source_file: src04.html
    section: Business investment floors
    verbatim_excerpt: Minimum investment of $100,000
- id: aaip_ent_equity
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  - candidate.equity_ratio
  - candidate.business_kind
  pass_if: (candidate.stream == 'rural' && candidate.business_kind == 'new' && candidate.equity_ratio
    >= 0.51) || (candidate.stream == 'rural' && candidate.business_kind == 'succession'
    && candidate.equity_ratio >= 1) || ((candidate.stream == 'graduate' || candidate.stream
    == 'farm') && candidate.equity_ratio >= 0.34) || (candidate.stream == 'foreign_graduate'
    && candidate.fges_urban == true && candidate.equity_ratio >= 0.34) || (candidate.stream
    == 'foreign_graduate' && candidate.fges_urban == false && candidate.equity_ratio
    >= 0.51)
  fail_if: (candidate.stream == 'rural' && candidate.business_kind == 'new' && candidate.equity_ratio
    < 0.51) || (candidate.stream == 'rural' && candidate.business_kind == 'succession'
    && candidate.equity_ratio < 1) || ((candidate.stream == 'graduate' || candidate.stream
    == 'farm') && candidate.equity_ratio < 0.34) || (candidate.stream == 'foreign_graduate'
    && candidate.fges_urban == true && candidate.equity_ratio < 0.34) || (candidate.stream
    == 'foreign_graduate' && candidate.fges_urban == false && candidate.equity_ratio
    < 0.51)
  missing_or_unverified: 'NEEDS_REVIEW: Equity share cannot be verified.'
  evidence_anchor:
    evidence_unit_id: bc.aaip_rural_apply_page.html
    source_file: 6abcf8b1664505061221c332dab8940ec27406ef267a8ceeca7f46a6c5c7b918
    section: Ownership equity thresholds
    source_id: aaip_ent
    verbatim_excerpt: "at least 51% ownership if establishing a new business or 100% ownership for business succession"
- id: aaip_ent_language
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'rural' || candidate.stream == 'graduate' || candidate.stream
      == 'foreign_graduate'
    fields:
    - candidate.language_clb_minimum
  pass_if: candidate.stream == 'farm' || (candidate.stream == 'rural' && candidate.language_clb_minimum
    >= 4) || (candidate.stream == 'graduate' && candidate.language_clb_minimum >=
    7) || (candidate.stream == 'foreign_graduate' && candidate.language_clb_minimum
    >= 5)
  fail_if: (candidate.stream == 'rural' && candidate.language_clb_minimum < 4) ||
    (candidate.stream == 'graduate' && candidate.language_clb_minimum < 7) || (candidate.stream
    == 'foreign_graduate' && candidate.language_clb_minimum < 5)
  missing_or_unverified: 'NEEDS_REVIEW: Language level cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-AAIP-ENT-LANGUAGE-005
    source_file: src04.html
    section: Language CLB floors by stream
    verbatim_excerpt: CLB) level of 4
