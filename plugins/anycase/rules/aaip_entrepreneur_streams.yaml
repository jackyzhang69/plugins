schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  types:
    assessment_date: ISO-8601 date
    candidate:
      stream: rural | graduate | foreign_graduate | farm
      accessible_funds_cad: Documented, confirmed access to funds from other sources; official alternative to net worth for Farm only.
      primary_production_equity_investment_cad: Verified equity to be invested in an Alberta primary-production farming business, not generic or passive business investment.
      language_clb_minimum: Lowest verified CLB/NCLC across all four abilities.
      language_result_within_2_years: Official result is less than two years old at EOI submission.
      language_test_accepted: The result is from an official test accepted by the applicable AAIP stream.
      fges_urban: Business is in the Calgary or Edmonton CMA; outside these CMAs is regional.
      partners_canadian_or_pr: All co-owners other than the applicant are Canadian citizens or permanent residents.
      farm_management_skills_verified: Farm-management skills are supported by verifiable evidence.
      farm_business_plan_submitted: The proposed primary-production farm plan has been provided for AAIP/agriculture review; not a fabricated endorsement.
      settlement_family_size: Number of family members, including the applicant, used for the official settlement-funds table.
      settlement_community_population: Population of the community where the proposed business will be established.
      settlement_table_amount_verified: The supplied settlement_funds_required_cad matches the official table for the verified family size and community population.
      rural_management_experience_qualifies: At least three years as active owner/manager or four years as senior manager within the past ten years.
      rural_high_school_and_eca_verified: Canadian-equivalent high-school education and applicable ECA verified.
      rural_location_qualifies: The proposed location meets the official rural community and census requirements.
      rural_exploratory_visit_completed: Required community exploratory visit has been completed.
      rural_exploratory_report_submitted: Exploratory visit report has been submitted with the Business Application.
      graduate_alberta_two_year_full_time_credential: At least two years of full-time study resulted in an eligible degree or diploma from a publicly funded Alberta institution.
      graduate_pgwp_valid_at_eoi: IRCC post-graduation work permit was valid when the EOI was submitted.
      graduate_business_is_eligible: Proposed business is not in the official ineligible-business list.
      fges_business_sector_eligible: Business is in an officially eligible Foreign Graduate Entrepreneur sector.
      fges_business_is_eligible: Proposed business is not in the official ineligible-business list.
      fges_designated_agency_report_submitted: The designated agency business-plan assessment report was submitted with the Business Application.
      fges_investment_source_eligible: Investment comes from an official eligible equity or financing source.
      fges_investment_timing_eligible: Investment timing satisfies the applicable official requirements.
      farm_no_other_active_nomination: No other active or extendable AAIP nomination.
      farm_no_reapplication_bar: No AAIP reapplication prohibition applies at application time.
      farm_no_removal_order: No IRCC or CBSA removal order has been issued.
      farm_canadian_status_eligible: Canadian temporary resident status is valid if living or working in Canada.
      farm_current_permit_category_eligible: Current permit or student category is eligible under the Farm Stream exclusions.
      no_other_active_aaip_nomination: No other active or extendable AAIP nomination.
      no_aaip_reapplication_bar: No AAIP reapplication prohibition applies at application time.
      no_removal_order: No IRCC or CBSA removal order has been issued.
      not_refugee_claimant_or_appeal: Applicant is not a refugee claimant or person in the IRCC appeal or removal process.
      valid_canadian_status_if_present: Canadian temporary resident status is valid if living or working in Canada.
      alberta_business_location_verified: Proposed business location is in Alberta and meets the stream-specific location requirement.
      owner_operator_management_verified: Applicant's proposed role is active management as an owner-operator.
      business_viability_reviewed: Credible likelihood of establishing, operating and sustaining the proposed business has been reviewed against the official economic-establishment criteria.
      existing_business_eoi_year_verified: If applying through the existing-business route, the business operated in Alberta for at least one year immediately before EOI; otherwise this fact is not applicable.
reference_points_grid:
  note: Documentation only. AnyScore owns the entrepreneur points.
rules:
- id: aaip_rural_community_support
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'rural'
    fields:
    - candidate.endorsement_valid
  pass_if: candidate.stream != 'rural' || (candidate.endorsement_valid == true)
  fail_if: candidate.stream == 'rural' && (candidate.endorsement_valid == false)
  missing_or_unverified: 'NEEDS_REVIEW: the participating-community support letter is unverified.'
  evidence_anchor:
    evidence_unit_id: aaip:aaip_rural_eligibility:full_document_body
    source_id: aaip_rural_eligibility
    source_file: 3518e457dbd0de6beb5c1c1a450a4f98455ee241dc73ec0781ccf65107757867
    section: Community support letter
    verbatim_excerpt: Candidates must have a Community Support Letter from a participating rural Alberta community.
    source_sha256: fbd798a2080e82f885ef35a33882fe8b506427b5f0fd3fa4d77d4676f610eb97
    source_url: https://www.alberta.ca/aaip-rural-entrepreneur-stream-eligibility
- id: aaip_fge_agency_recommendation
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'foreign_graduate'
    fields:
    - candidate.endorsement_valid
  pass_if: candidate.stream != 'foreign_graduate' || (candidate.endorsement_valid == true)
  fail_if: candidate.stream == 'foreign_graduate' && (candidate.endorsement_valid == false)
  missing_or_unverified: 'NEEDS_REVIEW: the AAIP-approved agency recommendation is unverified.'
  evidence_anchor:
    evidence_unit_id: aaip:aaip_foreign_graduate_eligibility:full_document_body
    source_id: aaip_foreign_graduate_eligibility
    source_file: 25c24b20715a20ffb801a70e718f76b7ce69bf9abfdc5b26bcef1b8f391c53c8
    section: Letter of recommendation
    verbatim_excerpt: Must have a letter of recommendation from an AAIP-approved designated agency.
    source_sha256: 98244deaef9326b891362619e3951f845c1a588ba228fabd1c6119bc7e834ec0
    source_url: https://www.alberta.ca/aaip-foreign-graduate-entrepreneur-stream-eligibility
- id: aaip_farm_financial_resources
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  pass_if: candidate.stream != 'farm' || (candidate.net_worth_cad >= 500000 || candidate.accessible_funds_cad >= 500000)
  fail_if: candidate.stream == 'farm' && (candidate.net_worth_cad != null && candidate.accessible_funds_cad != null && candidate.net_worth_cad < 500000 && candidate.accessible_funds_cad < 500000)
  missing_or_unverified: 'NEEDS_REVIEW: neither documented net worth nor confirmed access to equivalent funds has been established; low net worth alone does not reject the official alternative.'
  evidence_anchor:
    evidence_unit_id: aaip:aaip_farm_eligibility:full_document_body
    source_id: aaip_farm_eligibility
    source_file: 3449accb86df0f21ec2adb553d062e023cf2983c2f1979e1c316d381db92842c
    section: Sufficient financial resources
    verbatim_excerpt: Documents must be provided that show a minimum net worth of CDN $500,000, or confirmation of the ability to access a similar amount of funds from other sources.
    source_sha256: 314558650c7db27ec6ccf9efe235454e36df78b934add5770f3e751633ce3a29
    source_url: https://www.alberta.ca/aaip-farm-stream-eligibility
- id: aaip_fge_settlement_funds
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'foreign_graduate'
    fields:
    - candidate.settlement_funds_cad
    - candidate.settlement_funds_required_cad
    - candidate.settlement_family_size
    - candidate.settlement_community_population
    - candidate.settlement_table_amount_verified
  pass_if: candidate.stream != 'foreign_graduate' || (candidate.settlement_family_size >= 1 && candidate.settlement_community_population >= 0 && candidate.settlement_table_amount_verified == true && candidate.settlement_funds_cad >= candidate.settlement_funds_required_cad)
  fail_if: candidate.stream == 'foreign_graduate' && candidate.settlement_table_amount_verified == true && (candidate.settlement_funds_cad < candidate.settlement_funds_required_cad)
  missing_or_unverified: 'NEEDS_REVIEW: family size, community population, or the official table amount has not been verified.'
  evidence_anchor:
    evidence_unit_id: aaip:aaip_foreign_graduate_eligibility:full_document_body
    source_id: aaip_foreign_graduate_eligibility
    source_file: 25c24b20715a20ffb801a70e718f76b7ce69bf9abfdc5b26bcef1b8f391c53c8
    section: Settlement funds
    verbatim_excerpt: Minimum settlement funds requirements will be based on the <a href="https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1110024101&amp;pickMembers%5B0%5D=2.1&amp;cubeTimeFrame.startYear=2018&amp;cubeTimeFrame.endYear=2018&amp;referencePeriods=20180101%2C20180101" target="_blank">Low Income Cut-Offs (LICOs)</a>.
    source_sha256: 98244deaef9326b891362619e3951f845c1a588ba228fabd1c6119bc7e834ec0
    source_url: https://www.alberta.ca/aaip-foreign-graduate-entrepreneur-stream-eligibility
- id: aaip_farm_equity_investment
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'farm'
    fields:
    - candidate.primary_production_equity_investment_cad
  pass_if: candidate.stream != 'farm' || (candidate.primary_production_equity_investment_cad >= 500000)
  fail_if: candidate.stream == 'farm' && (candidate.primary_production_equity_investment_cad < 500000)
  missing_or_unverified: 'NEEDS_REVIEW: the amount of equity invested in primary-production farming is unverified; a generic business investment is not equivalent.'
  evidence_anchor:
    evidence_unit_id: aaip:aaip_farm_eligibility:full_document_body
    source_id: aaip_farm_eligibility
    source_file: 3449accb86df0f21ec2adb553d062e023cf2983c2f1979e1c316d381db92842c
    section: Primary-production equity investment
    verbatim_excerpt: Candidates must be able to invest a minimum of CDN $500,000 of equity in a primary production farming business in Alberta.
    source_sha256: 314558650c7db27ec6ccf9efe235454e36df78b934add5770f3e751633ce3a29
    source_url: https://www.alberta.ca/aaip-farm-stream-eligibility
- id: aaip_farm_management_and_plan
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'farm'
    fields:
    - candidate.farm_management_skills_verified
    - candidate.farm_business_plan_submitted
  pass_if: candidate.stream != 'farm' || (candidate.farm_management_skills_verified == true && candidate.farm_business_plan_submitted == true)
  fail_if: candidate.stream == 'farm' && (candidate.farm_management_skills_verified == false || candidate.farm_business_plan_submitted == false)
  missing_or_unverified: 'NEEDS_REVIEW: farm-management evidence or the required farming business plan is missing; no generic endorsement letter is required by this source.'
  evidence_anchor:
    evidence_unit_id: aaip:aaip_farm_eligibility:full_document_body
    source_id: aaip_farm_eligibility
    source_file: 3449accb86df0f21ec2adb553d062e023cf2983c2f1979e1c316d381db92842c
    section: Farm management skills and proposed business plan
    verbatim_excerpt: Candidates must prove that they have farm management skills.
    source_sha256: 314558650c7db27ec6ccf9efe235454e36df78b934add5770f3e751633ce3a29
    source_url: https://www.alberta.ca/aaip-farm-stream-eligibility
- id: aaip_fge_investment
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'foreign_graduate'
    fields:
    - candidate.fges_urban
    - candidate.investment_cad
  pass_if: candidate.stream != 'foreign_graduate' || ((candidate.fges_urban == true && candidate.investment_cad >= 100000) || (candidate.fges_urban == false && candidate.investment_cad >= 50000))
  fail_if: candidate.stream == 'foreign_graduate' && ((candidate.fges_urban == true && candidate.investment_cad < 100000) || (candidate.fges_urban == false && candidate.investment_cad < 50000))
  missing_or_unverified: 'NEEDS_REVIEW: the verified CMA-based urban/regional location or qualifying investment amount is missing.'
  evidence_anchor:
    evidence_unit_id: aaip:aaip_foreign_graduate_eligibility:full_document_body
    source_id: aaip_foreign_graduate_eligibility
    source_file: 25c24b20715a20ffb801a70e718f76b7ce69bf9abfdc5b26bcef1b8f391c53c8
    section: Business investment
    verbatim_excerpt: The mandatory minimum investment for an urban centre is $100,000 while the mandatory minimum investment for a regional area is $50,000.
    source_sha256: 98244deaef9326b891362619e3951f845c1a588ba228fabd1c6119bc7e834ec0
    source_url: https://www.alberta.ca/aaip-foreign-graduate-entrepreneur-stream-eligibility
- id: aaip_graduate_ownership
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'graduate'
    fields:
    - candidate.equity_ratio
  pass_if: candidate.stream != 'graduate' || (candidate.equity_ratio >= 0.34 && (candidate.equity_ratio >= 1 || candidate.partners_canadian_or_pr == true))
  fail_if: candidate.stream == 'graduate' && (candidate.equity_ratio < 0.34 || (candidate.equity_ratio < 1 && candidate.partners_canadian_or_pr == false))
  missing_or_unverified: 'NEEDS_REVIEW: ownership or the status of co-owners is unverified.'
  evidence_anchor:
    evidence_unit_id: aaip:aaip_graduate_eligibility:full_document_body
    source_id: aaip_graduate_eligibility
    source_file: 2cd033a02d2ab12d9174ed293dee44cdb103c27eb9a7f45ef9e6423af6e69ae1
    section: Business establishment and Canadian/PR partners
    verbatim_excerpt: Must establish a new business or buy an existing business in Alberta with a minimum 34% ownership.
    source_sha256: f5ba3f85f994b4723480e79f1352b98d748c2ee1bc4ec84995d0fdc4f1a5b835
    source_url: https://www.alberta.ca/aaip-graduate-entrepreneur-stream-eligibility
- id: aaip_fge_ownership
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'foreign_graduate'
    fields:
    - candidate.fges_urban
    - candidate.equity_ratio
  pass_if: candidate.stream != 'foreign_graduate' || (((candidate.fges_urban == true && candidate.equity_ratio >= 0.34) || (candidate.fges_urban == false && candidate.equity_ratio >= 0.51)) && (candidate.equity_ratio >= 1 || candidate.partners_canadian_or_pr == true))
  fail_if: candidate.stream == 'foreign_graduate' && ((candidate.fges_urban == true && candidate.equity_ratio < 0.34) || (candidate.fges_urban == false && candidate.equity_ratio < 0.51) || (candidate.equity_ratio < 1 && candidate.partners_canadian_or_pr == false))
  missing_or_unverified: 'NEEDS_REVIEW: CMA-based location, ownership or co-owner status is unverified; no farm ownership-percentage floor is inferred.'
  evidence_anchor:
    evidence_unit_id: aaip:aaip_foreign_graduate_eligibility:full_document_body
    source_id: aaip_foreign_graduate_eligibility
    source_file: 25c24b20715a20ffb801a70e718f76b7ce69bf9abfdc5b26bcef1b8f391c53c8
    section: Business establishment and Canadian/PR partners
    verbatim_excerpt: Must have a minimum of 34% ownership if the business is located in an urban centre or a minimum of 51% ownership if located in regional area outside <a href="https://www23.statcan.gc.ca/imdb/p3VD.pl?Function=getVD&amp;TVD=1348193&amp;CVD=1348199&amp;CPV=825&amp;CST=01012021&amp;CLV=2&amp;MLV=3" target="_blank">Calgary</a> and <a href="https://www23.statcan.gc.ca/imdb/p3VD.pl?Function=getVD&amp;TVD=1348193&amp;CVD=1348199&amp;CPV=835&amp;CST=01012021&amp;CLV=2&amp;MLV=3" target="_blank">Edmonton</a> Census Metropolitan Areas.
    source_sha256: 98244deaef9326b891362619e3951f845c1a588ba228fabd1c6119bc7e834ec0
    source_url: https://www.alberta.ca/aaip-foreign-graduate-entrepreneur-stream-eligibility
- id: aaip_ent_language_rural
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'rural'
    fields:
    - candidate.language_clb_minimum
    - candidate.language_result_within_2_years
    - candidate.language_test_accepted
  pass_if: candidate.stream != 'rural' || (candidate.language_clb_minimum >= 4 && candidate.language_result_within_2_years == true && candidate.language_test_accepted == true)
  fail_if: candidate.stream == 'rural' && (candidate.language_clb_minimum < 4 || candidate.language_result_within_2_years == false || candidate.language_test_accepted == false)
  missing_or_unverified: 'NEEDS_REVIEW: the minimum of all four verified abilities, an accepted official test, or the under-two-year validity at EOI submission is unverified.'
  evidence_anchor:
    evidence_unit_id: aaip:aaip_rural_eligibility:full_document_body
    source_id: aaip_rural_eligibility
    source_file: 3518e457dbd0de6beb5c1c1a450a4f98455ee241dc73ec0781ccf65107757867
    section: Language requirements at EOI submission
    verbatim_excerpt: Have a minimum Canadian Language Benchmark (CLB) level of 4 for each English language skill
    source_sha256: fbd798a2080e82f885ef35a33882fe8b506427b5f0fd3fa4d77d4676f610eb97
    source_url: https://www.alberta.ca/aaip-rural-entrepreneur-stream-eligibility
- id: aaip_ent_language_graduate
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'graduate'
    fields:
    - candidate.language_clb_minimum
    - candidate.language_result_within_2_years
    - candidate.language_test_accepted
  pass_if: candidate.stream != 'graduate' || (candidate.language_clb_minimum >= 7 && candidate.language_result_within_2_years == true && candidate.language_test_accepted == true)
  fail_if: candidate.stream == 'graduate' && (candidate.language_clb_minimum < 7 || candidate.language_result_within_2_years == false || candidate.language_test_accepted == false)
  missing_or_unverified: 'NEEDS_REVIEW: the minimum of all four verified abilities, an accepted official test, or the under-two-year validity at EOI submission is unverified.'
  evidence_anchor:
    evidence_unit_id: aaip:aaip_graduate_eligibility:full_document_body
    source_id: aaip_graduate_eligibility
