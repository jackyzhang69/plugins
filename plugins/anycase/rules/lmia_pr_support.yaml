schema_version: "1.0.0"
catalog_id: "lmia_pr_support"
jurisdiction: "FED"
category: "Temporary Foreign Worker Program"
display_name: "TFWP LMIA: Permanent Residence Support"
status: "ACTIVE"
program_id: "TFWP_LMIA"
stream_id: "PR_SUPPORT"
effective_date: "2026-11-10"
source_edition: "ESDC Hire a skilled worker to support their permanent residency (overview 2026-06-09; wages and working conditions 2026-11-10), business legitimacy 2026-10-05 and refusal to process 2026-10-27, fetched 2026-11-16"
source_url: "https://www.canada.ca/en/employment-social-development/services/foreign-workers/permanent.html"
decision_scope: "Pre-screen of the six rules defined below; PASS confirms the employer and job offer meet those published PR-support conditions, not that ESDC will issue a positive LMIA."
sources:
  - id: lmia_pr_overview
    title: "Hire a skilled worker to support their permanent residency: Overview"
    url: "https://www.canada.ca/en/employment-social-development/services/foreign-workers/permanent.html"
    citation: "ESDC page dated 2026-06-09; validated unpublished K candidate 129776b720f208e234dc7a9298dcd0054898e56cc20ddf55822f6bc500e7c409"
    legal_authority: "Official ESDC guidance for eligible occupations, hours, duration, seasonality and excluded employers."
  - id: lmia_pr_wages
    title: "Hire a skilled worker to support their permanent residency: Wages, working conditions and occupations"
    url: "https://www.canada.ca/en/employment-social-development/services/foreign-workers/permanent/working-conditions.html"
    citation: "ESDC page dated 2026-11-10 (changed after the 2026-09-30 VKS capture); same validated unpublished K candidate"
    legal_authority: "Official ESDC guidance for the prevailing-wage minimum."
  - id: lmia_business_legitimacy
    title: "Business legitimacy"
    url: "https://www.canada.ca/en/employment-social-development/services/foreign-workers/business-legitimacy.html"
    citation: "ESDC page dated 2026-10-05; same validated unpublished K candidate"
    legal_authority: "Official ESDC guidance: job offers must be genuine and legitimate."
  - id: lmia_refusal
    title: "Refusal to process a Labour Market Impact Assessment application"
    url: "https://www.canada.ca/en/employment-social-development/services/foreign-workers/refusal.html"
    citation: "ESDC page dated 2026-10-27 (changed after the 2026-10-04 VKS capture); same validated unpublished K candidate"
    legal_authority: "Official ESDC regulatory authority to refuse processing for ineligible employers."

reference_points_grid:
  note: "The PR-support stream has no selection points grid: it is a regulatory pre-screen of the six rules below (ESDC PR-support pages, current to 2026-11-10). Scoring belongs to the Express Entry program the job offer supports, not to the LMIA."
  source_url: "https://www.canada.ca/en/employment-social-development/services/foreign-workers/permanent.html"

schema:
  input_type: object
  required_top_level: [assessment_date, employer, job_offer, noul]
  types:
    assessment_date: "ISO-8601 date; LMIA submission date"
    employer:
      business_name: string
      cra_business_number: string
      is_sex_industry: boolean
      on_ircc_ineligibility_list: boolean
      in_default_of_amp: boolean
      lmia_revocation_past_2_years: boolean
      supports_pr_only: boolean
      is_diplomatic_mission: boolean
      in_business_at_least_one_year: boolean
    job_offer:
      province: "two-letter code in [AB, BC, MB, NB, NL, NT, NS, NU, ON, PE, QC, SK, YT]"
      noc_2021_code: "five-digit string"
      noc_teer: "integer 0-5"
      title: string
      indeterminate: boolean
      year_round: boolean
      weekly_regular_hours: "non-negative decimal"
      duration_months: "non-negative number; months of employment offered (required when indeterminate is false)"
      regular_hourly_wage_cad: "non-negative decimal"
      prevailing_wage_cad: "non-negative decimal"
      recruitment:
        advertising_duration_days: "non-negative integer"
        consecutive_weeks: "non-negative integer"
        job_bank_used: boolean
        additional_methods_count: "non-negative integer"
        targets_underrepresented_groups: boolean
        conducted_within_3_months: boolean
        recruitment_exempt: boolean
    noul:
      proposition_id: "is_genuine_and_legitimate_job_offer"
      probability_true: "decimal in [0,1] or null"
      evidence_complete: boolean
      evidence_refs: "non-empty array of stable evidence identifiers when evidence_complete is true"
      model_version: "non-empty string"

  validation:
    missing_or_null_required_value: "NEEDS_REVIEW with MISSING_MATERIAL and the missing field path"
    invalid_type_or_out_of_range: "NEEDS_REVIEW with INVALID_INPUT and the field path"
    inconsistent_verified_inputs: "NEEDS_REVIEW with CONFLICTING_EVIDENCE"
    unknown_evidence_status: "NEEDS_REVIEW with UNVERIFIED_EVIDENCE"
    no_short_circuit: true

evaluation:
  rule_statuses: [PASS, FAIL, NEEDS_REVIEW]
  aggregate:
    - "If any CRITICAL_REDLINE rule is FAIL, verdict = FAIL."
    - "Otherwise, if any rule is NEEDS_REVIEW, verdict = NEEDS_REVIEW."
    - "Otherwise, verdict = PASS."
  date_semantics:
    application_date: "assessment_date"

rules:
  - id: lmia_employer_ineligibility
    category: employer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - employer.is_sex_industry
      - employer.on_ircc_ineligibility_list
      - employer.in_default_of_amp
      - employer.lmia_revocation_past_2_years
    pass_if: "employer.is_sex_industry == false && employer.on_ircc_ineligibility_list == false && employer.in_default_of_amp == false && employer.lmia_revocation_past_2_years == false"
    fail_if: "employer.is_sex_industry == true || employer.on_ircc_ineligibility_list == true || employer.in_default_of_amp == true || employer.lmia_revocation_past_2_years == true"
    missing_or_unverified: "NEEDS_REVIEW: Employer compliance status cannot be established."
    interpretation: "ESDC cannot process LMIA applications from employers who regularly offer services in the sex industry, are in default of payment of an administrative monetary penalty, or had an LMIA revoked in the past 2 years; the PR-support page also excludes employers on the IRCC ineligible-employer list."
    evidence_anchor:
      evidence_unit_id: "lmia_pr_support_eligibility:lmia_refusal_to_process_2026_10_27:refusal.regulatory_authority"
      source_file: "3550177555438b1ed9f0755d3ba36cc0155665498288d68f78b88ebfd4946554"
      section: "Regulatory authority"
      source_id: lmia_refusal
      verbatim_excerpt: "We do not have the authority to process applications from ineligible employers for the Temporary Foreign Worker Program who:"
  - id: lmia_pr_employer_program_exclusions
    category: employer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - employer.is_diplomatic_mission
      - employer.in_business_at_least_one_year
      - job_offer.province
    pass_if: "employer.is_diplomatic_mission == false && employer.in_business_at_least_one_year == true && job_offer.province != 'QC'"
    fail_if: "employer.is_diplomatic_mission == true || employer.in_business_at_least_one_year == false || job_offer.province == 'QC'"
    missing_or_unverified: "NEEDS_REVIEW: Employer type, time in business, or the province where the worker will reside cannot be established."
    interpretation: "Employers cannot make a job offer under the Express Entry programs if they are an embassy, high commission or consulate in Canada, are new and have not been in business for a minimum of 1 year, or hire workers who intend to reside in Quebec. The Quebec test uses job_offer.province (the province where the worker will work and reside)."
    evidence_anchor:
      evidence_unit_id: "lmia_pr_support_eligibility:lmia_pr_support_overview_2026_06_09:pr_support.overview"
      source_file: "ba410b2485976fe7da430c045d159a7d1a1258047c0a41a2742e562fdaff7efd"
      section: "1. Overview"
      source_id: lmia_pr_overview
      verbatim_excerpt: "an embassy,</li>\r\n    <li>a high commission or consulate  in Canada</li>\r\n    <li>on the list of ineligible  employers maintained by <abbr>IRCC</abbr></li>\r\n    <li>new and have not been in  business for a minimum of 1 year, or</li>\r\n    <li>hiring workers who intend to reside in the province of Quebec"
  - id: lmia_pr_fulltime_one_year_offer
    category: job_offer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - job_offer.weekly_regular_hours
      - job_offer.year_round
      - job_offer.indeterminate
    conditional_required_fields:
      when: "job_offer.indeterminate == false"
      fields:
        - job_offer.duration_months
    pass_if: "job_offer.weekly_regular_hours >= 30.0 && job_offer.year_round == true && (job_offer.indeterminate == true || job_offer.duration_months >= 12)"
    fail_if: "job_offer.weekly_regular_hours < 30.0 || job_offer.year_round == false || (job_offer.indeterminate == false && job_offer.duration_months < 12)"
    missing_or_unverified: "NEEDS_REVIEW: Weekly hours, seasonality, or offered duration cannot be established."
    interpretation: "IRCC/ESDC (FSWP and CEC; FSTP likewise for full-time and 1 year): the offered job must be full-time (a minimum of 30 hours of work per week), for at least 1 year, and a non-seasonal position. An indeterminate (permanent) offer satisfies the 1-year duration; a fixed-term offer needs duration_months of at least 12."
    evidence_anchor:
      evidence_unit_id: "lmia_pr_support_eligibility:lmia_pr_support_overview_2026_06_09:pr_support.overview"
      source_file: "ba410b2485976fe7da430c045d159a7d1a1258047c0a41a2742e562fdaff7efd"
      section: "1. Overview"
      source_id: lmia_pr_overview
      verbatim_excerpt: "full-time hours (a minimum of 30 hours of work per week)</li>\r\n    <li>at least 1 year, and</li>\r\n    <li>a non-seasonal position"

  - id: lmia_pr_skilled_teer
    category: job_offer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - job_offer.noc_teer
    pass_if: "job_offer.noc_teer in [0, 1, 2, 3]"
    fail_if: "!(job_offer.noc_teer in [0, 1, 2, 3])"
    missing_or_unverified: "NEEDS_REVIEW: NOC TEER classification is missing."
    interpretation: "Express Entry PR support requires NOC 2021 TEER 0, 1, 2 or 3 positions (FSWP and CEC); under the FSTP the offer must be an eligible skilled trade or technical occupation in TEER 2 or 3. This rule is the union test: TEER 4 and 5 never qualify; whether a TEER 0 or 1 offer fits the FSTP is decided by the program the offer supports."
    evidence_anchor:
      evidence_unit_id: "lmia_pr_support_eligibility:lmia_pr_support_overview_2026_06_09:pr_support.overview"
      source_file: "ba410b2485976fe7da430c045d159a7d1a1258047c0a41a2742e562fdaff7efd"
      section: "1. Overview"
      source_id: lmia_pr_overview
      verbatim_excerpt: "positions in TEER 0/1/2/3 (Training, Education, Experience and Responsibilities) of the NOC, such as management, professional, scientific, technical or trade occupations"

  - id: lmia_prevailing_wage
    category: compensation
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - job_offer.regular_hourly_wage_cad
      - job_offer.prevailing_wage_cad
    pass_if: "job_offer.regular_hourly_wage_cad >= job_offer.prevailing_wage_cad"
    fail_if: "job_offer.regular_hourly_wage_cad < job_offer.prevailing_wage_cad"
    missing_or_unverified: "NEEDS_REVIEW: Prevailing wage on Job Bank or offered base wage is missing."
    interpretation: "Employers must pay at a minimum the posted prevailing wage for the occupation and work location, or the wage range paid to current employees in the same occupation and location if that rate is higher; prevailing_wage_cad carries that higher applicable rate."
    evidence_anchor:
      evidence_unit_id: "lmia_pr_support_eligibility:lmia_pr_support_wages_2026_11_10:wages.prevailing_wage_rule"
      source_file: "4b9d95f33c77f44dccf7be480d603dfc51afd438bd6f7bf918680d6650a92ffe"
      section: "3. Wages, working conditions and occupations"
      source_id: lmia_pr_wages
      verbatim_excerpt: "at a minimum, the posted prevailing wage for the occupation and work location where the foreign worker will be employed"

  - id: lmia_genuine_job_offer
    category: qualitative
    severity: QUALITATIVE_STANDARD
    eval_type: typesafe_jev
    required_fields:
      - noul.proposition_id
      - noul.probability_true
      - noul.evidence_complete
    precondition: "noul.evidence_complete == true && noul.proposition_id == 'is_genuine_and_legitimate_job_offer'"
    pass_if: "noul.probability_true >= 0.70"
    fail_if: "noul.probability_true < 0.30"
    missing_or_unverified: "NEEDS_REVIEW: Qualitative evidence is incomplete or probability is borderline."
    interpretation: "ESDC assesses every LMIA job offer to ensure that both the business and the job offer are genuine and legitimate (four factors; all must be met). The probability is a project qualitative estimate of that finding, not an ESDC decision."
    evidence_anchor:
      evidence_unit_id: "lmia_pr_support_eligibility:lmia_business_legitimacy_2026_10_05:legitimacy.assessment_factors"
      source_file: "4195b92e8228fa4e7ca6add0d28fac3fe9c04749f4cca2f4d217c5ce8450342e"
      section: "What’s a business legitimacy assessment"
      source_id: lmia_business_legitimacy
      verbatim_excerpt: "all job offers made by employers must be assessed to ensure that both the business and the job offer are genuine and legitimate."
