schema_version: "1.0.0"
program_id: "TFWP_LMIA"
stream_id: "PR_SUPPORT"
effective_date: "2026-07-17"
source_edition: "ESDC Temporary Foreign Worker Program Requirements for Permanent Residence Support, July 2026 update"
source_url: "https://www.canada.ca/en/employment-social-development/services/foreign-workers/permanent/requirements.html"
decision_scope: "Pre-screen of the five regulatory rules defined below; PASS confirms eligibility to support an Express Entry / Permanent Residence application."

schema:
  input_type: object
  required_top_level: [assessment_date, employer, job_offer, noul]
  types:
    assessment_date: "ISO-8601 date; LMIA submission date"
    employer:
      business_name: string
      cra_business_number: string
      is_sex_industry: boolean
      on_ircc_ineligibility_list: boolean
      in_default_of_amp: boolean
      lmia_revocation_past_2_years: boolean
      supports_pr_only: boolean
    job_offer:
      province: "two-letter code in [AB, BC, MB, NB, NL, NT, NS, NU, ON, PE, QC, SK, YT]"
      noc_2021_code: "five-digit string"
      noc_teer: "integer 0-5"
      title: string
      indeterminate: boolean
      year_round: boolean
      weekly_regular_hours: "non-negative decimal"
      regular_hourly_wage_cad: "non-negative decimal"
      prevailing_wage_cad: "non-negative decimal"
      recruitment:
        advertising_duration_days: "non-negative integer"
        consecutive_weeks: "non-negative integer"
        job_bank_used: boolean
        additional_methods_count: "non-negative integer"
        targets_underrepresented_groups: boolean
        conducted_within_3_months: boolean
        recruitment_exempt: boolean
    noul:
      proposition_id: "is_genuine_labour_shortage"
      probability_true: "decimal in [0,1] or null"
      evidence_complete: boolean
      evidence_refs: "non-empty array of stable evidence identifiers when evidence_complete is true"
      model_version: "non-empty string"

  validation:
    missing_or_null_required_value: "NEEDS_REVIEW with MISSING_MATERIAL and the missing field path"
    invalid_type_or_out_of_range: "NEEDS_REVIEW with INVALID_INPUT and the field path"
    inconsistent_verified_inputs: "NEEDS_REVIEW with CONFLICTING_EVIDENCE"
    unknown_evidence_status: "NEEDS_REVIEW with UNVERIFIED_EVIDENCE"
    no_short_circuit: true

evaluation:
  rule_statuses: [PASS, FAIL, NEEDS_REVIEW]
  aggregate:
    - "If any CRITICAL_REDLINE rule is FAIL, verdict = FAIL."
    - "Otherwise, if any rule is NEEDS_REVIEW, verdict = NEEDS_REVIEW."
    - "Otherwise, verdict = PASS."
  date_semantics:
    application_date: "assessment_date"

rules:
  - id: lmia_employer_ineligibility
    category: employer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - employer.is_sex_industry
      - employer.on_ircc_ineligibility_list
      - employer.in_default_of_amp
      - employer.lmia_revocation_past_2_years
    pass_if: "employer.is_sex_industry == false && employer.on_ircc_ineligibility_list == false && employer.in_default_of_amp == false && employer.lmia_revocation_past_2_years == false"
    fail_if: "employer.is_sex_industry == true || employer.on_ircc_ineligibility_list == true || employer.in_default_of_amp == true || employer.lmia_revocation_past_2_years == true"
    missing_or_unverified: "NEEDS_REVIEW: Employer compliance status cannot be established."
    interpretation: "Service Canada has no legal authority to process LMIA applications from ineligible employers."
    evidence_anchor:
      evidence_unit_id: "EU-LMIA-008"
      source_file: "refusal_to_process.html"
      section: "Regulatory authority and ineligibility"
      verbatim_excerpt: "We do not have the authority to process applications from ineligible employers"

  - id: lmia_pr_permanent_indeterminate_offer
    category: job_offer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - job_offer.indeterminate
      - job_offer.year_round
      - job_offer.weekly_regular_hours
    pass_if: "job_offer.indeterminate == true && job_offer.year_round == true && job_offer.weekly_regular_hours >= 30.0"
    fail_if: "job_offer.indeterminate == false || job_offer.year_round == false || job_offer.weekly_regular_hours < 30.0"
    missing_or_unverified: "NEEDS_REVIEW: Offer term, weekly hours, or permanence evidence is missing."
    interpretation: "To support a permanent residence application under Express Entry, the job offer must be permanent, indeterminate, year-round, and full-time (at least 30 regular hours per week). Temporary or contract positions are ineligible."
    evidence_anchor:
      evidence_unit_id: "EU-LMIA-005"
      source_file: "permanent_residence_requirements.html"
      section: "Job offer requirements"
      verbatim_excerpt: "The job offer must be permanent, non-seasonal and full-time (at least 30 hours per week)"

  - id: lmia_pr_skilled_teer
    category: job_offer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - job_offer.noc_teer
    pass_if: "job_offer.noc_teer in [0, 1, 2, 3]"
    fail_if: "!(job_offer.noc_teer in [0, 1, 2, 3])"
    missing_or_unverified: "NEEDS_REVIEW: NOC TEER classification is missing."
    interpretation: "Permanent residency support LMIAs under Express Entry (FSW, CEC, FST) require positions classified under NOC 2021 TEER 0, 1, 2, or 3. TEER 4 and 5 occupations do not qualify for Express Entry PR support."
    evidence_anchor:
      evidence_unit_id: "EU-LMIA-005"
      source_file: "permanent_residence_requirements.html"
      section: "Occupations"
      verbatim_excerpt: "The position must be in a skilled trade or professional occupation (NOC TEER 0, 1, 2, or 3)"

  - id: lmia_prevailing_wage
    category: compensation
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - job_offer.regular_hourly_wage_cad
      - job_offer.prevailing_wage_cad
    pass_if: "job_offer.regular_hourly_wage_cad >= job_offer.prevailing_wage_cad"
    fail_if: "job_offer.regular_hourly_wage_cad < job_offer.prevailing_wage_cad"
    missing_or_unverified: "NEEDS_REVIEW: Prevailing wage on Job Bank or offered base wage is missing."
    interpretation: "The offered hourly wage must equal or exceed the prevailing wage for the occupation in the sub-region."
    evidence_anchor:
      evidence_unit_id: "EU-LMIA-001"
      source_file: "permanent_residence_requirements.html"
      section: "Wages and benefits"
      verbatim_excerpt: "Employers must pay the prevailing wage rate for the occupation"

  - id: lmia_genuine_labour_shortage
    category: qualitative
    severity: QUALITATIVE_STANDARD
    eval_type: typesafe_jev
    required_fields:
      - noul.proposition_id
      - noul.probability_true
      - noul.evidence_complete
    precondition: "noul.evidence_complete == true && noul.proposition_id == 'is_genuine_labour_shortage'"
    pass_if: "noul.probability_true >= 0.70"
    fail_if: "noul.probability_true < 0.30"
    missing_or_unverified: "NEEDS_REVIEW: Qualitative evidence is incomplete or probability is borderline."
    interpretation: "Service Canada officers must be satisfied that the job offer is genuine and the position has a real commercial rationale."
    evidence_anchor:
      evidence_unit_id: "EU-LMIA-005"
      source_file: "permanent_residence_requirements.html"
      section: "Assessment criteria"
      verbatim_excerpt: "Service Canada will assess whether the job offer is genuine"
