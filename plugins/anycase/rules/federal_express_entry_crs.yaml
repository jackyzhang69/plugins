schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  types:
    assessment_date: ISO-8601 date
    candidate:
      intended_province: lowercase Canadian province or territory name
      program_eligibility:
        fswp: boolean; independently checked using full FSWP rules
        cec: boolean; independently checked under IRPR R87.1
        fstp: boolean; independently checked under IRPR R87.2
      language_test:
        test_name: CELPIP-General, IELTS-General-Training, PTE-Core, TEF-Canada or TCF-Canada; the test
          actually taken, which fixes the official language of the slot; any other name, or a name contradicted
          by approved_designated_test, is not scored
        approved_designated_test: boolean
        valid_within_two_years: boolean
        test_date: original ISO-8601 date of the principal's language test; checked against assessment_date
        listening_clb: integer
        reading_clb: integer
        writing_clb: integer
        speaking_clb: integer
      second_language_test:
        present: boolean; false if no second official language test
        test_name: CELPIP-General, IELTS-General-Training, PTE-Core, TEF-Canada or TCF-Canada; must be
          in the other official language than language_test.test_name, because points are assigned for
          the second official language only
        approved_designated_test: boolean; required when present
        valid_within_two_years: boolean; required when present
        test_date: original ISO-8601 date of the second-language test; required when present
        listening_clb: integer; required when present
        reading_clb: integer; required when present
        writing_clb: integer; required when present
        speaking_clb: integer; required when present
      category_request: none | french | stem | healthcare | trade | transport | education | physicians_canadian_experience
        | senior_managers_canadian_experience | researchers_canadian_experience | skilled_military_recruits
      category_round_requirements_met: boolean; independently reviewed against all instructions for the
        particular category-based invitation round, not merely the general category description
      french_test:
        approved_designated_test: boolean
        valid_within_two_years: boolean
        listening_nclc: integer or null
        reading_nclc: integer or null
        writing_nclc: integer or null
        speaking_nclc: integer or null
      category_occupation:
        noc_code: valid five-digit NOC 2021 unit group code string; required for occupational categories
          (researchers_canadian_experience accepts NOC 41200 only from 2026-11-17; NOC 41201 is excluded;
          NOC 41200 work experience and job offers paid by a Canadian entity via stipends, grants, bursaries,
          or scholarships qualify)
        current_listed_noc_verified: boolean or null
        qualifying_months_last_3_years: number or null
        single_listed_occupation: boolean or null
        experience_in_canada: boolean; required for physician, senior manager and researcher categories
      military_recruit:
        currently_serving_recognized_foreign_military: boolean
        recognized_foreign_military_service_years: completed continuous years
        duties_aligned_noc_code: NOC 40042, 42102 or 43204
        canadian_forces_offer_noc_code: NOC 40042, 42102 or 43204
        canadian_forces_offer_full_time_years: offered continuous years
        offer_from_forces_recruiting_group: boolean
        postsecondary_credential_years: completed credential duration
        foreign_credential_eca_verified: boolean; required for foreign credentials
        credential_canadian: boolean
      age: age at application
      education_level: supported scoring_grid core education level
      education_credential_source: canadian | eca | none; basis for principal education points, not the
        diploma label
      eca_designated_organization: boolean; required for an eca basis
      eca_assessment_date: original ISO-8601 principal ECA issue date; checked independently over five
        calendar years
      spouse_education_level: supported scoring_grid spouse education level
      spouse_education_credential_source: canadian | eca | none; accompanying spouse's own credential
        basis
      spouse_eca_designated_organization: boolean; required for the spouse's eca basis
      spouse_eca_assessment_date: original ISO-8601 spouse ECA issue date; never inferred from the principal's
      spouse_language_test:
        present: boolean; whether the accompanying spouse's test results are supplied; supplied results
          are scored whatever points are declared, and only a slot that supplies nothing at all scores
          zero spouse language points
        test_name: CELPIP-General, IELTS-General-Training, PTE-Core, TEF-Canada or TCF-Canada; the test
          actually taken, which fixes the spouse's own first official language
        approved_designated_test: boolean; required when the spouse's results are supplied
        valid_within_two_years: boolean; required when the spouse's results are supplied
        test_date: original ISO-8601 spouse language-test date; required when the spouse's results are
          supplied
        listening_clb: integer; required when the spouse's results are supplied
        reading_clb: integer; required when the spouse's results are supplied
        writing_clb: integer; required when the spouse's results are supplied
        speaking_clb: integer; required when the spouse's results are supplied
      canadian_work_years: completed qualifying years
      canadian_high_wage_experience_band: none | verified_2x | verified_1_5x | verified_1_3x | unknown;
        highest band of at least one year of Canadian work experience in high-wage occupations (MI s.
        15.1(8)) read from the official high-wage list in force at invitation, never from personal salary;
        'none' only after verifying that no qualifying year exists, anything else unverified is 'unknown'
        and is never scored
      qualifying_offer_high_wage_band: none | verified_2x | verified_1_5x | verified_1_3x | unknown; occupation
        level of a qualifying offer of employment under MI s. 15.2 (officer-determined genuine, full-time
        30 hours, at least one year from PR visa issuance, listed employer and TEER rules), 'none' only
        after verifying that no qualifying offer exists; an LMIA neither creates nor increases these points
      foreign_work_years: completed qualifying years
      accompanying_spouse: boolean
      valid_trades_certificate: boolean
      valid_provincial_nomination: boolean
      canadian_education_bonus: none | one_or_two_year | three_plus_or_graduate | unknown; verified qualifying
        Canadian post-secondary credential under the pinned Ministerial Instructions, not merely Canadian
        attendance
      has_eligible_sibling_in_canada: boolean; verified eligible adult Canadian-citizen or permanent-resident
        sibling living in Canada under the pinned Ministerial Instructions
    crs_breakdown: claimed component points, including all core (with core.labour_market_integration),
      spouse, transfer and additional factors (provincial_nomination, canadian_education, french_language,
      sibling)
    scoring_inputs: claimed core, spouse, transfer and additional subtotals
    claimed_crs_score: claimed total CRS points
pool_gates:
- crs_gate_pool_eligibility
- crs_gate_language_test
- crs_gate_intended_residence
- crs_gate_score_claim
pool_gate_note: Provincial nomination adds CRS points but does not replace eligibility for one of FSWP,
  CEC or FSTP.
category_filters:
  scope: A requested category filters a particular invitation round; it is not a general pool gate.
  active_2026:
  - french
  - healthcare
  - stem
  - trade
  - education
  - transport
  - physicians_canadian_experience
  - senior_managers_canadian_experience
  - researchers_canadian_experience
  - skilled_military_recruits
  french:
    minimum_nclc_each_ability: 7
    source_id: ircc_category_based_selection
  stem:
    listed_noc_required: true
    qualifying_months_last_3_years: 12
    same_occupation_required: true
    source_id: ircc_category_based_selection
  healthcare:
    listed_noc_required: true
    qualifying_months_last_3_years: 12
    same_occupation_required: true
    source_id: ircc_category_based_selection
  trade:
    listed_noc_required: true
    qualifying_months_last_3_years: 12
    same_occupation_required: true
    source_id: ircc_category_based_selection
  transport:
    listed_noc_required: true
    qualifying_months_last_3_years: 12
    same_occupation_required: true
    source_id: ircc_category_based_selection
  education:
    listed_noc_required: true
    qualifying_months_last_3_years: 12
    same_occupation_required: true
    source_id: ircc_category_based_selection
  physicians_canadian_experience:
    listed_noc_codes:
    - '31100'
    - '31101'
    - '31102'
    qualifying_months_last_3_years: 12
    canadian_experience_required: true
    source_id: ircc_category_based_selection
  senior_managers_canadian_experience:
    listed_noc_codes:
    - '00012'
    - '00013'
    - '00014'
    - '00015'
    qualifying_months_last_3_years: 12
    canadian_experience_required: true
    source_id: ircc_category_based_selection
  researchers_canadian_experience:
    listed_noc_codes:
    - '41200'
    qualifying_months_last_3_years: 12
    canadian_experience_required: true
    source_id: ircc_category_based_selection
  skilled_military_recruits:
    listed_noc_codes:
    - '40042'
    - '42102'
    - '43204'
    continuous_foreign_service_years: 10
    canadian_forces_offer_years: 3
    postsecondary_credential_years: 2
    source_id: ircc_category_based_selection
  agriculture:
    status: NOT_CURRENT_2026_CATEGORY
    note: Historical agriculture/agri-food category must not be treated as currently selectable.
    source_id: ircc_category_based_selection
scoring_grid:
  maximum: 1270
  formula: core_human_capital + spouse_factors + skill_transferability + min(600, additional_points);
    each category is capped by its own maximum (MI s. 8(2)), there is no combined cap
  family_context: With spouse only when accompanying and neither a Canadian citizen nor permanent resident.
  core_human_capital:
    maximum_without_spouse: 570
    maximum_with_spouse: 530
    age:
      maximum_without_spouse: 110
      maximum_with_spouse: 100
      points_by_age_without_spouse:
        17_or_less: 0
        '18': 99
        '19': 105
        20-29: 110
        '30': 105
        '31': 99
        '32': 94
        '33': 88
        '34': 83
        '35': 77
        '36': 72
        '37': 66
        '38': 61
        '39': 55
        '40': 50
        '41': 39
        '42': 28
        '43': 17
        '44': 6
        45_or_more: 0
      points_by_age_with_spouse:
        17_or_less: 0
        '18': 90
        '19': 95
        20-29: 100
        '30': 95
        '31': 90
        '32': 85
        '33': 80
        '34': 75
        '35': 70
        '36': 65
        '37': 60
        '38': 55
        '39': 50
        '40': 45
        '41': 35
        '42': 25
        '43': 15
        '44': 5
        45_or_more: 0
    education:
      maximum_without_spouse: 150
      maximum_with_spouse: 140
      levels:
      - less_than_secondary
      - secondary
      - one_year_postsecondary
      - two_year_postsecondary
      - bachelors_or_three_year
      - two_or_more_one_three_year
      - masters_or_eligible_professional
      - doctoral
      points_without_spouse:
      - 0
      - 30
      - 90
      - 98
      - 120
      - 128
      - 135
      - 150
      points_with_spouse:
      - 0
      - 28
      - 84
      - 91
      - 112
      - 119
      - 126
      - 140
    first_official_language:
      four_abilities:
      - listening
      - reading
      - writing
      - speaking
      levels:
      - below_clb4
      - clb4_or_5
      - clb6
      - clb7
      - clb8
      - clb9
      - clb10_or_more
      per_ability_without_spouse:
      - 0
      - 6
      - 9
      - 17
      - 23
      - 31
      - 34
      per_ability_with_spouse:
      - 0
      - 6
      - 8
      - 16
      - 22
      - 29
      - 32
    second_official_language:
      levels:
      - clb4_or_less
      - clb5_or_6
      - clb7_or_8
      - clb9_or_more
      per_ability_points:
      - 0
      - 1
      - 3
      - 6
      cap_without_spouse: 24
      cap_with_spouse: 22
    labour_market_integration:
      rule: MI s. 15 - greater of Canadian work experience points (s. 15.1(7) duration plus s. 15.1(8)
        high-wage occupation points) and qualifying offer points (s. 15.2(1)), capped by s. 15(2)
      maximum_without_spouse: 150
      maximum_with_spouse: 140
      canadian_work_experience:
        years:
        - less_than_1
        - 1
        - 2
        - 3
        - 4
        - 5_or_more
        points_without_spouse:
        - 0
        - 40
        - 53
        - 64
        - 72
        - 80
        points_with_spouse:
        - 0
        - 35
        - 46
        - 56
        - 63
        - 70
        high_wage_points:
          none: 0
          verified_2x: 70
          verified_1_5x: 40
          verified_1_3x: 20
      qualifying_offer:
        points:
          none: 0
          verified_2x: 100
          verified_1_5x: 70
          verified_1_3x: 50
