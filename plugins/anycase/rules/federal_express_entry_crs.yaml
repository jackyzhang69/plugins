      certificate_and_clb7_all: 50
    subtotal_formula: min(100, min(50, education_language + education_canadian_work) + min(50, foreign_work_language
      + foreign_work_canadian_work) + trade_certificate_language)
  additional_points:
    maximum: 600
    provincial_or_territorial_nomination: 600
    sibling_in_canada: 15
    french_nclc7_all_english_clb4_or_less_or_no_test: 25
    french_nclc7_all_english_clb5_all: 50
    canadian_postsecondary_one_or_two_years: 15
    canadian_postsecondary_three_or_more_years: 30
    arranged_employment: 0
    note: All additional factors combined are capped at 600; no job-offer points since 2025-03-25.
  source_id: ircc_crs
evaluation:
  rule_statuses:
  - PASS
  - FAIL
  - NEEDS_REVIEW
  note: Category checks run only when that category is requested; absence of a request is PASS for the
    category filter, not a finding of category eligibility.
rules:
- id: crs_gate_score_claim
  category: ranking_score
  severity: CRITICAL_REDLINE
  eval_type: federal_crs_score
  evidence_anchor:
    evidence_unit_id: EU-FED-CRS-SCORE-001
    source_file: src51.html
    section: Comprehensive Ranking System (CRS) criteria
    verbatim_excerpt: The Comprehensive Ranking System (CRS) is a points-based system that we use to assess
      and score your profile and rank it in the Express Entry pool.
- id: crs_gate_pool_eligibility
  category: pool_gate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.program_eligibility.fswp
  - candidate.program_eligibility.cec
  - candidate.program_eligibility.fstp
  pass_if: candidate.program_eligibility.fswp == true || candidate.program_eligibility.cec == true ||
    candidate.program_eligibility.fstp == true
  fail_if: candidate.program_eligibility.fswp == false && candidate.program_eligibility.cec == false &&
    candidate.program_eligibility.fstp == false
  evidence_anchor:
    evidence_unit_id: EU-FED-CRS-POOL-001
    source_file: src21.html
    section: Immigration programs
    verbatim_excerpt: 'Express Entry is an online system that we use to manage immigration applications
      for 3 programs:'
- id: crs_gate_language_test
  category: pool_gate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.language_test.approved_designated_test
  - candidate.language_test.valid_within_two_years
  pass_if: candidate.language_test.approved_designated_test == true && candidate.language_test.valid_within_two_years
    == true
  fail_if: candidate.language_test.approved_designated_test == false || candidate.language_test.valid_within_two_years
    == false
  evidence_anchor:
    evidence_unit_id: EU-FED-CRS-LANGUAGE-001
    source_file: src18.html
    section: How long your results are valid for
    verbatim_excerpt: 'Your test results must be less than 2 years old when you:'
- id: crs_gate_intended_residence
  category: pool_gate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.intended_province
  pass_if: candidate.intended_province != 'quebec'
  fail_if: candidate.intended_province == 'quebec'
  evidence_anchor:
    evidence_unit_id: EU-FED-CRS-QUEBEC-001
    source_file: src02.html
    section: Where you can live in Canada
    verbatim_excerpt: You must plan to live outside the province of Quebec
- id: crs_category_french_nclc7
  category: category_filter
  severity: STREAM_SPECIFIC
  eval_type: deterministic
  required_fields: []
  conditional_required_fields:
    when: candidate.category_request == 'french'
    fields:
    - candidate.french_test.approved_designated_test
    - candidate.french_test.valid_within_two_years
    - candidate.french_test.listening_nclc
    - candidate.french_test.reading_nclc
    - candidate.french_test.writing_nclc
    - candidate.french_test.speaking_nclc
  pass_if: candidate.category_request == null || candidate.category_request != 'french' || (candidate.french_test.approved_designated_test
    == true && candidate.french_test.valid_within_two_years == true && candidate.french_test.listening_nclc
    >= 7 && candidate.french_test.reading_nclc >= 7 && candidate.french_test.writing_nclc >= 7 && candidate.french_test.speaking_nclc
    >= 7)
  fail_if: candidate.category_request == 'french' && (candidate.french_test.approved_designated_test ==
    false || candidate.french_test.valid_within_two_years == false || candidate.french_test.listening_nclc
    < 7 || candidate.french_test.reading_nclc < 7 || candidate.french_test.writing_nclc < 7 || candidate.french_test.speaking_nclc
    < 7)
  evidence_anchor:
    evidence_unit_id: EU-FED-CRS-CAT-FRENCH-001
    source_file: src05.html
    section: Who’s eligible for the French-language proficiency category
    verbatim_excerpt: have French-language test results that show a minimum score of 7 in all 4 language
      abilities on the Niveaux de compétence linguistique canadiens
- id: crs_category_occupation_2026
  category: category_filter
  severity: STREAM_SPECIFIC
  eval_type: deterministic
  required_fields: []
  conditional_required_fields:
    when: candidate.category_request in ['stem', 'healthcare', 'trade', 'transport', 'education', 'physicians_canadian_experience',
      'senior_managers_canadian_experience', 'researchers_canadian_experience']
    fields:
    - candidate.category_occupation.noc_code
    - candidate.category_occupation.current_listed_noc_verified
    - candidate.category_occupation.qualifying_months_last_3_years
    - candidate.category_occupation.single_listed_occupation
  pass_if: candidate.category_request == null || candidate.category_request in ['none', 'french', 'skilled_military_recruits']
    || (candidate.category_request in ['stem', 'healthcare', 'trade', 'transport', 'education', 'physicians_canadian_experience',
    'senior_managers_canadian_experience', 'researchers_canadian_experience'] && valid_noc_2021_code(candidate.category_occupation.noc_code)
    && candidate.category_occupation.current_listed_noc_verified == true && candidate.category_occupation.qualifying_months_last_3_years
    >= 12 && candidate.category_occupation.single_listed_occupation == true)
  fail_if: (candidate.category_request != null && !(candidate.category_request in ['none', 'french', 'stem',
    'healthcare', 'trade', 'transport', 'education', 'physicians_canadian_experience', 'senior_managers_canadian_experience',
    'researchers_canadian_experience', 'skilled_military_recruits'])) || (candidate.category_request in
    ['stem', 'healthcare', 'trade', 'transport', 'education', 'physicians_canadian_experience', 'senior_managers_canadian_experience',
    'researchers_canadian_experience'] && (candidate.category_occupation.current_listed_noc_verified ==
    false || candidate.category_occupation.qualifying_months_last_3_years < 12 || candidate.category_occupation.single_listed_occupation
    == false || (candidate.category_occupation.current_listed_noc_verified == true && candidate.category_occupation.qualifying_months_last_3_years
    >= 12 && candidate.category_occupation.single_listed_occupation == true && !valid_noc_2021_code(candidate.category_occupation.noc_code))))
  missing_or_unverified: NEEDS_REVIEW — verify current round-specific NOC list and experience before treating
    occupational category as eligible.
  evidence_anchor:
    evidence_unit_id: EU-FED-CRS-CAT-OCC-001
    source_file: src05.html
    section: Who’s eligible for the healthcare and social services occupations category
    verbatim_excerpt: have accumulated, within the past 3 years, at least 12 months of full-time work
      experience (or an equal amount of part-time experience)
- id: crs_category_canadian_experience_2026
  category: category_filter
  severity: STREAM_SPECIFIC
  eval_type: deterministic
  required_fields: []
  conditional_required_fields:
    when: candidate.category_request in ['physicians_canadian_experience', 'senior_managers_canadian_experience',
      'researchers_canadian_experience']
    fields:
    - candidate.category_occupation.noc_code
    - candidate.category_occupation.experience_in_canada
  pass_if: '!(candidate.category_request in [''physicians_canadian_experience'', ''senior_managers_canadian_experience'',
    ''researchers_canadian_experience'']) || (candidate.category_occupation.experience_in_canada == true
    && ((candidate.category_request == ''physicians_canadian_experience'' && candidate.category_occupation.noc_code
    in [''31100'', ''31101'', ''31102'']) || (candidate.category_request == ''senior_managers_canadian_experience''
    && candidate.category_occupation.noc_code in [''00012'', ''00013'', ''00014'', ''00015'']) || (candidate.category_request
    == ''researchers_canadian_experience'' && candidate.category_occupation.noc_code in [''41200'', ''41201''])))'
  fail_if: candidate.category_request in ['physicians_canadian_experience', 'senior_managers_canadian_experience',
    'researchers_canadian_experience'] && (candidate.category_occupation.experience_in_canada == false
    || (candidate.category_occupation.noc_code != null && !((candidate.category_request == 'physicians_canadian_experience'
    && candidate.category_occupation.noc_code in ['31100', '31101', '31102']) || (candidate.category_request
    == 'senior_managers_canadian_experience' && candidate.category_occupation.noc_code in ['00012', '00013',
    '00014', '00015']) || (candidate.category_request == 'researchers_canadian_experience' && candidate.category_occupation.noc_code
    in ['41200', '41201']))))
  evidence_anchor:
    evidence_unit_id: EU-FED-CRS-CAT-CA-EXP-001
    source_file: src05.html
    section: Who’s eligible for the physicians with Canadian work experience category
    verbatim_excerpt: 'Who’s eligible for the physicians with Canadian work experience category To be
      eligible, you must: have accumulated, within the past 3 years, at least 12 months of full-time work
      experience (or an equal amount of part-time experience) —this experience does not need to be continuous
      in a single occupation listed in the table below (no matter your primary occupation) in Canada'
- id: crs_category_military_2026
  category: category_filter
  severity: STREAM_SPECIFIC
  eval_type: deterministic
  required_fields: []
  conditional_required_fields:
    when: candidate.category_request == 'skilled_military_recruits'
    fields:
    - candidate.military_recruit.currently_serving_recognized_foreign_military
    - candidate.military_recruit.recognized_foreign_military_service_years
    - candidate.military_recruit.duties_aligned_noc_code
    - candidate.military_recruit.canadian_forces_offer_noc_code
    - candidate.military_recruit.canadian_forces_offer_full_time_years
    - candidate.military_recruit.offer_from_forces_recruiting_group
    - candidate.military_recruit.postsecondary_credential_years
    - candidate.military_recruit.credential_canadian
  pass_if: candidate.category_request != 'skilled_military_recruits' || (candidate.military_recruit.currently_serving_recognized_foreign_military
    == true && candidate.military_recruit.recognized_foreign_military_service_years >= 10 && candidate.military_recruit.duties_aligned_noc_code
    in ['40042', '42102', '43204'] && candidate.military_recruit.canadian_forces_offer_noc_code in ['40042',
    '42102', '43204'] && candidate.military_recruit.canadian_forces_offer_full_time_years >= 3 && candidate.military_recruit.offer_from_forces_recruiting_group
    == true && candidate.military_recruit.postsecondary_credential_years >= 2 && (candidate.military_recruit.credential_canadian
    == true || candidate.military_recruit.foreign_credential_eca_verified == true))
  fail_if: candidate.category_request == 'skilled_military_recruits' && (candidate.military_recruit.currently_serving_recognized_foreign_military
    == false || candidate.military_recruit.recognized_foreign_military_service_years < 10 || (candidate.military_recruit.duties_aligned_noc_code
    != null && !(candidate.military_recruit.duties_aligned_noc_code in ['40042', '42102', '43204'])) ||
    (candidate.military_recruit.canadian_forces_offer_noc_code != null && !(candidate.military_recruit.canadian_forces_offer_noc_code
    in ['40042', '42102', '43204'])) || candidate.military_recruit.canadian_forces_offer_full_time_years
    < 3 || candidate.military_recruit.offer_from_forces_recruiting_group == false || candidate.military_recruit.postsecondary_credential_years
    < 2 || (candidate.military_recruit.credential_canadian == false && candidate.military_recruit.foreign_credential_eca_verified
    == false))
