schema_version: 1.0.0
catalog_id: federal_express_entry_crs
program_id: FEDERAL_EXPRESS_ENTRY
stream_id: CRS_POOL
jurisdiction: CA-FED
category: Express Entry
display_name: Express Entry — pool gates and CRS ranking grid
status: ACTIVE
effective_date: '2026-09-25'
source_edition: Current IRPA, Express Entry Ministerial Instructions and IRCC CRS criteria checked 2026-09-25
source_url: https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/check-score/crs-criteria.html
decision_scope: Pool prescreen using independently established FSWP/CEC/FSTP eligibility. CRS claims are
  checked against the scoring grid and supplied candidate facts; unsupported or incomplete components
  need review. This does not guarantee an invitation. Requested category checks require current round
  instructions.
