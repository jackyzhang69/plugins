  legal_authority: Official category guidance under IRPA s. 10.3
schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  types:
    assessment_date: ISO-8601 date
    candidate:
      intended_province: lowercase Canadian province or territory name
      program_eligibility:
        fswp: boolean; independently checked using full FSWP rules
        cec: boolean; independently checked under IRPR R87.1
        fstp: boolean; independently checked under IRPR R87.2
      language_test:
        approved_designated_test: boolean
        valid_within_two_years: boolean
        listening_clb: integer
        reading_clb: integer
        writing_clb: integer
        speaking_clb: integer
      second_language_test:
        present: boolean; false if no second official language test
        approved_designated_test: boolean; required when present
        valid_within_two_years: boolean; required when present
        listening_clb: integer; required when present
        reading_clb: integer; required when present
        writing_clb: integer; required when present
        speaking_clb: integer; required when present
      category_request: none | french | stem | healthcare | trade | transport | education | physicians_canadian_experience
        | senior_managers_canadian_experience | researchers_canadian_experience | skilled_military_recruits
      french_test:
        approved_designated_test: boolean
        valid_within_two_years: boolean
        listening_nclc: integer or null
        reading_nclc: integer or null
        writing_nclc: integer or null
        speaking_nclc: integer or null
      category_occupation:
        noc_code: valid five-digit NOC 2021 unit group code string; required for occupational categories
        current_listed_noc_verified: boolean or null
        qualifying_months_last_3_years: number or null
        single_listed_occupation: boolean or null
        experience_in_canada: boolean; required for physician, senior manager and researcher categories
      military_recruit:
        currently_serving_recognized_foreign_military: boolean
        recognized_foreign_military_service_years: completed continuous years
        duties_aligned_noc_code: NOC 40042, 42102 or 43204
        canadian_forces_offer_noc_code: NOC 40042, 42102 or 43204
        canadian_forces_offer_full_time_years: offered continuous years
        offer_from_forces_recruiting_group: boolean
        postsecondary_credential_years: completed credential duration
        foreign_credential_eca_verified: boolean; required for foreign credentials
        credential_canadian: boolean
      age: age at application
      education_level: supported scoring_grid core education level
      spouse_language_test: optional for accompanying spouse; absent or present=false scores 0; approved
        valid test and four CLB abilities required only when claiming spouse language points
      canadian_work_years: completed qualifying years
      foreign_work_years: completed qualifying years
      accompanying_spouse: boolean
      valid_trades_certificate: boolean
      valid_provincial_nomination: boolean
      other_additional_points_applicable: boolean; true if sibling, French proficiency, or Canadian study
        points may apply; needs full factor review
    crs_breakdown: claimed component points, including all core, spouse, transfer and nomination fields
    scoring_inputs: claimed core, spouse, transfer and additional subtotals
    claimed_crs_score: claimed total CRS points
pool_gates:
- crs_gate_pool_eligibility
- crs_gate_language_test
- crs_gate_intended_residence
- crs_gate_score_claim
pool_gate_note: Provincial nomination adds CRS points but does not replace eligibility for one of FSWP,
  CEC or FSTP.
category_filters:
  scope: A requested category filters a particular invitation round; it is not a general pool gate.
  active_2026:
  - french
  - healthcare
  - stem
  - trade
  - education
  - transport
  - physicians_canadian_experience
  - senior_managers_canadian_experience
  - researchers_canadian_experience
  - skilled_military_recruits
  french:
    minimum_nclc_each_ability: 7
    source_id: ircc_categories
  stem:
    listed_noc_required: true
    qualifying_months_last_3_years: 12
    same_occupation_required: true
    source_id: ircc_categories
  healthcare:
    listed_noc_required: true
    qualifying_months_last_3_years: 12
    same_occupation_required: true
    source_id: ircc_categories
  trade:
    listed_noc_required: true
    qualifying_months_last_3_years: 12
    same_occupation_required: true
    source_id: ircc_categories
  transport:
    listed_noc_required: true
    qualifying_months_last_3_years: 12
    same_occupation_required: true
    source_id: ircc_categories
  education:
    listed_noc_required: true
    qualifying_months_last_3_years: 12
    same_occupation_required: true
    source_id: ircc_categories
  physicians_canadian_experience:
    listed_noc_codes:
    - '31100'
    - '31101'
    - '31102'
    qualifying_months_last_3_years: 12
    canadian_experience_required: true
    source_id: ircc_categories
  senior_managers_canadian_experience:
    listed_noc_codes:
    - '00012'
    - '00013'
    - '00014'
    - '00015'
    qualifying_months_last_3_years: 12
    canadian_experience_required: true
    source_id: ircc_categories
  researchers_canadian_experience:
    listed_noc_codes:
    - '41200'
    - '41201'
    qualifying_months_last_3_years: 12
    canadian_experience_required: true
    source_id: ircc_categories
  skilled_military_recruits:
    listed_noc_codes:
    - '40042'
    - '42102'
    - '43204'
    continuous_foreign_service_years: 10
    canadian_forces_offer_years: 3
    postsecondary_credential_years: 2
    source_id: ircc_categories
  agriculture:
    status: NOT_CURRENT_2026_CATEGORY
    note: Historical agriculture/agri-food category must not be treated as currently selectable.
    source_id: ircc_categories
