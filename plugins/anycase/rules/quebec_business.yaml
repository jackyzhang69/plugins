- id: qc_biz_french
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.french_oral_level
  pass_if: candidate.french_oral_level >= 7
  fail_if: candidate.french_oral_level < 7
  missing_or_unverified: 'NEEDS_REVIEW: French oral level cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "d6.b05.html.quebec-entrepreneur-takeover-conditions.a3964b59c5a9"
    source_id: qc_biz
    source_file: "68cc6263681bcf85c671358f80d178ea25694cf0b222f273941afca1e46c8fcb"
    section: "Entrepreneur spoken French minimum"
    verbatim_excerpt: "You must have a knowledge of spoken French corresponding minimally to level 7"
  provenance:
    source_id: quebec_business_entrepreneur_start_conditions_20260930
    source_file: aade78718b579f11fa5ddee7e279fd02ac8b42cf2f1adeab09fb19ed6df17a65
    section: Entrepreneur spoken French minimum
    page: ""
    verbatim: "You must have a knowledge of spoken French corresponding minimally to level 7"
- id: qc_biz_entrepreneur
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'entrepreneur'
    fields:
    - candidate.entrepreneur_profile
  pass_if: >-
    candidate.stream in ['investor', 'self_employed'] ||
    (candidate.stream == 'entrepreneur' && candidate.entrepreneur_profile in ['demarrage_entreprise_innovante', 'realisation_projet_novateur'] &&
    candidate.innovation_support_services_obtained == true && candidate.equity_capital_share_percent >= 10) ||
    (candidate.stream == 'entrepreneur' && candidate.entrepreneur_profile == 'entreprise_en_demarrage' &&
    candidate.net_worth_cad - candidate.net_worth_donations_received_last_6_months_cad >= 600000 &&
    candidate.equity_capital_share_percent >= 25 &&
    ((candidate.in_cmm == true && candidate.investment_cad >= 300000) || (candidate.in_cmm == false && candidate.investment_cad >= 150000))) ||
    (candidate.stream == 'entrepreneur' && candidate.entrepreneur_profile == 'entreprise_demarree' &&
    candidate.net_worth_cad - candidate.net_worth_donations_received_last_6_months_cad >= 300000 &&
    candidate.equity_capital_share_percent >= 25 && candidate.business_started == true) ||
    (candidate.stream == 'entrepreneur' && candidate.entrepreneur_profile in ['entreprise_en_voie_acquisition', 'entreprise_acquise'] &&
    candidate.repreneuriat_support_services_obtained == true &&
    ((candidate.entrepreneur_profile == 'entreprise_en_voie_acquisition' && candidate.net_worth_cad - candidate.net_worth_donations_received_last_6_months_cad >= 600000) ||
    (candidate.entrepreneur_profile == 'entreprise_acquise' && candidate.net_worth_cad - candidate.net_worth_donations_received_last_6_months_cad >= 300000 && candidate.business_control_acquired_and_held == true)))
  fail_if: >-
    candidate.stream == 'entrepreneur' && candidate.article58_requested == false &&
    ((candidate.entrepreneur_profile == 'entreprise_en_demarrage' &&
    (candidate.net_worth_cad - candidate.net_worth_donations_received_last_6_months_cad < 600000 ||
    candidate.equity_capital_share_percent < 25 ||
    (candidate.in_cmm == true && candidate.investment_cad < 300000) ||
    (candidate.in_cmm == false && candidate.investment_cad < 150000))) ||
    (candidate.entrepreneur_profile == 'entreprise_demarree' &&
    (candidate.net_worth_cad - candidate.net_worth_donations_received_last_6_months_cad < 300000 || candidate.equity_capital_share_percent < 25)))
  missing_or_unverified: 'NEEDS_REVIEW: Identify the official entrepreneur profile and its conditions. Incubator status is neither a universal bypass nor a universal S1 requirement; an article 58 claim needs individual review.'
  evidence_anchor:
    evidence_unit_id: "d6.b05.html.quebec-entrepreneur-start-conditions.1e92c35cf81f"
    source_id: qc_biz
    source_file: "93e5d75428512ff389495081c27acef09ba643ab1e6366a73af1509368d6ef95"
    section: "Entrepreneur net worth minimum"
    verbatim_excerpt: "You must have a minimum net worth of CAD $600,000."
  provenance:
    source_id: quebec_business_entrepreneur_start_conditions_20260930
    source_file: aade78718b579f11fa5ddee7e279fd02ac8b42cf2f1adeab09fb19ed6df17a65
    section: Entrepreneur net worth minimum
    page: ""
    verbatim: "You must have a minimum net worth of CAD $600,000."
- id: qc_biz_self_employed
  category: experience
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'self_employed'
    fields:
    - candidate.self_employed_months_past_5_years
    - candidate.net_worth_cad
    - candidate.in_cmm
    - candidate.startup_deposit_cad
  pass_if: candidate.stream != 'self_employed' || (candidate.self_employed_months_past_5_years >= 24 &&
    candidate.net_worth_cad >= 100000 && ((candidate.in_cmm == true && candidate.startup_deposit_cad >=
    50000) || (candidate.in_cmm == false && candidate.startup_deposit_cad >= 25000)))
  fail_if: candidate.stream == 'self_employed' && (candidate.self_employed_months_past_5_years < 24 ||
    candidate.net_worth_cad < 100000 || (candidate.in_cmm == true && candidate.startup_deposit_cad < 50000)
    || (candidate.in_cmm == false && candidate.startup_deposit_cad < 25000))
  missing_or_unverified: 'NEEDS_REVIEW: Self-employed experience, net worth, or deposit cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "d6.b05.html.quebec-self-employed-conditions.64043325db56"
    source_id: qc_biz
    source_file: "b4b7ef70581ce63353d0da97bde205ff6962fb1629d73b24c0b982059e66197a"
    section: "Self-employed start-up deposit minimum"
    verbatim_excerpt: "On the territory of the CMM, the start-up deposit is CDN$50,000."
  provenance:
    source_id: quebec_business_self_employed_conditions_20260930
    source_file: b2bd2e4ca9fa7f5fd2b756b333121b8e66f32d10d95e0b6ef8904ffffee52192
    section: Self-employed start-up deposit minimum
    page: ""
    verbatim: "On the territory of the CMM, the start-up deposit is CDN$50,000."
- id: qc_biz_investor
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'investor'
    fields:
    - candidate.net_worth_cad
    - candidate.net_worth_donations_received_last_6_months_cad
    - candidate.management_years_past_5
    - candidate.investment_quebec_commitment
  pass_if: candidate.stream != 'investor' || (candidate.net_worth_cad - candidate.net_worth_donations_received_last_6_months_cad >= 2000000 && candidate.management_years_past_5 >= 2 && candidate.investment_quebec_commitment == true && ((candidate.stage == 'paper-application' && candidate.investor_payment_request_date == null) || candidate.investor_contribution_paid == true))
  fail_if: candidate.stream == 'investor' && candidate.article58_requested == false && (candidate.net_worth_cad - candidate.net_worth_donations_received_last_6_months_cad < 2000000 || candidate.management_years_past_5 < 2 || candidate.investment_quebec_commitment == false)
  missing_or_unverified: 'NEEDS_REVIEW: Investor net worth, management and commitment; contribution is not unconditionally due at filing. Request clock is evaluated separately, preserving individual article 58 review.'
  evidence_anchor:
    evidence_unit_id: "d6.b05.html.quebec-investor-conditions.d39eac55f657"
    source_id: qc_biz
    source_file: "4e41df87fe0720db6c3009c27124dde04e7bf650af935786f7e52659eef6f609"
    section: "Investor net worth minimum"
    verbatim_excerpt: "must have a net worth of at least CAD $2,000,000."
  provenance:
    source_id: quebec_business_investor_conditions_20260930
    source_file: 3bffb1f3832b335aaf48494fab687e938e8a5b57766e7a32399f04380436257d
    section: Investor net worth minimum
    page: ""
    verbatim: "must have a net worth of at least CAD $2,000,000."
- id: qc_biz_values
  category: pathway
  severity: ADVISORY
  eval_type: deterministic
  required_fields:
  - candidate.stage
  pass_if: quebec_values_current(candidate.values_members, candidate.values_attestation_request_date, candidate.application_examination_date, candidate.stage)
  missing_or_unverified: 'NEEDS_REVIEW: Verify each subject, medical exemption, Minister receipt within 60 days of request, and proof obtained within two years of examination. No unconditional pre-filing values gate.'
  evidence_anchor:
    evidence_unit_id: "d6.b05.html.quebec-entrepreneur-takeover-conditions.a3964b59c5a9"
    source_id: qc_biz
    source_file: "68cc6263681bcf85c671358f80d178ea25694cf0b222f273941afca1e46c8fcb"
    section: "Qu\u00e9bec values attestation timing and family ages"
    verbatim_excerpt: "When your file is opened, you will receive a request to obtain an <a href=\"/en/immigration/receiving-attestation-values\" target=\"_blank\">attestation of&nbsp;learning about democratic values and Qu\u00e9bec values</a>.</p><p>You must obtain your attestation within a maximum of 60<span class=\"nbsp\">&nbsp;</span>days after receiving this request.</p><p>The members of your family accompanying you will also need to obtain it, namely, your spouse aged 16<span class=\"nbsp\">&nbsp;</span>years or older and your dependent children aged 18<span class=\"nbsp\">&nbsp;</span>years or older.</p><p>You will not receive this request if you and your family have already obtained your attestation.</p></div></div></div>\n"
  provenance:
    source_id: quebec_business_entrepreneur_takeover_conditions_20260930
    source_file: a3e934d09e5e64323cdfa0f59084554c4d96de27ffcdbbb743470cb78948429f
    section: Québec values attestation timing and family ages
    page: ""
    verbatim: "When your file is opened, you will receive a request to obtain an <a href=\"/en/immigration/receiving-attestation-values\" target=\"_blank\">attestation of&nbsp;learning about democratic values and Québec values</a>.</p><p>You must obtain your attestation within a maximum of 60<span class=\"nbsp\">&nbsp;</span>days after receiving this request.</p><p>The members of your family accompanying you will also need to obtain it, namely, your spouse aged 16<span class=\"nbsp\">&nbsp;</span>years or older and your dependent children aged 18<span class=\"nbsp\">&nbsp;</span>years or older.</p><p>You will not receive this request if you and your family have already obtained your attestation.</p></div></div></div>\n\n"
- id: qc_business_financial_self_sufficiency_scale_matches_household
  category: funds
  severity: ADVISORY
  eval_type: deterministic
  required_fields:
  - candidate.stream
  pass_if: >-
    candidate.stream == 'investor' ||
    (candidate.stream in ['entrepreneur', 'self_employed'] &&
    candidate.financial_contract_signature_date >= '2026-01-01' && candidate.financial_contract_signature_date <= '2026-12-31' &&
    candidate.household_children_18_or_over_count >= 0 &&
    ((candidate.household_adults_count == 1 && candidate.household_children_18_or_over_count == 0 &&
    ((candidate.household_children_under_18_count == 0 && candidate.financial_self_sufficiency_required_amount_cad == 3957) ||
    (candidate.household_children_under_18_count == 1 && candidate.financial_self_sufficiency_required_amount_cad == 5318) ||
    (candidate.household_children_under_18_count == 2 && candidate.financial_self_sufficiency_required_amount_cad == 6002) ||
    (candidate.household_children_under_18_count >= 3 && candidate.financial_self_sufficiency_required_amount_cad == 6687 + (candidate.household_children_under_18_count - 3) * 685))) ||
    (candidate.household_adults_count == 2 &&
    ((candidate.household_children_under_18_count == 0 && candidate.financial_self_sufficiency_required_amount_cad == 5803 + candidate.household_children_18_or_over_count * 1845) ||
    (candidate.household_children_under_18_count == 1 && candidate.financial_self_sufficiency_required_amount_cad == 6500 + candidate.household_children_18_or_over_count * 1845) ||
    (candidate.household_children_under_18_count == 2 && candidate.financial_self_sufficiency_required_amount_cad == 7016 + candidate.household_children_18_or_over_count * 1845) ||
    (candidate.household_children_under_18_count >= 3 && candidate.financial_self_sufficiency_required_amount_cad == 7531 + (candidate.household_children_under_18_count - 3) * 516 + candidate.household_children_18_or_over_count * 1845)))) &&
    candidate.financial_self_sufficiency_resources_cad >= candidate.financial_self_sufficiency_required_amount_cad)
  missing_or_unverified: 'NEEDS_REVIEW: Verify applicable 2026 household scale, dependent roles and resources; no Schedule C lookup for investor, no extrapolation to another edition or unsupported household.'
  evidence_anchor:
    source_file: 2fc8bddd5d69d2630bb0803dc2a54718fae6c8036a259ace65f308af5aff5500
    section: Financial self sufficiency contract 2026, p.1
    verbatim_excerpt: Barèmes en vigueur du 1er janvier au 31 décembre 2026
- id: qc_inv_investment_120_day_window
  category: funds
