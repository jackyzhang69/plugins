schema_version: 1.0.0
catalog_id: quebec_business
jurisdiction: CA-QC
category: Quebec business
display_name: Quebec Business Immigration
status: ACTIVE
program_id: QUEBEC_BUSINESS
stream_id: BUSINESS
effective_date: '2024-01-01'
source_edition: Quebec entrepreneur, self-employed, and investor programs
source_url: https://www.quebec.ca/en/immigration/permanent/businesspeople
decision_scope: Deterministic prescreen for French, the entrepreneur, self-employed, and investor money
  gates, and the values attestation. Points stay in AnyScore.
sources:
- id: qc_biz
  title: Quebec business immigration
  url: https://www.quebec.ca/en/immigration/permanent/businesspeople
  citation: Quebec entrepreneur, self-employed, and investor programs
  legal_authority: Official program baseline used for the redline. Points arithmetic stays in AnyScore.
schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  types:
    assessment_date: ISO-8601 date
reference_points_grid:
  note: Documentation only. AnyScore owns Quebec business points.
rules:
- id: qc_biz_french
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.french_oral_level
  pass_if: candidate.french_oral_level >= 7
  fail_if: candidate.french_oral_level < 7
  missing_or_unverified: 'NEEDS_REVIEW: French oral level cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-QC-BIZ-FRENCH-006
    source_id: quebec_business_entrepreneur_start_conditions_20260930
    source_file: aade78718b579f11fa5ddee7e279fd02ac8b42cf2f1adeab09fb19ed6df17a65
    section: Entrepreneur spoken French minimum
    page: ""
    verbatim_excerpt: "You must have a knowledge of spoken French corresponding minimally to level 7"
  provenance:
    source_id: quebec_business_entrepreneur_start_conditions_20260930
    source_file: aade78718b579f11fa5ddee7e279fd02ac8b42cf2f1adeab09fb19ed6df17a65
    section: Entrepreneur spoken French minimum
    page: ""
    verbatim: "You must have a knowledge of spoken French corresponding minimally to level 7"
- id: qc_biz_entrepreneur
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'entrepreneur' && candidate.incubator_supported == false
    fields:
    - candidate.operating_business
    - candidate.net_worth_cad
    - candidate.in_cmm
    - candidate.investment_cad
  pass_if: candidate.stream != 'entrepreneur' || candidate.incubator_supported == true || (((candidate.operating_business
    == true && candidate.net_worth_cad >= 300000) || (candidate.operating_business == false && candidate.net_worth_cad
    >= 600000)) && ((candidate.in_cmm == true && candidate.investment_cad >= 300000) || (candidate.in_cmm
    == false && candidate.investment_cad >= 150000)))
  fail_if: candidate.stream == 'entrepreneur' && candidate.incubator_supported == false && ((candidate.operating_business
    == true && candidate.net_worth_cad < 300000) || (candidate.operating_business == false && candidate.net_worth_cad
    < 600000) || (candidate.in_cmm == true && candidate.investment_cad < 300000) || (candidate.in_cmm
    == false && candidate.investment_cad < 150000))
  missing_or_unverified: 'NEEDS_REVIEW: Entrepreneur incubator support, net worth, or investment cannot
    be verified.'
  evidence_anchor:
    evidence_unit_id: EU-QC-BIZ-ENT-007
    source_id: quebec_business_entrepreneur_start_conditions_20260930
    source_file: aade78718b579f11fa5ddee7e279fd02ac8b42cf2f1adeab09fb19ed6df17a65
    section: Entrepreneur net worth minimum
    page: ""
    verbatim_excerpt: "You must have a minimum net worth of CAD $600,000."
  provenance:
    source_id: quebec_business_entrepreneur_start_conditions_20260930
    source_file: aade78718b579f11fa5ddee7e279fd02ac8b42cf2f1adeab09fb19ed6df17a65
    section: Entrepreneur net worth minimum
    page: ""
    verbatim: "You must have a minimum net worth of CAD $600,000."
- id: qc_biz_self_employed
  category: experience
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'self_employed'
    fields:
    - candidate.self_employed_months_past_5_years
    - candidate.net_worth_cad
    - candidate.in_cmm
    - candidate.startup_deposit_cad
  pass_if: candidate.stream != 'self_employed' || (candidate.self_employed_months_past_5_years >= 24 &&
    candidate.net_worth_cad >= 100000 && ((candidate.in_cmm == true && candidate.startup_deposit_cad >=
    50000) || (candidate.in_cmm == false && candidate.startup_deposit_cad >= 25000)))
  fail_if: candidate.stream == 'self_employed' && (candidate.self_employed_months_past_5_years < 24 ||
    candidate.net_worth_cad < 100000 || (candidate.in_cmm == true && candidate.startup_deposit_cad < 50000)
    || (candidate.in_cmm == false && candidate.startup_deposit_cad < 25000))
  missing_or_unverified: 'NEEDS_REVIEW: Self-employed experience, net worth, or deposit cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-QC-BIZ-SE-008
    source_id: quebec_business_self_employed_conditions_20260930
    source_file: b2bd2e4ca9fa7f5fd2b756b333121b8e66f32d10d95e0b6ef8904ffffee52192
    section: Self-employed start-up deposit minimum
    page: ""
    verbatim_excerpt: "On the territory of the CMM, the start-up deposit is CDN$50,000."
  provenance:
    source_id: quebec_business_self_employed_conditions_20260930
    source_file: b2bd2e4ca9fa7f5fd2b756b333121b8e66f32d10d95e0b6ef8904ffffee52192
    section: Self-employed start-up deposit minimum
    page: ""
    verbatim: "On the territory of the CMM, the start-up deposit is CDN$50,000."
- id: qc_biz_investor
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'investor'
    fields:
    - candidate.net_worth_cad
    - candidate.management_years_past_5
    - candidate.investment_quebec_commitment
    - candidate.investor_contribution_paid
  pass_if: candidate.stream != 'investor' || (candidate.net_worth_cad >= 2000000 && candidate.management_years_past_5
    >= 2 && candidate.investment_quebec_commitment == true && candidate.investor_contribution_paid ==
    true)
  fail_if: candidate.stream == 'investor' && (candidate.net_worth_cad < 2000000 || candidate.management_years_past_5
    < 2 || candidate.investment_quebec_commitment == false || candidate.investor_contribution_paid ==
    false)
  missing_or_unverified: 'NEEDS_REVIEW: Investor net worth, management experience, or investment commitment
    cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-QC-BIZ-INV-009
    source_id: quebec_business_investor_conditions_20260930
    source_file: 3bffb1f3832b335aaf48494fab687e938e8a5b57766e7a32399f04380436257d
    section: Investor net worth minimum
    page: ""
    verbatim_excerpt: "must have a net worth of at least CAD $2,000,000."
  provenance:
    source_id: quebec_business_investor_conditions_20260930
    source_file: 3bffb1f3832b335aaf48494fab687e938e8a5b57766e7a32399f04380436257d
    section: Investor net worth minimum
    page: ""
    verbatim: "must have a net worth of at least CAD $2,000,000."
- id: qc_biz_values
  category: pathway
  severity: ADVISORY
  eval_type: deterministic
  required_fields:
  - candidate.values_attestation
  missing_or_unverified: 'NEEDS_REVIEW: Verify whether a post-filing request was issued, the response deadline, and attestations for the applicant, accompanying spouse aged 16 or older, and dependent children aged 18 or older.'
  evidence_anchor:
    evidence_unit_id: EU-QC-BIZ-VALUES-010
    source_id: quebec_business_entrepreneur_takeover_conditions_20260930
    source_file: a3e934d09e5e64323cdfa0f59084554c4d96de27ffcdbbb743470cb78948429f
    section: Québec values attestation timing and family ages
    page: ""
    verbatim_excerpt: "When your file is opened, you will receive a request to obtain an <a href=\"/en/immigration/receiving-attestation-values\" target=\"_blank\">attestation of&nbsp;learning about democratic values and Québec values</a>.</p><p>You must obtain your attestation within a maximum of 60<span class=\"nbsp\">&nbsp;</span>days after receiving this request.</p><p>The members of your family accompanying you will also need to obtain it, namely, your spouse aged 16<span class=\"nbsp\">&nbsp;</span>years or older and your dependent children aged 18<span class=\"nbsp\">&nbsp;</span>years or older.</p><p>You will not receive this request if you and your family have already obtained your attestation.</p></div></div></div>\n\n"
  provenance:
    source_id: quebec_business_entrepreneur_takeover_conditions_20260930
    source_file: a3e934d09e5e64323cdfa0f59084554c4d96de27ffcdbbb743470cb78948429f
    section: Québec values attestation timing and family ages
    page: ""
    verbatim: "When your file is opened, you will receive a request to obtain an <a href=\"/en/immigration/receiving-attestation-values\" target=\"_blank\">attestation of&nbsp;learning about democratic values and Québec values</a>.</p><p>You must obtain your attestation within a maximum of 60<span class=\"nbsp\">&nbsp;</span>days after receiving this request.</p><p>The members of your family accompanying you will also need to obtain it, namely, your spouse aged 16<span class=\"nbsp\">&nbsp;</span>years or older and your dependent children aged 18<span class=\"nbsp\">&nbsp;</span>years or older.</p><p>You will not receive this request if you and your family have already obtained your attestation.</p></div></div></div>\n\n"
