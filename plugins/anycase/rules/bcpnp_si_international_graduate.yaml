schema_version: "1.0.0"
catalog_id: "bcpnp_si_international_graduate"
jurisdiction: "CA-BC"
category: "Skills Immigration"
display_name: "BC PNP Skills Immigration: International Graduate (Legacy)"
program_id: "BC_PNP_SKILLS_IMMIGRATION"
stream_id: "INTERNATIONAL_GRADUATE"
status: "LEGACY_CLOSED"
effective_until: "2024-11-26"
effective_date: "2022-11-16"
source_edition: "BC PNP Skills Immigration Program Guide & Graduate Policy Schedule"
source_url: "https://www.welcomebc.ca/immigrate-to-b-c/bc-pnp-si-program-guide-pdf"
decision_scope: "Pre-screen of the eight rules defined below; PASS is not a nomination or complete program-eligibility decision."

schema:
  input_type: object
  required_top_level: [assessment_date, candidate, education, job_offer, employer, noul]

evaluation:
  rule_statuses: [PASS, FAIL, NEEDS_REVIEW]
  aggregate:
    - "If any CRITICAL_REDLINE rule is FAIL, verdict = FAIL."
    - "Otherwise, if any rule is NEEDS_REVIEW, verdict = NEEDS_REVIEW."
    - "Otherwise, verdict = PASS."
  pinned_statutory_minimum_wage:
    currency: CAD
    hourly_amount: 18.25
    effective_from: "2026-06-01"

rules:
  - id: ig_stream_lifecycle
    category: stream_policy
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
    pass_if: "assessment_date <= '2024-11-26'"
    fail_if: "assessment_date > '2024-11-26'"
    missing_or_unverified: "NEEDS_REVIEW: assessment_date is required to verify stream lifecycle."
    interpretation: "The International Graduate stream was permanently closed to new registrations on November 26, 2024. Applications after this date are ineligible."
    evidence_anchor:
      evidence_unit_id: "bcpnp:bc_pnp_si_program_guide:p5:updates_to_this_edition"
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "Program Updates - Graduate Streams Phased Out"
      page: "5"
      verbatim_excerpt: "International Graduate stream closed to new registrations"

  - id: ig_eligible_credential
    category: education
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - education.is_eligible_canadian_institution
      - education.credential_completion_years
    pass_if: "education.is_eligible_canadian_institution == true && education.credential_completion_years <= 3.0"
    fail_if: "education.is_eligible_canadian_institution == false || education.credential_completion_years > 3.0"
    missing_or_unverified: "NEEDS_REVIEW: Post-secondary educational credential, graduation date, or institution eligibility cannot be confirmed."
    interpretation: "Applicant must have graduated from an eligible Canadian public or authorized private post-secondary institution within the three years prior to applying."
    evidence_anchor:
      evidence_unit_id: "bcpnp:bc_pnp_si_program_guide:p52:8_2_highest_level_of_education"
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "8.2, Graduate Criteria"
      page: "52-54"
      verbatim_excerpt: "obtained a degree, diploma or certificate from an eligible Canadian post-secondary institution within the past three years"

  - id: ig_job_offer_noc_teer
    category: job_offer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - education.is_bc_stem_post_graduate
    conditional_required_fields:
      when: "education.is_bc_stem_post_graduate == false"
      fields:
        - job_offer.noc_2021_code
        - job_offer.noc_teer
    pass_if: "education.is_bc_stem_post_graduate == true || (job_offer.noc_teer in [0,1,2,3])"
    fail_if: "education.is_bc_stem_post_graduate == false && !(job_offer.noc_teer in [0,1,2,3])"
    missing_or_unverified: "NEEDS_REVIEW: Job offer NOC code or TEER level classification is unverified."
    interpretation: "Position must be in TEER 0, 1, 2, or 3, unless the applicant qualifies under the direct STEM Post-Graduate stream."
    evidence_anchor:
      evidence_unit_id: "bcpnp:bc_pnp_si_program_guide:p24:4_1_skilled_worker_stream"
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "4.1(b), Appendix A"
      page: "24; 61"
      verbatim_excerpt: "NOC TEER 0, 1, 2, or 3"

  - id: ig_hours_fulltime
    category: job_offer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - education.is_bc_stem_post_graduate
    conditional_required_fields:
      when: "education.is_bc_stem_post_graduate == false"
      fields:
        - job_offer.weekly_regular_hours
        - job_offer.year_round
        - job_offer.single_position
    pass_if: "education.is_bc_stem_post_graduate == true || (job_offer.weekly_regular_hours >= 30.0 && job_offer.year_round == true && job_offer.single_position == true)"
    fail_if: "education.is_bc_stem_post_graduate == false && (job_offer.weekly_regular_hours < 30.0 || job_offer.year_round == false || job_offer.single_position == false)"
    missing_or_unverified: "NEEDS_REVIEW: Full-time hours (>= 30 hrs/week) or year-round position details cannot be established."
    interpretation: "Job offer must provide full-time hours (at least 30 hours per week) on a year-round basis."
    evidence_anchor:
      evidence_unit_id: "bcpnp:bc_pnp_si_program_guide:p17:the_following_table_shows_the_minimum_scores_requi"
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "3.5"
      page: "17"
      verbatim_excerpt: "at least 30 hours per week, year-round"

  - id: ig_wage_prevailing
    category: compensation
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - education.is_bc_stem_post_graduate
    conditional_required_fields:
      when: "education.is_bc_stem_post_graduate == false"
      fields:
        - job_offer.regular_base_hourly_cad
        - job_offer.market_range_verified
    precondition: "education.is_bc_stem_post_graduate == true || current_statutory_minimum_verified(assessment_date) == true"
    pass_if: "education.is_bc_stem_post_graduate == true || (job_offer.regular_base_hourly_cad >= statutory_minimum(assessment_date) && job_offer.market_range_verified == true)"
    fail_if: "education.is_bc_stem_post_graduate == false && (job_offer.regular_base_hourly_cad < statutory_minimum(assessment_date))"
    missing_or_unverified: "NEEDS_REVIEW: Wage falls below statutory floor ($18.25/hr) or prevailing market rate is unverified."
    interpretation: "Offered wage must be at or above provincial minimum wage and commensurate with entry-level or prevailing graduate market rates."
    evidence_anchor:
      evidence_unit_id: "bcpnp:bc_pnp_si_program_guide:p20:3_9_wages"
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "3.9"
      page: "20"
      verbatim_excerpt: "wage rate that is at or above the provincial minimum wage"

  - id: ig_language_floor
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - education.is_bc_stem_post_graduate
    conditional_required_fields:
      when: "education.is_bc_stem_post_graduate == false && job_offer.noc_teer in [2,3]"
      fields:
        - candidate.language_test.test_type
        - candidate.language_test.valid_at_application
        - candidate.language_test.listening_clb
        - candidate.language_test.reading_clb
        - candidate.language_test.writing_clb
        - candidate.language_test.speaking_clb
    pass_if: "education.is_bc_stem_post_graduate == true || !(job_offer.noc_teer in [2,3]) || (accepted_designated_test(candidate.language_test.test_type) && candidate.language_test.valid_at_application == true && min(candidate.language_test.listening_clb, candidate.language_test.reading_clb, candidate.language_test.writing_clb, candidate.language_test.speaking_clb) >= 4)"
    fail_if: "education.is_bc_stem_post_graduate == false && job_offer.noc_teer in [2,3] && (candidate.language_test.valid_at_application == false || (candidate.language_test.test_type != None && !accepted_designated_test(candidate.language_test.test_type)) || min(candidate.language_test.listening_clb, candidate.language_test.reading_clb, candidate.language_test.writing_clb, candidate.language_test.speaking_clb) < 4)"
    missing_or_unverified: "NEEDS_REVIEW: Language test results missing or CLB score below threshold for TEER 2/3 graduate occupation."
    interpretation: "CLB 4 is mandatory for international graduates employed in TEER 2 or 3 occupations."
    evidence_anchor:
      evidence_unit_id: "bcpnp:bc_pnp_si_program_guide:p55:8_3_language_proficiency"
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "3.4"
      page: "15"
      verbatim_excerpt: "Canadian Language Benchmark (CLB) score of at least 4"

  - id: ig_employer_qualifications
    category: employer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - education.is_bc_stem_post_graduate
    conditional_required_fields:
      when: "education.is_bc_stem_post_graduate == false"
      fields:
        - employer.bc_operating_months
        - employer.in_metro_vancouver_regional_district
        - employer.eligible_bc_payroll_fte
    pass_if: "education.is_bc_stem_post_graduate == true || (employer.bc_operating_months >= 12.0 && ((employer.in_metro_vancouver_regional_district == true && employer.eligible_bc_payroll_fte >= 5.0) || (employer.in_metro_vancouver_regional_district == false && employer.eligible_bc_payroll_fte >= 3.0)))"
    fail_if: "education.is_bc_stem_post_graduate == false && (employer.bc_operating_months < 12.0 || (employer.in_metro_vancouver_regional_district == true && employer.eligible_bc_payroll_fte < 5.0) || (employer.in_metro_vancouver_regional_district == false && employer.eligible_bc_payroll_fte < 3.0))"
    missing_or_unverified: "NEEDS_REVIEW: Sponsoring employer operating history or minimum full-time employee counts cannot be confirmed."
    interpretation: "Employer must have operated in B.C. for at least 12 months with at least 5 local FTEs in Metro Vancouver or 3 outside."
    evidence_anchor:
      evidence_unit_id: "bcpnp:bc_pnp_si_program_guide:p33:6_7_minimum_number_of_years_in_operation_in_britis"
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "6.7, 6.8"
      page: "33"
      verbatim_excerpt: "operating in British Columbia for at least one year; minimum number of full-time employees"

  - id: ig_equity_cap
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - candidate.ownership_max_combined_ratio
      - candidate.ownership_window_complete
      - candidate.applicant_or_family_control
    pass_if: "candidate.ownership_max_combined_ratio < 0.10 && candidate.applicant_or_family_control == false"
    fail_if: "candidate.ownership_max_combined_ratio >= 0.10 || candidate.applicant_or_family_control == true"
    missing_or_unverified: "NEEDS_REVIEW: Ownership, family equity, or controlling interest in sponsoring business cannot be verified."
    interpretation: "Applicant and family cannot hold 10% or more ownership in the sponsoring enterprise."
    evidence_anchor:
      evidence_unit_id: "bcpnp:bc_pnp_si_program_guide:p22:3_12_eligible_employment_situations"
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "3.12"
      page: "22"
      verbatim_excerpt: "10 per cent"

  - id: ig_job_offer_genuineness
    category: integrity
    severity: CRITICAL_REDLINE
    eval_type: jev_semantic
    required_fields:
      - assessment_date
      - noul.proposition_id
      - noul.model_version
      - noul.probability_true
      - noul.evidence_complete
      - noul.evidence_refs
    noul_contract:
      proposition_id: "ig_job_offer_genuineness"
      fail: "probability_true < 0.30"
      pass: "probability_true >= 0.70"
    missing_or_unverified: "NEEDS_REVIEW: Graduate job offer genuineness evidence is incomplete or probability is uncertain (0.30 <= P < 0.70)."
    interpretation: "Evaluates bona fide alignment between the candidate's post-secondary education, commercial employer requirements, and genuine career progression."
    evidence_anchor:
      evidence_unit_id: "bcpnp:bc_pnp_si_program_guide:p36:6_11_genuine_need_for_the_position"
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "6.11"
      page: "36"
      verbatim_excerpt: "genuine need for the position"
