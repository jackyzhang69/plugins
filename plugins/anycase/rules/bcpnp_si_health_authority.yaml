schema_version: "1.0.0"
catalog_id: "bcpnp_si_health_authority"
jurisdiction: "CA-BC"
category: "Skills Immigration"
display_name: "BC PNP Skills Immigration: Health Authority Stream"
status: "ACTIVE"
program_id: "BC_PNP_SKILLS_IMMIGRATION"
stream_id: "HEALTH_AUTHORITY"
effective_date: "2026-06-10"
source_edition: "BC PNP Skills Immigration Program Guide, Section 4.2"
source_url: "https://www.welcomebc.ca/immigrate-to-b-c/bc-pnp-si-program-guide-pdf"
decision_scope: "Pre-screen of the source-scoped rules below; PASS is not a nomination or complete program-eligibility decision. Added employer operation/staff screens cover direct employees, not alternative professional routes."

schema:
  input_type: object
  required_top_level: [assessment_date, candidate, job_offer, employer, noul]

evaluation:
  rule_statuses: [PASS, FAIL, NEEDS_REVIEW]
  aggregate:
    - "If any CRITICAL_REDLINE rule is FAIL, verdict = FAIL."
    - "Otherwise, if any rule is NEEDS_REVIEW, verdict = NEEDS_REVIEW."
    - "Otherwise, verdict = PASS."
  pinned_statutory_minimum_wage:
    currency: CAD
    hourly_amount: 18.25
    effective_from: "2026-06-01"

rules:
  - id: ha_sponsoring_authority
    category: employer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - candidate.profession
    conditional_required_fields:
      when: "candidate.profession != 'midwife'"
      fields:
        - employer.health_authority_name
        - employer.has_health_authority_support
    pass_if: "(employer.has_health_authority_support == true && employer.health_authority_name in ['Provincial Health Services Authority', 'First Nations Health Authority', 'Fraser Health', 'Interior Health', 'Island Health', 'Northern Health', 'Vancouver Coastal Health', 'Providence Health Care']) || (candidate.profession == 'midwife' && employer.has_midwife_practice_group_support == true)"
    fail_if: "(candidate.profession != 'midwife' && (employer.has_health_authority_support == false || (employer.health_authority_name != None && !(employer.health_authority_name in ['Provincial Health Services Authority', 'First Nations Health Authority', 'Fraser Health', 'Interior Health', 'Island Health', 'Northern Health', 'Vancouver Coastal Health', 'Providence Health Care'])))) || (candidate.profession == 'midwife' && employer.has_midwife_practice_group_support == false && employer.has_health_authority_support == false)"
    missing_or_unverified: "NEEDS_REVIEW: Source-required authority support or, for a midwife, practice-group support is not verified."
    interpretation: "June 10, 2026 source: physicians and nurse practitioners may be non-direct employees but require listed health-authority support. Midwives may instead have support from a B.C. midwife practice group; licensure is checked independently. This rule does not grant a complete eligibility determination."
    evidence_anchor:
      evidence_unit_id: "bcpnp:bc_pnp_si_program_guide:p25:4_2_health_authority_stream"
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "4.2(b)"
      page: "25"
      verbatim_excerpt: "Your health authority must agree to support your BC PNP application before you apply."

  - id: ha_occupation_eligibility
    category: job_offer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - job_offer.noc_2021_code
      - job_offer.noc_teer
      - job_offer.is_health_occupation
    pass_if: "job_offer.noc_teer in [0,1,2,3] && (job_offer.is_health_occupation == true || job_offer.noc_2021_code in ['41300', '41301', '42201'])"
    fail_if: "!(job_offer.noc_teer in [0,1,2,3]) || (job_offer.is_health_occupation == false && !(job_offer.noc_2021_code in ['41300', '41301', '42201']))"
    missing_or_unverified: "NEEDS_REVIEW: Job offer NOC code or health occupation qualification evidence is missing or disputed."
    interpretation: "Eligible occupations must be in TEER 0-3 and belong to health professions (NOC category 3) or recognized allied social/therapy codes (41300, 41301, 42201)."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_si_program_guide:p25:4_2_health_authority_stream
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "4.2(c)"
      page: "25"
      verbatim_excerpt: "If you have a regular, indeterminate, full-time job offer in an eligible health occupation\nfrom a public health authority in B.C., you may be eligible for this stream."

  - id: ha_professional_licensing
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - candidate.licensing_registration_status
      - candidate.profession
    pass_if: "(candidate.profession == 'midwife' && candidate.licensing_registration_status == 'licensed') || (candidate.profession in ['physician', 'nurse_practitioner'] && candidate.licensing_registration_status in ['licensed', 'eligible_to_be_licensed']) || (!(candidate.profession in ['midwife', 'physician', 'nurse_practitioner']) && candidate.licensing_registration_status in ['licensed', 'eligible_to_be_licensed', 'not_regulated'])"
    fail_if: "candidate.licensing_registration_status == 'ineligible' || (candidate.profession == 'midwife' && candidate.licensing_registration_status in ['eligible_to_be_licensed', 'not_regulated']) || (candidate.profession in ['physician', 'nurse_practitioner'] && candidate.licensing_registration_status == 'not_regulated')"
    missing_or_unverified: "NEEDS_REVIEW: Profession-specific B.C. licensure or eligibility is not verified."
    interpretation: "June 10, 2026 source only: midwives must be licensed; physicians and nurse practitioners may be licensed or eligible to be licensed. Direct employment is not a requirement of these alternative professional routes. The 2025 historical route is not inferred or reinterpreted."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_si_program_guide:p26:social_workers_noc_41300
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "4.2(d), 4.2(e)"
      page: "26"
      verbatim_excerpt: "be licensed or be eligible to be licensed to work as a physician or nurse practitioner in B.C."

  - id: ha_hours_fulltime
    category: job_offer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - job_offer.weekly_regular_hours
      - job_offer.year_round
      - job_offer.single_position
    pass_if: "(job_offer.is_physician_nurse_practitioner_midwife == true || job_offer.indeterminate == true) && job_offer.weekly_regular_hours >= 30.0 && job_offer.year_round == true && job_offer.single_position == true"
    fail_if: "(job_offer.is_physician_nurse_practitioner_midwife != true && job_offer.indeterminate == false) || job_offer.weekly_regular_hours < 30.0 || job_offer.year_round == false || job_offer.single_position == false"
    missing_or_unverified: "NEEDS_REVIEW: Full-time hours, year-round status, or indeterminate job offer structure cannot be verified."
    interpretation: "Job offer must be full-time (at least 30 hours per week) year-round; direct health authority employees must have an indeterminate offer, while eligible physicians, nurse practitioners, and midwives supported by a health authority may hold eligible contracted terms."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_si_technical_guide:p36:bc_pnp_skills_immigration_application_guide
      source_file: "BC-PNP-SI-Technical-Guide.pdf"
      section: "3.5"
      page: "36"
      verbatim_excerpt: "Full-time employment is as at least an average of 30\nhours per week, year-round."

  - id: ha_wage_prevailing
    category: compensation
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - job_offer.regular_base_hourly_cad
      - job_offer.market_range_verified
      - job_offer.market_range_low_cad
      - job_offer.market_range_high_cad
      - job_offer.peer_wage_comparable
      - job_offer.employer_pay_structure_consistent
    precondition: "current_statutory_minimum_verified(assessment_date) == true"
    pass_if: "job_offer.regular_base_hourly_cad >= statutory_minimum(assessment_date) && job_offer.market_range_verified == true && job_offer.regular_base_hourly_cad >= job_offer.market_range_low_cad && job_offer.regular_base_hourly_cad <= job_offer.market_range_high_cad && job_offer.peer_wage_comparable == true && job_offer.employer_pay_structure_consistent == true"
    fail_if: "job_offer.regular_base_hourly_cad < statutory_minimum(assessment_date) || job_offer.regular_base_hourly_cad < job_offer.market_range_low_cad || job_offer.regular_base_hourly_cad > job_offer.market_range_high_cad || job_offer.peer_wage_comparable == false || job_offer.employer_pay_structure_consistent == false"
    missing_or_unverified: "NEEDS_REVIEW: Regular base pay, dated NOC/location wage range, peer wages or employer pay structure cannot be verified."
    interpretation: "Regular base pay excludes bonuses, commissions, profit sharing, tips, overtime, housing/room/board and similar allowances. Family income is assessed separately."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_si_program_guide:p20:3_9_wages
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "3.9"
      page: "20"
      verbatim_excerpt: "Your offered wage must be:\n\u2022 Within the wage range posted on WorkBC or the federal Job Bank website for the\noccupation and location"

  - id: ha_language_floor
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - job_offer.noc_teer
    conditional_required_fields:
      when: "job_offer.noc_teer in [2,3]"
      fields:
        - candidate.language_test.test_type
        - candidate.language_test.valid_at_application
        - candidate.language_test.listening_clb
        - candidate.language_test.reading_clb
        - candidate.language_test.writing_clb
        - candidate.language_test.speaking_clb
    pass_if: "!(job_offer.noc_teer in [2,3]) || (accepted_designated_test(candidate.language_test.test_type) && candidate.language_test.valid_at_application == true && min(candidate.language_test.listening_clb, candidate.language_test.reading_clb, candidate.language_test.writing_clb, candidate.language_test.speaking_clb) >= 4)"
    fail_if: "job_offer.noc_teer in [2,3] && (candidate.language_test.valid_at_application == false || (candidate.language_test.test_type != None && !accepted_designated_test(candidate.language_test.test_type)) || min(candidate.language_test.listening_clb, candidate.language_test.reading_clb, candidate.language_test.writing_clb, candidate.language_test.speaking_clb) < 4)"
    missing_or_unverified: "NEEDS_REVIEW: Language test results missing or validity cannot be confirmed for TEER 2/3 healthcare occupation."
    interpretation: "Mandatory CLB 4 threshold applies to healthcare workers in TEER 2 or 3 positions."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_si_program_guide:p17:the_following_table_shows_the_minimum_scores_requi
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "3.4"
      page: "17"
      verbatim_excerpt: "The following table shows the minimum scores required for the designated tests to meet CLB 4"

  - id: ha_equity_cap
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - candidate.ownership_max_combined_ratio
      - candidate.ownership_window_complete
      - candidate.applicant_or_family_control
    pass_if: "candidate.ownership_max_combined_ratio < 0.10 && candidate.applicant_or_family_control == false"
    fail_if: "candidate.ownership_max_combined_ratio >= 0.10 || candidate.applicant_or_family_control == true"
    missing_or_unverified: "NEEDS_REVIEW: Equity ownership or commercial control facts cannot be verified."
    interpretation: "Candidate or immediate family must not hold 10% or more ownership in the employing entity."
    evidence_anchor:
      evidence_unit_id: "bcpnp:bc_pnp_si_program_guide:p22:3_12_eligible_employment_situations"
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "3.12"
      page: "22"
      verbatim_excerpt: "\u2022 You do not hold or exercise control over an ownership stake of 10 per cent or greater in"

  - id: ha_job_offer_genuineness
    category: integrity
    severity: CRITICAL_REDLINE
    eval_type: jev_semantic
    required_fields:
      - assessment_date
      - noul.proposition_id
      - noul.model_version
      - noul.probability_true
      - noul.evidence_complete
      - noul.evidence_refs
    noul_contract:
      proposition_id: "ha_job_offer_genuineness"
      fail: "probability_true < 0.30"
      pass: "probability_true >= 0.70"
    missing_or_unverified: "NEEDS_REVIEW: Bona fides evidence is incomplete, absent, or probability falls in the uncertain band (0.30 <= P < 0.70)."
    interpretation: "Evaluates genuine clinical or administrative staffing need within public health infrastructure using TypeSafe Jev System One."
    evidence_anchor:
      evidence_unit_id: "bcpnp:bc_pnp_si_program_guide:p36:6_11_genuine_need_for_the_position"
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "6.11"
      page: "36"
      verbatim_excerpt: "Your employer must demonstrate that there is a genuine need for the position."

  - id: ha_immigration_status
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
    - candidate.in_canada
    - candidate.working_without_authorization
    - candidate.inadmissible
    - candidate.unresolved_refugee_claim
    - candidate.under_removal_order
    - candidate.requires_authorization_to_return
    pass_if: (candidate.in_canada == false || candidate.status_valid == true || (candidate.status_valid == false && candidate.restoration_filed == true && candidate.restoration_filing_days_after_expiry >= 0 && candidate.restoration_filing_days_after_expiry <= 90)) && candidate.working_without_authorization == false && candidate.inadmissible == false && candidate.unresolved_refugee_claim == false && candidate.under_removal_order == false && candidate.requires_authorization_to_return == false
    fail_if: (candidate.in_canada == true && candidate.status_valid == false && (candidate.restoration_filed == false || candidate.restoration_filing_days_after_expiry > 90)) || candidate.working_without_authorization == true || candidate.inadmissible == true || candidate.unresolved_refugee_claim == true || candidate.under_removal_order == true || candidate.requires_authorization_to_return == true
    missing_or_unverified: 'NEEDS_REVIEW: Source-required facts or discretionary assessment are missing or unresolved; no adverse inference from absent evidence.'
    interpretation: Only the out-of-status exception is satisfied by timely restoration; all independent nomination blockers remain assessed. Days are elapsed calendar days from status expiry to actual filing, not assessment. Missing conditional facts remain unresolved.
    evidence_anchor:
      source_file: si_guide_2026_06_10.txt
      section: '3.3'
      verbatim_excerpt: restoration of status within the 90-day eligibility period
  - id: ha_family_income
    category: compensation
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
    - family.size
    - family.size_evidence_complete
    - family.in_metro_vancouver
    - job_offer.regular_base_hourly_cad
    - job_offer.weekly_regular_hours
    pass_if: (family.in_metro_vancouver == true && family.size == 1 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 31264 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 31264))) || (family.in_metro_vancouver == true && family.size == 2 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 38922 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 38922))) || (family.in_metro_vancouver == true && family.size == 3 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 47851 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 47851))) || (family.in_metro_vancouver == true && family.size == 4 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 58096 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 58096))) || (family.in_metro_vancouver == true && family.size == 5 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 65892 || (family.spouse_valid_work_authorization == true &