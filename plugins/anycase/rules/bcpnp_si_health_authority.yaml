rs, 40) * 52) >= 32437))) || (family.in_metro_vancouver == false && family.size == 3 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 39878 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 39878))) || (family.in_metro_vancouver == false && family.size == 4 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 48418 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 48418))) || (family.in_metro_vancouver == false && family.size == 5 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 54914 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 54914))) || (family.in_metro_vancouver == false && family.size == 6 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 61935 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 61935))) || (family.in_metro_vancouver == false && family.size >= 7 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 68955 || (family.spouse_valid_work_au