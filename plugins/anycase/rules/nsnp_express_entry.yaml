schema_version: 1.0.0
catalog_id: nsnp_express_entry
category: Nova Scotia Nominee Program
display_name: 'Nova Scotia Nominee Program: Nova Scotia Express Entry'
status: ACTIVE
program_id: NSNP_EXPRESS_ENTRY
stream_id: NOVA_SCOTIA_EXPRESS_ENTRY
jurisdiction: CA-NS
effective_date: '2026-09-01'
source_edition: 'Nova Scotia: Express Entry stream page (liveinnovascotia.com/express-entry, no page date, retrieved 2026-11-16) and Nova Scotia: Express Entry Submission Guide, Nova Scotia Nominee Program (September 2026)'
source_url: https://liveinnovascotia.com/express-entry
decision_scope: >-
  Pre-screen of the Skilled Work Experience in Nova Scotia route of the Nova Scotia Express Entry stream. The Physician
  route and the Letter-of-Interest route have their own sub-criteria and are not evaluated here. No genuineness
  probability test exists in the sources and none is evaluated. A pass is not nomination.
sources:
- id: ns_express_entry_stream_page
  title: Nova Scotia Express Entry (stream page)
  url: https://liveinnovascotia.com/express-entry
  sha256: 902c2b2cefc5a98e835cc52f9c901e122c934cbcd8022041b0343dc31de39b35
  retrieved_at: '2026-11-16'
- id: ns_express_entry_guide
  title: Nova Scotia Express Entry Submission Guide (September 2026)
  url: https://liveinnovascotia.com/sites/default/files/2026-02/Guide-NSNP-Nova%20Scotia%20Express%20Entry-English.pdf
  sha256: d930f385d1c6e3e94e06f8d5b0db4648dac15e61cdff603f131fb7716dc42859
  retrieved_at: '2026-11-16'
schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  - employer
  types:
    assessment_date: ISO-8601 date; application assessment date
    candidate:
      has_active_federal_ee_profile: boolean
      ee_profile_number: string pattern ^E\d{9}$
      ee_job_seeker_validation_code: string
      age: integer; age at assessment
      has_canadian_high_school_credential_or_equivalent: boolean
      primary_noc_2021_code: five-digit string
      primary_noc_teer: integer 0-5
      ns_skilled_work_hours_last_3_years: number; counted hours only, in Nova Scotia within the 3 years before the EOI; 1,560 hours = 12 months full-time (30 h/week) or 24 months part-time (15 h/week). Self-employment, work as a full-time student, co-op, unpaid internship and volunteer work are not counted.
      experience_gained_with_legal_authorization: boolean
      experience_depends_on_pgwp_from_studies_outside_ns: boolean
      employment_at_arms_length_without_ownership_or_control: boolean; false when the applicant holds any ownership interest in, or controls hiring, supervision or operations of, the employer, or the arrangement is not at arm's length
      resides_in_canada: boolean
      valid_nonexpired_status_document: boolean; required when resides_in_canada is true
      on_maintained_status: boolean; required when resides_in_canada is true
      legal_status_in_country_of_residence: boolean; used when resides_in_canada is false
      intention_to_reside_in_ns: boolean
      language_test:
        valid_at_application: boolean; tested within 2 years of the EOI
        listening_clb: integer
        reading_clb: integer
        writing_clb: integer
        speaking_clb: integer
    employer:
      ns_operating_months_at_employment_start: integer
      meets_ns_registration_requirement: boolean; commercial business registered with the Nova Scotia Registry of Joint Stock Companies with a permanent establishment in Nova Scotia, or not-for-profit registered under the Societies Act
      in_good_standing_with_ohs_and_labour_authorities: boolean
evaluation:
  rule_statuses:
  - PASS
  - FAIL
  - NEEDS_REVIEW
  aggregate:
  - If any CRITICAL_REDLINE rule is FAIL, verdict = FAIL.
  - Otherwise, if any rule is NEEDS_REVIEW, verdict = NEEDS_REVIEW.
  - Otherwise, verdict = PASS.
rules:
- id: nsnp_ee_profile_status
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.has_active_federal_ee_profile
  - candidate.ee_profile_number
  - candidate.ee_job_seeker_validation_code
  pass_if: candidate.has_active_federal_ee_profile == true
  fail_if: candidate.has_active_federal_ee_profile == false
  missing_or_unverified: 'NEEDS_REVIEW: Express Entry profile number or Job Seeker Validation Code is unverified.'
  provenance:
    source_file: Guide-NSNP-Nova-Scotia-Express-Entry-English.pdf
    section: The expression of interest (EOI) process
    page: 28
    verbatim: 'You need both of these numbers to submit an EOI to the Nova Scotia: Express Entry Stream.'
  evidence_anchor:
    evidence_unit_id: ns.nsnp_express_entry.p028
    source_file: 930f960e1aeedf5920925db732c42672a7174613540dd878692dd609d7286596
    page: "28"
    section: The expression of interest (EOI) process
    verbatim_excerpt: "You need both of these numbers to submit an EOI to the Nova\nScotia: Express Entry Stream."
- id: nsnp_ee_age_range
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.age
  pass_if: candidate.age >= 21 && candidate.age <= 55
  fail_if: (candidate.age != null && candidate.age < 21) || (candidate.age != null && candidate.age > 55)
  missing_or_unverified: 'NEEDS_REVIEW: Candidate age cannot be verified.'
  provenance:
    source_file: https://liveinnovascotia.com/express-entry
    section: Skilled Work Experience in Nova Scotia - Eligibility
    verbatim: be 21 to 55 years old;
  evidence_anchor:
    evidence_unit_id: "atlantic_documents:ns_express_entry_stream_page:skilled_work_experience_in_ns_eligibility"
    unit_status: candidate_k_validated_not_published
    candidate_k_id: d8549be5853c4fd1aefae7f249deac1bbb4637145c01ad334c3b30a80e6a0d17
