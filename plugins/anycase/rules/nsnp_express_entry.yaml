- id: nsnp_ee_language_threshold
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.primary_noc_teer
  - candidate.language_test.valid_at_application
  - candidate.language_test.listening_clb
  - candidate.language_test.reading_clb
  - candidate.language_test.writing_clb
  - candidate.language_test.speaking_clb
  pass_if: >-
    candidate.language_test.valid_at_application == true &&
    ((candidate.primary_noc_teer in [0, 1] && candidate.language_test.listening_clb >= 7 && candidate.language_test.reading_clb >= 7 &&
    candidate.language_test.writing_clb >= 7 && candidate.language_test.speaking_clb >= 7) ||
    (candidate.primary_noc_teer in [2, 3] && candidate.language_test.listening_clb >= 5 && candidate.language_test.reading_clb >= 5 &&
    candidate.language_test.writing_clb >= 5 && candidate.language_test.speaking_clb >= 5))
  fail_if: >-
    candidate.language_test.valid_at_application == true &&
    ((candidate.primary_noc_teer in [0, 1] && (candidate.language_test.listening_clb < 7 || candidate.language_test.reading_clb < 7 ||
    candidate.language_test.writing_clb < 7 || candidate.language_test.speaking_clb < 7)) ||
    (candidate.primary_noc_teer in [2, 3] && (candidate.language_test.listening_clb < 5 || candidate.language_test.reading_clb < 5 ||
    candidate.language_test.writing_clb < 5 || candidate.language_test.speaking_clb < 5)))
  missing_or_unverified: 'NEEDS_REVIEW: Language test results are missing, older than 2 years, or the TEER is outside 0-3.'
  provenance:
    source_file: https://liveinnovascotia.com/express-entry
    section: Skilled Work Experience in Nova Scotia - Eligibility
    verbatim: You need CLB 7 for skilled work in the National Occupational Classification (NOC) TEER 0 and 1. You need CLB 5 for NOC TEER 2 and 3 positions;
  evidence_anchor:
    evidence_unit_id: "atlantic_documents:ns_express_entry_stream_page:skilled_work_experience_in_ns_eligibility"
    unit_status: candidate_k_validated_not_published
    candidate_k_id: d8549be5853c4fd1aefae7f249deac1bbb4637145c01ad334c3b30a80e6a0d17
    source_id: ns_express_entry_stream_page
    source_file: 35a872038ba56e5e5ba68dde4d3106ada3911c53484336884f1153a050fdcb27
    source_url: https://liveinnovascotia.com/express-entry
    source_sha256: 902c2b2cefc5a98e835cc52f9c901e122c934cbcd8022041b0343dc31de39b35
    source_edition: no page date; fetched 2026-11-16T18:24:16Z
    section: SKILLED WORK EXPERIENCE IN NOVA SCOTIA - ELIGIBILITY
    verbatim_excerpt: You need CLB 7 for skilled work in the National Occupational Classification (NOC) TEER 0 and 1. You need CLB 5 for NOC TEER 2 and 3 positions;
    supporting_excerpts:
    - evidence_unit_id: "atlantic_documents:nsnp_express_entry_guide_pdf:p025"
      unit_status: candidate_k_validated_not_published
      candidate_k_id: 75e68c1a464c7420badb56445a2bac3b01fd93a77be1c612072eb98a396217bd
      source_file: 865a2fa9af4207d87d49eabfcab68b18b8c1c695c7c398ccc8be71f7a767bc21
      page: "25"
      verbatim_excerpt: "Warning! You must have had your language skills tested within 2 years of\nsubmitting an expression of interest to the Nova Scotia: Express Entry Stream. We\ndo NOT accept test results dated more than 2 years before the date on your\nsubmission."
    - evidence_unit_id: "atlantic_documents:nsnp_express_entry_guide_pdf:p024"
      unit_status: candidate_k_validated_not_published
      candidate_k_id: 75e68c1a464c7420badb56445a2bac3b01fd93a77be1c612072eb98a396217bd
      source_file: 865a2fa9af4207d87d49eabfcab68b18b8c1c695c7c398ccc8be71f7a767bc21
      page: "24"
      verbatim_excerpt: "you must submit the results of one of\nthese language tests even if your first language is English or French"
