    verbatim_excerpt: "at least 12 months of full-time paid work experience—30 hours per\nweek for 12 months (1,560 hours)"
    supporting_excerpts:
    - evidence_unit_id: ns.nsnp_express_entry.p023
      source_file: 930f960e1aeedf5920925db732c42672a7174613540dd878692dd609d7286596
