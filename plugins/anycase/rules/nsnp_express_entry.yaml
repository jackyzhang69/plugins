    source_edition: no page date; fetched 2026-11-16T18:24:16Z
    section: SKILLED WORK EXPERIENCE IN NOVA SCOTIA - ELIGIBILITY
    verbatim_excerpt: be 21 to 55 years old;
- id: nsnp_ee_teer_eligibility
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.primary_noc_teer
  pass_if: candidate.primary_noc_teer in [0, 1, 2, 3]
  fail_if: candidate.primary_noc_teer in [4, 5]
  missing_or_unverified: 'NEEDS_REVIEW: Primary NOC TEER classification is missing.'
  provenance:
    source_file: Guide-NSNP-Nova-Scotia-Express-Entry-English.pdf
    section: For Skilled Work Experience gained in Nova Scotia
    page: 21
    verbatim: the work experience was in a job that meets the criteria for NOC categories 0, 1, 2, or 3
  evidence_anchor:
    evidence_unit_id: ns.nsnp_express_entry.p021
    source_file: 930f960e1aeedf5920925db732c42672a7174613540dd878692dd609d7286596
    page: "21"
    section: For Skilled Work Experience gained in Nova Scotia
    verbatim_excerpt: "the work experience was in a job that meets the criteria for NOC\ncategories 0, 1, 2, or 3"
- id: nsnp_ee_experience_duration_and_legality
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.ns_skilled_work_hours_last_3_years
  - candidate.experience_gained_with_legal_authorization
  - candidate.experience_depends_on_pgwp_from_studies_outside_ns
  - candidate.employment_at_arms_length_without_ownership_or_control
  pass_if: >-
    candidate.ns_skilled_work_hours_last_3_years >= 1560 && candidate.experience_gained_with_legal_authorization == true &&
    candidate.experience_depends_on_pgwp_from_studies_outside_ns == false &&
    candidate.employment_at_arms_length_without_ownership_or_control == true
  fail_if: >-
    (candidate.ns_skilled_work_hours_last_3_years != null && candidate.ns_skilled_work_hours_last_3_years < 1560) ||
    candidate.experience_gained_with_legal_authorization == false ||
    candidate.experience_depends_on_pgwp_from_studies_outside_ns == true ||
    candidate.employment_at_arms_length_without_ownership_or_control == false
  missing_or_unverified: 'NEEDS_REVIEW: Nova Scotia skilled work hours, work authorization, post-graduation work permit basis or arm''s-length employment is not documented.'
  provenance:
    source_file: Guide-NSNP-Nova-Scotia-Express-Entry-English.pdf
    section: For Skilled Work Experience gained in Nova Scotia
    page: 21
    verbatim: at least 12 months of full-time paid work experience—30 hours per week for 12 months (1,560 hours)
  evidence_anchor:
