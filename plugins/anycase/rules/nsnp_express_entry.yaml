- id: nsnp_ee_legal_status
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.resides_in_canada
  conditional_required_fields:
    when: candidate.resides_in_canada == true
    fields:
    - candidate.valid_nonexpired_status_document
    - candidate.on_maintained_status
  pass_if: >-
    (candidate.resides_in_canada == true && candidate.valid_nonexpired_status_document == true && candidate.on_maintained_status == false) ||
    (candidate.resides_in_canada == false && candidate.legal_status_in_country_of_residence == true)
  fail_if: >-
    (candidate.resides_in_canada == true && (candidate.valid_nonexpired_status_document == false || candidate.on_maintained_status == true)) ||
    (candidate.resides_in_canada == false && candidate.legal_status_in_country_of_residence == false)
  missing_or_unverified: 'NEEDS_REVIEW: Legal status in the country of residence is unverified. Maintained status is not eligible for a Canadian resident.'
  provenance:
    source_file: Guide-NSNP-Nova-Scotia-Express-Entry-English.pdf
    section: You must hold legal status in your country of residence
    page: 13
    verbatim: Applicants in maintained status, formerly referred to as implied status, are not eligible to submit an EOI.
  evidence_anchor:
    evidence_unit_id: "atlantic_documents:nsnp_express_entry_guide_pdf:p013"
    unit_status: candidate_k_validated_not_published
    candidate_k_id: 75e68c1a464c7420badb56445a2bac3b01fd93a77be1c612072eb98a396217bd
    source_id: nsnp_express_entry_guide_pdf
    source_file: 865a2fa9af4207d87d49eabfcab68b18b8c1c695c7c398ccc8be71f7a767bc21
    source_url: https://liveinnovascotia.com/sites/default/files/2026-02/Guide-NSNP-Nova%20Scotia%20Express%20Entry-English.pdf
    source_sha256: d930f385d1c6e3e94e06f8d5b0db4648dac15e61cdff603f131fb7716dc42859
    source_edition: "Nova Scotia Nominee Program (September 2026)"
    page: "13"
    section: "You must hold legal status in your country of residence"
    verbatim_excerpt: "You must hold a valid and non-expired temporary resident status document on\nthe date you submit your EOI, such as a work permit or a study permit. Applicants\nin maintained status, formerly referred to as implied status, are not eligible to\nsubmit an EOI."
- id: nsnp_ee_employer_criteria
  category: employer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - employer.ns_operating_months_at_employment_start
  - employer.meets_ns_registration_requirement
  - employer.in_good_standing_with_ohs_and_labour_authorities
  pass_if: >-
    employer.ns_operating_months_at_employment_start >= 24 && employer.meets_ns_registration_requirement == true &&
    employer.in_good_standing_with_ohs_and_labour_authorities == true
  fail_if: >-
    (employer.ns_operating_months_at_employment_start != null && employer.ns_operating_months_at_employment_start < 24) ||
    employer.meets_ns_registration_requirement == false || employer.in_good_standing_with_ohs_and_labour_authorities == false
  missing_or_unverified: 'NEEDS_REVIEW: Employer operating history, registration or labour-authority standing during the period of employment is unverified.'
  provenance:
    source_file: Guide-NSNP-Nova-Scotia-Express-Entry-English.pdf
    section: Employer criteria for Skilled Work Experience gained in Nova Scotia
    page: 22
    verbatim: be in good standing with provincial occupational health and safety and labour authorities.
  evidence_anchor:
    evidence_unit_id: ns.nsnp_express_entry.p022
    source_file: 930f960e1aeedf5920925db732c42672a7174613540dd878692dd609d7286596
    page: "22"
    section: Employer criteria for Skilled Work Experience gained in Nova Scotia
    verbatim_excerpt: "be in good standing with provincial occupational health and safety\nand labour authorities."
    supporting_excerpts:
    - evidence_unit_id: "atlantic_documents:nsnp_express_entry_guide_pdf:p021"
      unit_status: candidate_k_validated_not_published
      candidate_k_id: 75e68c1a464c7420badb56445a2bac3b01fd93a77be1c612072eb98a396217bd
      source_file: 865a2fa9af4207d87d49eabfcab68b18b8c1c695c7c398ccc8be71f7a767bc21
      page: "21"
      verbatim_excerpt: "The employer must have operated in Nova Scotia for at least\n2 years at the time your employment started."
    - evidence_unit_id: "atlantic_documents:nsnp_express_entry_guide_pdf:p021"
      unit_status: candidate_k_validated_not_published
      candidate_k_id: 75e68c1a464c7420badb56445a2bac3b01fd93a77be1c612072eb98a396217bd
      source_file: 865a2fa9af4207d87d49eabfcab68b18b8c1c695c7c398ccc8be71f7a767bc21
      page: "21"
      verbatim_excerpt: "If the employer is a commercial business, it must be registered\nwith the Nova Scotia Registry of Joint Stock Companies AND have\na permanent establishment in Nova Scotia as defined in\nCanada’s Income Tax Act."
    - evidence_unit_id: "atlantic_documents:nsnp_express_entry_guide_pdf:p021"
      unit_status: candidate_k_validated_not_published
      candidate_k_id: 75e68c1a464c7420badb56445a2bac3b01fd93a77be1c612072eb98a396217bd
      source_file: 865a2fa9af4207d87d49eabfcab68b18b8c1c695c7c398ccc8be71f7a767bc21
      page: "21"
      verbatim_excerpt: "If the employer is a not-for-profit organization, it must be registered\nunder the Societies Act."
