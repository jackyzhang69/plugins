gates:
- fswp_gate_continuous_experience
- fswp_gate_language_clb7
- fswp_gate_education_credential
- fswp_gate_settlement_funds
- fswp_gate_intended_residence
- fswp_gate_selection_score
- fswp_score_language
- fswp_score_education
- fswp_score_experience
- fswp_score_age
- fswp_score_arranged_employment
- fswp_score_adaptability
scoring_grid:
  maximum: 100
  pass_mark: 67
  formula: language + education + experience + age + arranged_employment + adaptability
  language:
    maximum: 28
    first_official_language:
      maximum: 24
      per_ability_clb_7: 4
      per_ability_clb_8: 5
      per_ability_clb_9_or_more: 6
    second_official_language:
      maximum: 4
      minimum_clb_each_ability: 5
      points_if_all_four_meet_minimum: 4
    source_id: express_entry_fswp_program
  education:
    maximum: 25
    points:
      doctoral: 25
      masters_or_eligible_professional: 23
      two_or_more_one_three_year: 22
      bachelors_or_three_year: 21
      two_year_postsecondary: 19
      one_year_postsecondary: 15
      secondary: 5
    source_id: irpr_75_83
  experience:
    maximum: 15
    years_to_points:
      '1': 9
      2-3: 11
      4-5: 13
      6+: 15
    source_id: express_entry_fswp_program
  age:
    maximum: 12
    points:
      under_18: 0
      18-35: 12
      '36': 11
      '37': 10
      '38': 9
      '39': 8
      '40': 7
      '41': 6
      '42': 5
      '43': 4
      '44': 3
      '45': 2
      '46': 1
      47+: 0
    source_id: irpr_75_83
  arranged_employment:
    maximum: 10
    qualifying_offer_points: 10
    eligible_teer:
    - 0
    - 1
    - 2
    - 3
    condition: Verified under IRPR R82 or 2026-11-03 LMIA-exemption public policy (no LMIA required; officer
      assesses genuineness; NOC 41200 non-wage remuneration recognized from 2026-11-17)
    source_id: irpr_75_83
  adaptability:
    maximum: 10
    additive_then_cap: 10
    points:
      spouse_language_clb5_all_four: 5
      candidate_past_study: 5
      spouse_past_study: 5
      candidate_past_work: 10
      spouse_past_work: 5
      arranged_employment_bonus: 5
      eligible_relative_in_canada: 5
    spouse_language_condition: Grid key spouse_language_clb5_all_four (and claim identifier spouse_clb5_all_four,
      retained for compatibility with released AnyCase clients) is awarded when the accompanying spouse
      or common-law partner has CLB/NCLC 4 or higher in all 4 language abilities on an approved test less
      than 2 years old (IRPR s. 83(1)(a)).
    arranged_employment_bonus_condition: Award only if 10 arranged employment points were awarded under
      IRPR R82(2) or the 2026-11-03 LMIA-exemption public policy (IRPR R83(1)(e) exemption).
    source_id: irpr_75_83
evaluation:
  rule_statuses:
  - PASS
  - FAIL
  - NEEDS_REVIEW
  note: All six redlines are evaluated; missing material is NEEDS_REVIEW unless an explicit disqualifying
    fact is already known.
rules:
- id: fswp_gate_continuous_experience
  category: statutory_gate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.primary_occupation_teer
  - candidate.primary_occupation_duties_met
  - candidate.experience_paid
  - candidate.experience_continuous_months
  - candidate.experience_counted_hours
  - candidate.experience_last_10_years
  pass_if: (candidate.primary_occupation_teer in [0, 1, 2, 3] && candidate.primary_occupation_duties_met
    == true && candidate.experience_paid == true && candidate.experience_continuous_months >= 12 && candidate.experience_counted_hours
    >= 1560 && candidate.experience_last_10_years == true) || candidate.researcher_public_policy_met == true
  fail_if: (candidate.primary_occupation_teer in [4, 5] || candidate.primary_occupation_duties_met == false
    || candidate.experience_paid == false || candidate.experience_continuous_months < 12 || candidate.experience_counted_hours
    < 1560 || candidate.experience_last_10_years == false) && !(candidate.researcher_public_policy_met == true)
  evidence_anchor:
    evidence_unit_id: federal_ee:express_entry_fswp_program:full_document_body
    source_id: express_entry_fswp_program
    source_file: abecef79e6f84ed8837a54e1ee54388628e0c91616fdc4e210a6ba5179b2ed74
    section: Skilled work experience
    verbatim_excerpt: be at least <strong>1 year of continuous work</strong> or 1,560 hours total
  secondary_evidence_anchors:
  - evidence_unit_id: federal_ee:ircc_public_policy_researchers_2026_11_17:full_document_body
    source_id: ircc_public_policy_researchers_2026_11_17
    source_file: 8f034cb57466d32e6f6a8699226994229e0246e2aebb13f4d27b6e28dd7130f1
    section: Conditions (eligibility requirements) — NOC 41200 non-wage remuneration within 3 years (exempts IRPR 75(2)(a)–(c))
    verbatim_excerpt: Has acquired in Canada, within the three years before the date on which their application
      for permanent residence is received, one year of full-time work experience
- id: fswp_gate_language_clb7
  category: statutory_gate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.language_test.approved_designated_test
  - candidate.language_test.valid_within_two_years
  - candidate.language_test.listening_clb
  - candidate.language_test.reading_clb
  - candidate.language_test.writing_clb
  - candidate.language_test.speaking_clb
  pass_if: candidate.language_test.approved_designated_test == true && candidate.language_test.valid_within_two_years
    == true && candidate.language_test.listening_clb >= 7 && candidate.language_test.reading_clb >= 7
    && candidate.language_test.writing_clb >= 7 && candidate.language_test.speaking_clb >= 7
  fail_if: candidate.language_test.approved_designated_test == false || candidate.language_test.valid_within_two_years
    == false || candidate.language_test.listening_clb < 7 || candidate.language_test.reading_clb < 7 ||
    candidate.language_test.writing_clb < 7 || candidate.language_test.speaking_clb < 7
  evidence_anchor:
    evidence_unit_id: federal_ee:express_entry_language_results:full_document_body
    source_id: express_entry_language_results
    source_file: 6ce1925b2d3efb4da6c35691195c7575c52f0d24f9503bee2e54ff00997d31a3
    section: Federal Skilled Worker Program — First official language
    verbatim_excerpt: "<th>English</th>\r\n                            <td>CLB 7</td>\r\n                        </tr>\r\n                        <tr>\r\n                            <th>French</th>\r\n                            <td>NCLC7</td>"
- id: fswp_gate_education_credential
  category: statutory_gate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.education.canadian_secondary_or_higher
  conditional_required_fields:
    when: candidate.education.canadian_secondary_or_higher == false
    fields:
    - candidate.education.foreign_secondary_or_higher
    - candidate.education.eca_designated
    - candidate.education.eca_valid_within_five_years
  pass_if: candidate.education.canadian_secondary_or_higher == true || (candidate.education.foreign_secondary_or_higher
    == true && candidate.education.eca_designated == true && candidate.education.eca_valid_within_five_years
    == true)
  fail_if: candidate.education.canadian_secondary_or_higher == false && (candidate.education.foreign_secondary_or_higher
    == false || candidate.education.eca_designated == false || candidate.education.eca_valid_within_five_years
    == false)
  evidence_anchor:
    evidence_unit_id: federal_ee:express_entry_education_assessment:full_document_body
    source_id: express_entry_education_assessment
    source_file: 5d4deedbba59bec5173cef9428f08a3a50e0352f48841ccbbb74a2ee09d2a617
    section: Education
    verbatim_excerpt: If you completed your education <strong>outside Canada</strong>
- id: fswp_gate_settlement_funds
  category: statutory_gate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.authorized_to_work_in_canada
  - candidate.valid_arranged_employment
  conditional_required_fields:
    when: '!(candidate.authorized_to_work_in_canada == true && candidate.valid_arranged_employment ==
      true)'
    fields:
    - candidate.family_size
    - funds.available_cad
    - funds.evidence_verified
  pass_if: (candidate.authorized_to_work_in_canada == true && candidate.valid_arranged_employment == true)
    || (funds.evidence_verified == true && ((candidate.family_size == 1 && funds.available_cad >= 15263)
    || (candidate.family_size == 2 && funds.available_cad >= 19001) || (candidate.family_size == 3 &&
    funds.available_cad >= 23360) || (candidate.family_size == 4 && funds.available_cad >= 28362) || (candidate.family_size
    == 5 && funds.available_cad >= 32168) || (candidate.family_size == 6 && funds.available_cad >= 36280)
    || (candidate.family_size == 7 && funds.available_cad >= 40392) || (candidate.family_size > 7 && funds.available_cad
    >= 40392 + (candidate.family_size - 7) * 4112)))
  fail_if: '!(candidate.authorized_to_work_in_canada == true && candidate.valid_arranged_employment ==
    true) && funds.evidence_verified == true && ((candidate.family_size == 1 && funds.available_cad <
    15263) || (candidate.family_size == 2 && funds.available_cad < 19001) || (candidate.family_size ==
    3 && funds.available_cad < 23360) || (candidate.family_size == 4 && funds.available_cad < 28362) ||
    (candidate.family_size == 5 && funds.available_cad < 32168) || (candidate.family_size == 6 && funds.available_cad
    < 36280) || (candidate.family_size == 7 && funds.available_cad < 40392) || (candidate.family_size
    > 7 && funds.available_cad < 40392 + (candidate.family_size - 7) * 4112))'
  missing_or_unverified: NEEDS_REVIEW — funds evidence, exemption or family-size calculation is unverified.
  evidence_anchor:
