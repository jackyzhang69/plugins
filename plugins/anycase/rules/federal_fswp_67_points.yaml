schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  - funds
  - score
  types:
    assessment_date: ISO-8601 date
    candidate:
      intended_province: lowercase Canadian province or territory name
      primary_occupation_teer: integer 0–5 verified against NOC 2021
      primary_occupation_duties_met: boolean; lead statement and substantial main duties including essential
        duties
      experience_paid: boolean (or null when unverified); paid by wages or commission under IRPR s. 73(2).
        Stipend-, grant-, bursary- or scholarship-paid NOC 41200 work counts ONLY under the 2026-11-17
        Temporary Public Policy for researchers (K unit federal_ee:ircc_public_policy_researchers_2026_11_17:full_document_body)
        when paid by a Canadian institution/entity AND the candidate has at least 1 year of full-time-equivalent
        NOC 41200 work in Canada within the 3 years before PR application receipt AND is invited to apply on
        or after 2026-11-17; otherwise false, or null (NEEDS_REVIEW) when the payer, the 3-year window or
        the invitation date is unverified.
      researcher_public_policy_met: "optional boolean (or null when unverified); true ONLY when all conditions
        of the 2026-11-17 Temporary Public Policy for researchers (K unit federal_ee:ircc_public_policy_researchers_2026_11_17:full_document_body)
        are verified: invited to apply on or after 2026-11-17, acquired in Canada within the 3 years before
        PR application receipt at least 1 year of full-time (or equivalent part-time) NOC 41200 work experience
        (with any non-wage remuneration such as a stipend, grant, bursary or scholarship paid by a Canadian
        institution/entity), and performed the lead statement and a substantial number of main duties; false
        when the candidate does not meet these conditions. When true, satisfies fswp_gate_continuous_experience
        (exempts IRPR paragraphs 75(2)(a), (b), and (c), including continuity)."
      experience_continuous_months: number; uninterrupted calendar months in same primary NOC
      experience_counted_hours: number; qualifying hours with no more than 30 hours per week credited
      experience_last_10_years: boolean
      language_test:
        approved_designated_test: boolean; approved designated test at application
        valid_within_two_years: boolean
        listening_clb: integer
        reading_clb: integer
        writing_clb: integer
        speaking_clb: integer
      second_language_test: approved valid test and four CLB/NCLC abilities when present; present=false
        if none
      highest_credential: one of scoring_grid.education.points keys, with credential/ECA evidence
      selection_experience_qualifying_months: qualifying skilled-work FTE months, including the continuous
        primary-occupation period
      age_years: age at application
      arranged_employment_r82_verified: boolean; verified under IRPR R82 or the 2026-11-03 LMIA-exemption
        public policy (no LMIA required; officer assesses employer/offer genuineness; NOC 41200 non-wage
        remuneration recognized from 2026-11-17)
      adaptability_claims: "list of verified IRPR R83 factors (each at most once): spouse_clb5_all_four
        (legacy/client-compatible identifier awarded when the accompanying spouse or common-law partner
        has CLB/NCLC 4 or higher in all 4 language abilities on an approved test less than 2 years old,
        IRPR s. 83(1)(a)), candidate_past_study_in_canada, spouse_past_study_in_canada, candidate_past_work_in_canada,
        spouse_past_work_in_canada, arranged_employment_bonus (requires awarded R82/public-policy points),
        eligible_relative_in_canada"
      education:
        canadian_secondary_or_higher: boolean
        foreign_secondary_or_higher: boolean
        eca_designated: boolean
        eca_valid_within_five_years: boolean
      family_size: integer >= 1, includes non-accompanying spouse and dependent children
      authorized_to_work_in_canada: boolean
      valid_arranged_employment: boolean; verified under IRPR R82 or the 2026-11-03 LMIA-exemption public
        policy (no LMIA required; officer assesses genuineness; online profile still uses placeholder
        LMIA Yes / 00000)
    funds:
      available_cad: number; transferable, available and unencumbered
      evidence_verified: boolean
    score:
      language: integer 0–28
      education: integer 0–25
      experience: integer 0–15
      age: integer 0–12
      arranged_employment: integer 0–10
      adaptability: integer 0–10
