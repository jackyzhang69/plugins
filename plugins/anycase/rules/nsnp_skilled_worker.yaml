    section: SKILLED WORKER - ELIGIBILITY
    verbatim_excerpt: be 21 to 55 years old;
- id: nsnp_sw_education_threshold
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.has_high_school_or_higher
  pass_if: candidate.has_high_school_or_higher == true
  fail_if: candidate.has_high_school_or_higher == false
  missing_or_unverified: 'NEEDS_REVIEW: High school diploma is unverified.'
  provenance:
    source_file: https://liveinnovascotia.com/skilled-worker
    section: Skilled Worker - Eligibility
    verbatim: have a high school diploma;
  evidence_anchor:
