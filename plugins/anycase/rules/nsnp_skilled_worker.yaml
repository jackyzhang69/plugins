schema_version: 1.0.0
catalog_id: nsnp_skilled_worker
category: Nova Scotia Nominee Program
display_name: 'Nova Scotia Nominee Program: Skilled Worker'
status: ACTIVE
program_id: NSNP_SKILLED_WORKER
stream_id: SKILLED_WORKER
jurisdiction: CA-NS
effective_date: '2026-09-01'
source_edition: 'Skilled Worker stream page (liveinnovascotia.com/skilled-worker, no page date, retrieved 2026-11-16) and Skilled Worker Stream Submission Guide, Nova Scotia Nominee Program (September 2026)'
source_url: https://liveinnovascotia.com/skilled-worker
decision_scope: >-
  Pre-screen of the core Skilled Worker category (job offer in any occupation). The Construction, Physician and
  Occupations In-Demand sub-criteria are not evaluated; Occupations In-Demand currently lists no occupations. No
  equity/ownership percentage cap and no genuineness probability test exist in the sources and none is evaluated;
  self-employment or control of the employer is a stated exclusion. A pass is not nomination.
sources:
- id: ns_skilled_worker_stream_page
  title: Nova Scotia Skilled Worker (stream page)
  url: https://liveinnovascotia.com/skilled-worker
  sha256: 8a94cee5f07d5ea5185346dfe94caa3318d88fa254e4dd979ec23fa886a22988
  retrieved_at: '2026-11-16'
- id: ns_skilled_worker_guide
  title: Nova Scotia Skilled Worker Stream Submission Guide (September 2026)
  url: https://liveinnovascotia.com/sites/default/files/2026-02/Guide-NSNP-Skilled-Worker-English.pdf
  sha256: f70cd959c04bc975f182b5603f2a59cd58459ab3ffa7faf07e0186edea73c3cc
  retrieved_at: '2026-11-16'
schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  - job_offer
  - employer
  types:
    assessment_date: ISO-8601 date; application assessment date
    candidate:
      age: integer; applicant age on assessment_date
      has_high_school_or_higher: boolean; high school diploma
      qualifying_work_experience_months: number; complete calendar months of paid, job-related work in the last 5 years
      qualifying_work_hours_last_5_years: number; paid job-related hours in the last 5 years (volunteer work and unpaid internships excluded)
      experience_with_ns_employer_months: number; paid work with the sponsoring employer (needed for TEER 4 and 5)
      self_employed_or_controls_employer: boolean; owns, co-owns or controls the business that employs the applicant, or the arrangement is not at arm's length
      resides_in_canada: boolean
      valid_nonexpired_status_document: boolean; required when resides_in_canada is true
      on_maintained_status: boolean; required when resides_in_canada is true
      legal_status_in_country_of_residence: boolean; used when resides_in_canada is false
      first_language_is_english_or_french: boolean
      language_test:
        valid_at_application: boolean; issued within 2 years of the EOI
        listening_clb: integer
        reading_clb: integer
        writing_clb: integer
        speaking_clb: integer
      settlement_funds_cad: number; funds in the applicant's own name
      settlement_funds_required_cad: number; amount for the family size from the IRCC table named in the guide
      intention_to_reside_in_ns: boolean
    job_offer:
      noc_2021_code: five-digit string
      noc_teer: integer 0-5
      is_in_nova_scotia: boolean
      is_telework_outside_ns: boolean
      weekly_regular_hours: number; full-time is at least 30 hours a week year-round
      indeterminate: boolean; permanent, no end date
      seasonal: boolean
      regular_base_hourly_cad: number
      statutory_minimum_wage_cad: number
      within_provincial_wage_range_for_occupation: boolean
    employer:
      ns_operating_months: integer; continuous operation in Nova Scotia
      in_good_standing: boolean; provincial occupational health and safety and labour authorities
      recruitment_efforts_conducted_or_exempt: boolean; recruited before offering the job (3 advertisements in 3 publications within 6 months before the offer, public for 4 weeks in a row, one in a Canada-wide tool) with no qualified Canadian or permanent resident found
evaluation:
  rule_statuses:
  - PASS
  - FAIL
  - NEEDS_REVIEW
  aggregate:
  - If any CRITICAL_REDLINE rule is FAIL, verdict = FAIL.
  - Otherwise, if any rule is NEEDS_REVIEW, verdict = NEEDS_REVIEW.
  - Otherwise, verdict = PASS.
rules:
- id: nsnp_sw_age_threshold
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.age
  pass_if: candidate.age >= 21 && candidate.age <= 55
  fail_if: (candidate.age != null && candidate.age < 21) || (candidate.age != null && candidate.age > 55)
  missing_or_unverified: 'NEEDS_REVIEW: Candidate age cannot be verified.'
  provenance:
    source_file: https://liveinnovascotia.com/skilled-worker
    section: Skilled Worker - Eligibility
    verbatim: be 21 to 55 years old;
  evidence_anchor:
    evidence_unit_id: "atlantic_documents:ns_skilled_worker_stream_page:skilled_worker_eligibility"
    unit_status: candidate_k_validated_not_published
    candidate_k_id: 15a268851177f815c03bd6c5dc4054c6a2c6894d5b0188ed7d5ed27ee1406db1
    source_id: ns_skilled_worker_stream_page
