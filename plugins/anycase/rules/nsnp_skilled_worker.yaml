- id: nsnp_sw_compensation_floor
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - job_offer.regular_base_hourly_cad
  - job_offer.statutory_minimum_wage_cad
  - job_offer.within_provincial_wage_range_for_occupation
  pass_if: >-
    job_offer.regular_base_hourly_cad >= job_offer.statutory_minimum_wage_cad &&
    job_offer.within_provincial_wage_range_for_occupation == true
  fail_if: >-
    (job_offer.regular_base_hourly_cad != null && job_offer.statutory_minimum_wage_cad != null &&
    job_offer.regular_base_hourly_cad < job_offer.statutory_minimum_wage_cad) ||
    job_offer.within_provincial_wage_range_for_occupation == false
