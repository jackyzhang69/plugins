      verbatim_excerpt: "If your job offer falls under the NOC TEER category 4 or 5, you\nhave 6 months’ paid work experience with the Nova Scotia\nemployer who is offering you the job."
- id: nsnp_sw_language_proficiency
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - job_offer.noc_teer
  - candidate.first_language_is_english_or_french
  conditional_required_fields:
    when: job_offer.noc_teer in [4, 5] || candidate.first_language_is_english_or_french == false
    fields:
    - candidate.language_test.valid_at_application
    - candidate.language_test.listening_clb
    - candidate.language_test.reading_clb
    - candidate.language_test.writing_clb
    - candidate.language_test.speaking_clb
  pass_if: >-
    (job_offer.noc_teer in [0, 1, 2, 3] && (candidate.first_language_is_english_or_french == true ||
    (candidate.language_test.valid_at_application == true && candidate.language_test.listening_clb >= 5 &&
    candidate.language_test.reading_clb >= 5 && candidate.language_test.writing_clb >= 5 && candidate.language_test.speaking_clb >= 5))) ||
    (job_offer.noc_teer in [4, 5] && candidate.language_test.valid_at_application == true && candidate.language_test.listening_clb >= 4 &&
    candidate.language_test.reading_clb >= 4 && candidate.language_test.writing_clb >= 4 && candidate.language_test.speaking_clb >= 4)
  fail_if: >-
    (job_offer.noc_teer in [0, 1, 2, 3] && candidate.first_language_is_english_or_french == false && candidate.language_test.valid_at_application == true &&
    ((candidate.language_test.listening_clb != null && candidate.language_test.listening_clb < 5) ||
    (candidate.language_test.reading_clb != null && candidate.language_test.reading_clb < 5) ||
    (candidate.language_test.writing_clb != null && candidate.language_test.writing_clb < 5) ||
    (candidate.language_test.speaking_clb != null && candidate.language_test.speaking_clb < 5))) ||
    (job_offer.noc_teer in [4, 5] && candidate.language_test.valid_at_application == true &&
    ((candidate.language_test.listening_clb != null && candidate.language_test.listening_clb < 4) ||
    (candidate.language_test.reading_clb != null && candidate.language_test.reading_clb < 4) ||
    (candidate.language_test.writing_clb != null && candidate.language_test.writing_clb < 4) ||
    (candidate.language_test.speaking_clb != null && candidate.language_test.speaking_clb < 4)))
  missing_or_unverified: 'NEEDS_REVIEW: A test within 2 years is missing (mandatory for TEER 4 or 5, and for TEER 0-3 when the first language is not English or French).'
  provenance:
    source_file: Guide-NSNP-Skilled-Worker-English.pdf
    section: Language test results
    page: 30
    verbatim: Your test results must show that you meet at least the CLB level 4 criteria
  evidence_anchor:
    evidence_unit_id: ns.nsnp_skilled_worker.p030.your_test_results_must_show_that_you
    source_file: 56a53a1198fd3569ac2482cde79aa2fb16cd30f2ac88d1f1084672a494165a16
    page: "30"
    section: Language test results (TEER 4 and 5)
    verbatim_excerpt: "Your test results must show that you meet at least the CLB level 4\ncriteria"
    supporting_excerpts:
    - evidence_unit_id: ns.nsnp_skilled_worker.p030.you_must_submit_the_results_of_one
      source_file: 56a53a1198fd3569ac2482cde79aa2fb16cd30f2ac88d1f1084672a494165a16
      page: "30"
      verbatim_excerpt: "You must submit the results of one of these language tests even if your\nfirst language is English or French"
    - evidence_unit_id: ns.nsnp_skilled_worker.p028.if_you_are_submitting_official_language_test
      source_file: 56a53a1198fd3569ac2482cde79aa2fb16cd30f2ac88d1f1084672a494165a16
      page: "28"
      verbatim_excerpt: "the results must have been issued within two (2) years of the date\nyou submit your EOI."
    - evidence_unit_id: "atlantic_documents:ns_skilled_worker_stream_page:skilled_worker_eligibility"
      unit_status: candidate_k_validated_not_published
      candidate_k_id: 15a268851177f815c03bd6c5dc4054c6a2c6894d5b0188ed7d5ed27ee1406db1
      source_file: 0f5a1dd5467ce0088a303621a22ab887878514c6ebe1ac977e9af22bf3fb43c9
      verbatim_excerpt: prove language ability equal to Canadian Language Benchmark (CLB) Level 5 if you are in a NOC TEER category 0, 1, 2, or 3 occupation. If your first language is English or French, that is enough proof.
- id: nsnp_sw_job_permanence_and_hours
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - job_offer.indeterminate
  - job_offer.weekly_regular_hours
  - job_offer.is_in_nova_scotia
  - job_offer.is_telework_outside_ns
  - job_offer.seasonal
  pass_if: >-
    job_offer.indeterminate == true && job_offer.weekly_regular_hours >= 30 && job_offer.is_in_nova_scotia == true &&
    job_offer.is_telework_outside_ns == false && job_offer.seasonal == false
  fail_if: >-
    job_offer.indeterminate == false || (job_offer.weekly_regular_hours != null && job_offer.weekly_regular_hours < 30) ||
    job_offer.is_in_nova_scotia == false || job_offer.is_telework_outside_ns == true || job_offer.seasonal == true
  missing_or_unverified: 'NEEDS_REVIEW: Permanence, year-round hours or Nova Scotia location of the job offer is unverified.'
