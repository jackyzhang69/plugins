- id: nsnp_sw_legal_status
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.resides_in_canada
  conditional_required_fields:
    when: candidate.resides_in_canada == true
    fields:
    - candidate.valid_nonexpired_status_document
    - candidate.on_maintained_status
  pass_if: >-
