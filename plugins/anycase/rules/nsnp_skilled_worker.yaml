    source_sha256: 8a94cee5f07d5ea5185346dfe94caa3318d88fa254e4dd979ec23fa886a22988
    source_edition: no page date; fetched 2026-11-16T18:24:17Z
    section: SKILLED WORKER - ELIGIBILITY
    verbatim_excerpt: have a high school diploma;
- id: nsnp_sw_work_experience
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.qualifying_work_experience_months
  - candidate.qualifying_work_hours_last_5_years
  - job_offer.noc_teer
  conditional_required_fields:
    when: job_offer.noc_teer in [4, 5]
    fields:
    - candidate.experience_with_ns_employer_months
  pass_if: >-
    candidate.qualifying_work_experience_months >= 12 && candidate.qualifying_work_hours_last_5_years >= 1560 &&
    (job_offer.noc_teer in [0, 1, 2, 3] || candidate.experience_with_ns_employer_months >= 6)
  fail_if: >-
    (candidate.qualifying_work_experience_months != null && candidate.qualifying_work_experience_months < 12) ||
    (candidate.qualifying_work_hours_last_5_years != null && candidate.qualifying_work_hours_last_5_years < 1560) ||
    (job_offer.noc_teer in [4, 5] && candidate.experience_with_ns_employer_months != null && candidate.experience_with_ns_employer_months < 6)
  missing_or_unverified: 'NEEDS_REVIEW: Paid, job-related work experience months or hours (and for TEER 4 or 5 six months with the sponsoring employer) are unverified.'
  provenance:
    source_file: https://liveinnovascotia.com/skilled-worker
    section: Skilled Worker - Eligibility
    verbatim: have 1 year of work experience related to the job. (Workers in TEER 4 or 5 of the National Occupational Classification must already have six months’ experience with the employer.);
  evidence_anchor:
    evidence_unit_id: "atlantic_documents:ns_skilled_worker_stream_page:skilled_worker_eligibility"
    unit_status: candidate_k_validated_not_published
    candidate_k_id: 15a268851177f815c03bd6c5dc4054c6a2c6894d5b0188ed7d5ed27ee1406db1
    source_id: ns_skilled_worker_stream_page
    source_file: 0f5a1dd5467ce0088a303621a22ab887878514c6ebe1ac977e9af22bf3fb43c9
    source_url: https://liveinnovascotia.com/skilled-worker
    source_sha256: 8a94cee5f07d5ea5185346dfe94caa3318d88fa254e4dd979ec23fa886a22988
    source_edition: no page date; fetched 2026-11-16T18:24:17Z
    section: SKILLED WORKER - ELIGIBILITY
    verbatim_excerpt: have 1 year of work experience related to the job. (Workers in TEER 4 or 5 of the National Occupational Classification must already have six months’ experience with the employer.);
    supporting_excerpts:
    - evidence_unit_id: "atlantic_documents:nsnp_skilled_worker_guide_pdf:p009"
      unit_status: candidate_k_validated_not_published
      candidate_k_id: 3fe226afea70f10bfd544ac5bbcde4126b1c279114c2393d433a43338b80a538
      source_file: 3003b603a778d76007b3a9a607ea3c2e929bed3745dcbc341e1e05e622c1a5d7
      page: "9"
      verbatim_excerpt: "You have worked 12 complete calendar months within the last 5\nyears and a minimum of 1,560 hours. This work must be related to\nthe job you are being offered, AND it must be paid work. It cannot include volunteer work or unpaid internships."
    - evidence_unit_id: "atlantic_documents:nsnp_skilled_worker_guide_pdf:p009"
      unit_status: candidate_k_validated_not_published
      candidate_k_id: 3fe226afea70f10bfd544ac5bbcde4126b1c279114c2393d433a43338b80a538
      source_file: 3003b603a778d76007b3a9a607ea3c2e929bed3745dcbc341e1e05e622c1a5d7
