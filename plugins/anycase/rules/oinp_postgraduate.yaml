  OINP Postgraduate Guidelines (2024/2026)
"source_url": "https://www.ontario.ca/page/oinp-masters-graduate-stream"
"decision_scope": >-
  Deterministic prescreen of statutory university qualification, physical Ontario residency, graduation
  window, language competency (CLB 7 for Masters), and settlement funds for the OINP Masters Graduate
  and PhD Graduate streams. Scoring is calculated by AnyScore EOI models.
