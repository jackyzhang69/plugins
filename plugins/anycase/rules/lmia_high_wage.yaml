schema_version: "1.0.0"
catalog_id: "lmia_high_wage"
jurisdiction: "FED"
category: "Temporary Foreign Worker Program"
display_name: "TFWP LMIA: High-Wage Stream"
status: "ACTIVE"
program_id: "TFWP_LMIA"
stream_id: "HIGH_WAGE"
effective_date: "2026-07-17"
source_edition: "ESDC Temporary Foreign Worker Program Requirements for High-Wage Positions, July 2026 update"
source_url: "https://www.canada.ca/en/employment-social-development/services/foreign-workers/median-wage/high/requirements.html"
decision_scope: "Pre-screen of the seven regulatory rules defined below; PASS is an assessment that program eligibility criteria are met, not an official ESDC LMIA decision."

schema:
  input_type: object
  required_top_level: [assessment_date, employer, job_offer, noul]
  types:
    assessment_date: "ISO-8601 date; LMIA submission or assessment date"
    employer:
      business_name: string
      cra_business_number: string
      is_sex_industry: boolean
      on_ircc_ineligibility_list: boolean
      in_default_of_amp: boolean
      lmia_revocation_past_2_years: boolean
      has_transition_plan: boolean
      transition_plan_exempt: boolean
      transition_plan_exemption_reason: "string or null"
    job_offer:
      province: "two-letter code in [AB, BC, MB, NB, NL, NT, NS, NU, ON, PE, QC, SK, YT]"
      noc_2021_code: "five-digit string"
      noc_teer: "integer 0-5"
      title: string
      work_location_city: string
      work_location_postal_code: string
      regular_hourly_wage_cad: "non-negative decimal"
      prevailing_wage_cad: "non-negative decimal"
      weekly_regular_hours: "non-negative decimal"
      recruitment:
        advertising_duration_days: "non-negative integer"
        consecutive_weeks: "non-negative integer"
        job_bank_used: boolean
        additional_methods_count: "non-negative integer"
        targets_underrepresented_groups: boolean
        conducted_within_3_months: boolean
    noul:
      proposition_id: "is_genuine_labour_shortage"
      probability_true: "decimal in [0,1] or null"
      evidence_complete: boolean
      evidence_refs: "non-empty array of stable evidence identifiers when evidence_complete is true"
      model_version: "non-empty string"

  validation:
    missing_or_null_required_value: "NEEDS_REVIEW with MISSING_MATERIAL and the missing field path"
    invalid_type_or_out_of_range: "NEEDS_REVIEW with INVALID_INPUT and the field path"
    inconsistent_verified_inputs: "NEEDS_REVIEW with CONFLICTING_EVIDENCE"
    unknown_evidence_status: "NEEDS_REVIEW with UNVERIFIED_EVIDENCE"
    no_short_circuit: true

evaluation:
  rule_statuses: [PASS, FAIL, NEEDS_REVIEW]
  aggregate:
    - "If any CRITICAL_REDLINE rule is FAIL, verdict = FAIL."
    - "Otherwise, if any rule is NEEDS_REVIEW, verdict = NEEDS_REVIEW."
    - "Otherwise, verdict = PASS."
  date_semantics:
    application_date: "assessment_date"
  provincial_wage_thresholds_cad:
    "AB": 37.50
    "BC": 38.40
    "MB": 31.33
    "NB": 31.73
    "NL": 33.60
    "NT": 48.00
    "NS": 31.96
    "NU": 45.00
    "ON": 36.92
    "PE": 31.20
    "QC": 36.00
    "SK": 34.62
    "YT": 45.60

rules:
  - id: lmia_employer_ineligibility
    category: employer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - employer.is_sex_industry
      - employer.on_ircc_ineligibility_list
      - employer.in_default_of_amp
      - employer.lmia_revocation_past_2_years
    pass_if: "employer.is_sex_industry == false && employer.on_ircc_ineligibility_list == false && employer.in_default_of_amp == false && employer.lmia_revocation_past_2_years == false"
    fail_if: "employer.is_sex_industry == true || employer.on_ircc_ineligibility_list == true || employer.in_default_of_amp == true || employer.lmia_revocation_past_2_years == true"
    missing_or_unverified: "NEEDS_REVIEW: Employer compliance status, IRCC ineligibility registry standing, or past 2-year revocation history cannot be established."
    interpretation: "Service Canada has no legal authority to process LMIA applications from employers offering sex industry services, banned employers on IRCC registry, employers with unpaid administrative monetary penalties, or employers with an LMIA revoked in the last 2 years."
    evidence_anchor:
      evidence_unit_id: "EU-LMIA-008"
      source_file: "refusal_to_process.html"
      section: "Regulatory authority and ineligibility"
      verbatim_excerpt: "We do not have the authority to process applications from ineligible employers"

  - id: lmia_high_wage_threshold
    category: compensation
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - job_offer.province
      - job_offer.regular_hourly_wage_cad
    pass_if: "job_offer.regular_hourly_wage_cad >= provincial_wage_thresholds_cad.get(job_offer.province, 999.0)"
    fail_if: "job_offer.regular_hourly_wage_cad < provincial_wage_thresholds_cad.get(job_offer.province, 999.0)"
    missing_or_unverified: "NEEDS_REVIEW: Province or offered hourly wage is missing or unverified."
    interpretation: "The offered hourly wage must be at or above the provincial/territorial wage threshold (median wage + 20%). E.g., ON >= $36.92, BC >= $38.40, AB >= $37.50. Wages below route to Low-Wage Stream."
    evidence_anchor:
      evidence_unit_id: "EU-LMIA-001"
      source_file: "median_wage_table.html"
      section: "Hourly wage threshold by province or territory"
      verbatim_excerpt: "If the offered wage is at or above the provincial or territorial hourly wage threshold, you must apply under the stream for high-wage positions"

  - id: lmia_prevailing_wage
    category: compensation
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - job_offer.regular_hourly_wage_cad
      - job_offer.prevailing_wage_cad
    pass_if: "job_offer.regular_hourly_wage_cad >= job_offer.prevailing_wage_cad"
    fail_if: "job_offer.regular_hourly_wage_cad < job_offer.prevailing_wage_cad"
    missing_or_unverified: "NEEDS_REVIEW: Prevailing wage for occupation and sub-region or offered base wage is missing."
    interpretation: "The offered wage must equal or exceed the prevailing wage for the occupation in the sub-region on Job Bank, as well as the wage paid to current Canadian employees in the same position."
    evidence_anchor:
      evidence_unit_id: "EU-LMIA-001"
      source_file: "high_wage_requirements.html"
      section: "Wages, working conditions and occupations"
      verbatim_excerpt: "Wages offered to temporary foreign workers should be similar to wages paid to Canadians and permanent residents hired for the same job"

  - id: lmia_recruitment_minimum_duration
    category: recruitment
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - job_offer.recruitment.advertising_duration_days
      - job_offer.recruitment.consecutive_weeks
      - job_offer.recruitment.conducted_within_3_months
    pass_if: "job_offer.recruitment.advertising_duration_days >= 28 && job_offer.recruitment.consecutive_weeks >= 4 && job_offer.recruitment.conducted_within_3_months == true"
    fail_if: "job_offer.recruitment.advertising_duration_days < 28 || job_offer.recruitment.consecutive_weeks < 4 || job_offer.recruitment.conducted_within_3_months == false"
    missing_or_unverified: "NEEDS_REVIEW: Recruitment advertising dates, duration, or 3-month recency window cannot be verified."
    interpretation: "Recruitment must be conducted for at least 4 consecutive weeks (minimum 28 continuous calendar days) within the 3 months prior to submitting the LMIA application."
    evidence_anchor:
      evidence_unit_id: "EU-LMIA-005"
      source_file: "high_wage_requirements.html"
      section: "Recruitment and advertising"
      verbatim_excerpt: "Employers must conduct at least 4 consecutive weeks of recruitment within the 3 months prior to submitting an application"

  - id: lmia_recruitment_methods_and_diversity
    category: recruitment
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - job_offer.recruitment.job_bank_used
      - job_offer.recruitment.additional_methods_count
      - job_offer.recruitment.targets_underrepresented_groups
    pass_if: "job_offer.recruitment.job_bank_used == true && job_offer.recruitment.additional_methods_count >= 2 && job_offer.recruitment.targets_underrepresented_groups == true"
    fail_if: "job_offer.recruitment.job_bank_used == false || job_offer.recruitment.additional_methods_count < 2 || job_offer.recruitment.targets_underrepresented_groups == false"
    missing_or_unverified: "NEEDS_REVIEW: Proof of Job Bank posting, 2 additional recruitment methods, or underrepresented group targeting is incomplete."
    interpretation: "Employers must advertise on Job Bank plus at least two additional national-reach recruitment methods (minimum 3 total methods). At least one method must actively target underrepresented groups (Indigenous peoples, vulnerable youth, newcomers, persons with disabilities)."
    evidence_anchor:
      evidence_unit_id: "EU-LMIA-005"
      source_file: "high_wage_requirements.html"
      section: "Recruitment and advertising"
      verbatim_excerpt: "The advertisement must be posted on Job Bank and at least two additional recruitment methods... One of the methods must target underrepresented groups"

  - id: lmia_transition_plan
    category: employer
    severity: STATUTORY_GATE
    eval_type: deterministic
    required_fields:
      - employer.has_transition_plan
      - employer.transition_plan_exempt
    pass_if: "employer.has_transition_plan == true || employer.transition_plan_exempt == true"
    fail_if: "employer.has_transition_plan == false && employer.transition_plan_exempt == false"
    missing_or_unverified: "NEEDS_REVIEW: Transition plan commitments or documented grounds for statutory exemption are absent."
    interpretation: "A Transition Plan is mandatory for High-Wage positions to recruit, retain, and train Canadians and permanent residents, unless an exemption applies (e.g. project under 120 days or PR-only support)."
    evidence_anchor:
      evidence_unit_id: "EU-LMIA-006"
      source_file: "high_wage_requirements.html"
      section: "Transition plan"
      verbatim_excerpt: "A Transition Plan is a mandatory requirement for high-wage positions"

  - id: lmia_genuine_labour_shortage
    category: qualitative
    severity: QUALITATIVE_STANDARD
    eval_type: typesafe_jev
    required_fields:
      - noul.proposition_id
      - noul.probability_true
      - noul.evidence_complete
    precondition: "noul.evidence_complete == true && noul.proposition_id == 'is_genuine_labour_shortage'"
    pass_if: "noul.probability_true >= 0.70"
    fail_if: "noul.probability_true < 0.30"
    missing_or_unverified: "NEEDS_REVIEW: Genuine business need and labour shortage probability is borderline (0.30 <= P < 0.70) or qualitative evidence is incomplete."
    interpretation: "ESDC officers assess whether the job vacancy is genuine, reasonable for the employer's business size and revenue, and whether an authentic labour shortage exists that cannot be satisfied by domestic workers."
    evidence_anchor:
      evidence_unit_id: "EU-LMIA-005"
      source_file: "high_wage_requirements.html"
      section: "Assessment criteria"
      verbatim_excerpt: "Service Canada will assess whether the job offer is genuine and if the business has a reasonable employment need"
