schema_version: "1.0.0"
catalog_id: "bcpnp_ei_regional"
jurisdiction: "CA-BC"
category: "Entrepreneur Immigration"
display_name: "BC PNP Entrepreneur Immigration: Regional Pilot"
status: "ACTIVE"
program_id: "BC_PNP_ENTREPRENEUR_IMMIGRATION"
stream_id: "ENTREPRENEUR_REGIONAL"
effective_date: "2024-05-27"
source_edition: "BC PNP Entrepreneur Immigration Program Guide - Regional Stream"
source_url: "https://www.welcomebc.ca/immigrate-to-b-c/bc-pnp-ei-regional-pilot-program-guide-pdf"
decision_scope: "Pre-screen of the nine rules defined below; PASS is not an invitation to register or final nomination."

schema:
  input_type: object
  required_top_level: [assessment_date, candidate, business, community, noul]

evaluation:
  rule_statuses: [PASS, FAIL, NEEDS_REVIEW]
  aggregate:
    - "If any CRITICAL_REDLINE rule is FAIL, verdict = FAIL."
    - "Otherwise, if any rule is NEEDS_REVIEW, verdict = NEEDS_REVIEW."
    - "Otherwise, verdict = PASS."

rules:
  - id: ei_reg_community_referral
    category: community
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - community.has_community_referral
      - community.is_enrolled_participating_community
      - community.community_population
      - community.exploratory_visit_completed
    pass_if: "community.has_community_referral == true && community.is_enrolled_participating_community == true && community.community_population < 75000 && community.exploratory_visit_completed == true"
    fail_if: "community.has_community_referral == false || community.is_enrolled_participating_community == false || community.community_population >= 75000 || community.exploratory_visit_completed == false"
    missing_or_unverified: "NEEDS_REVIEW: Community Referral, enrolled participating community status, exploratory visit record, or population criteria cannot be verified."
    interpretation: "Candidate must complete an exploratory visit and receive an official Community Referral from an enrolled participating municipality with a population under 75,000."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_ei_regional_guide:p7:1_2_streams_at_a_glance
      source_file: "BC-PNP-EI-Regional-Program-Guide.pdf"
      section: "1.2, 2.1"
      page: "7"
      verbatim_excerpt: "establish a new business in B.C. and be referred\nby an enrolled community."

  - id: ei_reg_personal_net_worth
    category: financial
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - business.personal_net_worth_cad
      - business.net_worth_verified
    pass_if: "business.personal_net_worth_cad >= 300000.0 && business.net_worth_verified == true"
    fail_if: "business.personal_net_worth_cad < 300000.0"
    missing_or_unverified: "NEEDS_REVIEW: Personal net worth or statutory third-party verification report cannot be confirmed."
    interpretation: "Candidate must have at least $300,000 CAD in legally obtained, unencumbered personal net worth."
    evidence_anchor:
      evidence_unit_id: bc.bcpnp_entrepreneur_page_2025_09_10.html
      source_file: "7d502d3264cc66d8e4e7068674169929aec2a97b840206a9c09687ac873b9654"
      section: "1.2, 2.2"
      page: "7; 12"
      verbatim_excerpt: "Must have a personal net worth of at least $300,000 CAD"

  - id: ei_reg_eligible_investment
    category: financial
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - business.eligible_investment_cad
    pass_if: "business.eligible_investment_cad >= 100000.0"
    fail_if: "business.eligible_investment_cad < 100000.0"
    missing_or_unverified: "NEEDS_REVIEW: Proposed eligible investment in the participating community is unverified."
    interpretation: "Candidate must make an eligible commercial investment of at least $100,000 CAD from personal funds into the community business."
    evidence_anchor:
      evidence_unit_id: bc.bcpnp_entrepreneur_page_2025_09_10.html
      source_file: "7d502d3264cc66d8e4e7068674169929aec2a97b840206a9c09687ac873b9654"
      section: "1.2, 2.3"
      page: "7; 13"
      verbatim_excerpt: "Must make an eligible personal investment of at least $100,000 CAD in the business"

  - id: ei_reg_equity_ownership
    category: business
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - business.equity_ownership_ratio
    pass_if: "business.equity_ownership_ratio >= 0.51"
    fail_if: "business.equity_ownership_ratio < 0.51"
    missing_or_unverified: "NEEDS_REVIEW: Controlling equity ownership percentage cannot be confirmed."
    interpretation: "Candidate must hold at least 51% (majority controlling ownership) of the newly established regional enterprise."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_ei_regional_guide:p19:any_other_type_of_business_that_by_association_w
      source_file: "BC-PNP-EI-Regional-Program-Guide.pdf"
      section: "1.2, 2.4"
      page: "19"
      verbatim_excerpt: "You must demonstrate that you will own at least 51 per cent of the business in B.C."

  - id: ei_reg_job_creation
    category: business
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - business.new_canadian_jobs_fte
    pass_if: "business.new_canadian_jobs_fte >= 1.0"
    fail_if: "business.new_canadian_jobs_fte < 1.0"
    missing_or_unverified: "NEEDS_REVIEW: Full-time job creation projections or documentation cannot be established."
    interpretation: "Candidate must create at least one new full-time equivalent job for a Canadian citizen or permanent resident in the community."
    evidence_anchor:
      evidence_unit_id: bc.bcpnp_entrepreneur_page_2025_09_10.html
      source_file: "7d502d3264cc66d8e4e7068674169929aec2a97b840206a9c09687ac873b9654"
      section: "1.2, 2.5"
      page: "7; 15"
      verbatim_excerpt: "text-align: left\">Must create at least one new full-time job for a Canadian citizen or permanent resident</td><td style=\"width: 40."

  - id: ei_reg_business_experience
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - candidate.business_owner_months
      - candidate.senior_manager_months
    pass_if: "(candidate.business_owner_months > 36 && candidate.owner_ownership_ratio >= 0.10 && candidate.owner_active_onsite == true && candidate.owner_lookback_months <= 60) || (candidate.senior_manager_months > 48 && candidate.senior_ownership_ratio < 0.10 && candidate.senior_noc_teer in [0,1] && candidate.senior_supervised_fte >= 3 && candidate.senior_active_onsite == true && candidate.senior_lookback_months <= 60) || (candidate.business_owner_months >= 12 && candidate.senior_manager_months >= 24 && candidate.owner_ownership_ratio >= 0.10 && candidate.owner_active_onsite == true && candidate.owner_lookback_months <= 60 && candidate.senior_ownership_ratio < 0.10 && candidate.senior_noc_teer in [0,1] && candidate.senior_supervised_fte >= 3 && candidate.senior_active_onsite == true && candidate.senior_lookback_months <= 60)"
    fail_if: "candidate.business_owner_months <= 36.0 && candidate.senior_manager_months <= 48.0 && (candidate.business_owner_months < 12.0 || candidate.senior_manager_months < 24.0)"
    missing_or_unverified: "NEEDS_REVIEW: Qualifying managerial or business ownership experience cannot be established."
    interpretation: "Within the last 60 months: more than 36 active onsite owner-manager months at >=10% ownership; more than 48 active onsite TEER 0/1 senior-manager months with <10% ownership and >=3 supervised FTE; or at least 12+24 qualifying months. Unknown role evidence does not pass."
    evidence_anchor:
      evidence_unit_id: bc.bcpnp_entrepreneur_page_2025_09_10.html
      source_file: "7d502d3264cc66d8e4e7068674169929aec2a97b840206a9c09687ac873b9654"
      section: "1.2, 2.6"
      page: "7; 16"
      verbatim_excerpt: "Must have a minimum of 3 years experience* as a business owner-manager in the last 5 years"

  - id: ei_reg_new_business_only
    category: business
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - business.is_new_business
      - business.is_acquisition
    pass_if: "business.is_new_business == true && business.is_acquisition == false"
    fail_if: "business.is_new_business == false || business.is_acquisition == true"
    missing_or_unverified: "NEEDS_REVIEW: Business structure classification (new vs acquisition) cannot be confirmed."
    interpretation: "Under the Regional Stream, only the establishment of a brand-new business is permitted. Business acquisitions are explicitly disqualified."
    evidence_anchor:
      evidence_unit_id: bc.bcpnp_entrepreneur_page_2025_09_10.html
      source_file: "7d502d3264cc66d8e4e7068674169929aec2a97b840206a9c09687ac873b9654"
      section: "1.2, 2.7"
      page: "7; 17"
      verbatim_excerpt: "Must establish an eligible new business aligned with the economic development priorities of the referring host community"

  - id: ei_reg_language_floor
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - candidate.language_test.test_type
      - candidate.language_test.valid_at_registration
      - candidate.language_test.listening_clb
      - candidate.language_test.reading_clb
      - candidate.language_test.writing_clb
      - candidate.language_test.speaking_clb
    pass_if: "candidate.language_test.test_type in ['IELTS-General-Training', 'CELPIP-General', 'TEF', 'TCF Canada'] && candidate.language_test.valid_at_registration == true && min(candidate.language_test.listening_clb, candidate.language_test.reading_clb, candidate.language_test.writing_clb, candidate.language_test.speaking_clb) >= 4"
    fail_if: "candidate.language_test.valid_at_registration == false || (candidate.language_test.test_type != None && !(candidate.language_test.test_type in ['IELTS-General-Training', 'CELPIP-General', 'TEF', 'TCF Canada'])) || min(candidate.language_test.listening_clb, candidate.language_test.reading_clb, candidate.language_test.writing_clb, candidate.language_test.speaking_clb) < 4"
    missing_or_unverified: "NEEDS_REVIEW: Mandatory language proficiency test (CLB 4) is unverified or expired."
    interpretation: "CLB 4 in each ability on one of the four tests designated by the May 27, 2024 guide; results must be within 24 months at registration, not at a later application date."
    evidence_anchor:
      evidence_unit_id: bc.bcpnp_entrepreneur_page_2025_09_10.html
      source_file: "7d502d3264cc66d8e4e7068674169929aec2a97b840206a9c09687ac873b9654"
      section: "2.8"
      page: "18"
      verbatim_excerpt: "text-align: left\">Must meet the minimum language requirement of Canadian Language Benchmark level 4<br></td><td style=\"width: 40."

  - id: ei_reg_community_alignment
    category: integrity
    severity: CRITICAL_REDLINE
    eval_type: jev_semantic
    required_fields:
      - assessment_date
      - noul.proposition_id
      - noul.model_version
      - noul.probability_true
      - noul.evidence_complete
      - noul.evidence_refs
    noul_contract:
      proposition_id: "ei_reg_community_alignment"
      fail: "probability_true < 0.30"
      pass: "probability_true >= 0.70"
    missing_or_unverified: "NEEDS_REVIEW: Community economic priority alignment evidence is incomplete or probability is uncertain."
    interpretation: "Evaluates genuine strategic alignment between the proposed enterprise and the host community's published economic development plan."
    evidence_anchor:
      evidence_unit_id: bc.bcpnp_entrepreneur_page_2025_09_10.html
      source_file: "7d502d3264cc66d8e4e7068674169929aec2a97b840206a9c09687ac873b9654"
      section: "2.9"
      page: "20"
      verbatim_excerpt: "Must establish an eligible new business aligned with the economic development priorities of the referring host community"

  - id: ei_reg_education_or_full_ownership
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
    - assessment_date
    pass_if: (education.has_postsecondary_credential == true && education.institution_licensed == true && education.language_training == false && education.recognized_in_canada == true) || (candidate.full_family_ownership_ratio == 1 && candidate.full_ownership_active_months_last_60 >= 36)
    fail_if: (education.has_postsecondary_credential == true && education.institution_licensed == true && education.language_training == false && education.recognized_in_canada == true) == false && (candidate.full_family_ownership_ratio == 1 && candidate.full_ownership_active_months_last_60 >= 36) == false
    missing_or_unverified: 'NEEDS_REVIEW: Missing or unverified source-required facts; no negative inference from absent evidence.'
    interpretation: A licensed postsecondary credential (not language training), or 36 of the last 60 active owner-manager months with 100% ownership shared only with spouse/common-law partner/dependent children. Unknown alternative remains unresolved.
    evidence_anchor:
      source_file: ei_regional_guide_2024_05_27.txt
      section: 2.2(D)
      verbatim_excerpt: experience as an active business owner-manager with 100 per cent ownership of the business for at least 36 of the past 60 months
  - id: ei_reg_ineligible_business_types
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
    - assessment_date
    - business.category
    - business.immigration_linked_investment
    - business.redemption_option
    - business.passive_investment
    - business.disrepute_decision
    - business.disrepute_evidence_ref
    pass_if: business.immigration_linked_investment == false && business.redemption_option == false && business.passive_investment == false && !(business.category in ["bed_and_breakfast", "hobby_farm", "home_based", "payday_loan", "cheque_cashing", "money_changing", "cash_machine", "pawnbroker", "tanning_salon", "dvd_rental", "coin_laundry", "automated_car_wash", "scrap_metal_recycling", "real_estate_brokerage", "insurance_brokerage", "business_brokerage", "real_estate_development", "sexually_explicit_products_or_services"]) && (!(business.category in ["used_goods", "goods_trading"]) || business.value_added_services == true) && business.disrepute_decision == "cleared" && business.disrepute_evidence_ref != ""
    fail_if: business.immigration_linked_investment == true || business.redemption_option == true || business.passive_investment == true || business.category in ["bed_and_breakfast", "hobby_farm", "home_based", "payday_loan", "cheque_cashing", "money_changing", "cash_machine", "pawnbroker", "tanning_salon", "dvd_rental", "coin_laundry", "automated_car_wash", "scrap_metal_recycling", "real_estate_brokerage", "insurance_brokerage", "business_brokerage", "real_estate_development", "sexually_explicit_products_or_services"] || (business.category == "used_goods" && business.value_added_services == false) || (business.category == "goods_trading" && business.value_added_services == false) || business.disrepute_decision == "adverse"
    missing_or_unverified: 'NEEDS_REVIEW: Missing or unverified source-required facts; no negative inference from absent evidence.'
    interpretation: Separate business category, investment terms and documented human disrepute finding; used-goods repairs/refurbishing/recycling and demonstrated value-add goods trading preserve their exceptions. A cleared disrepute finding requires a source/case evidence reference, not a probability.
    evidence_anchor:
      source_file: ei_regional_guide_2024_05_27.txt
      section: 2.3(B)
      verbatim_excerpt: Your registration will be disqualified if you propose an ineligible business.
