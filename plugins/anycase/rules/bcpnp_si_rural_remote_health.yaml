schema_version: "1.0.0"
catalog_id: "bcpnp_si_rural_remote_health"
jurisdiction: "CA-BC"
category: "Skills Immigration"
display_name: "BC PNP Skills Immigration: Rural & Remote Health Initiative"
program_id: "BC_PNP_SKILLS_IMMIGRATION"
stream_id: "RURAL_REMOTE_HEALTH"
status: "TEMPORARY_INITIATIVE"
effective_date: "2026-06-15"
effective_until: "2026-10-07"
source_edition: "BC PNP Skills Immigration Program Guide, Section 4.3"
source_url: "https://www.welcomebc.ca/immigrate-to-b-c/bc-pnp-si-program-guide-pdf"
decision_scope: "Pre-screen of the source-scoped rules below; PASS is not a nomination or complete program-eligibility decision."

schema:
  input_type: object
  required_top_level: [assessment_date, candidate, job_offer, employer, noul]

evaluation:
  rule_statuses: [PASS, FAIL, NEEDS_REVIEW]
  aggregate:
    - "If any CRITICAL_REDLINE rule is FAIL, verdict = FAIL."
    - "Otherwise, if any rule is NEEDS_REVIEW, verdict = NEEDS_REVIEW."
    - "Otherwise, verdict = PASS."
  pinned_statutory_minimum_wage:
    currency: CAD
    hourly_amount: 18.25
    effective_from: "2026-06-01"

rules:
  - id: rrh_initiative_window
    category: stream_policy
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
    pass_if: "assessment_date >= '2026-06-15' && assessment_date <= '2026-10-07'"
    fail_if: "assessment_date < '2026-06-15' || assessment_date > '2026-10-07'"
    missing_or_unverified: "NEEDS_REVIEW: assessment_date is required to verify initiative eligibility window."
    interpretation: "The Temporary Rural/Remote Health Support Initiative accepts registrations exclusively from June 15, 2026 to October 7, 2026."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_si_program_guide:p5:updates_to_this_edition
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "4.3 Temporary Rural/Remote Health Support Initiative"
      page: "5"
      verbatim_excerpt: "Registration for this initiative will open June 15, 2026"

  - id: rrh_health_authority_employer
    category: employer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - employer.health_authority_name
      - employer.has_health_authority_support
      - employer.direct_employee
    pass_if: "employer.has_health_authority_support == true && employer.direct_employee == true && employer.health_authority_name in ['Provincial Health Services Authority', 'First Nations Health Authority', 'Fraser Health', 'Interior Health', 'Island Health', 'Northern Health', 'Vancouver Coastal Health', 'Providence Health Care']"
    fail_if: "employer.has_health_authority_support == false || employer.direct_employee == false || !(employer.health_authority_name in ['Provincial Health Services Authority', 'First Nations Health Authority', 'Fraser Health', 'Interior Health', 'Island Health', 'Northern Health', 'Vancouver Coastal Health', 'Providence Health Care'])"
    missing_or_unverified: "NEEDS_REVIEW: Health authority support or direct employment status cannot be verified."
    interpretation: "Candidate must be a direct employee of one of the 8 designated B.C. public health authorities. Employees of service contractors are explicitly ineligible."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_si_program_guide:p27:4_3_temporary_rural_remote_health_support_initiati
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "4.3(b), 4.3(c)"
      page: "27"
      verbatim_excerpt: "You must be a direct employee of one of the health authorities listed in 4.3 (b)."

  - id: rrh_eligible_occupation
    category: job_offer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - job_offer.noc_2021_code
    pass_if: "job_offer.noc_2021_code in ['64410', '65310', '65312']"
    fail_if: "!(job_offer.noc_2021_code in ['64410', '65310', '65312'])"
    missing_or_unverified: "NEEDS_REVIEW: Job offer NOC code is missing or disputed."
    interpretation: "Under the Rural/Remote Health Support Initiative, only NOC 64410 (Security guards), 65310 (Light duty cleaners), and 65312 (Janitors, caretakers and heavy-duty cleaners) are eligible."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_si_program_guide:p27:4_3_temporary_rural_remote_health_support_initiati
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "4.3(c)"
      page: "27"
      verbatim_excerpt: "Only the following occupations are eligible under this initiative:\n\u2022 64410 Security guards and related security service occupations\n\u2022 65310 Light duty cleaners\n\u2022 65312 Janitors, caretakers and heavy-duty cleaners"

  - id: rrh_rural_remote_location
    category: job_offer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - job_offer.in_rural_remote_location
    pass_if: "job_offer.in_rural_remote_location == true"
    fail_if: "job_offer.in_rural_remote_location == false"
    missing_or_unverified: "NEEDS_REVIEW: Geographic eligibility of work location cannot be confirmed."
    interpretation: "Work location must be in a designated rural or remote region. Work locations in Metro Vancouver, Central Okanagan, or non-island Capital Regional District are strictly disqualified."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_si_program_guide:p28:4_3_d_your_current_work_location_must_be_in_a_ru
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "4.3(d)"
      page: "28"
      verbatim_excerpt: "Your current work location must be in a rural/remote part of the province with the\nsame health authority that has signed your job offer letter."

  - id: rrh_qualifying_work_experience
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - candidate.consecutive_rural_health_months
      - candidate.same_health_authority_history
      - candidate.year_round_history
      - candidate.history_weekly_hours
      - candidate.history_eligible_occupation
      - candidate.history_eligible_rural_site
      - candidate.working_at_registration
      - candidate.history_immediately_before_registration
      - candidate.excluded_leave_months
      - candidate.study_or_coop_months
      - candidate.unapproved_break_months
    pass_if: "candidate.consecutive_rural_health_months - candidate.excluded_leave_months - candidate.study_or_coop_months >= 9 && candidate.same_health_authority_history == true && candidate.year_round_history == true && candidate.history_weekly_hours >= 30 && candidate.history_eligible_occupation == true && candidate.history_eligible_rural_site == true && candidate.working_at_registration == true && candidate.history_immediately_before_registration == true && candidate.unapproved_break_months == 0"
    fail_if: "!(candidate.consecutive_rural_health_months - candidate.excluded_leave_months - candidate.study_or_coop_months >= 9 && candidate.same_health_authority_history == true && candidate.year_round_history == true && candidate.history_weekly_hours >= 30 && candidate.history_eligible_occupation == true && candidate.history_eligible_rural_site == true && candidate.working_at_registration == true && candidate.history_immediately_before_registration == true && candidate.unapproved_break_months == 0)"
    missing_or_unverified: "NEEDS_REVIEW: Source-qualified consecutive work history immediately before registration is unverified."
    interpretation: "Nine source-qualified months immediately before registration: same health authority, eligible occupations and rural sites throughout, full-time/year-round and working at registration. Input total is gross elapsed employment months; subtract non-overlapping excluded leave and study/co-op months. Ordinary vacation up to two weeks counts. Documented medical/parental/maternity/extended vacation and any leave over two weeks do not accrue but may bridge continuity. Unapproved breaks do not qualify."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_si_program_guide:p28:4_3_d_your_current_work_location_must_be_in_a_ru
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "4.3(e)"
      page: "28"
      verbatim_excerpt: "you must have been working full-\ntime, year-round, for at least nine (9) consecutive months"

  - id: rrh_job_offer_hours_duration
    category: job_offer
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - job_offer.indeterminate
      - job_offer.weekly_regular_hours
      - job_offer.year_round
    pass_if: "job_offer.indeterminate == true && job_offer.weekly_regular_hours >= 30.0 && job_offer.year_round == true"
    fail_if: "job_offer.indeterminate == false || job_offer.weekly_regular_hours < 30.0 || job_offer.year_round == false"
    missing_or_unverified: "NEEDS_REVIEW: Indeterminate tenure, year-round status, or full-time hours cannot be confirmed."
    interpretation: "Must be a regular, indeterminate, full-time position offering at least 30 hours per week."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_si_program_guide:p27:4_3_temporary_rural_remote_health_support_initiati
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "4.3(c)"
      page: "27"
      verbatim_excerpt: "You must be currently working in a regular, indeterminate, full-time job in an eligible\noccupation"

  - id: rrh_wage_prevailing
    category: compensation
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - job_offer.regular_base_hourly_cad
      - job_offer.market_range_verified
      - job_offer.market_range_low_cad
      - job_offer.market_range_high_cad
      - job_offer.peer_wage_comparable
      - job_offer.employer_pay_structure_consistent
    precondition: "current_statutory_minimum_verified(assessment_date) == true"
    pass_if: "job_offer.regular_base_hourly_cad >= statutory_minimum(assessment_date) && job_offer.market_range_verified == true && job_offer.regular_base_hourly_cad >= job_offer.market_range_low_cad && job_offer.regular_base_hourly_cad <= job_offer.market_range_high_cad && job_offer.peer_wage_comparable == true && job_offer.employer_pay_structure_consistent == true"
    fail_if: "job_offer.regular_base_hourly_cad < statutory_minimum(assessment_date) || job_offer.regular_base_hourly_cad < job_offer.market_range_low_cad || job_offer.regular_base_hourly_cad > job_offer.market_range_high_cad || job_offer.peer_wage_comparable == false || job_offer.employer_pay_structure_consistent == false"
    missing_or_unverified: "NEEDS_REVIEW: Regular base pay, dated NOC/location wage range, peer wages or employer pay structure cannot be verified."
    interpretation: "Regular base pay excludes bonuses, commissions, profit sharing, tips, overtime, housing/room/board and similar allowances. Family income is assessed separately."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_si_program_guide:p20:3_9_wages
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "3.9"
      page: "20"
      verbatim_excerpt: "Your offered wage must be:\n\u2022 Within the wage range posted on WorkBC or the federal Job Bank website for the\noccupation and location"

  - id: rrh_language_floor
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - candidate.language_test.test_type
      - candidate.language_test.valid_at_application
      - candidate.language_test.listening_clb
      - candidate.language_test.reading_clb
      - candidate.language_test.writing_clb
      - candidate.language_test.speaking_clb
    pass_if: "accepted_designated_test(candidate.language_test.test_type) && candidate.language_test.valid_at_application == true && min(candidate.language_test.listening_clb, candidate.language_test.reading_clb, candidate.language_test.writing_clb, candidate.language_test.speaking_clb) >= 4"
    fail_if: "candidate.language_test.valid_at_application == false || (candidate.language_test.test_type != None && !accepted_designated_test(candidate.language_test.test_type)) || min(candidate.language_test.listening_clb, candidate.language_test.reading_clb, candidate.language_test.writing_clb, candidate.language_test.speaking_clb) < 4"
    missing_or_unverified: "NEEDS_REVIEW: Mandatory language proficiency test (CLB 4) is unverified or expired."
    interpretation: "All applicants under TEER 4 and 5 occupations must demonstrate language proficiency of at least CLB 4 across all 4 competencies."
    evidence_anchor:
      evidence_unit_id: bcpnp:bc_pnp_si_program_guide:p17:the_following_table_shows_the_minimum_scores_requi
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "3.4"
      page: "17"
      verbatim_excerpt: "The following table shows the minimum scores required for the designated tests to meet CLB 4"

  - id: rrh_equity_cap
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
      - assessment_date
      - candidate.ownership_max_combined_ratio
      - candidate.ownership_window_complete
      - candidate.applicant_or_family_control
    pass_if: "candidate.ownership_max_combined_ratio < 0.10 && candidate.applicant_or_family_control == false"
    fail_if: "candidate.ownership_max_combined_ratio >= 0.10 || candidate.applicant_or_family_control == true"
    missing_or_unverified: "NEEDS_REVIEW: Ownership or control conditions cannot be established."
    interpretation: "Standard BCPNP 10% equity restriction applies."
    evidence_anchor:
      evidence_unit_id: "bcpnp:bc_pnp_si_program_guide:p22:3_12_eligible_employment_situations"
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "3.12"
      page: "22"
      verbatim_excerpt: "\u2022 You do not hold or exercise control over an ownership stake of 10 per cent or greater in"

  - id: rrh_job_offer_genuineness
    category: integrity
    severity: CRITICAL_REDLINE
    eval_type: jev_semantic
    required_fields:
      - assessment_date
      - noul.proposition_id
      - noul.model_version
      - noul.probability_true
      - noul.evidence_complete
      - noul.evidence_refs
    noul_contract:
      proposition_id: "rrh_job_offer_genuineness"
      fail: "probability_true < 0.30"
      pass: "probability_true >= 0.70"
    missing_or_unverified: "NEEDS_REVIEW: Operational staffing evidence is incomplete or probability falls in borderline band (0.30 <= P < 0.70)."
    interpretation: "Evaluates genuine ongoing operational support needs in rural hospital/clinic facilities."
    evidence_anchor:
      evidence_unit_id: "bcpnp:bc_pnp_si_program_guide:p36:6_11_genuine_need_for_the_position"
      source_file: "BC-PNP-Skills-Immigration-Program-Guide.pdf"
      section: "6.11"
      page: "36"
      verbatim_excerpt: "Your employer must demonstrate that there is a genuine need for the position."

  - id: rrh_continuity_income_secondary
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
    - assessment_date
    - candidate.working_fulltime
    - candidate.same_occupation
    - candidate.same_worksite
    - candidate.same_health_authority
    - candidate.minimum_income_history_months
    - candidate.secondary_education_completed
    pass_if: candidate.working_fulltime == true && candidate.same_occupation == true && candidate.same_worksite == true && candidate.same_health_authority == true && candidate.minimum_income_history_months >= 9 && candidate.secondary_education_completed == true
    fail_if: candidate.working_fulltime == false || candidate.same_occupation == false || candidate.same_worksite == false || candidate.same_health_authority == false || candidate.minimum_income_history_months < 9 || candidate.secondary_education_completed == false
    missing_or_unverified: 'NEEDS_REVIEW: Missing or unverified source-required facts; no negative inference from absent evidence.'
    interpretation: Continue full-time in the same eligible occupation, rural/remote worksite and health authority throughout the process. Minimum family income must be met throughout the full nine months before registration and application; completed secondary education is independently required. Unknown facts remain unresolved.
    evidence_anchor:
      source_file: si_guide_2026_06_10.txt
      section: 4.3(f)-(h)
      verbatim_excerpt: Throughout the BC PNP application process you must continue working

  - id: rrh_immigration_status
    category: candidate
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
    - candidate.in_canada
    - candidate.working_without_authorization
    - candidate.inadmissible
    - candidate.unresolved_refugee_claim
    - candidate.under_removal_order
    - candidate.requires_authorization_to_return
    pass_if: (candidate.in_canada == false || candidate.status_valid == true || (candidate.status_valid == false && candidate.restoration_filed == true && candidate.restoration_filing_days_after_expiry >= 0 && candidate.restoration_filing_days_after_expiry <= 90)) && candidate.working_without_authorization == false && candidate.inadmissible == false && candidate.unresolved_refugee_claim == false && candidate.under_removal_order == false && candidate.requires_authorization_to_return == false
    fail_if: (candidate.in_canada == true && candidate.status_valid == false && (candidate.restoration_filed == false || candidate.restoration_filing_days_after_expiry > 90)) || candidate.working_without_authorization == true || candidate.inadmissible == true || candidate.unresolved_refugee_claim == true || candidate.under_removal_order == true || candidate.requires_authorization_to_return == true
    missing_or_unverified: 'NEEDS_REVIEW: Source-required facts or discretionary assessment are missing or unresolved; no adverse inference from absent evidence.'
    interpretation: Only the out-of-status exception is satisfied by timely restoration; all independent nomination blockers remain assessed. Days are elapsed calendar days from status expiry to actual filing, not assessment. Missing conditional facts remain unresolved.
    evidence_anchor:
      source_file: si_guide_2026_06_10.txt
      section: '3.3'
      verbatim_excerpt: restoration of status within the 90-day eligibility period
  - id: rrh_family_income
    category: compensation
    severity: CRITICAL_REDLINE
    eval_type: deterministic
    required_fields:
    - family.size
    - family.size_evidence_complete
    - family.in_metro_vancouver
    - job_offer.regular_base_hourly_cad
    - job_offer.weekly_regular_hours
    pass_if: (family.in_metro_vancouver == true && family.size == 1 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 31264 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 31264))) || (family.in_metro_vancouver == true && family.size == 2 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 38922 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 38922))) || (family.in_metro_vancouver == true && family.size == 3 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 47851 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 47851))) || (family.in_metro_vancouver == true && family.size == 4 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 58096 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 58096))) || (family.in_metro_vancouver == true && family.size == 5 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 65892 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 65892))) || (family.in_metro_vancouver == true && family.size == 6 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 74315 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 74315))) || (family.in_metro_vancouver == true && family.size >= 7 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 82739 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 82739))) || (family.in_metro_vancouver == false && family.size == 1 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 26057 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hours, 40) * 52) >= 26057))) || (family.in_metro_vancouver == false && family.size == 2 && ((job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) >= 32437 || (family.spouse_valid_work_authorization == true && family.spouse_currently_employed_in_bc == true && (job_offer.regular_base_hourly_cad * min(job_offer.weekly_regular_hours, 40) * 52) + (family.spouse_regular_base_hourly_cad * min(family.spouse_weekly_regular_hou