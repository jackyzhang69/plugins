schema_version: 1.0.0
catalog_id: federal_agri_food
jurisdiction: CA
category: Federal agri-food
display_name: Agri-Food Pilot
status: "LEGACY_CLOSED"
closure_basis: 'Agri-Food Pilot: "The Agri-Food Pilot ended on May 14, 2025. We’ll continue to process applications we accepted before this date." (unit agri.guide.after_processing_cohort)'
program_id: FEDERAL_AGRI_FOOD
stream_id: AGRI_FOOD
effective_date: '2025-05-14'
effective_until: '2025-05-14'
source_edition: Agri-Food Pilot
source_url: https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/agri-food-pilot.html
decision_scope: Deterministic Agri-Food Pilot prescreen. No points grid. The eligible-occupation list is a supplied flag because
  the list changes.
sources:
- id: afp
  title: Agri-Food Pilot
  url: https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/agri-food-pilot.html
  citation: Agri-Food Pilot
  legal_authority: Official program baseline used for the redline. Points arithmetic stays in AnyScore.
schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  types:
    assessment_date: ISO-8601 date
reference_points_grid:
  note: The Agri-Food Pilot has no selection points grid.
rules:
- id: afp_program_lifecycle
  category: stream_policy
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - assessment_date
  pass_if: "assessment_date <= '2025-05-14'"
  fail_if: "false"
  missing_or_unverified: 'NEEDS_REVIEW: the Agri-Food Pilot ended on May 14, 2025 and only applications received before that date are processed; an assessment after this date cannot pass.'
  interpretation: 'The official programme page records the closure date. Any assessment dated after May 14, 2025 must not be treated as eligible for a new application.'
  evidence_anchor:
    evidence_unit_id: agri.guide.after_processing_cohort
    source_file: d5f3e43b49f0654b51bc3ae4b2bc20eff653657116e9be906d7e945e472dce3e
    section: After you apply
    verbatim_excerpt: "<p>The Agri-Food Pilot ended on May 14, 2025. We\u2019ll continue to process applications we accepted before this date."
- id: afp_occupation
  category: occupation
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.eligible_occupation
  pass_if: candidate.eligible_occupation == true
  fail_if: candidate.eligible_occupation == false
  missing_or_unverified: 'NEEDS_REVIEW: Eligible agri-food occupation cannot be verified.'
  evidence_anchor:
    evidence_unit_id: agri.guide.eligibility
    source_file: d5f3e43b49f0654b51bc3ae4b2bc20eff653657116e9be906d7e945e472dce3e
    section: Eligible industries and occupations
    source_id: afp
    verbatim_excerpt: "from an employer whose primary business activities are in an eligible industry (NAICS)</li>\r\n  <li>for an eligible occupation (NOC)</li>\r\n  <li>for an eligible occupation (NOC) and industry (NAICS) combination as listed above"
- id: afp_experience
  category: experience
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.canadian_nonseasonal_months_past_3_years
  pass_if: candidate.canadian_nonseasonal_months_past_3_years >= 12
  fail_if: candidate.canadian_nonseasonal_months_past_3_years < 12
  missing_or_unverified: 'NEEDS_REVIEW: Canadian non-seasonal experience cannot be verified.'
  evidence_anchor:
    evidence_unit_id: agri_food_checklist_0116_pdf.p03
    source_file: 03beafbbc687a98e399a761fda99969636f50bbde6f3013f3aaf5a0de93298ec
    page: "3"
    section: Eligible work experience
    source_id: afp
    verbatim_excerpt: "at least 12 months of cumulative authorized, full-time, non-seasonal work experience in Canada"
- id: afp_offer
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - job_offer.nonseasonal
  - job_offer.weekly_hours
  pass_if: job_offer.nonseasonal == true && job_offer.weekly_hours >= 30
  fail_if: job_offer.nonseasonal == false || job_offer.weekly_hours < 30
  missing_or_unverified: 'NEEDS_REVIEW: Job-offer terms cannot be verified.'
  evidence_anchor:
    evidence_unit_id: agri.guide.eligibility
    source_file: d5f3e43b49f0654b51bc3ae4b2bc20eff653657116e9be906d7e945e472dce3e
    section: Job offer
    source_id: afp
    verbatim_excerpt: "full time and non-seasonal</li>\r\n  <li>indeterminate period (no end date)"
- id: afp_language
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.language_clb_minimum
  pass_if: candidate.language_clb_minimum >= 4
  fail_if: candidate.language_clb_minimum < 4
  missing_or_unverified: 'NEEDS_REVIEW: Language cannot be verified.'
  evidence_anchor:
    evidence_unit_id: agri.guide.eligibility
    source_file: d5f3e43b49f0654b51bc3ae4b2bc20eff653657116e9be906d7e945e472dce3e
    section: Language testing
    source_id: afp
    verbatim_excerpt: "at level 4 (or above) across all language abilities"
- id: afp_education
  category: education
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.meets_canadian_high_school
  pass_if: candidate.meets_canadian_high_school == true
  fail_if: candidate.meets_canadian_high_school == false
  missing_or_unverified: 'NEEDS_REVIEW: Education cannot be verified.'
  evidence_anchor:
    evidence_unit_id: agri.guide.eligibility
    source_file: d5f3e43b49f0654b51bc3ae4b2bc20eff653657116e9be906d7e945e472dce3e
    section: Educational requirements
    source_id: afp
    verbatim_excerpt: "You must have a high-school diploma, post-secondary certificate or degree that is valid and equal to a Canadian"
