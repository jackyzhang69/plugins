schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  types:
    assessment_date: ISO-8601 date
    candidate:
      trade_months_past_5_years: Verified full-time-equivalent skilled trade work months in the 5 years
        before application (24 months = 3,120 hours).
      has_qualifying_job_offer: Verified full-time job offer for at least 1 year from up to 2 employers
        in an eligible trade NOC; from 2026-11-03 no LMIA is required (officer assesses genuineness; online
        profile uses placeholder LMIA Yes / 00000). Leave null/absent if genuineness is unverified.
      has_certificate_of_qualification: Certificate of qualification in the skilled trade issued by a
        Canadian provincial, territorial, or federal authority.
      speaking_clb: CLB/NCLC speaking score
      listening_clb: CLB/NCLC listening score
      reading_clb: CLB/NCLC reading score
      writing_clb: CLB/NCLC writing score
      intended_province: lowercase Canadian province or territory name (must be outside Quebec)
      authorized_to_work_in_canada: boolean; currently authorized to legally work in Canada
      family_size: integer >= 1, includes non-accompanying spouse and dependent children
    funds:
      available_cad: number; transferable, available and unencumbered settlement funds in CAD
      evidence_verified: boolean; settlement funds evidence verified
reference_points_grid:
  note: The Federal Skilled Trades class has no selection points grid.
rules:
- id: fstp_experience
  category: experience
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.trade_months_past_5_years
  pass_if: candidate.trade_months_past_5_years >= 24
  fail_if: candidate.trade_months_past_5_years < 24
  missing_or_unverified: 'NEEDS_REVIEW: Skilled-trade experience cannot be verified.'
  evidence_anchor:
    evidence_unit_id: federal_ee:express_entry_fstp_program:full_document_body
    source_id: express_entry_fstp_program
    source_file: 09c2d12f4b8c1c3c646d2dbf4d8173ef5211fa8157746c551aa00a9451ed5d53
    section: Skilled trades work experience
    verbatim_excerpt: be at least <strong>2&nbsp;years</strong> of full-time work experience
- id: fstp_offer_or_certificate
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.has_qualifying_job_offer
  - candidate.has_certificate_of_qualification
  pass_if: candidate.has_qualifying_job_offer == true || candidate.has_certificate_of_qualification ==
    true
  fail_if: candidate.has_qualifying_job_offer == false && candidate.has_certificate_of_qualification ==
    false
  missing_or_unverified: 'NEEDS_REVIEW: Job offer (including genuineness assessment without LMIA from
    2026-11-03) or certificate of qualification cannot be verified.'
  evidence_anchor:
    evidence_unit_id: federal_ee:ircc_job_offer:full_document_body
    source_id: ircc_job_offer
    source_file: 6327974a64386fb5a813e2ae45104273d898b5490b1e58a5020df52996f0120a
    section: Valid job offers — no LMIA required from 2026-11-03 (up to 2 employers for FSTP)
    verbatim_excerpt: "Labour Market Impact Assessment (LMIA) for a job offer to qualify.</li>\r\n        <li>Having an LMIA won’t give you more Comprehensive Ranking System points"
- id: fstp_language
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.speaking_clb
  - candidate.listening_clb
  - candidate.reading_clb
  - candidate.writing_clb
  pass_if: candidate.speaking_clb >= 5 && candidate.listening_clb >= 5 && candidate.reading_clb >= 4 &&
    candidate.writing_clb >= 4
  fail_if: candidate.speaking_clb < 5 || candidate.listening_clb < 5 || candidate.reading_clb < 4 || candidate.writing_clb
    < 4
  missing_or_unverified: 'NEEDS_REVIEW: Language scores cannot be verified.'
  evidence_anchor:
    evidence_unit_id: federal_ee:express_entry_language_results:full_document_body
    source_id: express_entry_language_results
    source_file: 07ba664e866fd5a3dc46874e1a77f55b308009f4bd74a6165b0e238b77af3a1e
    section: Language requirements — Federal Skilled Trades Program minimum level
    verbatim_excerpt: "<td>Speaking and listening </td>\r\n                            <td><strong>CLB 5</strong></td>\r\n                        </tr>\r\n                        <tr>\r\n                            <th>English</th>\r\n                            <td>Reading and writing </td>\r\n                            <td><strong>CLB 4</strong></td>"
- id: fstp_intended_residence
  category: statutory_gate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.intended_province
  pass_if: candidate.intended_province in ['alberta', 'british columbia', 'manitoba', 'new brunswick',
    'newfoundland and labrador', 'northwest territories', 'nova scotia', 'nunavut', 'ontario', 'prince
    edward island', 'saskatchewan', 'yukon']
  fail_if: candidate.intended_province == 'quebec'
  missing_or_unverified: 'NEEDS_REVIEW: Intended province of residence outside Quebec cannot be verified.'
  evidence_anchor:
    evidence_unit_id: federal_ee:express_entry_fstp_program:full_document_body
    source_id: express_entry_fstp_program
    source_file: 09c2d12f4b8c1c3c646d2dbf4d8173ef5211fa8157746c551aa00a9451ed5d53
    section: Where you can live in Canada
    verbatim_excerpt: You must plan to live <strong>outside the province of Quebec</strong>. The province
      of Quebec selects its own skilled workers.
- id: fstp_settlement_funds
  category: statutory_gate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.authorized_to_work_in_canada
  - candidate.has_qualifying_job_offer
  conditional_required_fields:
    when: '!(candidate.authorized_to_work_in_canada == true && candidate.has_qualifying_job_offer == true)'
    fields:
    - candidate.family_size
    - funds.available_cad
    - funds.evidence_verified
  pass_if: (candidate.authorized_to_work_in_canada == true && candidate.has_qualifying_job_offer == true)
    || (funds.evidence_verified == true && ((candidate.family_size == 1 && funds.available_cad >= 15263)
    || (candidate.family_size == 2 && funds.available_cad >= 19001) || (candidate.family_size == 3 &&
    funds.available_cad >= 23360) || (candidate.family_size == 4 && funds.available_cad >= 28362) || (candidate.family_size
    == 5 && funds.available_cad >= 32168) || (candidate.family_size == 6 && funds.available_cad >= 36280)
    || (candidate.family_size == 7 && funds.available_cad >= 40392) || (candidate.family_size > 7 && funds.available_cad
    >= 40392 + (candidate.family_size - 7) * 4112)))
  fail_if: '!(candidate.authorized_to_work_in_canada == true && candidate.has_qualifying_job_offer ==
    true) && funds.evidence_verified == true && ((candidate.family_size == 1 && funds.available_cad <
    15263) || (candidate.family_size == 2 && funds.available_cad < 19001) || (candidate.family_size ==
    3 && funds.available_cad < 23360) || (candidate.family_size == 4 && funds.available_cad < 28362) ||
    (candidate.family_size == 5 && funds.available_cad < 32168) || (candidate.family_size == 6 && funds.available_cad
    < 36280) || (candidate.family_size == 7 && funds.available_cad < 40392) || (candidate.family_size
    > 7 && funds.available_cad < 40392 + (candidate.family_size - 7) * 4112))'
  missing_or_unverified: 'NEEDS_REVIEW: Settlement funds evidence, work-authorization plus valid-job-offer
    exemption, or family-size threshold is unverified.'
  evidence_anchor:
    evidence_unit_id: federal_ee:express_entry_proof_of_funds:full_document_body
    source_id: express_entry_proof_of_funds
    source_file: b16e319f0d3041193f14d06bd979e2a8037531b4d2e05f37bcde1e9deb03b238
    section: Proof of funds — who does not need proof of funds (and half-LICO table updated 2025-07-07)
    verbatim_excerpt: you’re authorized to work in Canada <strong>and</strong> you have a <a href="/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/documents/job-offer.html">valid
      job offer</a>, even if you apply under the Federal Skilled Worker Program or the
