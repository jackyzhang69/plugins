schema_version: 1.0.0
catalog_id: mpnp_business_investor
jurisdiction: CA-MB
category: MPNP business
display_name: MPNP Business Investor
status: ACTIVE
program_id: MPNP_BUSINESS
stream_id: BUSINESS
effective_date: '2026-01-01'
source_edition: MPNP Entrepreneur and Farm Investor pathways
source_url: https://immigratemanitoba.com/immigrate/business/
decision_scope: Deterministic prescreen for the entrepreneur and farm investor pathways.
  Ranking points stay in AnyScore.
sources:
- id: mpnp_biz
  title: MPNP Business Investor Stream
  url: https://immigratemanitoba.com/immigrate/business/
  citation: MPNP Entrepreneur and Farm Investor pathways
  legal_authority: Official program baseline used for the redline. Points arithmetic
    stays in AnyScore.
schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  types:
    assessment_date: ISO-8601 date
reference_points_grid:
  note: Documentation only. AnyScore owns the business ranking arithmetic.
rules:
- id: mpnp_biz_entrepreneur
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'entrepreneur'
    fields:
    - candidate.net_worth_cad
    - candidate.business_years_past_5
    - candidate.language_clb_minimum
    - candidate.meets_canadian_high_school
    - candidate.in_winnipeg
    - candidate.investment_cad
    - candidate.jobs_to_create
  pass_if: candidate.stream == 'farm_investor' || (candidate.net_worth_cad >= 500000
    && candidate.business_years_past_5 >= 3 && candidate.language_clb_minimum >= 5
    && candidate.meets_canadian_high_school == true && ((candidate.in_winnipeg ==
    true && candidate.investment_cad >= 250000) || (candidate.in_winnipeg == false
    && candidate.investment_cad >= 150000)) && candidate.jobs_to_create >= 1)
  fail_if: candidate.stream == 'entrepreneur' && (candidate.net_worth_cad < 500000
    || candidate.business_years_past_5 < 3 || candidate.language_clb_minimum < 5 ||
    candidate.meets_canadian_high_school == false || (candidate.in_winnipeg == true
    && candidate.investment_cad < 250000) || (candidate.in_winnipeg == false && candidate.investment_cad
    < 150000) || candidate.jobs_to_create < 1)
  missing_or_unverified: 'NEEDS_REVIEW: Entrepreneur pathway facts cannot be verified.'
  evidence_anchor:
    evidence_unit_id: bc.mpnp_ep_apply_page.html
    source_id: mpnp_biz
    source_file: 78c14ad80094b450e805c0d1ebaf1dc335f9abb70a4e9143b2195467e203c445
    section: Entrepreneur Pathway eligibility
    verbatim_excerpt: "<li><strong>Net worth:</strong> Minimum of $500,000 CAD</li>"
- id: mpnp_biz_farm
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  conditional_required_fields:
    when: candidate.stream == 'farm_investor'
    fields:
    - candidate.net_worth_cad
    - candidate.farm_ownership_years
    - candidate.farm_investment_cad
    - candidate.farm_research_visit
    - candidate.reside_in_rural_manitoba
  pass_if: candidate.stream == 'entrepreneur' || (candidate.net_worth_cad >= 500000
    && candidate.farm_ownership_years >= 3 && candidate.farm_investment_cad >= 300000
    && candidate.farm_research_visit == true && candidate.reside_in_rural_manitoba
    == true)
  fail_if: candidate.stream == 'farm_investor' && (candidate.net_worth_cad < 500000
    || candidate.farm_ownership_years < 3 || candidate.farm_investment_cad < 300000
    || candidate.farm_research_visit == false || candidate.reside_in_rural_manitoba
    == false)
  missing_or_unverified: 'NEEDS_REVIEW: Farm investor facts cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-MPNP-BIZ-FARM-002
    source_file: src47.html
    section: Farm Investor Pathway eligibility
    verbatim_excerpt: invest a minimum of $300,000 CAD

- id: mpnp_fip_ownership_operation
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  pass_if: (candidate.stream in ['entrepreneur']) || ((candidate.stream == 'farm_investor') && (candidate.farm_ownership_years >= 3 && candidate.farm_operation_years >= 3 && candidate.farm_history_documents_verified == true))
  fail_if: (candidate.stream == 'farm_investor') && (candidate.farm_ownership_years < 3 || candidate.farm_operation_years
    < 3 || candidate.farm_history_documents_verified == false)
  missing_or_unverified: 'NEEDS_REVIEW: Source-specific facts or assessed evidence are missing; do not infer
    a determination.'
  evidence_anchor:
    evidence_unit_id: prairies:detail:E:mpnp-fip-farm-history
    source_file: regions/prairies/sources/current/mb_fip_detailed_eligibility.txt
    section: lines 3-16
    verbatim_excerpt: You must have a minimum of 3 years of farm ownership and operation experience, supported
      by verifiable documents.
    source_sha256: ac6ffe765697bd7137fddaf928e234e71dd291cf207ea44ae0d6bd627ebce940

- id: mpnp_fip_active_operation
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  pass_if: (candidate.stream in ['entrepreneur']) || ((candidate.stream == 'farm_investor') && (candidate.farm_research_visit == true && candidate.farm_recurring_activities == true && candidate.lives_on_farm == true && candidate.manages_from_manitoba == true && candidate.primary_production == true && candidate.economically_viable_assessed == true && candidate.value_added_manitoba == true && candidate.third_party_farm_manager == false && candidate.speculative_farm == false))
  fail_if: (candidate.stream == 'farm_investor') && (candidate.farm_research_visit == false || candidate.farm_recurring_activities
    == false || candidate.lives_on_farm == false || candidate.manages_from_manitoba == false || candidate.primary_production
    == false || candidate.economically_viable_assessed == false || candidate.value_added_manitoba == false
    || candidate.third_party_farm_manager == true || candidate.speculative_farm == true)
  missing_or_unverified: 'NEEDS_REVIEW: Source-specific facts or assessed evidence are missing; do not infer
    a determination.'
  evidence_anchor:
    evidence_unit_id: prairies:detail:E:mpnp-fip-visit-viability-operation
    source_file: regions/prairies/sources/current/mb_fip_detailed_eligibility.txt
    section: lines 3-16
    verbatim_excerpt: The farm business must be in active primary agriculture production and economically
      viable.
    source_sha256: ac6ffe765697bd7137fddaf928e234e71dd291cf207ea44ae0d6bd627ebce940

- id: mpnp_fip_adaptability_interview
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  pass_if: (candidate.stream in ['entrepreneur']) || ((candidate.stream == 'farm_investor') && (candidate.practical_farming_skills_assessed == true && candidate.technical_knowledge_assessed == true && candidate.technology_transfer_assessed == true && (candidate.interview_invited == false || (candidate.interview_invited == true && candidate.interview_language in ['English', 'French']))))
  fail_if: (candidate.stream == 'farm_investor') && (candidate.practical_farming_skills_assessed == false
    || candidate.technical_knowledge_assessed == false || candidate.technology_transfer_assessed == false
    || (candidate.interview_invited == true && candidate.interview_language != null && !(candidate.interview_language
    in ['English', 'French'])))
  missing_or_unverified: 'NEEDS_REVIEW: Source-specific facts or assessed evidence are missing; do not infer
    a determination.'
  evidence_anchor:
    evidence_unit_id: prairies:detail:E:mpnp-fip-practical-skills-interview
    source_file: regions/prairies/sources/current/mb_fip_detailed_eligibility.txt
    section: lines 3-16
    verbatim_excerpt: If you are invited to attend a FIP interview, you will be required to conduct the
      interview in either French or English.
    source_sha256: ac6ffe765697bd7137fddaf928e234e71dd291cf207ea44ae0d6bd627ebce940

- id: mpnp_fip_interest_submission
  category: pathway
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.stream
  pass_if: (candidate.stream == 'entrepreneur' || (candidate.stream == 'farm_investor' && candidate.stage != null && candidate.stage != 'interest_submission')) || ((candidate.stream == 'farm_investor' && candidate.stage == 'interest_submission') && (candidate.minimum_fip_criteria_assessed == true && candidate.interest_guidelines_complete == true && candidate.farm_business_concept_complete == true && candidate.farm_comparable_technology_assessed == true && candidate.farm_comparable_practices_assessed == true && candidate.farm_comparable_scale_assessed == true && candidate.farm_comparable_equipment_assessed == true && candidate.farm_comparable_output_assessed == true && candidate.practical_farming_skills_assessed == true && candidate.technical_knowledge_assessed == true && candidate.technology_transfer_assessed == true && candidate.submission_channel == 'email' && (candidate.representative_used == false || (candidate.representative_used == true && candidate.representative_code_of_conduct_complete == true))))
  fail_if: (candidate.stream == 'farm_investor' && candidate.stage == 'interest_submission') && (candidate.minimum_fip_criteria_assessed
    == false || candidate.interest_guidelines_complete == false || candidate.farm_business_concept_complete
    == false || candidate.farm_comparable_technology_assessed == false || candidate.farm_comparable_practices_assessed
    == false || candidate.farm_comparable_scale_assessed == false || candidate.farm_comparable_equipment_assessed
    == false || candidate.farm_comparable_output_assessed == false || candidate.practical_farming_skills_assessed
    == false || candidate.technical_knowledge_assessed == false || candidate.technology_transfer_assessed
    == false || (candidate.submission_channel != null && candidate.submission_channel != 'email') || (candidate.representative_used
    == true && candidate.representative_code_of_conduct_complete == false))
  missing_or_unverified: 'NEEDS_REVIEW: Source-specific facts or assessed evidence are missing; do not infer
    a determination.'
  evidence_anchor:
    evidence_unit_id: prairies:detail:E:mpnp-fip-interest-submission-gate
    source_file: regions/prairies/sources/current/mb_fip_apply.txt
    section: lines 3-17
    verbatim_excerpt: Please note that the business concept is not an application to the MPNP.
    source_sha256: 711ba9f28408eb7bcbf30b1db9311e07a690020b6cd7f861850ff25bbf28c8ca
