schema_version: 1.0.0
catalog_id: atlantic_aip
jurisdiction: CA-ATL
category: Atlantic immigration
display_name: Atlantic Immigration Program
status: ACTIVE
program_id: ATLANTIC_AIP
stream_id: AIP
effective_date: '2026-01-01'
source_edition: Atlantic Immigration Program
source_url: https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/atlantic-immigration.html
decision_scope: Deterministic Atlantic Immigration Program prescreen. No points grid.
sources:
- id: aip
  title: Atlantic Immigration Program
  url: https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/atlantic-immigration.html
  citation: Atlantic Immigration Program
  legal_authority: Official program baseline used for the redline. Points arithmetic stays in AnyScore.
schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  types:
    assessment_date: ISO-8601 date
reference_points_grid:
  note: The Atlantic Immigration Program has no selection points grid.
rules:
- id: aip_employer
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - employer.designated
  - candidate.endorsement_valid
  - job_offer.weekly_hours
  - job_offer.is_seasonal
  - job_offer.duration_months
  pass_if: employer.designated == true && candidate.endorsement_valid == true && job_offer.weekly_hours >= 30 && job_offer.is_seasonal
    == false && job_offer.duration_months >= 12
  fail_if: employer.designated == false || candidate.endorsement_valid == false || job_offer.weekly_hours < 30 || job_offer.is_seasonal
    == true || job_offer.duration_months < 12
  missing_or_unverified: 'NEEDS_REVIEW: Designation, endorsement, or offer terms cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-AIP-JOB-OFFER-001
    source_file: atlantic-immigration-job-offer.html
    section: Job offer and endorsement
    verbatim_excerpt: 'The job offer must be: full-time (at least 30 hours a week) non-seasonal (consistent and paid all year)
      for at least 1 year from the time you become a permanent resident The province must endorse your job offer before the
      candidate can apply for permanent residence.'
- id: aip_language_and_experience
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - job_offer.noc_teer
  - candidate.language_clb_minimum
  conditional_required_fields:
    when: job_offer.noc_teer in [0, 1, 2, 3, 4]
    fields:
    - candidate.experience_months
  pass_if: (job_offer.noc_teer in [0, 1, 2, 3] && candidate.language_clb_minimum >= 5 && (candidate.experience_months >= 12
    || candidate.post_secondary == true)) || (job_offer.noc_teer == 4 && candidate.language_clb_minimum >= 4 && candidate.meets_canadian_high_school
    == true && candidate.experience_months >= 12)
  fail_if: (job_offer.noc_teer in [0, 1, 2, 3] && candidate.language_clb_minimum < 5) || (job_offer.noc_teer in [0, 1, 2,
    3] && candidate.experience_months < 12 && candidate.post_secondary == false) || (job_offer.noc_teer == 4 && (candidate.language_clb_minimum
    < 4 || candidate.meets_canadian_high_school == false || candidate.experience_months < 12)) || (job_offer.noc_teer != null
    && !(job_offer.noc_teer in [0, 1, 2, 3, 4]))
  missing_or_unverified: 'NEEDS_REVIEW: Language, education, or experience cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-AIP-LANGUAGE-EXPERIENCE-002
    source_file: atlantic-immigration-language-testing.html
    section: Language, education and work experience
    verbatim_excerpt: CLB 5 for job offer in TEER 0, 1, 2 or 3 CLB 4 for job offer in TEER 4 You need at least 1,560 hours
      of related work experience over the past 5 years. This is the same as working 30 hours per week for 1 year.
- id: aip_funds
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.working_in_canada
  conditional_required_fields:
    when: candidate.working_in_canada == false
    fields:
    - candidate.settlement_funds_cad
    - candidate.settlement_funds_required_cad
  pass_if: candidate.working_in_canada == true || candidate.settlement_funds_cad >= candidate.settlement_funds_required_cad
  fail_if: candidate.working_in_canada == false && candidate.settlement_funds_cad < candidate.settlement_funds_required_cad
  missing_or_unverified: 'NEEDS_REVIEW: Settlement funds cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-AIP-FUNDS-003
    source_file: atlantic-immigration-proof-funds.html
    section: Proof of funds
    verbatim_excerpt: You do not need to show proof of funds if you’re already working in Canada with a valid work permit.
