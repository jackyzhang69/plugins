rules:
- id: aip_employer
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - employer.designated
  - candidate.endorsement_valid
  - job_offer.weekly_hours
  - job_offer.is_seasonal
  - job_offer.duration_months
  pass_if: employer.designated == true && candidate.endorsement_valid == true && job_offer.weekly_hours >= 30 && job_offer.is_seasonal
    == false && job_offer.duration_months >= 12
  fail_if: employer.designated == false || candidate.endorsement_valid == false || job_offer.weekly_hours < 30 || job_offer.is_seasonal
    == true || job_offer.duration_months < 12
  missing_or_unverified: 'NEEDS_REVIEW: Designation, endorsement, or offer terms cannot be verified.'
  evidence_anchor:
    evidence_unit_id: EU-AIP-JOB-OFFER-001
    source_file: atlantic-immigration-job-offer.html
    section: Job offer and endorsement
    verbatim_excerpt: 'The job offer must be: full-time (at least 30 hours a week) non-seasonal (consistent and paid all year)
      for at least 1 year from the time you become a permanent resident The province must endorse your job offer before the
      candidate can apply for permanent residence.'
- id: aip_language_and_experience
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - job_offer.noc_teer
  - candidate.language_clb_minimum
  conditional_required_fields:
    when: job_offer.noc_teer == 4
    fields:
    - candidate.meets_canadian_high_school
  pass_if: >-
    ((job_offer.noc_teer in [0, 1, 2, 3] && candidate.language_clb_minimum >= 5) ||
    (job_offer.noc_teer == 4 && candidate.language_clb_minimum >= 4 &&
    candidate.meets_canadian_high_school == true)) &&
    ((candidate.aip_work_experience_hours >= 1560 &&
    candidate.aip_work_experience_period_at_least_one_year == true) ||
    candidate.aip_graduate_exception_eligible == true)
  fail_if: >-
    (job_offer.noc_teer in [0, 1, 2, 3] && candidate.language_clb_minimum < 5) ||
    (job_offer.noc_teer == 4 && (candidate.language_clb_minimum < 4 ||
    candidate.meets_canadian_high_school == false)) ||
    (job_offer.noc_teer != null && !(job_offer.noc_teer in [0, 1, 2, 3, 4])) ||
    (job_offer.noc_teer in [0, 1, 2, 3, 4] &&
    candidate.aip_work_experience_inputs_complete == true &&
    (candidate.aip_work_experience_hours < 1560 ||
    candidate.aip_work_experience_period_at_least_one_year == false) &&
    candidate.aip_graduate_exception_eligible == false)
  missing_or_unverified: 'NEEDS_REVIEW: Verified work history or the detailed Atlantic graduate exception facts cannot be established.'
  evidence_anchor:
    evidence_unit_id: aip.work_experience.native_facts_2026_05_28
    source_file: regions/atlantic/sources/aip_work_experience.txt
    section: Work experience; Exemption if you studied and graduated in Atlantic Canada; Ineligible studies
    verbatim_excerpt: |-
      You need at least 1,560 hours of related work experience over the past 5 years.
      You must have worked these hours over a period of at least 1 year.
      Your qualifying work experience must:
      - have been for a paid job
      - not be from a self-employed job
      - include the actions in the description of your NOC
      - include most of the main NOC duties
      - be in the same TEER category as your job offer or higher:
      You do not need to meet the work experience requirements if you’re an international graduate and you:
      - have a degree, diploma, certificate, or trade or apprenticeship certification that took at least 2 years
      - is from a recognized post-secondary institution in 1 of the 4 Atlantic provinces
      - received it less than 2 years before you applied for permanent residence
      - were a full-time student for the entire time you were studying
      - lived in 1 of the 4 Atlantic provinces for at least 16 months during the last 2 years before you graduated
      - had the visa or permit you needed to work, study or get training while you were in Canada
      The study of English or French as a second language was at least half of the program.
      Distance learning was at least half of the program.
      You received a scholarship or fellowship with an agreement that you return to your home country to apply the knowledge and skills you gained.
- id: aip_funds
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  # Native intake recomputes dated exemption and source-bound family/amount facts.
  # Application PASS covers that stage only; visa issuance requires a later recheck.
  required_fields: []
  pass_if: candidate.aip_funds_exempt == true || candidate.aip_funds_amount_sufficient == true
  fail_if: candidate.aip_funds_exempt == false && candidate.aip_funds_amount_sufficient == false
  missing_or_unverified: 'NEEDS_REVIEW: Verify dated employment and valid permit together, or complete the evidence-backed family and stage-specific funds contract. The published table is bound to its recorded source/as-of, not a caller-required threshold. Application PASS does not establish future visa-issuance availability.'
  evidence_anchor:
    evidence_unit_id: aip.proof_funds.published_table_2025_07_29
    source_file: "90ea4cf2a00433344866a067d74224156ea8bcfc1643e96ce440b4b271203eb8"
    section: How much money you need; What we accept as proof
    verbatim_excerpt: "The table below shows the minimum amount you need to immigrate to Canada."
