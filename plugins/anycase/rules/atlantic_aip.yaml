schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  types:
    assessment_date: ISO-8601 date
reference_points_grid:
  note: The Atlantic Immigration Program has no selection points grid.
rules:
- id: aip_employer
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - employer.designated
  - employer.majority_owned_by_candidate_or_spouse
  - job_offer.weekly_hours
  - job_offer.is_seasonal
  pass_if: employer.designated == true && employer.majority_owned_by_candidate_or_spouse == false && job_offer.weekly_hours >= 30 && job_offer.is_seasonal == false
  fail_if: employer.designated == false || employer.majority_owned_by_candidate_or_spouse == true || job_offer.weekly_hours < 30 || job_offer.is_seasonal == true
  missing_or_unverified: 'NEEDS_REVIEW: Employer designation, ownership, weekly hours or seasonality cannot be verified.'
  interpretation: 'IRCC: each province designates the employers who can offer jobs; the job offer must be full-time (at least 30 hours a week) and non-seasonal, and cannot come from a company in which the candidate or spouse/common-law partner is a majority owner.'
  evidence_anchor:
    evidence_unit_id: "federal_pilots:aip_job_offer_2026_09_22:full_document_body"
    source_file: "471388f9d191478c85f20ae5a54c4aabb7cf6b8c47f22c20e2a86d7f67ada4d0"
    section: Get a job offer
    source_id: aip_job_offer_2026_09_22
    verbatim_excerpt: "full-time (at least 30&nbsp;hours a week)</li>\r\n\t\r\n\t<li><a href=\"/en/services/immigration-citizenship/helpcentre/glossary.html#non_seasonal_work\">non-seasonal</a> (consistent <strong>and</strong> paid all year)"
- id: aip_offer_term
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - job_offer.noc_teer
  conditional_required_fields:
    when: job_offer.noc_teer in [0, 1, 2, 3]
    fields:
    - job_offer.duration_months
  pass_if: (job_offer.noc_teer in [0, 1, 2, 3] && job_offer.duration_months >= 12) || (job_offer.noc_teer == 4 && job_offer.permanent_no_set_end_date == true)
  fail_if: (job_offer.noc_teer in [0, 1, 2, 3] && job_offer.duration_months < 12) || (job_offer.noc_teer == 4 && job_offer.permanent_no_set_end_date == false) || (job_offer.noc_teer != null && !(job_offer.noc_teer in [0, 1, 2, 3, 4]))
  missing_or_unverified: 'NEEDS_REVIEW: Offer term cannot be verified (TEER 0-3 need at least 1 year from permanent residence; TEER 4 needs permanent employment with no set end date).'
  evidence_anchor:
    evidence_unit_id: "federal_pilots:aip_job_offer_2026_09_22:full_document_body"
    source_file: "471388f9d191478c85f20ae5a54c4aabb7cf6b8c47f22c20e2a86d7f67ada4d0"
    section: Get a job offer
    source_id: aip_job_offer_2026_09_22
    verbatim_excerpt: "for at least 1 year from the time you become a permanent resident for <a href=\"/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/eligibility/find-national-occupation-code.html\">TEER 0, 1, 2 or 3</a> job offers</li>\r\n\t\r\n\t<li>for permanent employment with no set end date for <a href=\"/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/eligibility/find-national-occupation-code.html\">TEER 4</a>&nbsp;job offers"
- id: aip_endorsement
  category: job_offer
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.endorsement_valid
  pass_if: candidate.endorsement_valid == true
  fail_if: candidate.endorsement_valid == false
  missing_or_unverified: 'NEEDS_REVIEW: Provincial endorsement of the job offer cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "federal_pilots:aip_employer_endorsement:full_document_body"
    source_file: "138a7f162db46dc1fa819ffc1edcea31610f200bd54ec4b6dc8f696c0dce4969"
    section: Submit an endorsement
    source_id: aip_employer_endorsement
    verbatim_excerpt: "The province must endorse your job offer before the candidate can apply for permanent residence."
- id: aip_language
  category: language
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - job_offer.noc_teer
  - candidate.language_clb_minimum
  pass_if: (job_offer.noc_teer in [0, 1, 2, 3] && candidate.language_clb_minimum >= 5) || (job_offer.noc_teer == 4 && candidate.language_clb_minimum >= 4)
  fail_if: (job_offer.noc_teer in [0, 1, 2, 3] && candidate.language_clb_minimum < 5) || (job_offer.noc_teer == 4 && candidate.language_clb_minimum < 4) || (job_offer.noc_teer != null && !(job_offer.noc_teer in [0, 1, 2, 3, 4]))
  missing_or_unverified: 'NEEDS_REVIEW: Language results cannot be verified.'
  evidence_anchor:
    evidence_unit_id: "federal_pilots:aip_language_2026_05_28:full_document_body"
    source_file: "e01c20f1b1dbfe41b47013c21a58799a586b2582cdbbb9effe06f3feb0463ab8"
    section: How to prove your language ability
    source_id: aip_language_2026_05_28
    verbatim_excerpt: "The minimum score depends on the NOC 2021 TEER category of your job offer:</p>\n<ul>\n<li>CLB <strong>5</strong> for job offer in TEER 0, 1, 2 or 3</li>\n<li>CLB <strong>4</strong> for job offer in TEER 4"
- id: aip_education
  category: education
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - job_offer.noc_teer
  conditional_required_fields:
    when: job_offer.noc_teer in [2, 3, 4]
    fields:
    - candidate.meets_canadian_high_school
  pass_if: (job_offer.noc_teer in [0, 1] && candidate.meets_canadian_one_year_postsecondary == true) || (job_offer.noc_teer in [2, 3, 4] && candidate.meets_canadian_high_school == true)
  fail_if: (job_offer.noc_teer in [0, 1] && candidate.meets_canadian_one_year_postsecondary == false) || (job_offer.noc_teer in [2, 3, 4] && candidate.meets_canadian_high_school == false) || (job_offer.noc_teer != null && !(job_offer.noc_teer in [0, 1, 2, 3, 4]))
  missing_or_unverified: 'NEEDS_REVIEW: The education credential (or its ECA-verified foreign equivalent) cannot be matched to the job offer TEER.'
  interpretation: 'IRCC: TEER 0 or 1 needs a Canadian one-year post-secondary (or higher) credential; TEER 2, 3 or 4 needs a Canadian high school diploma (or higher). A foreign credential counts only through an educational credential assessment (ECA) showing the Canadian equivalent. The flags carry the verified outcome of that comparison.'
  evidence_anchor:
    evidence_unit_id: "federal_pilots:aip_education_2026_06_22:full_document_body"
    source_file: "d422a3c87b5febdac994a19c98739d7a2c60df7e1a192737d0170522d80ff3f4"
    section: Get your proof of education
    source_id: aip_education_2026_06_22
    verbatim_excerpt: "TEER 0 or 1</strong>: a Canadian one-year post-secondary (or higher) educational credential</li>\r\n    <li><strong>TEER 2, 3, or 4</strong>: a Canadian high school diploma (or higher)"
- id: aip_work_experience
  category: experience
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - job_offer.noc_teer
  pass_if: >-
    (candidate.aip_work_experience_hours >= 1560 &&
    candidate.aip_work_experience_period_at_least_one_year == true) ||
    candidate.aip_graduate_exception_eligible == true
  fail_if: >-
    (job_offer.noc_teer != null && !(job_offer.noc_teer in [0, 1, 2, 3, 4])) ||
    (job_offer.noc_teer in [0, 1, 2, 3, 4] &&
    candidate.aip_work_experience_inputs_complete == true &&
    (candidate.aip_work_experience_hours < 1560 ||
    candidate.aip_work_experience_period_at_least_one_year == false) &&
    candidate.aip_graduate_exception_eligible == false)
  missing_or_unverified: 'NEEDS_REVIEW: Verified work history or the detailed Atlantic graduate exception facts cannot be established.'
  interpretation: 'IRCC: at least 1,560 hours of related, paid, non-self-employed work over the past 5 years, worked over a period of at least 1 year, in the same TEER category as the job offer or higher; international graduates of a recognized Atlantic institution who meet the listed study conditions are exempt. Hours, TEER match and the graduate exemption are derived by the native intake.'
  evidence_anchor:
    evidence_unit_id: "federal_pilots:aip_work_experience_2026_05_28:full_document_body"
    source_file: "8585b1adbe838819fbf07e87ba884e41d24c316a09743d88d125df47ac24ed6f"
    section: What counts as related work experience; Exemption if you studied and graduated in Atlantic Canada
    source_id: aip_work_experience_2026_05_28
    verbatim_excerpt: "You need at least <strong>1,560 hours</strong> of related work experience over the past 5 years."
- id: aip_funds
  category: funds
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  # Native intake recomputes dated exemption and source-bound family/amount facts.
  # Application PASS covers that stage only; visa issuance requires a later recheck.
  required_fields: []
  pass_if: candidate.aip_funds_exempt == true || candidate.aip_funds_amount_sufficient == true
  fail_if: candidate.aip_funds_exempt == false && candidate.aip_funds_amount_sufficient == false
  missing_or_unverified: 'NEEDS_REVIEW: Verify dated employment and valid permit together, or complete the evidence-backed family and stage-specific funds contract. The published table is bound to its recorded source/as-of, not a caller-required threshold. Application PASS does not establish future visa-issuance availability.'
  evidence_anchor:
    evidence_unit_id: "federal_pilots:aip_proof_funds_2026_05_28:full_document_body"
    source_file: "90f980825997a32b2dd458fe2a7ae643cdd64e62a98c67a4f209ce4ea240b139"
    section: How much money you need
    source_id: aip_proof_funds_2026_05_28
    verbatim_excerpt: "The table below shows the <strong>minimum amount</strong> you need to immigrate to Canada."
