- id: nsnp_ent_ownership_or_management
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.business_ownership_years_last_10_years
  - candidate.senior_management_years_last_10_years
  pass_if: candidate.business_ownership_years_last_10_years >= 3 || candidate.senior_management_years_last_10_years > 5
  fail_if: >-
    candidate.business_ownership_years_last_10_years != null && candidate.business_ownership_years_last_10_years < 3 &&
