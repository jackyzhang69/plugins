schema_version: 1.0.0
catalog_id: nsnp_entrepreneur
category: Nova Scotia Nominee Program
display_name: 'Nova Scotia Nominee Program: Entrepreneur Stream'
status: ACTIVE
program_id: NSNP_ENTREPRENEUR
stream_id: ENTREPRENEUR
jurisdiction: CA-NS
effective_date: '2026-09-01'
source_edition: 'Entrepreneur stream page (liveinnovascotia.com/entrepreneur, no page date, retrieved 2026-11-16) and Entrepreneur Stream Application Guide, Nova Scotia Nominee Program (September 2026)'
source_url: https://liveinnovascotia.com/entrepreneur
decision_scope: >-
  Pre-screen of the experienced business owner / senior business manager route of the Entrepreneur stream. Application
  to the stream is by invitation only (stream page). The International Graduate Entrepreneur sub-criteria (CLB 7,
  one year operating the business) are not evaluated here. No genuineness/viability probability test exists in the
  sources (the guide says the business 'has the potential to benefit the Nova Scotia economy' and the plan must show
  'a reasonable chance of success', both judged by the Department) and none is evaluated. A pass is not an invitation
  or nomination.
sources:
- id: ns_entrepreneur_stream_page
  title: Nova Scotia Entrepreneur (stream page)
  url: https://liveinnovascotia.com/entrepreneur
  sha256: bb05a2f7661f87738c166ecfed4fae88c59d7bf342b9d835ef631d7b906f65e5
  retrieved_at: '2026-11-16'
- id: ns_entrepreneur_guide
  title: Nova Scotia Entrepreneur Stream Application Guide (September 2026)
  url: https://liveinnovascotia.com/sites/default/files/2026-02/Guide-NSNP-ENT-English.pdf
  sha256: 901250eecbf5b745a0cd22091beee0640c8b48dd34396d4b958bf06a3e196296
  retrieved_at: '2026-11-16'
schema:
  input_type: object
  required_top_level:
  - assessment_date
  - candidate
  - business
  types:
    assessment_date: ISO-8601 date; application assessment date
    candidate:
      age: integer; age at assessment
      verified_net_worth_cad: number; third-party verified net worth earned legally
      business_ownership_years_last_10_years: number; years as a business owner in the last 10 years (applicant alone)
      senior_management_years_last_10_years: number; years in a senior business management role in the last 10 years (applicant alone)
      business_equity_percentage: number in [0, 100]; share of the Nova Scotia business the applicant will own
      plans_day_to_day_operation: boolean
      language_test:
        valid_at_application: boolean; tested no more than 2 years before the EOI
        listening_clb: integer
        reading_clb: integer
        writing_clb: integer
        speaking_clb: integer
    business:
      is_in_hrm: boolean; located within the Halifax Regional Municipality
      total_capital_investment_cad: number; applicant's own money to be invested
      location_is_nova_scotia: boolean
      is_eligible_commercial_business: boolean; for-profit goods or services business that meets legal requirements and is not an excluded business type
      planned_permanent_full_time_jobs_for_canadians_or_prs: number; permanent full-time positions (1,560 hours) for citizens or permanent residents not related to the applicant
evaluation:
  rule_statuses:
  - PASS
  - FAIL
  - NEEDS_REVIEW
  aggregate:
  - If any CRITICAL_REDLINE rule is FAIL, verdict = FAIL.
  - Otherwise, if any rule is NEEDS_REVIEW, verdict = NEEDS_REVIEW.
  - Otherwise, verdict = PASS.
rules:
- id: nsnp_ent_age
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.age
  pass_if: candidate.age >= 21
  fail_if: candidate.age != null && candidate.age < 21
  missing_or_unverified: 'NEEDS_REVIEW: Candidate age cannot be verified.'
  provenance:
    source_file: https://liveinnovascotia.com/entrepreneur
    section: Entrepreneur - Eligibility
    verbatim: be 21 years of age or older;
  evidence_anchor:
    evidence_unit_id: "atlantic_documents:ns_entrepreneur_stream_page:entrepreneur_eligibility"
    unit_status: candidate_k_validated_not_published
    candidate_k_id: 4b0cdf9642ccc078535331d6620e49c576d369616ef8189362ade46da6a9ce68
    source_id: ns_entrepreneur_stream_page
    source_file: 663100fa905f66c1a29ea69eff7a9e5fe791f0a97272fbf50aabfd255fe4eb56
    source_url: https://liveinnovascotia.com/entrepreneur
    source_sha256: bb05a2f7661f87738c166ecfed4fae88c59d7bf342b9d835ef631d7b906f65e5
    source_edition: no page date; fetched 2026-11-16T18:24:16Z
    section: ENTREPRENEUR - ELIGIBILITY
    verbatim_excerpt: be 21 years of age or older;
- id: nsnp_ent_net_worth_threshold
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.verified_net_worth_cad
  - business.is_in_hrm
  pass_if: >-
    (business.is_in_hrm == true && candidate.verified_net_worth_cad >= 600000) ||
    (business.is_in_hrm == false && candidate.verified_net_worth_cad >= 400000)
  fail_if: >-
    (business.is_in_hrm == true && candidate.verified_net_worth_cad != null && candidate.verified_net_worth_cad < 600000) ||
    (business.is_in_hrm == false && candidate.verified_net_worth_cad != null && candidate.verified_net_worth_cad < 400000)
  missing_or_unverified: 'NEEDS_REVIEW: Third-party net worth verification (legally earned) or the business location is missing.'
  provenance:
    source_file: https://liveinnovascotia.com/entrepreneur
    section: Entrepreneur - Eligibility
    verbatim: have a net worth of at least $600,000 CAD ($400,000 CAD if your business is outside Halifax Regional Municipality (HRM));
