  pass_if: >-
    (business.is_in_hrm == true && business.total_capital_investment_cad >= 150000) ||
    (business.is_in_hrm == false && business.total_capital_investment_cad >= 100000)
  fail_if: >-
    (business.is_in_hrm == true && business.total_capital_investment_cad != null && business.total_capital_investment_cad < 150000) ||
    (business.is_in_hrm == false && business.total_capital_investment_cad != null && business.total_capital_investment_cad < 100000)
  missing_or_unverified: 'NEEDS_REVIEW: Planned own-capital investment or the business location is missing.'
  provenance:
