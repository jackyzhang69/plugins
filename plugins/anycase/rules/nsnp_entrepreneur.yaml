- id: nsnp_ent_language_proficiency
  category: candidate
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.language_test.valid_at_application
  - candidate.language_test.listening_clb
  - candidate.language_test.reading_clb
  - candidate.language_test.writing_clb
  - candidate.language_test.speaking_clb
  pass_if: >-
    candidate.language_test.valid_at_application == true && candidate.language_test.listening_clb >= 5 &&
    candidate.language_test.reading_clb >= 5 && candidate.language_test.writing_clb >= 5 && candidate.language_test.speaking_clb >= 5
  fail_if: >-
    candidate.language_test.valid_at_application == false || (candidate.language_test.listening_clb != null && candidate.language_test.listening_clb < 5) ||
    (candidate.language_test.reading_clb != null && candidate.language_test.reading_clb < 5) ||
    (candidate.language_test.writing_clb != null && candidate.language_test.writing_clb < 5) ||
    (candidate.language_test.speaking_clb != null && candidate.language_test.speaking_clb < 5)
  missing_or_unverified: 'NEEDS_REVIEW: A language test report within 2 years is missing; a test is required even if the first language is English or French.'
  provenance:
    source_file: Guide-NSNP-ENT-English.pdf
    section: Language requirements
    page: 42
    verbatim: The criteria listed under Canadian Language Benchmarks (CLB) Level 5 or higher.
  evidence_anchor:
    evidence_unit_id: atlantic_documents:nsnp_entrepreneur_guide_pdf:p042
    source_file: dc2fd98a0cd120dc47748122ff212c434de328b4d2a074f886bf668086432056
    page: "42"
    section: Language Requirements
    verbatim_excerpt: "The criteria listed under Canadian Language Benchmarks (CLB)\nLevel 5 or higher."
    supporting_excerpts:
    - evidence_unit_id: "atlantic_documents:ns_entrepreneur_stream_page:entrepreneur_eligibility"
      unit_status: candidate_k_validated_not_published
      candidate_k_id: 4b0cdf9642ccc078535331d6620e49c576d369616ef8189362ade46da6a9ce68
      source_file: 663100fa905f66c1a29ea69eff7a9e5fe791f0a97272fbf50aabfd255fe4eb56
      verbatim_excerpt: have a score of at least 5 on the Canadian Language Benchmark in speaking, listening, reading and writing in English or French;
    - evidence_unit_id: "atlantic_documents:nsnp_entrepreneur_guide_pdf:p042"
      unit_status: candidate_k_validated_not_published
      candidate_k_id: e0bdf9b0617d97bae213312cbedd62fb57a8bf1845787da9cfff5331a170b1d2
      source_file: dc2fd98a0cd120dc47748122ff212c434de328b4d2a074f886bf668086432056
      page: "42"
      verbatim_excerpt: "You must have had your language skills tested no more than 2 years before\nthe date that you submitted your Expression of Interest (EOI)."
- id: nsnp_ent_active_operation_and_job_creation
  category: business
  severity: CRITICAL_REDLINE
  eval_type: deterministic
  required_fields:
  - candidate.plans_day_to_day_operation
  - business.location_is_nova_scotia
  - business.planned_permanent_full_time_jobs_for_canadians_or_prs
