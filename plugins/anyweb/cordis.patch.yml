# DeepSeek Harness bundle layer. Installed with:
#   dsh plugin --profile web add "github:jackyzhang69/plugins#anyweb-v0.2.23&path:plugins/anyweb"
# The row mounts index.js, which registers this package's skills/ directory as
# an isolated skill provider so the host agent sees the same anyweb contract
# as the Claude and Codex plugin hosts.
- insert:
    - id: anyweb
      name: dsh-anyweb
