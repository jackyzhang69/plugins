# DeepSeek Harness bundle layer. Installed with:
#   dsh plugin --profile web add "github:jackyzhang69/plugins#anyscore-v0.2.2&path:plugins/anyscore"
# The row mounts index.js, which registers this package's skills/ directory as
# an isolated skill provider so the host agent sees the same anyscore contract
# as the Claude and Codex plugin hosts.
- insert:
    - id: anyscore
      name: dsh-anyscore
