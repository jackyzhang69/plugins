# DeepSeek Harness bundle layer. Installed with:
#   dsh plugin --profile web add "github:jackyzhang69/plugins#anymail-v0.1.12&path:plugins/anymail"
# The row mounts index.js, which registers this package's skills/ directory as
# an isolated skill provider so the host agent sees the same anymail contract
# as the Claude and Codex plugin hosts.
- insert:
    - id: anymail
      name: dsh-anymail
